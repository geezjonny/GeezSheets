<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GeezVTT — DM Console</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

:root {
–bg:#05080f; –bg2:#080d18; –panel:#0c1220; –line:#182030; –line2:#1e2d45;
–text:#dde6f5; –muted:#3d5070; –muted2:#6a80a0;
–accent:#4a7fe8; –accent2:#6b9ef5;
–gold:#c8993a; –gold2:#e8bb5a;
–good:#0fa372;
–header-h:48px;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:‘Syne’,sans-serif;background:var(–bg);color:var(–text);display:flex;flex-direction:column;}

/* ── HEADER ── */
.header{
height:var(–header-h);background:var(–bg2);
border-bottom:1px solid var(–line2);
display:flex;align-items:stretch;flex-shrink:0;
position:relative;
}

/* Subtle gold line at bottom of header */
.header::after{
content:’’;position:absolute;bottom:0;left:0;right:0;height:1px;
background:linear-gradient(90deg,transparent,rgba(200,153,58,.25),rgba(74,127,232,.2),transparent);
pointer-events:none;
}

/* Brand */
.brand{
display:flex;align-items:center;gap:10px;
padding:0 20px;border-right:1px solid var(–line2);flex-shrink:0;
}

.brand-mark{
width:24px;height:24px;border:1px solid var(–gold);border-radius:5px;
background:rgba(200,153,58,.08);display:flex;align-items:center;justify-content:center;
}

.brand-mark svg{width:13px;height:13px;stroke:var(–gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

.brand-name{font-family:‘Cinzel’,serif;font-size:.88rem;font-weight:700;color:var(–gold2);letter-spacing:.08em;}

/* Tabs */
.tabs{display:flex;align-items:stretch;flex:1;overflow:hidden;}

.tab{
display:flex;align-items:center;gap:8px;
padding:0 22px;font-size:.78rem;font-weight:700;letter-spacing:.03em;
color:var(–muted2);cursor:pointer;
border-right:1px solid var(–line);border-bottom:2px solid transparent;
transition:all .15s;white-space:nowrap;user-select:none;
}

.tab:hover{color:var(–text);background:rgba(255,255,255,.02);}

.tab.active{
color:var(–accent2);border-bottom-color:var(–accent);
background:rgba(74,127,232,.05);
}

.tab.tab-vtt.active{
color:var(–gold2);border-bottom-color:var(–gold);
background:rgba(200,153,58,.05);
}

.tab svg{
width:14px;height:14px;stroke:currentColor;fill:none;
stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
flex-shrink:0;opacity:.7;transition:opacity .15s;
}

.tab.active svg{opacity:1;}

/* Header right */
.header-right{
margin-left:auto;display:flex;align-items:center;gap:8px;
padding:0 14px;border-left:1px solid var(–line2);flex-shrink:0;
}

.hbtn{
border:1px solid var(–line2);background:rgba(255,255,255,.04);color:var(–muted2);
border-radius:6px;padding:5px 10px;font-size:.72rem;font-weight:700;cursor:pointer;
font-family:‘Syne’,sans-serif;transition:all .12s;white-space:nowrap;
}

.hbtn:hover{color:var(–text);border-color:var(–accent);}

.hbtn.gold{border-color:rgba(200,153,58,.4);color:var(–gold2);background:rgba(200,153,58,.06);}
.hbtn.gold:hover{background:rgba(200,153,58,.12);}

.status-dot{
width:6px;height:6px;border-radius:50%;
background:var(–good);box-shadow:0 0 5px var(–good);
animation:blink 2.5s ease-in-out infinite;
}

@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ── CONTENT ── */
.content{flex:1;position:relative;min-height:0;}

.panel{position:absolute;inset:0;display:none;}
.panel.active{display:block;}

.panel iframe{width:100%;height:100%;border:none;background:var(–bg);}
</style>

</head>
<body>

<div class="header">
  <!-- Brand -->
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </div>
    <div class="brand-name">GeezVTT</div>
  </div>

  <!-- Tabs -->

  <div class="tabs">
    <div class="tab active" data-tab="character">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Characters
    </div>
    <div class="tab" data-tab="mapsetup">
      <svg viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
      Map Setup
    </div>
    <div class="tab tab-vtt" data-tab="vtt">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      VTT
    </div>
  </div>

  <!-- Right controls -->

  <div class="header-right">
    <button class="hbtn" id="refreshBtn">↺ Refresh</button>
    <button class="hbtn" id="newTabBtn">⤢ New Tab</button>
    <button class="hbtn gold" id="launchVttBtn">⚔ Launch VTT for Players</button>
    <div class="status-dot"></div>
  </div>
</div>

<div class="content">
  <div class="panel active" id="panel-character">
    <iframe id="frame-character" src="character.html" title="Characters"></iframe>
  </div>
  <div class="panel" id="panel-mapsetup">
    <iframe id="frame-mapsetup" src="mapsetup.html" title="Map Setup" loading="lazy"></iframe>
  </div>
  <div class="panel" id="panel-vtt">
    <iframe id="frame-vtt" src="vtt.html?gm=true" title="VTT" loading="lazy"></iframe>
  </div>
</div>

<script>
  const tabs   = document.querySelectorAll(".tab");
  const panels = document.querySelectorAll(".panel");
  let active   = "character";

  function switchTab(id) {
    if (id === active) return;
    active = id;
    tabs.forEach(t   => t.classList.toggle("active", t.dataset.tab === id));
    panels.forEach(p => p.classList.toggle("active", p.id === `panel-${id}`));
  }

  tabs.forEach(tab => {
    tab.addEventListener("click", () => switchTab(tab.dataset.tab));
  });

  // Refresh current iframe
  document.getElementById("refreshBtn").addEventListener("click", () => {
    const iframe = document.querySelector(`#panel-${active} iframe`);
    if (iframe) iframe.src = iframe.src;
  });

  // Open current tool in new tab
  document.getElementById("newTabBtn").addEventListener("click", () => {
    const iframe = document.querySelector(`#panel-${active} iframe`);
    if (iframe) window.open(iframe.src, "_blank", "noopener,noreferrer");
  });

  // Launch VTT for players in new window (no ?gm=true)
  document.getElementById("launchVttBtn").addEventListener("click", () => {
    window.open("vtt.html", "_blank", "noopener,noreferrer");
  });
</script>

</body>
</html>
