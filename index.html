<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dungeon Table</title>
  <link rel="stylesheet" href="js/vtt/vtt.css">
  <script src="js/firebase-config.js"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <header>
    <h1>Dungeon Table</h1>
    <nav id="menubar"><button id="file-btn" type="button" hidden>File</button><button id="add" hidden>Build</button><button id="table-btn" type="button" hidden>Table</button><button id="atmo-btn" type="button" hidden>Atmosphere</button><button id="audio-btn" type="button">Audio</button><button id="chat-btn" type="button">Chat</button><button id="view-btn" type="button">View</button><button id="mode" hidden>Puzzle</button></nav>
    <span class="grow"></span><span id="role"></span>
  </header>
  <div id="addmenu" hidden></div>
  <div id="toolbar" hidden></div>
  <main>
    <div class="paper">
      <svg id="map" viewBox="0 0 800 560" role="img" aria-label="A gridded dungeon map with floors, walls, doors, props and draggable player tokens">
        <defs>
          <pattern id="gridlines" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0003" stroke-width="1"/></pattern>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#eee8d6"/><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c7bfaa" stroke-width="1"/></pattern>
          <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.8" xChannelSelector="R" yChannelSelector="G"/></filter>
          <filter id="stamp" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0.8" xChannelSelector="R" yChannelSelector="G"/></filter>
          <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="11" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.15  0 0 0 0.28 0"/></filter>
          <radialGradient id="glow"><stop offset="0%" stop-color="#ffc766" stop-opacity=".6"/><stop offset="55%" stop-color="#ffb347" stop-opacity=".25"/><stop offset="100%" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
          <pattern id="shingle" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#8f6044"/><path d="M0 12 Q8 4 16 12 M-8 6 Q0 -2 8 6 M8 6 Q16 -2 24 6" fill="none" stroke="#5e3b27" stroke-width="1.4"/></pattern>
          <radialGradient id="vignette" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#7a5a2a" stop-opacity="0"/><stop offset="100%" stop-color="#7a5a2a" stop-opacity=".35"/></radialGradient>
        <clipPath id="tokclip"><circle r="16"/></clipPath>
        </defs>
        <rect id="mapbase" x="20" y="20" width="760" height="520" fill="#e8e1cd" stroke="#b4ab97" stroke-width="2"/>
        <g id="floors"></g>
        <g id="images"></g>
        <g id="lights"></g>
        <g id="props"></g>
        <g id="walls"></g>
        <text x="42" y="52" fill="#5a554a" font-size="20">N</text>
        <path d="M46 60 V94 M40 70 L46 60 L52 70" fill="none" stroke="#817b6e" stroke-width="2"/>
        <rect class="fullrect" x="0" y="0" width="800" height="560" filter="url(#paper)" pointer-events="none"/>
        <rect class="fullrect" x="0" y="0" width="800" height="560" fill="url(#vignette)" pointer-events="none"/>
        <g id="objects"></g>
        <g id="tokens"></g>
        <g id="roofs"></g>
        <g id="fog"></g>
        <g id="preview"></g>
      </svg>
    </div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="panel">
    <div class="row"><span id="hint">Pick a part to place, or click objects to select them.</span></div>
    <div class="row" id="palette"></div>
    <div id="inspector"></div>
    <div class="zones"><div class="zone" id="z-pool" data-z="pool"><b>Selected</b></div>
      <div class="zone" id="z-when" data-z="when"><b>When (all true)</b></div><div class="eq">=</div>
      <div class="zone" id="z-then" data-z="then"><b>Then</b></div></div>
    <div class="row"><button id="save">Save group</button> <button id="cancel-edit" hidden>Cancel edit</button> <button id="clear">Clear</button> <button id="reset" class="danger">Reset all</button></div>
    <ul class="glist" id="glist"></ul>
  </div>
  <div id="chatdock" hidden>
    <div id="chathead"><span>Table Chat</span><span class="grow"></span><button id="chatclose" type="button" aria-label="Hide chat">&times;</button></div>
    <iframe id="chatframe" title="Table Chat" allow="camera; microphone; autoplay; display-capture; fullscreen; speaker-selection"></iframe>
  </div>
  <style>
    #chatdock{position:fixed;right:16px;bottom:16px;width:340px;height:400px;min-width:240px;min-height:180px;max-width:96vw;max-height:90vh;z-index:50;display:flex;flex-direction:column;background:var(--leather-dk);border:1px solid var(--brass);box-shadow:2px 4px 10px #0009;overflow:hidden;resize:both}
    #chatdock[hidden]{display:none}
    #chathead{display:flex;align-items:center;gap:8px;height:1.6rem;padding:0 .4rem;background:var(--leather-dk);border-bottom:1px solid var(--brass);color:var(--brass-lt);font:700 .8rem Georgia,serif;letter-spacing:.1em;text-transform:uppercase;cursor:move;user-select:none;touch-action:none}
    #chathead .grow{flex:1}
    #chatclose{background:none;border:0;color:var(--brass-lt);font:1rem/1 Georgia,serif;cursor:pointer;padding:0 .3rem;height:100%}
    #chatclose:hover{background:#b98f4540}
    #chatframe{flex:1;width:100%;border:0;min-height:0;background:var(--leather-dk)}
    #chatdock.dragging #chatframe{pointer-events:none}
  </style>
  <script>
  (function(){
    const dock=document.getElementById('chatdock'),frame=document.getElementById('chatframe'),head=document.getElementById('chathead');
    const btn=document.getElementById('chat-btn');
    const CHAT_ROOM='geez-table';   // fixed room name: everyone on the VTT lands in the same call (override with ?room=)
    const qs=new URLSearchParams(location.search);
    const room=qs.get('room')||CHAT_ROOM;
    const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
    // GM (?gm) joins as "GM"; players use ?name=, else the name they typed last time (saved by the chat page); else they see the join form once.
    const myName=()=>{ if(qs.has('gm'))return 'GM'; let me=null; try{me=JSON.parse(localStorage.getItem('vtt-me'))}catch(e){} return qs.get('name')||me?.name||get('geez.videochat.name')||''; };   // your VTT "Me" character, so the call name matches your token
    let loaded=false;
    function show(on){
      if(on&&!loaded){loaded=true;   // loaded once; stays mounted so the call survives hiding
        const n=myName();
        frame.src='videochat.html?room='+encodeURIComponent(room)+(n?'&name='+encodeURIComponent(n)+'&autojoin=1':'')+(qs.get('fake')?'&fake='+encodeURIComponent(qs.get('fake')):'');   // autojoin: no join form, camera+mic requested straight away
      }
      dock.hidden=!on;set('geez.chatdock.open',on?'1':'');
    }
    btn.addEventListener('click',()=>show(dock.hidden));
    addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.geezChat==='left'){show(false);loaded=false;frame.src='about:blank'}});   // Leave inside the chat closes the dock; next open rejoins
    document.getElementById('chatclose').addEventListener('click',()=>show(false));
    try{const r=JSON.parse(get('geez.chatdock.rect')||'null');if(r){dock.style.left=r.l+'px';dock.style.top=r.t+'px';dock.style.right='auto';dock.style.bottom='auto';if(r.w>=260)dock.style.width=r.w+'px';if(r.h>=240)dock.style.height=r.h+'px';}}catch(e){}   // sizes under 260x240 are ignored
    function saveRect(){const b=dock.getBoundingClientRect();set('geez.chatdock.rect',JSON.stringify({l:Math.round(b.left),t:Math.round(b.top),w:Math.round(b.width),h:Math.round(b.height)}))}
    let d=null;
    head.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const b=dock.getBoundingClientRect();d={x:e.clientX-b.left,y:e.clientY-b.top};head.setPointerCapture(e.pointerId);dock.classList.add('dragging')});
    head.addEventListener('pointermove',e=>{if(!d)return;const x=Math.max(0,Math.min(innerWidth-80,e.clientX-d.x)),y=Math.max(0,Math.min(innerHeight-40,e.clientY-d.y));dock.style.left=x+'px';dock.style.top=y+'px';dock.style.right='auto';dock.style.bottom='auto'});
    const end=()=>{if(!d)return;d=null;dock.classList.remove('dragging');saveRect()};
    head.addEventListener('pointerup',end);head.addEventListener('pointercancel',end);
    new ResizeObserver(()=>{if(!dock.hidden)saveRect()}).observe(dock);
    if(get('geez.chatdock.open'))show(true);
  })();
  </script>
  <script type="module" src="js/vtt/vtt.js"></script>
</body>
</html>
