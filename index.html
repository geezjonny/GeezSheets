<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DM Toolkit Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg2: #111827;
      --panel: rgba(17, 24, 39, 0.95);
      --line: #374151;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --accent2: #93c5fd;
      --good: #22c55e;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.1;
    }

    .title-wrap p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #0b1220;
    }

    .btn-primary:hover {
      background: var(--accent2);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #334155;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #475569;
      transform: translateY(-1px);
    }

    .status {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      font-size: 0.9rem;
      color: var(--text);
      min-width: 220px;
    }

    .tabbar-wrap {
      background: rgba(15, 23, 42, 0.8);
      border-bottom: 1px solid var(--line);
      padding: 10px 14px;
      position: sticky;
      top: 74px;
      z-index: 9;
      backdrop-filter: blur(8px);
    }

    .tabbar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      white-space: nowrap;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      flex: 0 0 auto;
      transition: 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--accent);
    }

    .tab-btn.active {
      background: rgba(96,165,250,0.12);
      border-color: var(--accent);
      color: var(--accent2);
      box-shadow: 0 0 0 1px rgba(96,165,250,0.18);
    }

    .content {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .frame-shell {
      flex: 1;
      min-height: 0;
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.25);
      position: relative;
    }

    .frame-panel {
      display: none;
      width: 100%;
      height: calc(100vh - 170px);
      min-height: 650px;
      border: none;
      background: #0b1220;
    }

    .frame-panel.active {
      display: block;
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.8);
      color: var(--muted);
      font-size: 0.82rem;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .mono {
      font-family: Consolas, Monaco, monospace;
    }

    @media (max-width: 900px) {
      .topbar {
        position: static;
      }

      .tabbar-wrap {
        position: static;
      }

      .frame-panel {
        height: calc(100vh - 210px);
        min-height: 600px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- TOP BAR -->
    <div class="topbar">
      <div class="title-wrap">
        <h1>DM Toolkit Dashboard</h1>
        <p>One-page shell. Each tool loads in its own internal tab via iframe.</p>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary" id="refreshCurrentBtn">Refresh Current Tab</button>
        <button class="btn btn-secondary" id="refreshAllBtn">Refresh All Tabs</button>
        <button class="btn btn-secondary" id="openCurrentBtn">Open Current in New Tab</button>
      </div>

      <div class="status" id="statusBox">Ready.</div>
    </div>

    <!-- TAB BAR -->
    <div class="tabbar-wrap">
      <div class="tabbar" id="tabBar"></div>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <div class="frame-shell" id="frameShell">
        <!-- Iframes injected here -->
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div>
        Current Tool: <span class="mono" id="currentToolLabel">character.html</span>
      </div>
      <div>
        Files: <span class="mono">character.html • party.html • saves.html • mapsetup.html • vtt.html</span>
      </div>
    </div>
  </div>

  <script>
    // -------------------------
    // Tool registry (your actual files)
    // -------------------------
    const tools = [
      {
        id: "character",
        label: "Character",
        file: "character.html"
      },
      {
        id: "party",
        label: "Party",
        file: "party.html"
      },
      {
        id: "saves",
        label: "Saves",
        file: "saves.html"
      },
      {
        id: "mapsetup",
        label: "Map Setup",
        file: "mapsetup.html"
      },
      {
        id: "vtt",
        label: "VTT",
        file: "vtt.html"
      }
    ];

    const tabBar = document.getElementById("tabBar");
    const frameShell = document.getElementById("frameShell");
    const statusBox = document.getElementById("statusBox");
    const currentToolLabel = document.getElementById("currentToolLabel");

    let activeToolId = tools[0].id;
    const iframeMap = {};

    // -------------------------
    // Helpers
    // -------------------------
    function setStatus(message, type = "info") {
      statusBox.textContent = message;

      if (type === "success") {
        statusBox.style.borderColor = "#166534";
        statusBox.style.color = "#86efac";
      } else if (type === "error") {
        statusBox.style.borderColor = "#7f1d1d";
        statusBox.style.color = "#fca5a5";
      } else if (type === "warn") {
        statusBox.style.borderColor = "#92400e";
        statusBox.style.color = "#fcd34d";
      } else {
        statusBox.style.borderColor = "#374151";
        statusBox.style.color = "#e5e7eb";
      }
    }

    function getToolById(toolId) {
      return tools.find(t => t.id === toolId);
    }

    function getActiveTool() {
      return getToolById(activeToolId);
    }

    function createTabs() {
      tabBar.innerHTML = "";

      tools.forEach(tool => {
        const btn = document.createElement("button");
        btn.className = "tab-btn" + (tool.id === activeToolId ? " active" : "");
        btn.textContent = tool.label;

        btn.addEventListener("click", () => {
          switchTab(tool.id);
        });

        tabBar.appendChild(btn);
      });
    }

    function createIframes() {
      frameShell.innerHTML = "";

      tools.forEach(tool => {
        const iframe = document.createElement("iframe");
        iframe.className = "frame-panel" + (tool.id === activeToolId ? " active" : "");
        iframe.src = tool.file;
        iframe.title = tool.label;
        iframe.dataset.toolId = tool.id;

        iframe.addEventListener("load", () => {
          if (tool.id === activeToolId) {
            setStatus(`Loaded ${tool.file}`, "success");
          }
        });

        iframeMap[tool.id] = iframe;
        frameShell.appendChild(iframe);
      });
    }

    function switchTab(toolId) {
      activeToolId = toolId;

      document.querySelectorAll(".tab-btn").forEach((btn, index) => {
        const tool = tools[index];
        btn.classList.toggle("active", tool.id === toolId);
      });

      document.querySelectorAll(".frame-panel").forEach(frame => {
        frame.classList.toggle("active", frame.dataset.toolId === toolId);
      });

      const activeTool = getActiveTool();
      currentToolLabel.textContent = activeTool.file;
      setStatus(`Switched to ${activeTool.file}`, "info");
    }

    function refreshCurrentTab() {
      const activeTool = getActiveTool();
      const iframe = iframeMap[activeTool.id];

      if (!iframe) {
        setStatus("No active iframe found.", "error");
        return;
      }

      const currentSrc = iframe.src;
      iframe.src = currentSrc;
      setStatus(`Refreshing ${activeTool.file}...`, "warn");
    }

    function refreshAllTabs() {
      tools.forEach(tool => {
        const iframe = iframeMap[tool.id];
        if (iframe) {
          const currentSrc = iframe.src;
          iframe.src = currentSrc;
        }
      });

      setStatus("Refreshing all tabs...", "warn");
    }

    function openCurrentInNewTab() {
      const activeTool = getActiveTool();
      window.open(activeTool.file, "_blank", "noopener,noreferrer");
      setStatus(`Opened ${activeTool.file} in new tab.`, "info");
    }

    // -------------------------
    // Wire up
    // -------------------------
    document.getElementById("refreshCurrentBtn").addEventListener("click", refreshCurrentTab);
    document.getElementById("refreshAllBtn").addEventListener("click", refreshAllTabs);
    document.getElementById("openCurrentBtn").addEventListener("click", openCurrentInNewTab);

    createTabs();
    createIframes();
    currentToolLabel.textContent = getActiveTool().file;
    setStatus(`Loaded ${getActiveTool().file}`, "success");
  </script>
</body>
</html>
