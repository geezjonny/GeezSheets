<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Renderer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=IM+Fell+English&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0b08;--panel:#1a1510;--panel2:#151208;--border:#3d2e1a;
  --gold:#c8a84b;--gold-dim:#7a6228;--text:#d4c49a;--dim:#6b5a38;
  --red:#e04040;--green:#5a9a5a;
  --sidebar:280px;--hud:48px;--initiative:56px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'IM Fell English',serif;color:var(--text)}
#app{display:grid;grid-template-columns:1fr var(--sidebar);grid-template-rows:var(--hud) 1fr var(--initiative);width:100vw;height:100vh}
#hud{grid-column:1/3;grid-row:1;background:rgba(13,11,8,.95);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:20;backdrop-filter:blur(6px)}
#hud h1{font-family:'Cinzel',serif;font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.12em;white-space:nowrap}
.sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
button{height:30px;padding:0 11px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--dim);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.05em;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
button:hover{border-color:var(--gold-dim);color:var(--text)}
button.active{border-color:var(--gold);color:var(--gold);background:rgba(200,168,75,.08)}
#status{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;color:var(--dim);flex-shrink:0}
#status.live{color:var(--green)}
#status.error{color:var(--red)}
#player-name-display{font-family:'Cinzel',serif;font-size:10px;color:var(--gold-dim);margin-left:auto;flex-shrink:0;cursor:pointer;padding:0 4px}
#player-name-display:hover{color:var(--gold)}
#viewport{grid-column:1;grid-row:2;position:relative;overflow:hidden;cursor:grab}
#viewport.grabbing{cursor:grabbing}
#viewport.pinging{cursor:crosshair}
canvas{display:block;width:100%;height:100%}
#scale-label{position:absolute;bottom:8px;left:8px;font-family:'Cinzel',serif;font-size:9px;color:var(--dim);pointer-events:none}
#weather-indicator{position:absolute;bottom:8px;left:60px;font-family:'Cinzel',serif;font-size:9px;color:var(--dim);pointer-events:none}
#session{grid-column:2;grid-row:2;display:flex;flex-direction:column;background:var(--panel2);border-left:1px solid var(--border);overflow:hidden}
#session-header{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);letter-spacing:.1em;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
#chat-log{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
#chat-log::-webkit-scrollbar{width:4px}
#chat-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chat-msg{font-size:12px;line-height:1.4;word-break:break-word}
.chat-msg .who{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);margin-right:6px}
.chat-msg .who.system{color:var(--dim)}
.chat-msg .who.dice{color:#7ab0e0}
.chat-msg.mine .who{color:#e0b070}
#dice-section{border-top:1px solid var(--border);padding:8px;flex-shrink:0}
#dice-section-label{font-family:'Cinzel',serif;font-size:9px;color:var(--dim);letter-spacing:.08em;margin-bottom:6px}
#dice-btns{display:flex;gap:4px;flex-wrap:wrap}
.die-btn{width:36px;height:36px;padding:0;font-family:'Cinzel',serif;font-size:10px;border-radius:4px}
#dice-result-inline{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);margin-top:6px;min-height:18px;text-align:center}
#chat-input-row{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border);flex-shrink:0}
#chat-input{flex:1;background:#111;border:1px solid var(--border);color:var(--text);font-family:'IM Fell English',serif;font-size:12px;padding:5px 8px;border-radius:4px;outline:none;min-width:0}
#chat-input:focus{border-color:var(--gold-dim)}
#chat-send{padding:0 10px;height:28px;font-size:10px}
#initiative-bar{grid-column:1/3;grid-row:3;background:rgba(13,11,8,.95);border-top:1px solid var(--border);display:flex;align-items:center;overflow:hidden}
#init-label{font-family:'Cinzel',serif;font-size:9px;color:var(--dim);letter-spacing:.1em;padding:0 10px;flex-shrink:0;text-transform:uppercase}
#init-controls{display:flex;flex-direction:column;gap:4px;padding:4px 8px;border-right:1px solid var(--border);flex-shrink:0}
#init-controls button{height:22px;font-size:9px;padding:0 8px}
#init-track{flex:1;display:flex;align-items:center;gap:6px;padding:0 8px;overflow-x:auto}
#init-track::-webkit-scrollbar{height:3px}
#init-track::-webkit-scrollbar-thumb{background:var(--border)}
.init-card{flex-shrink:0;height:44px;min-width:80px;border:1px solid var(--border);border-radius:4px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;padding:0 8px;position:relative}
.init-card:hover{border-color:var(--gold-dim)}
.init-card.active-turn{border-color:var(--gold);background:rgba(200,168,75,.1);box-shadow:0 0 8px rgba(200,168,75,.3)}
.init-card.active-turn::before{content:'▶';position:absolute;left:-14px;font-size:10px;color:var(--gold)}
.init-card .init-name{font-family:'Cinzel',serif;font-size:10px;color:var(--text);letter-spacing:.04em;text-align:center}
.init-card .init-num{font-family:'Cinzel',serif;font-size:9px;color:var(--dim)}
.init-card .init-hp{font-size:9px;font-family:'Cinzel',serif}

/* ── Context menu ── */
#ctx-menu{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:4px 0;display:none;min-width:160px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#ctx-menu.open{display:block}
.ctx-item{padding:7px 14px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.05em;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--dim);transition:background .1s}
.ctx-item:hover{background:rgba(200,168,75,.08);color:var(--text)}
.ctx-item .ctx-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ctx-sep{height:1px;background:var(--border);margin:3px 0}
.ctx-label{padding:4px 14px;font-family:'Cinzel',serif;font-size:8px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}

/* ── Toast ── */
#ping-toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid #4a8aaa;color:#7ac0e0;font-family:'Cinzel',serif;font-size:11px;padding:5px 14px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:25}
#ping-toast.show{opacity:1}

/* ── Login modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px 28px 24px;width:380px;display:flex;flex-direction:column;gap:0}
.login-title{font-family:'Cinzel',serif;font-size:18px;font-weight:600;color:var(--gold);letter-spacing:.1em;text-align:center;margin-bottom:4px}
.login-sub{font-family:'Cinzel',serif;font-size:10px;color:var(--dim);text-align:center;letter-spacing:.06em;margin-bottom:22px}
.login-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.login-field label{font-family:'Cinzel',serif;font-size:.6rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.login-field input,.login-field select{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'IM Fell English',serif;font-size:14px;padding:9px 11px;outline:none;transition:border-color .15s;width:100%}
.login-field input:focus,.login-field select:focus{border-color:var(--gold-dim)}
.login-field select option{background:var(--panel)}
.login-divider{height:1px;background:var(--border);margin:6px 0 16px}
.mic-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:14px;cursor:pointer;transition:border-color .15s}
.mic-row:hover{border-color:var(--gold-dim)}
.mic-row.granted{border-color:rgba(90,154,90,.5);background:rgba(90,154,90,.05)}
.mic-row.denied{border-color:rgba(224,64,64,.4);background:rgba(224,64,64,.04);cursor:default}
.mic-icon{font-size:20px;flex-shrink:0}
.mic-text{flex:1}
.mic-text strong{font-family:'Cinzel',serif;font-size:.7rem;font-weight:600;color:var(--text);display:block;margin-bottom:1px}
.mic-text span{font-family:'Cinzel',serif;font-size:.6rem;color:var(--dim)}
.mic-check{font-size:14px}
.login-btn{width:100%;height:42px;border:1px solid rgba(200,168,75,.5);border-radius:6px;background:rgba(200,168,75,.08);color:var(--gold);font-family:'Cinzel',serif;font-size:.8rem;font-weight:600;letter-spacing:.08em;cursor:pointer;margin-top:4px;transition:all .15s}
.login-btn:hover{background:rgba(200,168,75,.16);border-color:var(--gold)}
.login-err{font-family:'Cinzel',serif;font-size:.65rem;color:var(--red);text-align:center;min-height:16px;margin-top:-8px;margin-bottom:4px}

/* ── Spinner overlay ── */
#overlay{position:fixed;inset:0;background:rgba(13,11,8,.92);display:flex;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:14px}
#overlay.hidden{display:none}
#overlay p{font-family:'Cinzel',serif;font-size:.85rem;color:var(--dim)}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ── Login Modal ── -->
<div id="login-modal" class="modal-overlay">
  <div class="login-box">
    <div class="login-title">⚔ GeezVTT</div>
    <div class="login-sub">Enter the dungeon</div>

    <div class="login-field">
      <label>Your Name</label>
      <input id="login-name" type="text" placeholder="How shall you be known?" maxlength="30" spellcheck="false" autocomplete="off"/>
    </div>

    <div class="login-field" id="login-campaign-field">
      <label>Campaign</label>
      <select id="login-campaign"><option value="">Loading…</option></select>
    </div>

    <div class="login-field">
      <label>Your Character</label>
      <select id="login-char"><option value="">— Choose your character —</option></select>
    </div>

    <div class="login-field" id="login-pass-field" style="display:none">
      <label>Session Passphrase</label>
      <input id="login-pass" type="password" placeholder="Ask your GM" maxlength="40" spellcheck="false"/>
    </div>

    <div class="login-divider"></div>

    <div class="mic-row" id="mic-row" onclick="requestMic()">
      <div class="mic-icon">🎤</div>
      <div class="mic-text">
        <strong>Microphone</strong>
        <span id="mic-status-text">Click to enable talking indicator</span>
      </div>
      <div class="mic-check" id="mic-check">○</div>
    </div>

    <div class="login-err" id="login-err"></div>
    <button class="login-btn" id="login-confirm">Enter the Dungeon</button>
  </div>
</div>

<!-- ── Loading overlay ── -->
<div id="overlay">
  <div class="spinner"></div>
  <p id="overlay-msg">Loading…</p>
</div>

<!-- ── Context menu ── -->
<div id="ctx-menu">
  <div class="ctx-label">Conditions</div>
  <div class="ctx-item" data-condition="poisoned"  ><div class="ctx-dot" style="background:#5aaa5a"></div>Poisoned</div>
  <div class="ctx-item" data-condition="stunned"   ><div class="ctx-dot" style="background:#aaaa30"></div>Stunned</div>
  <div class="ctx-item" data-condition="prone"     ><div class="ctx-dot" style="background:#888888"></div>Prone</div>
  <div class="ctx-item" data-condition="burning"   ><div class="ctx-dot" style="background:#e07030"></div>Burning</div>
  <div class="ctx-item" data-condition="frozen"    ><div class="ctx-dot" style="background:#50c0e0"></div>Frozen</div>
  <div class="ctx-item" data-condition="blinded"   ><div class="ctx-dot" style="background:#dddddd"></div>Blinded</div>
  <div class="ctx-item" data-condition="charmed"   ><div class="ctx-dot" style="background:#e070c0"></div>Charmed</div>
  <div class="ctx-item" data-condition="frightened"><div class="ctx-dot" style="background:#9060d0"></div>Frightened</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-condition="clear" style="color:var(--red)">✕ Clear conditions</div>
  <div class="ctx-sep"></div>
  <div class="ctx-label">Token</div>
  <div class="ctx-item" data-action="delete" style="color:var(--red)">✕ Delete token</div>
</div>

<!-- ── App shell ── -->
<div id="app">
  <div id="hud">
    <h1>⚔ DUNGEON</h1>
    <div class="sep"></div>
    <button id="fitBtn">Fit</button>
    <input id="map-input" type="text" value="dungeon-1" hidden>
    <div class="sep"></div>
    <button id="pingBtn">📍 Ping</button>
    <button id="micBtn">🎤 Mic</button>
    <button id="sheetsBtn">📋 Sheets</button>
    <div class="sep"></div>
    <span id="status">—</span>
    <span id="player-name-display" title="Click to re-login"></span>
  </div>
  <div id="viewport">
    <canvas id="canvas"></canvas>
    <div id="scale-label">100%</div>
    <div id="weather-indicator"></div>
  </div>
  <div id="session">
    <div id="session-header">⚔ SESSION</div>
    <div id="chat-log"></div>
    <div id="dice-section">
      <div id="dice-section-label">DICE ROLLER</div>
      <div id="dice-btns"></div>
      <div id="dice-result-inline"></div>
    </div>
    <div id="chat-input-row">
      <input id="chat-input" type="text" placeholder="Message…" maxlength="300" spellcheck="false">
      <button id="chat-send">Send</button>
    </div>
  </div>
  <div id="initiative-bar">
    <div id="init-label">Initiative</div>
    <div id="init-track"></div>
  </div>
</div>
<div id="ping-toast"></div>

<script type="module">
import { getDatabase, ref, onValue, set, push, remove, update, get }
  from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";
import { db }                from "./js/firebase.js";
import { loadConfig, getTERRAINS, getCONDITIONS, getDICE, TILE } from "./js/config.js";
import { camera, toWorld, toScreen, worldToTile, applyZoom, fitCamera } from "./js/camera.js";
import { textures, tokenTextures, propTextures, loadTerrainTextures, tryLoadTokenTexture, tryLoadPropTexture } from "./js/assets.js";
import { weather, initParticles, applyWeatherData, drawWeather } from "./js/weather.js";
import { drawToken, tokenAtTile, applyCondition, deleteToken } from "./js/tokens.js";
import { drawFog } from "./js/fog.js";
import { sendPing, drawPings, drawLasers, startLaser, moveLaser, stopLaser } from "./js/pings.js";
import { drawChains } from "./js/chains.js";
import { drawRuler, findSnapPoint } from "./js/ruler.js";
import { startMicListener, stopMicListener, subscribeTalking, getShakeOffset } from "./js/mic.js";
import { subscribePassphrase, checkPassphrase, hasPassphraseSet, fetchCharacterRoster, saveAuthSession, loadAuthSession } from "./js/auth.js";
import { sendChat, renderChat } from "./js/chat.js";
import { rollDie, animateDiceResult } from "./js/dice.js";
import { renderInitTrack } from "./js/initiative.js";

// ── State ─────────────────────────────────────────────────────────────────────
let tiles={},fog={},tokens={},stamps={},roofs={},props={},propDefs={},chains={};
let bgImage=null,bgUrl="",bgPpi=70,nightMode=false;
let pcsData={};
let playerName=localStorage.getItem("vtt_player_name")||"";
let currentMap="dungeon-1";
let firstLoad=true;
let pingMode=false,isHolding=false;
let pingHoldTimer=null,myLaserRef=null;
const activePings={},activeLasers={};
let draggingToken=null,panning=false;
let panStartX=0,panStartY=0,camStartX=0,camStartY=0;
let rulerStart=null,rulerEnd=null,rulerActive=false;
let micEnabled=false;
let micPermission="unknown"; // "unknown" | "granted" | "denied"
let myCharacterId=null,myCharacterName=null;
let initiative={order:[],active:null};
let ctxTokenId=null;
let liveUnsub=null;
let allRosterChars=[]; // [{id, name, campaign}]

// ── DOM ───────────────────────────────────────────────────────────────────────
const canvas     = document.getElementById("canvas");
const ctx        = canvas.getContext("2d");
const viewport   = document.getElementById("viewport");
const statusEl   = document.getElementById("status");
const overlayEl  = document.getElementById("overlay");
const mapInput   = document.getElementById("map-input");
const scaleLabel = document.getElementById("scale-label");
const pingToast  = document.getElementById("ping-toast");
const loginModal = document.getElementById("login-modal");
const nameDisplay= document.getElementById("player-name-display");
const chatLog    = document.getElementById("chat-log");
const chatInput  = document.getElementById("chat-input");
const initTrack  = document.getElementById("init-track");
const ctxMenu    = document.getElementById("ctx-menu");
const micBtn     = document.getElementById("micBtn");

// Login elements
const loginName      = document.getElementById("login-name");
const loginCampaign  = document.getElementById("login-campaign");
const loginChar      = document.getElementById("login-char");
const loginPass      = document.getElementById("login-pass");
const loginPassField = document.getElementById("login-pass-field");
const loginErr       = document.getElementById("login-err");
const micRow         = document.getElementById("mic-row");
const micStatusText  = document.getElementById("mic-status-text");
const micCheck       = document.getElementById("mic-check");

// ── Helpers ───────────────────────────────────────────────────────────────────
function setStatus(cls,text){statusEl.className=cls;statusEl.textContent=text;}
function toast(msg){pingToast.textContent=msg;pingToast.classList.add("show");setTimeout(()=>pingToast.classList.remove("show"),2500);}
function screenPos(e){const r=viewport.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}

// ── Mic permission request (login modal) ──────────────────────────────────────
window.requestMic = async function(){
  if(micPermission==="denied") return;
  if(micPermission==="granted"){micPermission="unknown";updateMicUI();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop()); // just checking permission
    micPermission="granted";
  }catch(e){
    micPermission="denied";
  }
  updateMicUI();
};

function updateMicUI(){
  micRow.classList.toggle("granted",micPermission==="granted");
  micRow.classList.toggle("denied",micPermission==="denied");
  if(micPermission==="granted"){micStatusText.textContent="Microphone enabled";micCheck.textContent="✓";}
  else if(micPermission==="denied"){micStatusText.textContent="Access denied — check browser settings";micCheck.textContent="✗";}
  else{micStatusText.textContent="Click to enable talking indicator";micCheck.textContent="○";}
}

// ── Populate login dropdowns from RTDB ────────────────────────────────────────
async function populateLoginDropdowns(){
  const snap=await get(ref(db,"characters/pcs"));
  if(!snap.exists()){loginCampaign.innerHTML='<option value="">No characters found</option>';return;}
  const data=snap.val();
  allRosterChars=Object.entries(data)
    .filter(([,c])=>c&&c.name&&c.type!=='npc'&&c.campaign!=='__oracle__')
    .map(([id,c])=>({id,name:c.name,campaign:c.campaign||''}));

  const campaigns=[...new Set(allRosterChars.map(c=>c.campaign).filter(Boolean))].sort();
  loginCampaign.innerHTML='<option value="">— All —</option>'+campaigns.map(c=>`<option value="${c}">${c}</option>`).join('');

  // Restore saved session to pre-fill
  const saved=loadAuthSession();
  if(saved){
    loginName.value=saved.playerName||'';
    if(saved.campaign) loginCampaign.value=saved.campaign;
  }
  filterCharsBycampaign();

  if(saved&&saved.characterId) loginChar.value=saved.characterId;
}

function filterCharsBycampaign(){
  const camp=loginCampaign.value;
  const filtered=camp?allRosterChars.filter(c=>c.campaign===camp):allRosterChars;
  const prev=loginChar.value;
  loginChar.innerHTML='<option value="">— Choose your character —</option>'+filtered.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  if(prev&&filtered.find(c=>c.id===prev)) loginChar.value=prev;
}
loginCampaign.addEventListener("change",filterCharsBycampaign);

// ── Confirm login ─────────────────────────────────────────────────────────────
async function confirmLogin(){
  const name=loginName.value.trim();
  if(!name){loginErr.textContent="Please enter your name.";return;}
  if(hasPassphraseSet()&&!checkPassphrase(loginPass.value)){loginErr.textContent="Incorrect passphrase.";return;}
  loginErr.textContent="";

  playerName=name;
  localStorage.setItem("vtt_player_name",name);

  const charId=loginChar.value;
  const charEntry=allRosterChars.find(c=>c.id===charId);
  myCharacterId=charId||null;
  myCharacterName=charEntry?.name||null;
  saveAuthSession(name,charId,charEntry?.name||null,loginCampaign.value);

  // Start mic if permission was granted in the modal
  if(micPermission==="granted"&&!micEnabled){
    const ok=await startMicListener(playerName);
    if(ok){micEnabled=true;micBtn.classList.add("active");micBtn.textContent="🎤 On";}
  }

  loginModal.classList.add("hidden");
  nameDisplay.textContent=playerName+(myCharacterName?` · ${myCharacterName}`:"");
}

document.getElementById("login-confirm").onclick=confirmLogin;
loginName.addEventListener("keydown",e=>{if(e.key==="Enter")confirmLogin();});

// ── HUD mic toggle ────────────────────────────────────────────────────────────
micBtn.onclick=async()=>{
  if(!playerName){loginModal.classList.remove("hidden");return;}
  micEnabled=!micEnabled;
  if(micEnabled){
    const ok=await startMicListener(playerName);
    if(!ok){micEnabled=false;toast("Mic access denied");return;}
    micBtn.classList.add("active");micBtn.textContent="🎤 On";
  }else{
    stopMicListener(playerName);
    micBtn.classList.remove("active");micBtn.textContent="🎤 Mic";
  }
};

// Re-login from name display
nameDisplay.onclick=()=>{
  populateLoginDropdowns();
  loginModal.classList.remove("hidden");
};

// ── Resize ────────────────────────────────────────────────────────────────────
function resize(){canvas.width=viewport.clientWidth;canvas.height=viewport.clientHeight;initParticles(canvas.width,canvas.height);}
resize();window.addEventListener("resize",resize);

// ── RTDB Listeners ────────────────────────────────────────────────────────────
onValue(ref(db,"characters/pcs"),snap=>{for(const k in pcsData)delete pcsData[k];if(snap.exists())Object.assign(pcsData,snap.val());});
onValue(ref(db,"propDefs"),snap=>{const data=snap.val();if(!data)return;for(const[id,p]of Object.entries(data)){propDefs[id]=p;tryLoadPropTexture(id);}});
onValue(ref(db,"weather"),snap=>{
  const data=snap.val();if(!data)return;
  applyWeatherData(data);
  const active=["rain","snow","mist","storm"].filter(t=>weather[t].enabled).map(t=>t[0].toUpperCase()+t.slice(1));
  document.getElementById("weather-indicator").textContent=active.length?active.join(" · "):"";
});
onValue(ref(db,"pings"),snap=>{
  const data=snap.val()||{};const now=Date.now();
  for(const[id,ping]of Object.entries(data)){
    if(!activePings[id]&&now-ping.t<4000){
      activePings[id]={wx:ping.x*TILE+TILE/2,wy:ping.y*TILE+TILE/2,name:ping.name,startTime:now,id};
      if(ping.name!==playerName)toast(`📍 ${ping.name} pinged!`);
    }
  }
});
onValue(ref(db,"lasers"),snap=>{
  const data=snap.val()||{};for(const k in activeLasers)delete activeLasers[k];
  for(const[name,pos]of Object.entries(data)){if(name!==playerName.replace(/\./g,"_"))activeLasers[name]={wx:pos.wx,wy:pos.wy,color:pos.color};}
});
onValue(ref(db,"initiative"),snap=>{
  const data=snap.val()||{};
  initiative.order=data.order||[];initiative.active=data.active||null;
  renderInitTrack(initTrack,initiative,{
    onCardClick:(id,entry)=>{
      const tok=Object.values(tokens).find(t=>t.name?.toLowerCase()===entry.name.toLowerCase());
      if(tok)activePings[`init_${id}`]={wx:tok.x*TILE+TILE/2,wy:tok.y*TILE+TILE/2,name:entry.name,startTime:Date.now(),id:`init_${id}`};
    },
  });
});
onValue(ref(db,"chat"),snap=>{renderChat(snap.val(),chatLog,playerName);});
onValue(ref(db,"dice/last"),snap=>{
  const data=snap.val();if(!data||Date.now()-data.t>10000)return;
  const resultEl=document.getElementById("dice-result-inline");
  animateDiceResult(data,resultEl,d=>{resultEl.textContent=`${d.roller}: d${d.sides} → ${d.result}`;});
});

function subscribeLive(){
  if(liveUnsub){liveUnsub();liveUnsub=null;}
  const mapName=mapInput.value.trim()||"dungeon-1";
  setStatus("","Connecting…");
  liveUnsub=onValue(ref(db,`maps/${mapName}`),snap=>{
    const data=snap.val();
    for(const k in tiles)delete tiles[k];for(const k in fog)delete fog[k];
    for(const k in tokens)delete tokens[k];for(const k in stamps)delete stamps[k];
    for(const k in roofs)delete roofs[k];for(const k in props)delete props[k];
    for(const k in chains)delete chains[k];
    if(data){
      if(data.tiles)Object.assign(tiles,data.tiles);
      if(data.fog)Object.assign(fog,data.fog);
      if(data.tokens){Object.assign(tokens,data.tokens);Object.values(data.tokens).forEach(t=>tryLoadTokenTexture(t.characterId,t.lookupName||t.name));}
      if(data.stamps)for(const[k,v]of Object.entries(data.stamps))stamps[k.replace("_",",")]=v;
      if(data.roofs)Object.assign(roofs,data.roofs);
      if(data.props)Object.assign(props,data.props);
      if(data.chains)Object.assign(chains,data.chains);
      if(data.background&&data.background!==bgUrl){bgUrl=data.background;bgImage=null;const img=new Image();img.crossOrigin="anonymous";img.onload=()=>bgImage=img;img.src=bgUrl;}
      else if(!data.background){bgUrl="";bgImage=null;}
      bgPpi=data.backgroundPpi||70;nightMode=!!data.nightMode;
    }
    setStatus("live",`Live · ${Object.keys(tiles).length} tiles`);
    if(firstLoad){firstLoad=false;fitCamera(tiles,TILE,canvas.width,canvas.height);overlayEl.classList.add("hidden");}
  },()=>{setStatus("error","RTDB error");overlayEl.classList.add("hidden");});
}
onValue(ref(db,"session/currentMap"),snap=>{
  const name=snap.val();if(!name)return;
  mapInput.value=name;currentMap=name;firstLoad=true;subscribeLive();
});

// ── Context menu ──────────────────────────────────────────────────────────────
document.querySelectorAll(".ctx-item").forEach(item=>{
  item.onclick=()=>{
    if(!ctxTokenId){ctxMenu.classList.remove("open");return;}
    const cond=item.dataset.condition,action=item.dataset.action;
    if(cond)applyCondition(currentMap,ctxTokenId,cond,tokens);
    if(action==="delete")deleteToken(currentMap,ctxTokenId,tokens);
    ctxMenu.classList.remove("open");ctxTokenId=null;
  };
});
document.addEventListener("click",()=>ctxMenu.classList.remove("open"));

// ── Chat & Dice ───────────────────────────────────────────────────────────────
document.getElementById("chat-send").onclick=()=>{if(!playerName)return;sendChat(chatInput.value,playerName);chatInput.value="";};
chatInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!playerName)return;sendChat(chatInput.value,playerName);chatInput.value="";}});

// ── Buttons ───────────────────────────────────────────────────────────────────
document.getElementById("fitBtn").onclick=()=>fitCamera(tiles,TILE,canvas.width,canvas.height);
document.getElementById("sheetsBtn").onclick=()=>window.open("sheet.html","_blank");
document.getElementById("pingBtn").onclick=()=>{
  if(!playerName)return;
  pingMode=!pingMode;document.getElementById("pingBtn").classList.toggle("active",pingMode);
  viewport.classList.toggle("pinging",pingMode);
};

// ── Draw ──────────────────────────────────────────────────────────────────────
const CONDITIONS={};
function buildConditionsMap(){getCONDITIONS().forEach(c=>CONDITIONS[c.id]=c.color);}
function hasWall(x,y){const t=tiles[`${x},${y}`];return t&&t.walls;}
function drawTileAt(x,y,terrain){
  const TERRAINS=getTERRAINS();const def=TERRAINS.find(t=>t.id===terrain);
  const px=x*TILE,py=y*TILE;
  if(textures[terrain])ctx.drawImage(textures[terrain],px,py,TILE,TILE);
  else{ctx.fillStyle=def?.color||"#333";ctx.fillRect(px,py,TILE,TILE);}
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#0d0b08";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();ctx.translate(camera.x,camera.y);ctx.scale(camera.zoom,camera.zoom);

  if(bgImage){
    const s=TILE/(bgPpi||70);const bw=bgImage.width*s,bh=bgImage.height*s;
    if(nightMode){
      ctx.save();ctx.filter="saturate(0.55) brightness(0.55)";ctx.drawImage(bgImage,0,0,bw,bh);
      ctx.filter="none";ctx.globalCompositeOperation="multiply";
      ctx.fillStyle="rgba(40,60,110,0.55)";ctx.fillRect(0,0,bw,bh);
      ctx.globalCompositeOperation="source-over";ctx.restore();
    }else{ctx.drawImage(bgImage,0,0,bw,bh);}
  }

  for(const k in tiles){const[x,y]=k.split(",").map(Number);drawTileAt(x,y,tiles[k].terrain);}
  ctx.strokeStyle="#c0392b";ctx.lineWidth=2.5/camera.zoom;ctx.lineCap="round";
  for(const k in tiles){if(!tiles[k].walls)continue;const[x,y]=k.split(",").map(Number);const px=x*TILE,py=y*TILE;[[0,-1,px,py,px+TILE,py],[0,1,px,py+TILE,px+TILE,py+TILE],[-1,0,px,py,px,py+TILE],[1,0,px+TILE,py,px+TILE,py+TILE]].forEach(([dx,dy,x1,y1,x2,y2])=>{if(!hasWall(x+dx,y+dy)){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}});}

  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`${Math.round(TILE*.65)}px serif`;
  for(const[k,emoji]of Object.entries(stamps)){const[x,y]=k.split(",").map(Number);ctx.fillText(emoji,x*TILE+TILE/2,y*TILE+TILE/2);}
  ctx.restore();

  for(const[k,p]of Object.entries(props)){
    let rx,ry;
    if(p.attachedTo&&tokens[p.attachedTo]){rx=tokens[p.attachedTo].x+(p.offsetX||0);ry=tokens[p.attachedTo].y+(p.offsetY||0);}
    else{[rx,ry]=k.split(",").map(Number);}
    const def=propDefs[p.propId]||{emoji:"📦",w:1,h:1};
    const px=rx*TILE,py=ry*TILE,pw=(p.w||def.w||1)*TILE,ph=(p.h||def.h||1)*TILE;
    const img=propTextures[p.propId];
    if(img)ctx.drawImage(img,px,py,pw,ph);
    else{ctx.save();ctx.font=`${Math.round(Math.min(pw,ph)*0.7)}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(def.emoji,px+pw/2,py+ph/2);ctx.restore();}
  }

  drawChains(ctx,chains,tokens,camera.zoom);
  for(const[id,tok]of Object.entries(tokens))if(tok.type==="npc")drawToken(ctx,tok,camera.zoom,pcsData,CONDITIONS,1,getShakeOffset(tok.name));
  drawFog(ctx,fog,camera.zoom,false);
  for(const[id,tok]of Object.entries(tokens))if(tok.type==="pc")drawToken(ctx,tok,camera.zoom,pcsData,CONDITIONS,1,getShakeOffset(tok.name));

  ctx.save();ctx.globalAlpha=1;
  for(const[k,r]of Object.entries(roofs)){const[x,y]=k.split(",").map(Number);drawTileAt(x,y,r.terrain);}
  ctx.restore();

  ctx.strokeStyle="rgba(255,255,255,.03)";ctx.lineWidth=1/camera.zoom;
  const l=-camera.x/camera.zoom,t=-camera.y/camera.zoom,rr=(canvas.width-camera.x)/camera.zoom,b=(canvas.height-camera.y)/camera.zoom;
  for(let x=Math.floor(l/TILE)*TILE;x<rr;x+=TILE){ctx.beginPath();ctx.moveTo(x,t);ctx.lineTo(x,b);ctx.stroke();}
  for(let y=Math.floor(t/TILE)*TILE;y<b;y+=TILE){ctx.beginPath();ctx.moveTo(l,y);ctx.lineTo(rr,y);ctx.stroke();}
  ctx.restore();

  drawWeather(ctx,canvas.width,canvas.height);
  drawPings(ctx,activePings,(wx,wy)=>toScreen(wx,wy));
  drawLasers(ctx,activeLasers,(wx,wy)=>toScreen(wx,wy));
  drawRuler(ctx,rulerStart,rulerEnd,(wx,wy)=>toScreen(wx,wy));
  requestAnimationFrame(draw);
}

// ── Pointer events ────────────────────────────────────────────────────────────
viewport.addEventListener("contextmenu",e=>{
  e.preventDefault();const[sx,sy]=screenPos(e);const[wx,wy]=toWorld(sx,sy);const[tx,ty]=worldToTile(wx,wy,TILE);
  const tokId=tokenAtTile(tokens,tx,ty);
  if(tokId){ctxTokenId=tokId;ctxMenu.style.left=e.clientX+"px";ctxMenu.style.top=e.clientY+"px";ctxMenu.classList.add("open");}
});

viewport.addEventListener("pointerdown",e=>{
  const[sx,sy]=screenPos(e);
  if(pingMode){sendPing(Math.floor(toWorld(sx,sy)[0]/TILE),Math.floor(toWorld(sx,sy)[1]/TILE),playerName);pingMode=false;document.getElementById("pingBtn").classList.remove("active");viewport.classList.remove("pinging");return;}
  if(e.altKey){
    const[wx,wy]=toWorld(sx,sy);const snap=findSnapPoint(tokens,wx,wy);const point=snap||[wx,wy];
    if(!rulerActive){rulerStart=point;rulerEnd=point;rulerActive=true;}else{rulerEnd=point;rulerActive=false;}
    return;
  }
  const[wx,wy]=toWorld(sx,sy);const[tx,ty]=worldToTile(wx,wy,TILE);
  const tokId=tokenAtTile(tokens,tx,ty);
  if(tokId&&tokens[tokId].type==="pc"&&(tokens[tokId].name?.toLowerCase()===playerName.toLowerCase()||tokens[tokId].characterId===myCharacterId)){
    draggingToken={id:tokId,offsetTX:tx-tokens[tokId].x,offsetTY:ty-tokens[tokId].y};viewport.setPointerCapture(e.pointerId);return;
  }
  isHolding=false;pingHoldTimer=setTimeout(()=>{isHolding=true;myLaserRef=startLaser(playerName,wx,wy);},300);
  panning=true;panStartX=e.clientX;panStartY=e.clientY;camStartX=camera.x;camStartY=camera.y;
  viewport.setPointerCapture(e.pointerId);
});

viewport.addEventListener("pointermove",e=>{
  const[sx,sy]=screenPos(e);
  if(rulerActive){const[wx,wy]=toWorld(sx,sy);const snap=findSnapPoint(tokens,wx,wy);rulerEnd=snap||[wx,wy];return;}
  if(draggingToken){const[wx,wy]=toWorld(sx,sy);tokens[draggingToken.id].x=Math.floor(wx/TILE)-draggingToken.offsetTX;tokens[draggingToken.id].y=Math.floor(wy/TILE)-draggingToken.offsetTY;return;}
  if(isHolding&&myLaserRef){const[wx,wy]=toWorld(sx,sy);moveLaser(myLaserRef,wx,wy,playerName);return;}
  if(panning){camera.x=camStartX+(e.clientX-panStartX);camera.y=camStartY+(e.clientY-panStartY);}
});

viewport.addEventListener("pointerup",e=>{
  if(rulerActive)return;
  if(draggingToken){
    update(ref(db,`maps/${currentMap}/tokens/${draggingToken.id}`),{x:tokens[draggingToken.id].x,y:tokens[draggingToken.id].y});
    draggingToken=null;return;
  }
  clearTimeout(pingHoldTimer);
  if(isHolding){stopLaser(myLaserRef);myLaserRef=null;}
  isHolding=false;panning=false;
});

viewport.addEventListener("wheel",e=>{
  e.preventDefault();
  const[sx,sy]=screenPos(e);
  applyZoom(e.deltaY<0?1.1:.9,sx,sy);
  scaleLabel.textContent=`${Math.round(camera.zoom*100)}%`;
},{passive:false});

window.addEventListener("keydown",e=>{if(e.code==="Escape"){rulerStart=null;rulerEnd=null;rulerActive=false;}});

// ── Init ──────────────────────────────────────────────────────────────────────
(async()=>{
  subscribePassphrase();
  subscribeTalking();
  await loadConfig();
  buildConditionsMap();
  getDICE().forEach(sides=>{
    const btn=document.createElement("button");btn.className="die-btn";btn.textContent=`d${sides}`;
    btn.onclick=async()=>{if(!playerName)return;const result=await rollDie(sides,playerName);sendChat(`rolled d${sides} → ${result}`,playerName,"dice");};
    document.getElementById("dice-btns").appendChild(btn);
  });
  await loadTerrainTextures(getTERRAINS());

  // Check if there's a saved session — show login or restore
  const saved=loadAuthSession();
  if(saved&&saved.playerName){
    playerName=saved.playerName;
    myCharacterId=saved.characterId||null;
    myCharacterName=saved.characterName||null;
    nameDisplay.textContent=playerName+(myCharacterName?` · ${myCharacterName}`:"");
    // Show passphrase field if needed (populated async)
    setTimeout(()=>{if(hasPassphraseSet())loginPassField.style.display="block";},200);
    loginModal.classList.add("hidden");
  } else {
    // Pre-fill passphrase field after subscribe has a moment to resolve
    setTimeout(()=>{if(hasPassphraseSet())loginPassField.style.display="block";},200);
  }

  await populateLoginDropdowns();

  // Start map subscription
  subscribeLive();
  draw();
})();
</script>
