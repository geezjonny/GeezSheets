<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Renderer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=IM+Fell+English&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0b08;--panel:#1a1510;--panel2:#151208;--border:#3d2e1a;
  --gold:#c8a84b;--gold-dim:#7a6228;--text:#d4c49a;--dim:#6b5a38;
  --red:#e04040;--green:#5a9a5a;
  --sidebar:280px;--hud:48px;--initiative:82px;--chat-collapsed:36px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'IM Fell English',serif;color:var(--text)}
#app{display:grid;grid-template-columns:1fr;grid-template-rows:var(--hud) 1fr var(--initiative) var(--chat-collapsed);width:100vw;height:100vh}
#hud{grid-column:1;grid-row:1;background:rgba(13,11,8,.95);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:20;backdrop-filter:blur(6px)}
#hud h1{font-family:'Cinzel',serif;font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.12em;white-space:nowrap}
.sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
button{height:30px;padding:0 11px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--dim);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.05em;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
button:hover{border-color:var(--gold-dim);color:var(--text)}
button.active{border-color:var(--gold);color:var(--gold);background:rgba(200,168,75,.08)}
#status{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;color:var(--dim);flex-shrink:0}
#status.live{color:var(--green)}
#status.error{color:var(--red)}
#player-name-display{font-family:'Cinzel',serif;font-size:10px;color:var(--gold-dim);margin-left:auto;flex-shrink:0;cursor:pointer;padding:0 4px}
#player-name-display:hover{color:var(--gold)}
#viewport{grid-column:1;grid-row:2;position:relative;overflow:hidden;cursor:grab}
#viewport.grabbing{cursor:grabbing}
#viewport.pinging{cursor:crosshair}
canvas{display:block;width:100%;height:100%}
#scale-label{position:absolute;bottom:8px;left:8px;font-family:'Cinzel',serif;font-size:9px;color:var(--dim);pointer-events:none}
#weather-indicator{position:absolute;bottom:8px;left:60px;font-family:'Cinzel',serif;font-size:9px;color:var(--dim);pointer-events:none}
#session-header{display:none}
#session-header{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);letter-spacing:.1em;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
#chat-log{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
#chat-log::-webkit-scrollbar{width:4px}
#chat-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chat-msg{font-size:12px;line-height:1.4;word-break:break-word}
.chat-msg .who{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);margin-right:6px}
.chat-msg .who.system{color:var(--dim)}
.chat-msg .who.dice{color:#7ab0e0}
.chat-msg.mine .who{color:#e0b070}
#dice-section{border-top:1px solid var(--border);padding:8px;flex-shrink:0}
#dice-section-label{font-family:'Cinzel',serif;font-size:9px;color:var(--dim);letter-spacing:.08em;margin-bottom:6px}
#dice-btns{display:flex;gap:4px;flex-wrap:wrap}
.die-btn{width:36px;height:36px;padding:0;font-family:'Cinzel',serif;font-size:10px;border-radius:4px}
#dice-result-inline{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);margin-top:6px;min-height:18px;text-align:center}
#chat-input-row{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border);flex-shrink:0}
#chat-input{flex:1;background:#111;border:1px solid var(--border);color:var(--text);font-family:'IM Fell English',serif;font-size:12px;padding:5px 8px;border-radius:4px;outline:none;min-width:0}
#chat-input:focus{border-color:var(--gold-dim)}
#chat-send{padding:0 10px;height:28px;font-size:10px}
#initiative-bar{grid-column:1;grid-row:3;background:rgba(13,11,8,.95);border-top:1px solid var(--border);display:flex;align-items:center;overflow:hidden}

/* ── Chat strip (collapsed by default) ── */
#chat-strip{grid-column:1;grid-row:4;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer;z-index:15;position:relative;transition:all .25s;overflow:hidden;height:var(--chat-collapsed)}
#chat-strip:hover{background:var(--panel2)}
#chat-last-msg{flex:1;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'IM Fell English',serif}
#chat-last-msg .who{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);margin-right:5px}
#chat-unread{background:var(--gold);color:#0d0b08;font-family:'Cinzel',serif;font-size:9px;font-weight:700;border-radius:999px;padding:1px 7px;flex-shrink:0;display:none}
#chat-toggle-icon{font-size:10px;color:var(--dim);flex-shrink:0;transition:transform .2s}
#chat-strip.open #chat-toggle-icon{transform:rotate(180deg)}

/* ── Chat drawer (slides up) ── */
#chat-drawer{position:fixed;bottom:var(--chat-collapsed);left:0;right:0;height:340px;background:var(--panel);border-top:1px solid var(--border);z-index:14;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:0 -8px 32px rgba(0,0,0,.5)}
#chat-drawer.open{transform:translateY(0)}
#chat-log{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
#chat-log::-webkit-scrollbar{width:4px}
#chat-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chat-msg{font-size:12px;line-height:1.4;word-break:break-word}
.chat-msg .who{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);margin-right:6px}
.chat-msg .who.system{color:var(--text-dim)}
.chat-msg .who.dice{color:#7ab0e0}
.chat-msg.mine .who{color:#e0b070}
#chat-input-row{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border);flex-shrink:0}
#chat-input{flex:1;background:#111;border:1px solid var(--border);color:var(--text);font-family:'IM Fell English',serif;font-size:12px;padding:5px 8px;border-radius:4px;outline:none;min-width:0}
#chat-input:focus{border-color:var(--gold-dim)}
#chat-send{padding:0 10px;height:28px;font-size:10px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--text-dim);font-family:'Cinzel',serif;cursor:pointer}
#chat-send:hover{border-color:var(--gold-dim);color:var(--text)}

/* ── Dice popup ── */
#dice-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);z-index:1000;background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:20px 32px;text-align:center;box-shadow:0 0 60px rgba(200,168,75,.25),0 16px 48px rgba(0,0,0,.8);pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;min-width:160px}
#dice-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#dice-popup.hide{opacity:0;transform:translate(-50%,-50%) scale(0.9)}
#dice-roller-name{font-family:'Cinzel',serif;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
#dice-face{width:80px;height:80px;margin:0 auto 12px;position:relative}
#dice-face svg{width:100%;height:100%}
#dice-number{font-family:'Cinzel',serif;font-size:48px;font-weight:700;color:var(--gold);line-height:1;text-shadow:0 0 20px rgba(200,168,75,.5)}
#dice-label{font-family:'Cinzel',serif;font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.1em}

/* ── Dice HUD bar ── */
#dice-hud{display:flex;align-items:center;gap:4px;padding:0 4px;border-left:1px solid var(--border);margin-left:4px;flex-shrink:0}
.hud-die{width:28px;height:28px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--dim);font-family:'Cinzel',serif;font-size:8px;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center}
.hud-die:hover{border-color:var(--gold-dim);color:var(--text);background:rgba(200,168,75,.06)}
#init-label{font-family:'Cinzel',serif;font-size:9px;color:var(--dim);letter-spacing:.1em;padding:0 10px;flex-shrink:0;text-transform:uppercase}
#init-controls{display:flex;flex-direction:column;gap:4px;padding:4px 8px;border-right:1px solid var(--border);flex-shrink:0}
#init-controls button{height:22px;font-size:9px;padding:0 8px}
#init-track{flex:1;display:flex;align-items:center;gap:6px;padding:0 8px;overflow-x:auto}
#init-track::-webkit-scrollbar{height:3px}
#init-track::-webkit-scrollbar-thumb{background:var(--border)}
.init-card{flex-shrink:0;height:44px;min-width:80px;border:1px solid var(--border);border-radius:4px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;padding:0 8px;position:relative}
.init-card:hover{border-color:var(--gold-dim)}
.init-card.active-turn{border-color:var(--gold);background:rgba(200,168,75,.1);box-shadow:0 0 8px rgba(200,168,75,.3)}
.init-card.active-turn::before{content:'▶';position:absolute;left:-14px;font-size:10px;color:var(--gold)}
.init-card .init-name{font-family:'Cinzel',serif;font-size:10px;color:var(--text);letter-spacing:.04em;text-align:center}
.init-card .init-num{font-family:'Cinzel',serif;font-size:9px;color:var(--dim)}
.init-card .init-hp{font-size:9px;font-family:'Cinzel',serif}

/* ── Context menu ── */



/* ── Left slide-in sheet panel ── */
#sheet-panel{
  position:fixed;top:var(--hud);left:0;bottom:0;
  width:300px;
  background:var(--panel);
  border-right:1px solid var(--border);
  z-index:50;
  display:flex;flex-direction:column;
  transform:translateX(-100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  box-shadow:4px 0 24px rgba(0,0,0,.5);
}
#sheet-panel.open{transform:translateX(0)}
#sheet-panel-header{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-bottom:1px solid var(--border);
  flex-shrink:0;background:var(--panel2);
}
#sheet-panel-title{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);letter-spacing:.1em;flex:1}
#sheet-panel-close{
  border:none;background:transparent;color:var(--dim);font-size:14px;
  cursor:pointer;padding:2px 6px;border-radius:3px;line-height:1;
  transition:color .12s;
}
#sheet-panel-close:hover{color:var(--text)}
#sheet-view{flex:1;overflow-y:auto;padding:0}
#sheet-empty{display:flex;align-items:center;justify-content:center;height:100%;font-family:'Cinzel',serif;font-size:.75rem;color:var(--dim);text-align:center;padding:20px;line-height:1.8}

/* ── Session header (restored) ── */
#session-header{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);letter-spacing:.1em;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
#chat-view{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0}

/* ── Sheet card (scoped to panel) ── */
#sheet-panel .card{background:transparent;border:none;border-radius:0;width:100%;flex-shrink:0;overflow:visible}
#sheet-panel .card-header{padding:12px 12px 8px;border-bottom:1px solid var(--border)}
#sheet-panel .char-name{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;color:var(--gold);margin-bottom:2px}
#sheet-panel .char-sub{font-size:.68rem;color:var(--dim);font-family:'JetBrains Mono',monospace}
#sheet-panel .char-role-badge{display:inline-block;font-family:'Cinzel',serif;font-size:.56rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.3);color:var(--gold);margin-top:4px}
#sheet-panel .hp-row{display:flex;align-items:center;gap:6px;margin-top:8px}
#sheet-panel .hp-label{font-family:'Cinzel',serif;font-size:.58rem;font-weight:700;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;width:16px}
#sheet-panel .hp-bar-wrap{flex:1;height:5px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}
#sheet-panel .hp-bar{height:100%;border-radius:999px;transition:width .4s,background-color .4s}
#sheet-panel .hp-val{font-size:.7rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text);white-space:nowrap;min-width:48px;text-align:right}
#sheet-panel .temp-badge{font-size:.58rem;font-family:'JetBrains Mono',monospace;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.35);color:#c084fc;border-radius:999px;padding:1px 6px;white-space:nowrap}
#sheet-panel .hp-controls{display:flex;align-items:center;gap:5px;margin-top:6px}
#sheet-panel .hp-delta{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:4px 6px;font-size:.76rem;font-family:'JetBrains Mono',monospace;outline:none;text-align:center;min-width:0}
#sheet-panel .hp-delta:focus{border-color:var(--gold-dim)}
#sheet-panel .hp-btn{border-radius:4px;padding:4px 8px;font-size:.68rem;font-weight:700;font-family:'Cinzel',serif;cursor:pointer;transition:all .12s;white-space:nowrap;letter-spacing:.04em}
#sheet-panel .hp-btn.heal{background:rgba(74,154,74,.12);border:1px solid rgba(74,154,74,.3);color:var(--green)}
#sheet-panel .hp-btn.heal:hover{background:rgba(74,154,74,.22)}
#sheet-panel .hp-btn.dmg{background:rgba(224,64,64,.12);border:1px solid rgba(224,64,64,.3);color:#fca5a5}
#sheet-panel .hp-btn.dmg:hover{background:rgba(224,64,64,.22)}
#sheet-panel .stats-row{display:flex;border-bottom:1px solid var(--border)}
#sheet-panel .stat-cell{flex:1;padding:6px 2px;text-align:center;border-right:1px solid var(--border)}
#sheet-panel .stat-cell:last-child{border-right:none}
#sheet-panel .stat-label{font-family:'Cinzel',serif;font-size:.52rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
#sheet-panel .stat-val{font-size:.84rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text)}
#sheet-panel .ability-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px;border-bottom:1px solid var(--border)}
#sheet-panel .ab-box{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:5px;padding:5px 2px;text-align:center}
#sheet-panel .ab-name{font-family:'Cinzel',serif;font-size:.5rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin-bottom:1px}
#sheet-panel .ab-score{font-size:.84rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text);line-height:1}
#sheet-panel .ab-mod{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:var(--gold);margin-top:1px}
#sheet-panel .conditions-row{display:flex;flex-wrap:wrap;gap:3px;padding:5px 8px;border-bottom:1px solid var(--border)}
#sheet-panel .conditions-row:empty{display:none}
#sheet-panel .cond-pill{font-family:'Cinzel',serif;font-size:.55rem;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(224,64,64,.12);border:1px solid rgba(224,64,64,.3);color:#fca5a5}
#sheet-panel .card-footer{padding:6px;display:flex;flex-direction:column;gap:4px}
#sheet-panel .panel-btn{width:100%;border-radius:5px;color:var(--dim);font-family:'Cinzel',serif;font-size:.68rem;font-weight:700;letter-spacing:.04em;padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;border:1px solid var(--border);background:rgba(255,255,255,.02)}
#sheet-panel .panel-btn .chevron{margin-left:auto;transition:transform .2s}
#sheet-panel .panel-btn.open .chevron{transform:rotate(180deg)}
#sheet-panel .panel-btn:hover,#sheet-panel .panel-btn.open{border-color:var(--gold-dim);color:var(--text);background:rgba(200,168,75,.05)}
#sheet-panel .panel-btn.spell-btn:hover,#sheet-panel .panel-btn.spell-btn.open{border-color:#8b5cf6;color:#c084fc;background:rgba(139,92,246,.08)}
#sheet-panel .panel-btn.skill-btn:hover,#sheet-panel .panel-btn.skill-btn.open{border-color:#0ea5e9;color:#38bdf8;background:rgba(14,165,233,.08)}
#sheet-panel .panel-btn.weapon-btn:hover,#sheet-panel .panel-btn.weapon-btn.open{border-color:#e8834a;color:#f5a87b;background:rgba(232,131,74,.08)}
#sheet-panel .panel-btn.tip-btn:hover,#sheet-panel .panel-btn.tip-btn.open{border-color:#22c55e;color:#4ade80;background:rgba(34,197,94,.05)}
#sheet-panel .panel-btn.inv-btn:hover,#sheet-panel .panel-btn.inv-btn.open{border-color:var(--gold-dim);color:var(--gold);background:rgba(200,168,75,.06)}
#sheet-panel .expand-panel{display:none;border-top:1px solid var(--border);padding:10px;background:rgba(12,9,8,.5)}
#sheet-panel .expand-panel.open{display:block}
#sheet-panel .sp-section-title{font-family:'Cinzel',serif;font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;margin-top:8px}
#sheet-panel .sp-section-title:first-child{margin-top:0}
#sheet-panel .empty-panel{font-family:'Cinzel',serif;font-size:.68rem;color:var(--dim);text-align:center;padding:8px 0}
#sheet-panel .sp-meta{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
#sheet-panel .sp-meta-item{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:var(--dim)}
#sheet-panel .sp-meta-item span{color:var(--gold);font-weight:700}
#sheet-panel .slot-levels{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
#sheet-panel .slot-level-row{display:flex;align-items:center;gap:6px}
#sheet-panel .slot-level-label{font-family:'Cinzel',serif;font-size:.58rem;color:var(--dim);width:38px;flex-shrink:0}
#sheet-panel .slot-pips{display:flex;gap:4px;flex-wrap:wrap}
#sheet-panel .slot-pip{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold-dim);background:rgba(200,168,75,.15);cursor:pointer;transition:all .12s;flex-shrink:0}
#sheet-panel .slot-pip:hover{transform:scale(1.15)}
#sheet-panel .slot-pip.used{background:rgba(255,255,255,.04);border-color:var(--border)}
#sheet-panel .spell-list{display:flex;flex-direction:column;gap:3px}
#sheet-panel .spell-item{padding:5px 7px;border-radius:4px;background:rgba(255,255,255,.02);border:1px solid var(--border)}
#sheet-panel .spell-item-top{display:flex;align-items:baseline;justify-content:space-between;gap:5px}
#sheet-panel .spell-name{font-family:'Cinzel',serif;font-size:.7rem;font-weight:700;color:var(--text)}
#sheet-panel .spell-level-tag{font-size:.58rem;font-family:'JetBrains Mono',monospace;color:var(--dim);white-space:nowrap}
#sheet-panel .spell-desc{font-size:.64rem;color:var(--dim);line-height:1.5;margin-top:2px;font-family:'JetBrains Mono',monospace}
#sheet-panel .spell-meta{font-size:.6rem;font-family:'JetBrains Mono',monospace;color:var(--dim);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
#sheet-panel .spell-meta span{color:var(--text)}
#sheet-panel .spell-tip{display:flex;align-items:flex-start;gap:4px;margin-top:3px;padding:3px 6px;border-radius:3px;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2)}
#sheet-panel .spell-tip-text{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:#4ade80;line-height:1.5}
#sheet-panel .skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:6px}
#sheet-panel .skill-row-item{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:3px 7px;border-radius:4px;background:rgba(255,255,255,.02);border:1px solid var(--border);font-size:.66rem}
#sheet-panel .skill-name{color:var(--dim)}
#sheet-panel .skill-val{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text)}
#sheet-panel .skill-row-item.prof .skill-name{color:#38bdf8}
#sheet-panel .skill-row-item.expert .skill-name{color:#4ade80}
#sheet-panel .save-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:6px}
#sheet-panel .save-row-item{display:flex;align-items:center;justify-content:space-between;flex-direction:column;gap:2px;padding:4px 3px;border-radius:4px;background:rgba(255,255,255,.02);border:1px solid var(--border);font-size:.62rem;text-align:center}
#sheet-panel .save-row-item.prof .skill-name{color:var(--gold)}
#sheet-panel .senses-block{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
#sheet-panel .sense-pill{font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:2px 7px;border-radius:4px;border:1px solid rgba(14,165,233,.25);background:rgba(14,165,233,.05);color:#38bdf8}
#sheet-panel .feat-item{padding:5px 7px;border-radius:4px;border:1px solid var(--border);background:rgba(255,255,255,.02);margin-bottom:3px}

import { ref, onValue, set, push, remove, update, get }
  from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";
import { db }                from "./js/firebase.js";
import { loadConfig, getTERRAINS, getCONDITIONS, getPROPS, getDICE, TILE } from "./js/config.js";
import { camera, toWorld, toScreen, worldToTile, applyZoom, fitCamera } from "./js/camera.js";

import { drawChains } from "./js/chains.js";
import { drawRuler, findSnapPoint } from "./js/ruler.js";

import { toggleGlossarySearch, registerTerms } from "./js/glossary.js";

// ── State ─────────────────────────────────────────────────────────────────────
let tiles={},fog={},tokens={},stamps={},roofs={},props={},propDefs={},portals={},impassable={},traps={},chains={};
let bgImage=null,bgUrl="",bgPpi=70,timeOfDay="day";
const geometry={walls:[],lights:[],doors:[],timeOfDay:"day",lightingParams:{blackAlpha:1,lightPunch:1}};
let _geoLC=null,_geoLX=null;

/** True if a world position is currently inside the player's visible area --
 *  reads the actual mask canvas pixel rather than recomputing vision, so it
 *  automatically works the same for day-vision and night-darkness alike. */
function isPositionVisible(wx,wy){
  if(!_geoLC) return true; // mask not built yet this frame -- don't hide
  const[sx,sy]=toScreen(wx,wy);
  const px=Math.floor(sx),py=Math.floor(sy);
  if(px<0||py<0||px>=_geoLC.width||py>=_geoLC.height) return false;
  try{
    const data=_geoLX.getImageData(px,py,1,1).data;
    return data[3]<128; // low alpha = punched transparent = visible; high alpha = still dark
  }catch(e){ return true; } // canvas read failed (e.g. tainted) -- fail open rather than crash
}
function getActiveLights(){
  const tl=[];
  for(const[id,tok] of Object.entries(tokens)){
    if(!tok.light)continue;
    tl.push({id:`tok_light_${id}`,x:tok.x+0.5,y:tok.y+0.5,...tok.light});
  }
  return[...geometry.lights,...tl];
}
let pcsData={};
let playerName=localStorage.getItem("vtt_player_name")||"";
let currentMap="dungeon-1";
let firstLoad=true;
let pingMode=false,isHolding=false;
let pingHoldTimer=null,myLaserRef=null;
const activePings={},activeLasers={};
let draggingToken=null,panning=false;
let panStartX=0,panStartY=0,camStartX=0,camStartY=0;
let rulerStart=null,rulerEnd=null,rulerActive=false;
let micEnabled=false;
let micPermission="unknown"; // "unknown" | "granted" | "denied"
let myCharacterId=null,myCharacterName=null;
let initiative={order:[],active:null};
let liveUnsub=null;
let allRosterChars=[]; // [{id, name, campaign}]

// ── DOM ───────────────────────────────────────────────────────────────────────
const canvas     = document.getElementById("canvas");
const ctx        = canvas.getContext("2d");
const viewport   = document.getElementById("viewport");

// Login elements
const loginName      = document.getElementById("login-name");
const loginCampaign  = document.getElementById("login-campaign");

// ── Mic permission request (login modal) ──────────────────────────────────────
window.requestMic = async function(){
  if(micPermission==="denied") return;
  if(micPermission==="granted"){micPermission="unknown";updateMicUI();return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop()); // just checking permission
    micPermission="granted";
  }catch(e){
    micPermission="denied";
  }
  updateMicUI();
};

function updateMicUI(){
  micRow.classList.toggle("granted",micPermission==="granted");
  micRow.classList.toggle("denied",micPermission==="denied");
  if(micPermission==="granted"){micStatusText.textContent="Microphone enabled";micCheck.textContent="✓";}
  else if(micPermission==="denied"){micStatusText.textContent="Access denied — check browser settings";micCheck.textContent="✗";}
  else{micStatusText.textContent="Click to enable talking indicator";micCheck.textContent="○";}
}

// ── Populate login dropdowns from RTDB ────────────────────────────────────────
async function populateLoginDropdowns(){
  const snap=await get(ref(db,"characters/pcs"));
  if(!snap.exists()){loginCampaign.innerHTML='<option value="">No characters found</option>';return;}
  const data=snap.val();
  allRosterChars=Object.entries(data)
    .filter(([,c])=>c&&c.name&&c.type!=='npc'&&c.campaign!=='__oracle__')
    .map(([id,c])=>({id,name:c.name,campaign:c.campaign||''}));

  const campaigns=[...new Set(allRosterChars.map(c=>c.campaign).filter(Boolean))].sort();
  loginCampaign.innerHTML='<option value="">— All —</option>'+campaigns.map(c=>`<option value="${c}">${c}</option>`).join('');

  // Restore saved session to pre-fill
  const saved=loadAuthSession();
  if(saved){
    loginName.value=saved.playerName||'';
    if(saved.campaign) loginCampaign.value=saved.campaign;
  }
  filterCharsBycampaign();

  if(saved&&saved.characterId) loginChar.value=saved.characterId;
}

function filterCharsBycampaign(){
  const camp=loginCampaign.value;
  const filtered=camp?allRosterChars.filter(c=>c.campaign===camp):allRosterChars;
  const prev=loginChar.value;
  loginChar.innerHTML='<option value="">— Choose your character —</option>'+filtered.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  if(prev&&filtered.find(c=>c.id===prev)) loginChar.value=prev;
}
loginCampaign.addEventListener("change",filterCharsBycampaign);

// ── Confirm login ─────────────────────────────────────────────────────────────
async function confirmLogin(){
  const name=loginName.value.trim();
  if(!name){loginErr.textContent="Please enter your name.";return;}
  if(hasPassphraseSet()&&!checkPassphrase(loginPass.value)){loginErr.textContent="Incorrect passphrase.";return;}
  loginErr.textContent="";

  playerName=name;
  localStorage.setItem("vtt_player_name",name);

  const charId=loginChar.value;
  const charEntry=allRosterChars.find(c=>c.id===charId);
  myCharacterId=charId||null;
  myCharacterName=charEntry?.name||null;
  saveAuthSession(name,charId,charEntry?.name||null,loginCampaign.value);

  // Start mic if permission was granted in the modal
  if(micPermission==="granted"&&!micEnabled){
    const ok=await startMicListener(playerName);
    if(ok){micEnabled=true;micBtn.classList.add("active");micBtn.textContent="🎤 On";}
  }

  loginModal.classList.add("hidden");
  nameDisplay.textContent=playerName+(myCharacterName?` · ${myCharacterName}`:"");
  writePresence(playerName,"map");
}

  // presence, sheet, map, glossary now from modules
  writePresence(playerName,"map");
window.addEventListener("beforeunload",()=>{if(playerName)set(ref(db,`presence/${playerName.replace(/\./g,"_")}`),null);});

document.getElementById("login-confirm").onclick=confirmLogin;

// ── HUD mic toggle ────────────────────────────────────────────────────────────
micBtn.onclick=async()=>{
  if(!playerName){loginModal.classList.remove("hidden");return;}
  micEnabled=!micEnabled;
  if(micEnabled){
    const ok=await startMicListener(playerName);
    if(!ok){micEnabled=false;toast("Mic access denied");return;}
    micBtn.classList.add("active");micBtn.textContent="🎤 On";
  }else{
    stopMicListener(playerName);
    micBtn.classList.remove("active");micBtn.textContent="🎤 Mic";
  }
};

// ── Dice popup ────────────────────────────────────────────────────────────────
const DICE_SHAPES={4:{shape:'triangle',color:'#8b2020'},6:{shape:'square',color:'#1a3a6a'},8:{shape:'diamond',color:'#2a6030'},10:{shape:'pentagon',color:'#5a2a6a'},12:{shape:'hexagon',color:'#6a4a10'},20:{shape:'icosahedron',color:'#1a4a5a'},100:{shape:'circle',color:'#4a1a4a'}};

function drawDiceFace(svgEl,sides,rolling){
  const cfg=DICE_SHAPES[sides]||DICE_SHAPES[20];
  const cx=40,cy=40,s=30;
  let shape='';
  if(cfg.shape==='square') shape=`<rect x="${cx-s}" y="${cy-s}" width="${s*2}" height="${s*2}" rx="4" fill="url(#dg)" stroke="var(--gold)" stroke-width="1.5"/>`;
  else if(cfg.shape==='triangle') shape=`<polygon points="${cx},${cy-s*1.2} ${cx+s*1.1},${cy+s*0.7} ${cx-s*1.1},${cy+s*0.7}" fill="url(#dg)" stroke="var(--gold)" stroke-width="1.5"/>`;
  else if(cfg.shape==='diamond') shape=`<polygon points="${cx},${cy-s*1.2} ${cx+s},${cy} ${cx},${cy+s*1.2} ${cx-s},${cy}" fill="url(#dg)" stroke="var(--gold)" stroke-width="1.5"/>`;
  else if(cfg.shape==='hexagon'){const pts=Array.from({length:6},(_,i)=>{const a=i*60-30;return `${cx+s*Math.cos(a*Math.PI/180)},${cy+s*Math.sin(a*Math.PI/180)}`;});shape=`<polygon points="${pts.join(' ')}" fill="url(#dg)" stroke="var(--gold)" stroke-width="1.5"/>`;}
  else if(cfg.shape==='pentagon'){const pts=Array.from({length:5},(_,i)=>{const a=i*72-90;return `${cx+s*Math.cos(a*Math.PI/180)},${cy+s*Math.sin(a*Math.PI/180)}`;});shape=`<polygon points="${pts.join(' ')}" fill="url(#dg)" stroke="var(--gold)" stroke-width="1.5"/>`;}
  else if(cfg.shape==='icosahedron'){const pts=Array.from({length:10},(_,i)=>{const a=i*36-90;const r=i%2===0?s:s*0.6;return `${cx+r*Math.cos(a*Math.PI/180)},${cy+r*Math.sin(a*Math.PI/180)}`;});shape=`<polygon points="${pts.join(' ')}" fill="url(#dg)" stroke="var(--gold)" stroke-width="1.5"/>`;}
  else shape=`<circle cx="${cx}" cy="${cy}" r="${s}" fill="url(#dg)" stroke="var(--gold)" stroke-width="1.5"/>`;
  svgEl.innerHTML=`<defs><radialGradient id="dg" cx="35%" cy="35%"><stop offset="0%" stop-color="${cfg.color}"/><stop offset="100%" stop-color="#0d0b08"/></radialGradient></defs>${shape}`;
}

let _diceTimer=null,_diceRollTimer=null;
function showDicePopup(sides,result,rollerName){
  const popup=document.getElementById('dice-popup');
  const numEl=document.getElementById('dice-number');
  const svgEl=document.getElementById('dice-svg');
  if(!popup)return;
  clearTimeout(_diceTimer);clearInterval(_diceRollTimer);
  document.getElementById('dice-roller-name').textContent=rollerName||'—';
  document.getElementById('dice-label').textContent=`d${sides}`;
  popup.classList.remove('hide');popup.classList.add('show');
  drawDiceFace(svgEl,sides,true);
  let ticks=0;
  _diceRollTimer=setInterval(()=>{
    ticks++;
    numEl.textContent=Math.ceil(Math.random()*sides);
    numEl.style.color='var(--dim)';
    if(ticks>=20){
      clearInterval(_diceRollTimer);
      numEl.textContent=result;
      numEl.style.color=result===sides?'#ffd700':result===1?'#e04040':'var(--gold)';
      numEl.style.transform='scale(1.15)';
      drawDiceFace(svgEl,sides,false);
      setTimeout(()=>numEl.style.transform='scale(1)',80);
      _diceTimer=setTimeout(()=>{popup.classList.add('hide');setTimeout(()=>popup.classList.remove('show','hide'),220);},3000);
    }
  },55);
}
document.getElementById('dice-popup')?.addEventListener('click',()=>{
  clearTimeout(_diceTimer);clearInterval(_diceRollTimer);
  const p=document.getElementById('dice-popup');p.classList.add('hide');setTimeout(()=>p.classList.remove('show','hide'),220);
});

onValue(ref(db,"dice/last"),snap=>{

function subscribeLive(){
  if(liveUnsub){liveUnsub();liveUnsub=null;}
  const mapName=mapInput.value.trim()||"dungeon-1";
  setStatus("","Connecting…");
  liveUnsub=onValue(ref(db,`maps/${mapName}`),snap=>{
    const data=snap.val();
    for(const k in tiles)delete tiles[k];for(const k in fog)delete fog[k];
    for(const k in tokens)delete tokens[k];for(const k in stamps)delete stamps[k];
    for(const k in roofs)delete roofs[k];for(const k in props)delete props[k];
    for(const k in portals)delete portals[k];
    for(const k in impassable)delete impassable[k];
    for(const k in traps)delete traps[k];
    for(const k in chains)delete chains[k];
    if(data){
      if(data.tiles)Object.assign(tiles,data.tiles);
      if(data.fog)Object.assign(fog,data.fog);
      if(data.tokens){Object.assign(tokens,data.tokens);Object.values(data.tokens).forEach(t=>tryLoadTokenTexture(t.characterId,t.lookupName||t.name));}
      if(data.stamps)for(const[k,v]of Object.entries(data.stamps))stamps[k.replace("_",",")]=v;
      if(data.roofs)Object.assign(roofs,data.roofs);
      if(data.props)Object.assign(props,data.props);
      if(data.portals)Object.assign(portals,data.portals);
      if(data.impassable)Object.assign(impassable,data.impassable);
      if(data.traps)Object.assign(traps,data.traps);
      if(data.chains)Object.assign(chains,data.chains);
      geometry.walls.length=0;geometry.lights.length=0;geometry.doors=[];
      if(data.geometry){
        if(data.geometry.walls)geometry.walls.push(...Object.values(data.geometry.walls));
        if(data.geometry.lights)geometry.lights.push(...Object.values(data.geometry.lights));
        if(data.geometry.doors)geometry.doors.push(...Object.values(data.geometry.doors));
        if(data.geometry.timeOfDay)geometry.timeOfDay=data.geometry.timeOfDay;
        if(data.geometry.lightingParams)Object.assign(geometry.lightingParams,data.geometry.lightingParams);
      }
      if(data.background&&data.background!==bgUrl){bgUrl=data.background;bgImage=null;const img=new Image();img.crossOrigin="anonymous";img.onload=()=>bgImage=img;img.src=bgUrl;}
      else if(!data.background){bgUrl="";bgImage=null;}
      bgPpi=data.backgroundPpi||70;timeOfDay=data.nightMode||"day"||"day";
    }
    setStatus("live",`Live · ${Object.keys(tiles).length} tiles`);
    if(firstLoad){firstLoad=false;doFit();overlayEl.classList.add("hidden");}
  },()=>{setStatus("error","RTDB error");overlayEl.classList.add("hidden");});
}
function doFit(){
  if(myCharacterId){
    const myTok=Object.values(tokens).find(t=>t.type==="pc"&&(t.characterId===myCharacterId||t.name?.toLowerCase()===playerName.toLowerCase()));
    if(myTok){
      camera.x=canvas.width/2-(myTok.x+0.5)*TILE*camera.zoom;
      camera.y=canvas.height/2-(myTok.y+0.5)*TILE*camera.zoom;
      return;
    }
  }
  if(Object.keys(tiles).length){fitCamera(tiles,TILE,canvas.width,canvas.height);return;}
  if(bgImage){const s=TILE/(bgPpi||70);const mapW=bgImage.width*s,mapH=bgImage.height*s;camera.zoom=Math.min((canvas.width-80)/mapW,(canvas.height-80)/mapH,2);camera.x=canvas.width/2-mapW/2*camera.zoom;camera.y=canvas.height/2-mapH/2*camera.zoom;}
}

// ── Turn menu — shows on your turn, surfaces what your sheet says you can do.
//    Selecting something announces it in chat; it doesn't roll or resolve
//    anything itself, except marking a spell slot used when you cast. ────────
let _turnMenuCollapsed=false;
function myOwnTokenEntry(){
  return Object.entries(tokens).find(([id,t])=>t.type==="pc"&&(t.name?.toLowerCase()===playerName.toLowerCase()||t.characterId===myCharacterId));
}
function updateTurnMenu(){
  const menu=document.getElementById("turn-menu"),tab=document.getElementById("turn-menu-tab");
  if(!menu||!tab) return;
  const entry=myOwnTokenEntry();
  const isMyTurn=inCombat&&initiativeState.order.length&&entry&&initiativeState.active===(entry[1].id||entry[0]);
  if(!isMyTurn){ menu.style.display="none"; tab.style.display="none"; return; }
  if(_turnMenuCollapsed){ menu.style.display="none"; tab.style.display="block"; }
  else{ menu.style.display="block"; tab.style.display="none"; showTurnMenuMain(); }
}
function showTurnMenuMain(){
  document.getElementById("turn-menu-main").style.display="flex";
  document.getElementById("turn-menu-sub").style.display="none";
}
function showTurnMenuSub(items,emptyMsg){
  document.getElementById("turn-menu-main").style.display="none";
  const sub=document.getElementById("turn-menu-sub");sub.style.display="flex";
  const list=document.getElementById("turn-menu-sub-list");
  list.innerHTML="";
  if(!items.length){
    list.innerHTML=`<div style="padding:10px;font-family:'IM Fell English',serif;font-size:11px;color:var(--dim,#6b5a38);font-style:italic">${emptyMsg}</div>`;
    return;
  }
  for(const item of items){
    const el=document.createElement("button");
    el.className="turn-menu-item";
    el.innerHTML=`<div class="tmi-name">${item.name}</div>${item.meta?`<div class="tmi-meta">${item.meta}</div>`:""}`;
    el.onclick=item.onClick;
    list.appendChild(el);
  }
}
function buildActionList(){
  const c=pcsData[myCharacterId]||{};
  const items=[];
  for(const a of (c.attacks||[])){
    const raw=a.to_hit!=null&&a.to_hit!==""?a.to_hit:(a.attack_bonus??0);
    const atk=(parseInt(String(raw).replace(/[^0-9-]/g,""),10)||0);
    const atkStr=(atk>=0?"+":"")+atk;
    items.push({
      name:`⚔ ${a.name||"Unnamed attack"}`,
      meta:`${atkStr} to hit · ${a.damage||"—"}${a.damage_type?" "+a.damage_type:""}${a.range?" · "+a.range:""}`,
      onClick:()=>{
        sendChat(`⚔ ${myCharacterName||playerName} attacks with **${a.name}**: ${atkStr} to hit, ${a.damage||"—"}${a.damage_type?" "+a.damage_type:""}.`,playerName,"chat");
        showTurnMenuMain();
      }
    });
  }
  const spells=c.spellcasting?.spells||[];
  const slotsMax=c.spellcasting?.slots||{},slotsUsed=c.spellcasting?.slots_used||{};
  for(const s of spells){
    const isCantrip=s.level===0||s.prepared_type==="cantrip";
    if(isCantrip){
      items.push({
        name:`✨ ${s.name} (Cantrip)`,
        meta:"",
        onClick:()=>{
          sendChat(`✨ ${myCharacterName||playerName} casts **${s.name}**.`,playerName,"chat");
          showTurnMenuMain();
        }
      });
    }else{
      const lvl=s.level||1;
      const max=slotsMax[String(lvl)]??slotsMax[lvl]??0;
      const used=slotsUsed[String(lvl)]??slotsUsed[lvl]??0;
      if(max-used<=0) continue; // no slot available -- don't show it
      items.push({
        name:`✨ ${s.name} (Lv ${lvl})`,
        meta:`${max-used} slot${max-used===1?"":"s"} remaining`,
        onClick:async()=>{
          await set(ref(db,`characters/pcs/${myCharacterId}/spellcasting/slots_used/${lvl}`),used+1);
          sendChat(`✨ ${myCharacterName||playerName} casts **${s.name}** (Level ${lvl} slot).`,playerName,"chat");
          showTurnMenuMain();
        }
      });
    }
  }
  return items;
}
function buildBonusList(){
  const c=pcsData[myCharacterId]||{};
  const items=[];
  for(const[abKey,ab]of Object.entries(c.abilities||{})){
    if(!ab||!ab.label) continue;
    items.push({
      name:`⚡ ${ab.label}`,
      meta:ab.effect_desc||"",
      onClick:()=>{
        sendChat(`⚡ ${myCharacterName||playerName} uses **${ab.label}**.`,playerName,"chat");
        showTurnMenuMain();
      }
    });
  }
  return items;
}

const _turnMenuBtns=document.querySelectorAll(".turn-menu-btn");
console.log(`[turn-menu debug] found ${_turnMenuBtns.length} .turn-menu-btn elements`);
_turnMenuBtns.forEach(btn=>{

function drawMovementRange(){

  const blocked=new Set(Object.keys(impassable));

// ── Pointer events ────────────────────────────────────────────────────────────
// ── Investigate (proximity-based) — notes appear automatically while your
//    token is next to a prop that has them, no click needed ────────────────────
function propAtTile(tx,ty){
  for(const[k,p]of Object.entries(props)){
    let px,py;
    if(p.attachedTo&&tokens[p.attachedTo]){px=tokens[p.attachedTo].x+(p.offsetX||0);py=tokens[p.attachedTo].y+(p.offsetY||0);}
    else{[px,py]=k.split(",").map(Number);}
    const def=propDefs[p.propId]||{w:1,h:1};
    const w=p.w||def.w||1,h=p.h||def.h||1;
    if(tx>=px&&tx<px+w&&ty>=py&&ty<py+h)return k;
  }
  return null;
}

// ── Containers — right-click OR shift+click to open, rolled fresh at the
//    moment you open it (shift+click added as a trackpad-friendly alternate
//    to right-click, same as every other right-click action in this file) ──
loadLootData();
function openContainerAt(tx,ty){
  const pk=propAtTile(tx,ty);
  if(!pk||!props[pk]?.container) return;
  const container=props[pk].container;
  if(container.looted){ toast("It's already empty."); return; }
  if(!myCharacterId){ toast("Pick a character first."); return; }
  const{coins,items}=generateContainerLoot(container.tier);
  (async()=>{
    const snap=await get(ref(db,`characters/pcs/${myCharacterId}/inventory`));
    const inv=snap.exists()?snap.val():{};
    items.forEach(item=>{
      const key=(item.index||item.name.toLowerCase().replace(/[^a-z0-9]/g,"_"))+"_"+Date.now()+"_"+Math.floor(Math.random()*1000);
      inv[key]={name:item.name,qty:1,magic:!!item._magic,rarity:item.rarity?.name||null};
    });
    await update(ref(db,`characters/pcs/${myCharacterId}`),{inventory:inv});
    await set(ref(db,`maps/${currentMap}/props/${pk}/container/looted`),true);
    props[pk].container.looted=true;
    sendChat(`🎒 ${myCharacterName||playerName} searched it and found: ${summarizeLoot(coins,items)}.`,"GM","system");
    toast(`You found: ${summarizeLoot(coins,items)}`);
  })();
}

let _lastInvestigateText=null;
function updateInvestigateBanner(){
  const banner=document.getElementById("investigate-banner");
  if(!banner) return;
  const myTok=myCharacterId&&Object.values(tokens).find(t=>t.type==="pc"&&(t.characterId===myCharacterId||t.name?.toLowerCase()===playerName?.toLowerCase()));
  let found=null;
  if(myTok){
    const mx=myTok.x+0.5,my=myTok.y+0.5;
    for(const[k,p]of Object.entries(props)){
      if(!p.notes) continue;
      let px,py;
      if(p.attachedTo&&tokens[p.attachedTo]){px=tokens[p.attachedTo].x+(p.offsetX||0);py=tokens[p.attachedTo].y+(p.offsetY||0);}
      else{[px,py]=k.split(",").map(Number);}
      const def=propDefs[p.propId]||{w:1,h:1};
      const w=p.w||def.w||1,h=p.h||def.h||1;
      const cx=px+w/2,cy=py+h/2;
      // "Directly in front" — within about 1 tile of the prop's footprint
      const dx=Math.max(px-mx,0,mx-(px+w)),dy=Math.max(py-my,0,my-(py+h));
      if(Math.hypot(dx,dy)<=1.05){ found=p.notes; break; }
    }
  }
  if(found!==_lastInvestigateText){
    _lastInvestigateText=found;
    if(found){ banner.textContent="🔍 "+found; banner.style.display="block"; }
    else{ banner.style.display="none"; }
  }
}

    if(dest){ tok.x=dest.x; tok.y=dest.y; }
    update(ref(db,`maps/${currentMap}/tokens/${draggingToken.id}`),{x:tok.x,y:tok.y});
    draggingToken=null;return;
  }
  clearTimeout(pingHoldTimer);
  if(isHolding){stopLaser(myLaserRef);myLaserRef=null;}
  isHolding=false;panning=false;
});

viewport.addEventListener("wheel",e=>{
  e.preventDefault();
  const[sx,sy]=screenPos(e);
  applyZoom(e.deltaY<0?1.1:.9,sx,sy);
  scaleLabel.textContent=`${Math.round(camera.zoom*100)}%`;
},{passive:false});

window.addEventListener("keydown",e=>{
  if(e.code==="Escape"){
    rulerStart=null;rulerEnd=null;rulerActive=false;
    if(rulerMode){rulerMode=false;document.getElementById("rulerBtn").classList.remove("active");viewport.style.cursor="";}
    closeSheetPanel();
  }
});

// ── NPC line-of-sight detection (omnidirectional, wall-blocked) ───────────────
const NPC_SIGHT_RANGE=12;
const _seenByNpc=new Set(); // NPC token ids currently seeing the player
function pointInPolygon(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    const intersect=((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}
function checkNpcSight(myTok){
  const occ=activeOccluders(geometry.walls,geometry.doors||[]);
  for(const[npcId,npc]of Object.entries(tokens)){
    if(npc.type!=="npc"||!npc.hostile) continue;
    const poly=computeVisibilityPolygon(npc.x+0.5,npc.y+0.5,occ,NPC_SIGHT_RANGE);
    const seen=poly.length>=3&&pointInPolygon(myTok.x+0.5,myTok.y+0.5,poly);
    if(seen&&!_seenByNpc.has(npcId)){
      _seenByNpc.add(npcId);
      sendChat(`👁️ You might have been seen by ${npc.name||"something"}...`,"GM","system");
    }else if(!seen&&_seenByNpc.has(npcId)){
      _seenByNpc.delete(npcId);
    }
  }
}

// ── Keyboard movement (arrow keys) — own token only, wall-blocked ─────────────
let _lastMoveTime=0;
window.addEventListener("keydown",e=>{
  const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  const d=dirs[e.key];
  if(!d) return;
  if(e.target.matches("input,textarea,select,[contenteditable]")) return;
  e.preventDefault();
  const now=Date.now();
  if(now-_lastMoveTime<140) return; // throttle key-repeat so it can't flood Firebase
  const entry=Object.entries(tokens).find(([id,t])=>t.type==="pc"&&(t.name?.toLowerCase()===playerName.toLowerCase()||t.characterId===myCharacterId));
  if(!entry) return;
  const[tokId,tok]=entry;
  if(playersLocked){toast("🔒 Movement is locked");return;}
  if(tok.trapped){toast("🪤 You're trapped! The GM needs to release you.");return;}
  if(tok.moveLocked){toast("🔒 The GM has locked your movement.");return;}
  if(inCombat&&initiativeState.order.length){
    if(initiativeState.active!==(tok.id||tokId)){toast("⚔ It's not your turn yet");return;}
    const speedTiles=Math.max(1,Math.round((pcsData[myCharacterId]?.speed??30)/5));
    const movedSoFar=tok.turnMovedTiles||0;
    if(movedSoFar>=speedTiles){toast(`⚔ You've used all ${speedTiles} squares of movement this turn`);return;}
  }
  const[dx,dy]=d;
  const fromX=tok.x,fromY=tok.y,toX=fromX+dx,toY=fromY+dy;
  const occ=activeOccluders(geometry.walls,geometry.doors||[]);
  if(pathBlocked(fromX+0.5,fromY+0.5,toX+0.5,toY+0.5,occ)) return; // blocked by a wall/closed door
  if(impassable[`${toX},${toY}`]) return; // blocked by an impassable cell
  _lastMoveTime=now;
  tok.x=toX;tok.y=toY;
  const dest=resolvePortal(portals,tok.x,tok.y);
  if(dest){tok.x=dest.x;tok.y=dest.y;}
  const updates={x:tok.x,y:tok.y};
  if(inCombat&&initiativeState.order.length&&initiativeState.active===(tok.id||tokId)){
    tok.turnMovedTiles=(tok.turnMovedTiles||0)+1;
    updates.turnMovedTiles=tok.turnMovedTiles;
  }
  if(traps[`${tok.x},${tok.y}`]){
    tok.trapped=true;updates.trapped=true;
    toast("🪤 You've triggered a trap and can't move until the GM releases you!");
  }
  update(ref(db,`maps/${currentMap}/tokens/${tokId}`),updates);
  checkNpcSight(tok);
});

// ── Init ──────────────────────────────────────────────────────────────────────
(async()=>{
  subscribePassphrase();
  subscribeTalking();
  await loadConfig();
  buildConditionsMap();

  // Dice buttons in HUD
  const diceHud = document.getElementById("dice-hud");
  getDICE().forEach(sides=>{
    const btn=document.createElement("button");
    btn.className="hud-die";
    btn.textContent=`d${sides}`;
    btn.title=`Roll d${sides}`;
    btn.onclick=async()=>{
      if(!playerName)return;
      const result=await rollDie(sides,playerName);
      sendChat(`rolled d${sides} → **${result}**`,playerName,"dice");
    };
    diceHud?.appendChild(btn);
  });

  await loadTerrainTextures(getTERRAINS());
  getPROPS().forEach(p=>{ propDefs[p.id]=p; tryLoadPropTexture(p.id); });
  ["door","doorclosed","portal"].forEach(id=>tryLoadPropTexture(id));

  // Wire sheet toast function
  setSheetToastFn(msg=>{const el=document.getElementById("ping-toast");if(!el)return;el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2500);});

  // Subscribe presence pills
  subscribePresence(document.getElementById("presence-row"));

  // Wire glossary tooltips on sheet panel updates
  const sheetViewEl=document.getElementById("sheet-view");
  if(sheetViewEl){new MutationObserver(()=>registerTerms(sheetViewEl)).observe(sheetViewEl,{childList:true,subtree:true});}

  // Check if there's a saved session — show login or restore
  const saved=loadAuthSession();
  if(saved&&saved.playerName){
    playerName=saved.playerName;
    myCharacterId=saved.characterId||null;
    myCharacterName=saved.characterName||null;
    nameDisplay.textContent=playerName+(myCharacterName?` · ${myCharacterName}`:"");
    setTimeout(()=>{if(hasPassphraseSet())loginPassField.style.display="block";},200);
    loginModal.classList.add("hidden");
    writePresence(playerName,"map");
    startPresenceHeartbeat(playerName,"map");
  } else {
    setTimeout(()=>{if(hasPassphraseSet())loginPassField.style.display="block";},200);
  }

  await populateLoginDropdowns();

  // Token strip — wires initiative, presence, inCombat subscriptions
  subscribeTokenStrip(document.getElementById("init-track"), tokens, pcsData, {
    isGM: false,
    playerName,
    myCharacterId,
    onOpenSheet: (charId, name) => openCharSheet(charId, name, false),
    onRollInitiative: rollInitiative,
  });

  // Start map subscription
  subscribeLive();
  draw();
})();
