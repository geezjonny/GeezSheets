<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Maker</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #f3ecdc; color: #2a2118; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  #panel { width: 260px; display: grid; gap: 8px; align-content: start; }
  label { display: grid; grid-template-columns: 90px 1fr 36px; align-items: center; gap: 6px; }
  label output { text-align: right; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button, select { font: inherit; padding: 6px 10px; border: 1px solid #2a2118; background: #fffaf0; border-radius: 4px; cursor: pointer; }
  button.primary { background: #2a2118; color: #fffaf0; }
  #dirs { display: grid; grid-template-columns: repeat(3, 36px); gap: 4px; }
  #dirs button { padding: 4px 0; }
  #dirs button.on { background: #2a2118; color: #fffaf0; }
  canvas { max-width: min(100%, 900px); height: auto; border: 1px solid #2a2118; background-size: 50%; }
  #status { min-height: 1.4em; }
  h1 { font-size: 18px; margin: 0; }
</style>
</head>
<body>
<div id="panel">
  <h1>Loop Maker</h1>
  <select id="preset"></select>
  <label>Water <input type="color" id="c0"></label>
  <label>Ripples <input type="color" id="c1"></label>
  <label>Foam <input type="color" id="c2"></label>
  <div>Flow direction</div>
  <div id="dirs"></div>
  <label>Speed <input type="range" id="speed" min="0" max="4" step="1"><output></output></label>
  <label>Size <input type="range" id="cells" min="2" max="16" step="1"><output></output></label>
  <label>Ripples <input type="range" id="rip" min="0" max="0.3" step="0.01"><output></output></label>
  <label>Foam <input type="range" id="foam" min="0" max="0.15" step="0.005"><output></output></label>
  <label>Wobble <input type="range" id="warp" min="0" max="0.3" step="0.01"><output></output></label>
  <label>Seconds <input type="range" id="dur" min="2" max="12" step="1"><output></output></label>
  <label>Pixels <select id="px"><option>512</option><option selected>1024</option><option>2048</option></select></label>
  <label>FPS <select id="fps"><option>24</option><option selected>30</option></select></label>
  <div class="row">
    <button class="primary" id="save">Save WebM</button>
    <button id="tile">Show 2×2</button>
  </div>
  <div id="status"></div>
  <small>The picture tiles and loops: scale it over the whole map in Owlbear or Dungeondraft.</small>
</div>
<canvas id="cv" width="1024" height="1024"></canvas>

<script>
const PRESETS = {
  'Dungeondraft sea': { c0: '#2f6f86', c1: '#4f97a8', c2: '#d9f1f0', speed: 1, cells: 5, rip: 0.10, foam: 0.03, warp: 0.12, dur: 6 },
  'Deep ocean':       { c0: '#163f5c', c1: '#2a6585', c2: '#bfe3ee', speed: 1, cells: 5, rip: 0.08, foam: 0.025, warp: 0.15, dur: 8 },
  'Stormy sea':       { c0: '#2c3d3f', c1: '#4b6062', c2: '#c9d3cf', speed: 2, cells: 7, rip: 0.14, foam: 0.05, warp: 0.2, dur: 6 },
  'River':            { c0: '#3b7a80', c1: '#5c9c9c', c2: '#e3f2ea', speed: 3, cells: 8, rip: 0.12, foam: 0.03, warp: 0.08, dur: 4 },
  'Swamp':            { c0: '#3d4a2c', c1: '#56653a', c2: '#a3ad74', speed: 0, cells: 6, rip: 0.10, foam: 0.02, warp: 0.1, dur: 8 },
  'Lava':             { c0: '#5a1508', c1: '#c2410c', c2: '#fcd34d', speed: 1, cells: 5, rip: 0.16, foam: 0.05, warp: 0.15, dur: 8 },
};
const DIRS = [[-1,-1],[0,-1],[1,-1],[-1,0],null,[1,0],[-1,1],[0,1],[1,1]];
const ARROWS = ['↖','↑','↗','←','','→','↙','↓','↘'];
let dir = [1, 0];

const $ = id => document.getElementById(id);
const cv = $('cv');
const gl = cv.getContext('webgl', { preserveDrawingBuffer: true });

// Everything moves by whole tiles or whole circles per loop, so frame 0 == frame N and the edges wrap.
const FRAG = `
precision highp float;
uniform vec2 res; uniform float t, cells, rip, foam, warp; uniform vec2 flow; uniform vec3 c0, c1, c2;
const float TAU = 6.2831853;
vec2 hash(vec2 p) { p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
// periodic value noise; moving the sample point on a circle keeps both the tile and the loop seamless
float vnoise(vec2 p, float per) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = hash(mod(i, per)).x, b = hash(mod(i + vec2(1, 0), per)).x;
  float c = hash(mod(i + vec2(0, 1), per)).x, d = hash(mod(i + vec2(1, 1), per)).x;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
vec2 swirl(vec2 uv, float per, float phase) {
  vec2 o = 0.6 * vec2(cos(TAU * (t + phase)), sin(TAU * (t + phase)));
  vec2 p = uv * per;
  return vec2(vnoise(p + o, per), vnoise(p + o.yx + 7.3, per)) - 0.5;
}
// periodic voronoi: returns F2 - F1 (0 on cell borders)
float edges(vec2 p, float period, float spin) {
  vec2 i = floor(p), f = fract(p); float d1 = 9.0, d2 = 9.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 n = vec2(x, y), h = hash(mod(i + n, period));
    vec2 o = 0.5 + 0.35 * vec2(cos(TAU * (t * spin + h.x)), sin(TAU * (t * spin + h.y)));
    float d = length(n + o - f);
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
  }
  return d2 - d1;
}
void main() {
  vec2 uv = gl_FragCoord.xy / res; uv.y = 1.0 - uv.y;
  vec2 m = fract(uv - flow * t);
  vec2 w = warp * (swirl(m, 4.0, 0.0) * 2.0 + swirl(m, 8.0, 0.37)) * 2.0 / cells * 3.0;
  vec2 a = (fract(uv - flow * t + w)) * cells;               // big ripples, follow the flow
  float r = edges(a, cells, 1.0);
  // big slow patches: darker deep water and thinner, broken ripples
  vec2 dq = fract(uv - flow * t) * 6.0 + w * cells + 0.5 * vec2(cos(TAU * t), sin(TAU * t));
  float deep = 0.65 * vnoise(dq, 6.0) + 0.35 * vnoise(dq * 2.0, 12.0);
  float width = rip * mix(0.15, 1.4, vnoise(fract(uv - flow * t) * 5.0 + w * cells, 5.0));
  vec3 col = mix(c0, c0 * 0.8, smoothstep(0.6, 0.605, deep));
  // toon shadow: the same ripple sampled a little up-left, drawn darker underneath
  float rs = edges(a - vec2(0.06, 0.06), cells, 1.0);
  col = mix(col, col * 0.82, 1.0 - smoothstep(width, width + 0.006, rs));
  float band = 1.0 - smoothstep(width, width + 0.006, r);
  col = mix(col, c1, band);
  // foam: a broken rim on the lit (lower-right) edge of each ripple, plus specks from the small layer
  float o = foam * 0.8;
  float lit = 1.0 - smoothstep(width, width + 0.006, edges(a + vec2(o, o), cells, 1.0));
  float rim = band * (1.0 - lit);
  float breakup = smoothstep(0.4, 0.45, vnoise(fract(uv - flow * t) * 14.0 + w * cells * 2.0, 14.0));
  col = mix(col, c2, rim * breakup);
  gl_FragColor = vec4(col, 1.0);
}`;
const VERT = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);

function draw(phase) {
  const v = id => +$(id).value, sp = v('speed');
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(U('res'), cv.width, cv.height);
  gl.uniform1f(U('t'), phase);
  gl.uniform1f(U('cells'), v('cells'));
  gl.uniform1f(U('rip'), v('rip'));
  gl.uniform1f(U('foam'), v('foam'));
  gl.uniform1f(U('warp'), v('warp'));
  gl.uniform2f(U('flow'), dir[0] * sp, dir[1] * sp);
  ['c0', 'c1', 'c2'].forEach(c => gl.uniform3fv(U(c), rgb($(c).value)));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// UI
for (const name in PRESETS) $('preset').add(new Option(name));
function applyPreset() { const p = PRESETS[$('preset').value]; for (const k in p) $(k).value = p[k]; syncOutputs(); }
function syncOutputs() { document.querySelectorAll('label output').forEach(o => o.value = o.previousElementSibling.value); }
$('preset').onchange = applyPreset;
document.querySelectorAll('input').forEach(i => i.oninput = syncOutputs);
DIRS.forEach((d, i) => {
  const b = document.createElement('button'); b.textContent = ARROWS[i];
  if (!d) b.disabled = true;
  else b.onclick = () => { dir = d; [...$('dirs').children].forEach(x => x.classList.toggle('on', x === b)); };
  if (d && d[0] === 1 && d[1] === 0) b.classList.add('on');
  $('dirs').append(b);
});
$('px').onchange = () => { cv.width = cv.height = +$('px').value; };
$('tile').onclick = () => {
  const on = cv.dataset.tiled !== '1'; cv.dataset.tiled = on ? '1' : '0';
  $('tile').textContent = on ? 'Show 1×1' : 'Show 2×2';
};
if (PRESETS[decodeURIComponent(location.hash.slice(1))]) $('preset').value = decodeURIComponent(location.hash.slice(1));
applyPreset();

// preview: in tiled mode draw the canvas 2x2 via CSS background of a snapshot each frame would be costly,
// so instead shrink the uv: render a 2x2 preview by drawing the tile into a second canvas.
const view = document.createElement('canvas'); const vx = view.getContext('2d');
let recording = false;
function loop(now) {
  const dur = +$('dur').value;
  if (!recording) draw((now / 1000 / dur) % 1);
  if (cv.dataset.tiled === '1') {
    view.width = view.height = cv.width;
    const h = cv.width / 2;
    for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) vx.drawImage(cv, x * h, y * h, h, h);
    if (!view.isConnected) { cv.after(view); cv.style.display = 'none'; view.style.cssText = cv.style.cssText; view.style.display = ''; view.className = 'tiled'; }
  } else if (view.isConnected) { view.remove(); cv.style.display = ''; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// shortcut: MediaRecorder stamps frames in real time, so a slow PC can drop a frame at the seam; upgrade to WebCodecs if that shows.
$('save').onclick = async () => {
  if (recording) return;
  const fps = +$('fps').value, dur = +$('dur').value, frames = fps * dur;
  const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  if (!mime) { $('status').textContent = 'This browser cannot record WebM (use Chrome or Edge).'; return; }
  recording = true; $('save').disabled = true;
  const stream = cv.captureStream(0), track = stream.getVideoTracks()[0];
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: cv.width * cv.width * fps * 0.15 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  rec.start();
  for (let i = 0; i < frames; i++) {
    draw(i / frames); track.requestFrame();
    $('status').textContent = `Recording ${i + 1} / ${frames}`;
    await new Promise(r => setTimeout(r, 1000 / fps));
  }
  rec.stop(); await done;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
  a.download = `${$('preset').value.toLowerCase().replace(/\s+/g, '-')}-${cv.width}.webm`;
  a.click();
  $('status').textContent = `Saved ${a.download} (${(chunks.reduce((n, c) => n + c.size, 0) / 1e6).toFixed(1)} MB)`;
  recording = false; $('save').disabled = false;
};
</script>
</body>
</html>
