      // one image, always anchored at (0,0), always floor 0 (a single
      // background has no per-floor concept, same convention viewer.html
      // itself uses). Grid dimensions aren't stored directly for this case,
      // so they're derived from the image's own pixel size divided by
      // backgroundPpi, the exact math viewer.html's own rebuildBackground
      // already uses for this identical image.
      async function loadSingleBackground(mapName, imageSrc) {
        console.log(`[firebase-load] found a single background image (length ${imageSrc.length}); loading...`);
        const [ppiSnap, geomSnap] = await Promise.all([
          get(ref(db, `maps/${mapName}/backgroundPpi`)),
          get(ref(db, `maps/${mapName}/geometry`)),
        ]);
        const ppi = ppiSnap.val() || 70;
        const geom = geomSnap.val() || {};
        const img = await loadImageAsync(imageSrc);
        const fakeData = {
          resolution: {
            map_size: { x: img.naturalWidth / ppi, y: img.naturalHeight / ppi },
            pixels_per_grid: ppi,
            map_origin: { x: 0, y: 0 },
          },
          image: imageSrc,
          line_of_sight: wallsToLineOfSight(geom.walls || [], 0),
          portals: doorsToPortals(geom.doors || [], 0),
          lights: lightsToPlannerLights(geom.lights || [], 0),
        };
        console.log(`[firebase-load] geometry for floor 0: ${fakeData.line_of_sight.length} wall segment(s), ${fakeData.portals.length} door(s), ${fakeData.lights.length} light(s)`);
        const mapRec = createMapEntity(fakeData, `${mapName} (Firebase)`, 0);
        // Single background is always floor 0, always anchored with no
        // shift (lx=ly=0) -- see loadTokens below for how this is used.
        entityByFloor[0] = { mapRec, gridW: fakeData.resolution.map_size.x, gridH: fakeData.resolution.map_size.y, lx: 0, ly: 0 };
        loadTokens(mapName);
      }

      // Multi-layer case (mapeditor-layers.html's "Add dd2vtt Section" flow) --
      // each layer already stores its own grid-unit w/h AND an (x,y) position
      // offset (this is how multiple imported pieces get positioned relative
      // to each other), unlike the single-background case above. That's
      // exactly the per-piece positioning createMapEntity's own multi-map
      // model wants, so each layer becomes its own map entity here, then its
      // group gets moved to the saved (x,y) directly -- createMapEntity's own
      // `offset` parameter only supports a uniform diagonal stagger (one
      // number applied to both axes, meant for spacing out multiple
      // freshly-uploaded files), not independent x/y placement.
      async function loadMapLayers(mapName, layers) {
        const entries = Object.entries(layers);
        console.log(`[firebase-load] found ${entries.length} mapLayers piece(s); loading each...`);
        const geomSnap = await get(ref(db, `maps/${mapName}/geometry`));
        const geom = geomSnap.val() || {};
        for (const [layerId, layer] of entries) {
          if (!layer.url) continue;
          const floor = layer.floor || 0;
          const lx = layer.x || 0, ly = layer.y || 0;
          // Our geometry is stored in absolute map coordinates, but
          // convertCoord (inside createMapEntity) re-centers around THIS
          // layer's own local w/h -- so shift every point into this
          // layer's local coordinate space (subtract its own x/y offset)
          // before handing it off. The layer's group gets moved back to
          // (lx,ly) afterward, which restores the correct absolute
          // position in world space -- get this backwards and everything
          // renders offset from where it actually belongs.
          const shiftPt = pt => ({ x: pt.x - lx, y: pt.y - ly });
          const lineOfSight = wallsToLineOfSight(geom.walls || [], floor).map(poly => poly.map(shiftPt));
          const portals = doorsToPortals(geom.doors || [], floor).map(p => ({ ...p, bounds: p.bounds.map(shiftPt) }));
          const lights = lightsToPlannerLights(geom.lights || [], floor).map(l => ({ ...l, position: shiftPt(l.position) }));
          console.log(`[firebase-load] layer "${layerId}" (floor ${floor}): ${lineOfSight.length} wall segment(s), ${portals.length} door(s), ${lights.length} light(s)`);

          const fakeData = {
            resolution: {
              map_size: { x: layer.w, y: layer.h },
              pixels_per_grid: 70, // not stored per-layer; only affects texture crop math for a real dd2vtt's map_origin, unused here since map_origin is {0,0} below
              map_origin: { x: 0, y: 0 },
            },
            image: layer.url,
            line_of_sight: lineOfSight,
            portals,
            lights,
          };
          const mapRec = createMapEntity(fakeData, `${mapName}: ${layerId} (Firebase)`, 0);
          if (mapRec && mapRec.group) {
            // createMapEntity's own convertCoord centers a piece's geometry
            // around its group's position (group.position = the piece's
            // CENTER), but lx/ly (layer.x/layer.y from Firebase) is the
            // piece's TOP-LEFT corner -- confirmed by how
            // mapeditor-layers.html itself draws these layers in 2D
            // (ctx.drawImage(img,x,y,w,h), where drawImage's (x,y) is
            // always top-left). Shifting by half the piece's own
            // width/height converts corner to center; without this every
            // multi-layer map renders offset by half its own size.
            //
            // Caveat I want to be upfront about: I'm not fully certain this
            // group-offset formula is exactly right when MULTIPLE layers
            // need to align against each other (there's a Y-axis flip
            // inside createMapEntity's own convertCoord that this offset
            // doesn't obviously mirror, and I can't run this to verify).
            // What I AM confident about: anything added as a CHILD of this
            // same group (like the token markers below) will stay visually
            // consistent with this piece's own image/walls regardless,
            // since it inherits whatever this offset actually resolves to
            // rather than needing a second, independent calculation.
            mapRec.group.position.set(lx + layer.w / 2, ly + layer.h / 2, 0);
          }
          entityByFloor[floor] = { mapRec, gridW: layer.w, gridH: layer.h, lx, ly };
        }
        loadTokens(mapName);
      }

      function loadImageAsync(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Image failed to decode'));
          img.src = src;
        });
      }

      document.querySelectorAll('.dice-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const sides = parseInt(btn.dataset.sides, 10);
          const result = await rollDie(sides, 'GM (Planner)');
          animateDiceResult({ sides, result }, document.getElementById('dice-result'));
        });
      });

      document.getElementById('firebase-load-btn').addEventListener('click', loadBackgroundFromFirebase);
    </script>
