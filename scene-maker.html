<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTT Map Creator with DD2VTT Export</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #ui-container {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(30, 30, 30, 0.9);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 280px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #aaa;
        }

        input[type="file"], input[type="number"], input[type="color"], button {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        button:hover { background: #3a3a3a; }

        .btn-group { display: flex; gap: 4px; }
        .btn-group button { flex: 1; padding: 6px 2px; font-size: 12px; }
        .btn-group button.active { background: #007acc; border-color: #007acc; }

        .row-group { display: flex; gap: 8px; align-items: center; }
        .row-group label { flex: 1; }
        .row-group input { flex: 1; }

        .export-btn {
            background: #28a745 !important;
            border-color: #28a745 !important;
            font-weight: bold;
            margin-top: 5px;
        }
        .export-btn:hover { background: #218838 !important; }

        .topdown-btn {
            background: #007acc !important;
            border-color: #007acc !important;
            font-weight: bold;
        }
        .topdown-btn:hover { background: #005999 !important; }

        .shortcuts-hint {
            font-size: 10px;
            color: #888;
            border-top: 1px solid #333;
            padding-top: 8px;
            margin-top: 2px;
            line-height: 1.4;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-container">
        <h3 style="margin: 0 0 5px 0;">VTT Map Creator</h3>

        <!-- Camera Control -->
        <div class="section">
            <button id="btn-topdown" class="topdown-btn">Snap to Top-Down</button>
        </div>

        <!-- Placement Mode -->
        <div class="section">
            <label>Placement Mode</label>
            <div class="btn-group">
                <button id="mode-select" class="active">Select</button>
                <button id="mode-wall">Wall</button>
                <button id="mode-door">Door</button>
                <button id="mode-light">Light</button>
            </div>
        </div>

        <!-- Dynamic Light Settings -->
        <div class="section" id="light-settings">
            <label>Light Settings</label>
            <div class="row-group">
                <label>Color</label>
                <input type="color" id="light-color" value="#ffaa00">
            </div>
            <div class="row-group">
                <label>Range</label>
                <input type="number" id="light-range" value="10" min="1" max="50">
            </div>
        </div>

        <!-- Transform Gizmo -->
        <div class="section" id="transform-section">
            <label>Transform Gizmo</label>
            <div class="btn-group">
                <button id="btn-translate" class="active">Move</button>
                <button id="btn-rotate">Rotate</button>
                <button id="btn-scale">Scale</button>
            </div>
        </div>

        <!-- Import Asset -->
        <div class="section">
            <label>Import Asset (.png, .jpg, .glb)</label>
            <input type="file" id="file-input" accept=".png, .jpg, .jpeg, .glb">
        </div>

        <!-- Grid Settings -->
        <div class="section">
            <label>Grid Size (Squares)</label>
            <input type="number" id="grid-size" value="20" min="5" max="100">
            
            <label>Grid DPI (Pixels/Inch)</label>
            <input type="number" id="grid-dpi" value="70" min="10" max="300">
            
            <div class="checkbox-container">
                <input type="checkbox" id="snap-toggle" checked>
                <label for="snap-toggle" style="color: #fff; cursor: pointer;">Enable Grid Snap</label>
            </div>
        </div>

        <!-- Actions & Export -->
        <div class="section">
            <button id="btn-delete" style="background: #a22;">Delete Selected</button>
            <button id="btn-export" class="export-btn">Export .dd2vtt</button>
        </div>

        <div class="shortcuts-hint">
            <b>Shortcuts:</b><br>
            Ctrl+C: Copy | Ctrl+V: Paste<br>
            Ctrl+Z: Undo | Ctrl+Y: Redo
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let currentMode = 'select'; 
        const walls = [];          
        const doors = [];          
        const vttLights = [];      
        const selectableObjects = [];

        // Clipboard & Undo/Redo Stacks
        let copiedObjectData = null;
        const undoStack = [];
        const redoStack = [];

        // Scene & Camera Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1e1e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 25, 0.1); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Raycast Floor
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        floorGeo.rotateX(-Math.PI / 2);
        const floorMat = new THREE.MeshBasicMaterial({ visible: false });
        const raycastFloor = new THREE.Mesh(floorGeo, floorMat);
        scene.add(raycastFloor);

        // Controls
        const orbit = new OrbitControls(camera, renderer.domElement);
        orbit.enableDamping = true;

        const transformControls = new TransformControls(camera, renderer.domElement);
        transformControls.renderOrder = 1000;
        scene.add(transformControls);

        transformControls.addEventListener('dragging-changed', (e) => {
            orbit.enabled = !e.value;
        });

        // Track object transform changes for Undo/Redo history
        let initialTransform = null;
        transformControls.addEventListener('mouseDown', () => {
            const obj = transformControls.object;
            if (obj) {
                initialTransform = {
                    position: obj.position.clone(),
                    rotation: obj.rotation.clone(),
                    scale: obj.scale.clone()
                };
            }
        });

        transformControls.addEventListener('mouseUp', () => {
            const obj = transformControls.object;
            if (obj && initialTransform) {
                const finalTransform = {
                    position: obj.position.clone(),
                    rotation: obj.rotation.clone(),
                    scale: obj.scale.clone()
                };

                if (!initialTransform.position.equals(finalTransform.position) ||
                    !initialTransform.rotation.equals(finalTransform.rotation) ||
                    !initialTransform.scale.equals(finalTransform.scale)) {
                    
                    pushCommand({
                        type: 'transform',
                        object: obj,
                        before: initialTransform,
                        after: finalTransform
                    });
                }
            }
            initialTransform = null;
        });

        // Snap To Top-Down Camera Animation
        document.getElementById('btn-topdown').addEventListener('click', () => {
            const targetPos = new THREE.Vector3(orbit.target.x, orbit.target.y + 25, orbit.target.z + 0.001);
            let progress = 0;
            const startPos = camera.position.clone();
            
            function animateCamera() {
                progress += 0.05;
                if (progress <= 1) {
                    camera.position.lerpVectors(startPos, targetPos, progress);
                    orbit.update();
                    requestAnimationFrame(animateCamera);
                } else {
                    camera.position.copy(targetPos);
                    orbit.update();
                }
            }
            animateCamera();
        });

        // Grid Management
        let gridHelper;
        function updateGrid() {
            if (gridHelper) scene.remove(gridHelper);

            const size = parseFloat(document.getElementById('grid-size').value) || 20;
            gridHelper = new THREE.GridHelper(size, size, 0x007acc, 0x444444);
            gridHelper.position.y = 0.02;

            gridHelper.material.depthTest = false;
            gridHelper.material.transparent = true;
            gridHelper.renderOrder = 999;

            scene.add(gridHelper);
            updateSnapping();
        }

        function updateSnapping() {
            const snapEnabled = document.getElementById('snap-toggle').checked;
            if (snapEnabled) {
                transformControls.setTranslationSnap(1);
                transformControls.setRotationSnap(Math.PI / 4);
                transformControls.setScaleSnap(0.5);
            } else {
                transformControls.setTranslationSnap(null);
                transformControls.setRotationSnap(null);
                transformControls.setScaleSnap(null);
            }
        }
        updateGrid();

        // Undo/Redo Engine
        function pushCommand(cmd) {
            undoStack.push(cmd);
            redoStack.length = 0; 
        }

        function undo() {
            if (undoStack.length === 0) return;
            const cmd = undoStack.pop();

            if (cmd.type === 'transform') {
                cmd.object.position.copy(cmd.before.position);
                cmd.object.rotation.copy(cmd.before.rotation);
                cmd.object.scale.copy(cmd.before.scale);
            } else if (cmd.type === 'add') {
                removeObjectFromScene(cmd.object);
                transformControls.detach();
            } else if (cmd.type === 'delete') {
                addObjectToScene(cmd.object);
                transformControls.attach(cmd.object);
            } else if (cmd.type === 'wall') {
                scene.remove(cmd.wall.mesh);
                const idx = walls.indexOf(cmd.wall);
                if (idx > -1) walls.splice(idx, 1);
            }

            redoStack.push(cmd);
        }

        function redo() {
            if (redoStack.length === 0) return;
            const cmd = redoStack.pop();

            if (cmd.type === 'transform') {
                cmd.object.position.copy(cmd.after.position);
                cmd.object.rotation.copy(cmd.after.rotation);
                cmd.object.scale.copy(cmd.after.scale);
            } else if (cmd.type === 'add') {
                addObjectToScene(cmd.object);
                transformControls.attach(cmd.object);
            } else if (cmd.type === 'delete') {
                removeObjectFromScene(cmd.object);
                transformControls.detach();
            } else if (cmd.type === 'wall') {
                scene.add(cmd.wall.mesh);
                walls.push(cmd.wall);
            }

            undoStack.push(cmd);
        }

        function addObjectToScene(obj) {
            scene.add(obj);
            selectableObjects.push(obj);
        }

        function removeObjectFromScene(obj) {
            scene.remove(obj);
            const idx = selectableObjects.indexOf(obj);
            if (idx > -1) selectableObjects.splice(idx, 1);
            
            const lightIdx = vttLights.findIndex(l => l.mesh === obj);
            if (lightIdx > -1) {
                scene.remove(vttLights[lightIdx].light);
                vttLights.splice(lightIdx, 1);
            }

            const doorIdx = doors.findIndex(d => d.mesh === obj);
            if (doorIdx > -1) doors.splice(doorIdx, 1);
        }

        // Raycasting & Interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let activeWallPoints = [];

        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('#ui-container')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (currentMode === 'select') {
                const intersects = raycaster.intersectObjects(selectableObjects, true);
                if (intersects.length > 0) {
                    let obj = intersects[0].object;
                    while (obj.parent && !selectableObjects.includes(obj)) {
                        obj = obj.parent;
                    }
                    transformControls.attach(obj);
                } else if (!transformControls.dragging) {
                    transformControls.detach();
                }
            } else {
                const floorIntersects = raycaster.intersectObject(raycastFloor);
                if (floorIntersects.length === 0) return;

                const pt = floorIntersects[0].point;
                const snap = document.getElementById('snap-toggle').checked;
                if (snap) {
                    pt.x = Math.round(pt.x);
                    pt.z = Math.round(pt.z);
                }

                if (currentMode === 'wall') {
                    activeWallPoints.push(pt.clone());
                    if (activeWallPoints.length > 1) {
                        const p1 = activeWallPoints[activeWallPoints.length - 2];
                        const p2 = activeWallPoints[activeWallPoints.length - 1];
                        
                        const lineGeo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
                        const lineMat = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 3 });
                        const line = new THREE.Line(lineGeo, lineMat);
                        line.position.y = 0.05;
                        scene.add(line);
                        
                        const wallData = { p1, p2, mesh: line };
                        walls.push(wallData);
                        pushCommand({ type: 'wall', wall: wallData });
                    }
                } else if (currentMode === 'door') {
                    const doorGeo = new THREE.BoxGeometry(0.8, 0.2, 0.2);
                    const doorMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                    const doorMesh = new THREE.Mesh(doorGeo, doorMat);
                    doorMesh.position.set(pt.x, 0.1, pt.z);

                    addObjectToScene(doorMesh);
                    doors.push({ position: pt.clone(), mesh: doorMesh });
                    pushCommand({ type: 'add', object: doorMesh });
                } else if (currentMode === 'light') {
                    const colorHex = document.getElementById('light-color').value;
                    const rangeVal = parseFloat(document.getElementById('light-range').value) || 10;

                    const light = new THREE.PointLight(colorHex, 2, rangeVal);
                    light.position.set(pt.x, 1, pt.z);
                    light.castShadow = true;
                    scene.add(light);

                    const lightGeo = new THREE.SphereGeometry(0.2, 8, 8);
                    const lightMat = new THREE.MeshBasicMaterial({ color: colorHex });
                    const lightMesh = new THREE.Mesh(lightGeo, lightMat);
                    lightMesh.position.set(pt.x, 1, pt.z);

                    addObjectToScene(lightMesh);
                    vttLights.push({ light, mesh: lightMesh });
                    pushCommand({ type: 'add', object: lightMesh });
                }
            }
        });

        window.addEventListener('dblclick', () => {
            if (currentMode === 'wall') activeWallPoints = [];
        });

        // Copy / Paste / Undo / Redo Global Key Listeners
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;

            const isCtrlOrCmd = e.ctrlKey || e.metaKey;

            if (isCtrlOrCmd && e.key.toLowerCase() === 'c') {
                const selected = transformControls.object;
                if (selected) {
                    copiedObjectData = {
                        mesh: selected.clone(true),
                        type: selected.type
                    };
                }
            } else if (isCtrlOrCmd && e.key.toLowerCase() === 'v') {
                if (copiedObjectData) {
                    const clone = copiedObjectData.mesh.clone(true);
                    clone.position.x += 1;
                    clone.position.z += 1;

                    addObjectToScene(clone);
                    transformControls.attach(clone);
                    pushCommand({ type: 'add', object: clone });
                }
            } else if (isCtrlOrCmd && e.key.toLowerCase() === 'z') {
                if (e.shiftKey) {
                    redo();
                } else {
                    undo();
                }
            } else if (isCtrlOrCmd && e.key.toLowerCase() === 'y') {
                redo();
            }
        });

        // Mode Switching
        const modeSelect = document.getElementById('mode-select');
        const modeWall = document.getElementById('mode-wall');
        const modeDoor = document.getElementById('mode-door');
        const modeLight = document.getElementById('mode-light');

        function setMode(mode, btn) {
            currentMode = mode;
            [modeSelect, modeWall, modeDoor, modeLight].forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (mode !== 'select') transformControls.detach();
        }

        modeSelect.addEventListener('click', () => setMode('select', modeSelect));
        modeWall.addEventListener('click', () => setMode('wall', modeWall));
        modeDoor.addEventListener('click', () => setMode('door', modeDoor));
        modeLight.addEventListener('click', () => setMode('light', modeLight));

        // File Import Handling
        const gltfLoader = new GLTFLoader();
        const textureLoader = new THREE.TextureLoader();

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const fileUrl = URL.createObjectURL(file);
            const extension = file.name.split('.').pop().toLowerCase();

            if (extension === 'glb') {
                gltfLoader.load(fileUrl, (gltf) => {
                    const model = gltf.scene;
                    model.position.set(0, 0, 0);
                    model.traverse((child) => {
                        if (child.isMesh) child.castShadow = true;
                    });
                    addObjectToScene(model);
                    transformControls.attach(model);
                    pushCommand({ type: 'add', object: model });
                });
            } else if (['png', 'jpg', 'jpeg'].includes(extension)) {
                textureLoader.load(fileUrl, (texture) => {
                    const aspect = texture.image.width / texture.image.height;
                    const geometry = new THREE.PlaneGeometry(aspect * 2, 2);
                    const material = new THREE.MeshStandardMaterial({ 
                        map: texture, 
                        transparent: true,
                        side: THREE.DoubleSide
                    });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.position.y = 0;

                    addObjectToScene(mesh);
                    transformControls.attach(mesh);
                    pushCommand({ type: 'add', object: mesh });
                });
            }
        });

        // UI Event Listeners
        document.getElementById('grid-size').addEventListener('input', updateGrid);
        document.getElementById('grid-dpi').addEventListener('input', updateGrid);
        document.getElementById('snap-toggle').addEventListener('change', updateSnapping);

        const btnTranslate = document.getElementById('btn-translate');
        const btnRotate = document.getElementById('btn-rotate');
        const btnScale = document.getElementById('btn-scale');

        function setActiveTool(mode, activeBtn) {
            transformControls.setMode(mode);
            [btnTranslate, btnRotate, btnScale].forEach(b => b.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        btnTranslate.addEventListener('click', () => setActiveTool('translate', btnTranslate));
        btnRotate.addEventListener('click', () => setActiveTool('rotate', btnRotate));
        btnScale.addEventListener('click', () => setActiveTool('scale', btnScale));

        document.getElementById('btn-delete').addEventListener('click', () => {
            const selected = transformControls.object;
            if (selected) {
                transformControls.detach();
                removeObjectFromScene(selected);
                pushCommand({ type: 'delete', object: selected });
            }
        });

        // --- EXPORT TO .DD2VTT FORMAT (Orthographic Grid Bounds Cropped Engine) ---
        document.getElementById('btn-export').addEventListener('click', () => {
            transformControls.detach();
            gridHelper.visible = false; 

            const gridSize = parseFloat(document.getElementById('grid-size').value) || 20;
            const dpi = parseFloat(document.getElementById('grid-dpi').value) || 70;

            // Calculate pixel dimensions based on grid size & DPI
            const exportWidth = gridSize * dpi;
            const exportHeight = gridSize * dpi;

            // Set up Orthographic Camera strictly framed to grid dimensions
            const halfSize = gridSize / 2;
            const exportCamera = new THREE.OrthographicCamera(
                -halfSize, // left
                 halfSize, // right
                 halfSize, // top
                -halfSize, // bottom
                 0.1,      // near
                 1000      // far
            );
            exportCamera.position.set(0, 50, 0);
            exportCamera.lookAt(0, 0, 0);

            // Temporarily resize renderer to high-res export size
            const originalSize = new THREE.Vector2();
            renderer.getSize(originalSize);
            renderer.setSize(exportWidth, exportHeight, false);

            // Render offscreen image frame
            renderer.render(scene, exportCamera);
            const dataUrl = renderer.domElement.toDataURL('image/png');
            const base64Image = dataUrl.replace(/^data:image\/png;base64,/, "");

            // Restore screen canvas viewport size & UI grid
            renderer.setSize(originalSize.x, originalSize.y, false);
            gridHelper.visible = true;

            // Map Line-of-sight walls, doors, and lights normalized (0.0 to 1.0)
            const normalizeCoord = (val) => (val + halfSize) / gridSize;

            const losWalls = walls.map(w => [
                { x: normalizeCoord(w.p1.x), y: normalizeCoord(w.p1.z) },
                { x: normalizeCoord(w.p2.x), y: normalizeCoord(w.p2.z) }
            ]);

            const vttPortals = doors.map(d => ({
                position: { x: normalizeCoord(d.position.x), y: normalizeCoord(d.position.z) },
                bounds: [
                    { x: normalizeCoord(d.position.x - 0.5), y: normalizeCoord(d.position.z) },
                    { x: normalizeCoord(d.position.x + 0.5), y: normalizeCoord(d.position.z) }
                ],
                closed: true,
                freeloop: false
            }));

            const formattedLights = vttLights.map(l => ({
                position: { x: normalizeCoord(l.mesh.position.x), y: normalizeCoord(l.mesh.position.z) },
                range: l.light.distance || 10,
                intensity: l.light.intensity || 1,
                color: l.light.color.getHexString(),
                shadows: true
            }));

            // Assemble DD2VTT JSON data
            const dd2vttData = {
                format: 0.2,
                resolution: {
                    map_origin: { x: 0, y: 0 },
                    map_size: { x: gridSize, y: gridSize },
                    pixels_per_grid: dpi
                },
                line_of_sight: losWalls,
                portals: vttPortals,
                environment: {
                    ambient_light: "ffffff"
                },
                lights: formattedLights,
                image: base64Image
            };

            // Trigger File Download
            const blob = new Blob([JSON.stringify(dd2vttData, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'map.dd2vtt';
            link.click();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            orbit.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
