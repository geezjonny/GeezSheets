<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GM Stream Deck</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0b08;--panel:#1a1510;--panel2:#151208;--border:#3d2e1a;
  --gold:#c8a84b;--gold-dim:#7a6228;--red:#8b2020;--red-bright:#e04040;
  --text:#d4c49a;--dim:#6b5a38;--green:#4a9a4a;
}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Cinzel',serif;color:var(--text);user-select:none}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;max-width:700px;margin:0 auto}

/* ── Top bar ── */
#topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
#topbar-title{font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;flex:1}
#map-name-display{font-size:10px;color:var(--dim);letter-spacing:.06em}
#status-dot{width:8px;height:8px;border-radius:50%;background:#666;flex-shrink:0}
#status-dot.live{background:var(--green)}

/* ── Deck ── */
#deck{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
#deck::-webkit-scrollbar{width:4px}
#deck::-webkit-scrollbar-thumb{background:var(--border)}

.section{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.section-header{padding:8px 14px;background:var(--panel2);border-bottom:1px solid var(--border);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-dim)}
.section-body{padding:10px}

/* ── Big touch buttons ── */
.btn-grid{display:grid;gap:8px}
.btn-grid.col-2{grid-template-columns:1fr 1fr}
.btn-grid.col-3{grid-template-columns:1fr 1fr 1fr}
.btn-grid.col-4{grid-template-columns:1fr 1fr 1fr 1fr}
.deck-btn{height:56px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.03);color:var(--dim);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.06em;cursor:pointer;transition:all .12s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.deck-btn:active{transform:scale(.96);opacity:.85}
.deck-btn .icon{font-size:20px;line-height:1}
.deck-btn:hover{border-color:var(--gold-dim);color:var(--text)}
.deck-btn.on{border-color:var(--gold);background:rgba(200,168,75,.1);color:var(--gold)}
.deck-btn.danger{border-color:rgba(224,64,64,.3);color:#fca5a5}
.deck-btn.danger:hover{border-color:var(--red-bright)}
.deck-btn.green{border-color:rgba(74,154,74,.3);color:#5a9a5a}
.deck-btn.green.on{border-color:var(--green);background:rgba(74,154,74,.12);color:#4a9a4a}
.deck-btn.big{height:72px;font-size:12px}

/* ── HP strip ── */
.pc-strip{display:flex;flex-direction:column;gap:8px}
.pc-row{display:grid;grid-template-columns:36px 1fr auto auto;gap:8px;align-items:center}
.pc-portrait{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:#3a6aaa;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0}
.pc-portrait img{width:100%;height:100%;object-fit:cover}
.pc-info{min-width:0}
.pc-name{font-size:10px;color:var(--text);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-bar-wrap{height:4px;background:rgba(255,255,255,.06);border-radius:999px;margin-top:3px;overflow:hidden}
.hp-bar{height:100%;border-radius:999px;transition:width .3s,background .3s}
.hp-val{font-size:10px;color:var(--text);white-space:nowrap;letter-spacing:.04em;min-width:40px;text-align:right}
.hp-btns{display:flex;gap:4px}
.hp-adj{width:32px;height:32px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;touch-action:manipulation}
.hp-adj:active{transform:scale(.92)}
.hp-adj.heal{border-color:rgba(74,154,74,.4);color:#4a9a4a}
.hp-adj.heal:hover{background:rgba(74,154,74,.1)}
.hp-adj.dmg{border-color:rgba(224,64,64,.3);color:#fca5a5}
.hp-adj.dmg:hover{background:rgba(224,64,64,.1)}

/* ── HP delta input ── */
.hp-delta-wrap{display:flex;align-items:center;gap:6px;margin-top:6px}
.hp-delta-label{font-size:9px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.hp-delta{width:60px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Cinzel',serif;font-size:13px;padding:5px 8px;outline:none;text-align:center}
.hp-delta:focus{border-color:var(--gold-dim)}

/* ── Weather sliders ── */
.wx-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wx-label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);width:46px;flex-shrink:0}
.wx-check{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:12px;border:1px solid var(--border);background:#111;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;outline:none}
.wx-check:checked{background:rgba(200,168,75,.3);border-color:var(--gold)}
.wx-check::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:left .2s,background .2s}
.wx-check:checked::after{left:21px;background:var(--gold)}
.wx-slider{flex:1;accent-color:var(--gold);cursor:pointer}

/* ── Toast ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--gold);color:var(--gold);font-family:'Cinzel',serif;font-size:11px;padding:8px 18px;border-radius:5px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:100}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

<!-- Top bar -->
<div id="topbar">
  <div id="status-dot"></div>
  <div id="topbar-title">⚔ GM Deck</div>
  <div id="map-name-display">—</div>
</div>

<div id="deck">

  <!-- Combat -->
  <div class="section">
    <div class="section-header">⚔ Combat</div>
    <div class="section-body">
      <div class="btn-grid col-3">
        <button class="deck-btn big green" id="combat-btn" onclick="toggleCombat()">
          <span class="icon">⚔</span>Start Combat
        </button>
        <button class="deck-btn big" id="next-btn" onclick="doNextTurn()">
          <span class="icon">▶</span>Next Turn
        </button>
        <button class="deck-btn big danger" onclick="doClearInitiative()">
          <span class="icon">✕</span>End Combat
        </button>
      </div>
    </div>
  </div>

  <!-- Party HP -->
  <div class="section">
    <div class="section-header">❤ Party HP</div>
    <div class="section-body">
      <div class="hp-delta-wrap" style="margin-bottom:10px">
        <span class="hp-delta-label">Adjust by</span>
        <input class="hp-delta" id="hp-delta-input" type="number" min="1" value="5" placeholder="5">
        <span style="font-size:9px;color:var(--dim)">hp</span>
      </div>
      <div class="pc-strip" id="pc-strip"></div>
    </div>
  </div>

  <!-- Session -->
  <div class="section">
    <div class="section-header">🗺 Session</div>
    <div class="section-body">
      <div class="btn-grid col-2">
        <button class="deck-btn" onclick="doFogAll()"><span class="icon">🌫</span>Fog All</button>
        <button class="deck-btn" onclick="doClearFog()"><span class="icon">☀</span>Clear Fog</button>
        <button class="deck-btn" id="night-btn" onclick="toggleNight()"><span class="icon">🌙</span>Night Mode</button>
        <button class="deck-btn" onclick="doPing()"><span class="icon">📍</span>Ping Map</button>
      </div>
    </div>
  </div>

  <!-- Weather -->
  <div class="section">
    <div class="section-header">🌦 Weather</div>
    <div class="section-body">
      <div class="wx-row"><input class="wx-check" type="checkbox" id="wx-rain"><span class="wx-label">Rain</span><input class="wx-slider" type="range" id="wx-rain-i" min="0" max="1" step="0.05" value="0.5"></div>
      <div class="wx-row"><input class="wx-check" type="checkbox" id="wx-snow"><span class="wx-label">Snow</span><input class="wx-slider" type="range" id="wx-snow-i" min="0" max="1" step="0.05" value="0.3"></div>
      <div class="wx-row"><input class="wx-check" type="checkbox" id="wx-mist"><span class="wx-label">Mist</span><input class="wx-slider" type="range" id="wx-mist-i" min="0" max="1" step="0.05" value="0.4"></div>
      <div class="wx-row"><input class="wx-check" type="checkbox" id="wx-storm"><span class="wx-label">Storm</span><input class="wx-slider" type="range" id="wx-storm-i" min="0" max="1" step="0.05" value="0.5"></div>
    </div>
  </div>

  <!-- Oracle quick roll -->
  <div class="section">
    <div class="section-header">🎲 Oracle</div>
    <div class="section-body">
      <div class="btn-grid col-3" style="margin-bottom:8px">
        <button class="deck-btn" onclick="oracleRoll('npc')"><span class="icon">👤</span>NPC</button>
        <button class="deck-btn" onclick="oracleRoll('loot')"><span class="icon">💰</span>Loot</button>
        <button class="deck-btn" onclick="oracleRoll('monster')"><span class="icon">👹</span>Monster</button>
        <button class="deck-btn" onclick="oracleRoll('poi')"><span class="icon">❗</span>POI</button>
        <button class="deck-btn" onclick="oracleRoll('hazard')"><span class="icon">🔥</span>Hazard</button>
        <button class="deck-btn" onclick="oracleRoll('danger')"><span class="icon">💀</span>Danger</button>
      </div>
      <div id="oracle-out" style="font-size:9px;line-height:1.7;color:var(--text);white-space:pre-wrap;min-height:20px"></div>
    </div>
  </div>

</div><!-- /deck -->
</div><!-- /app -->
<div id="toast"></div>

<script type="module">
import { initializeApp }                      from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getDatabase, ref, set, get, update,
         onValue, remove, push }              from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";
import { tokenTextures, tryLoadTokenTexture } from "./js/assets.js";
import { rollNPC, rollLoot, rollMonster,
         rollPOI, rollHazard, rollDanger }    from "./js/rollers.js";

const cfg = {
  apiKey:"AIzaSyAI3Itfvj4kZ0j0wxUhdrlVK6W76h260ZY",
  authDomain:"sheets-e5838.firebaseapp.com",
  databaseURL:"https://sheets-e5838-default-rtdb.firebaseio.com",
  projectId:"sheets-e5838",
  storageBucket:"sheets-e5838.firebasestorage.app",
};
const app = initializeApp(cfg);
const db  = getDatabase(app);

// ── State ──────────────────────────────────────────────────────────────────────
let currentMap  = "dungeon-1";
let inCombat    = false;
let nightMode   = false;
let initiative  = { order:[], active:null };
const tokens    = {};
const pcsData   = {};
const weather   = { rain:{enabled:false,intensity:.5}, snow:{enabled:false,intensity:.3}, mist:{enabled:false,intensity:.4}, storm:{enabled:false,intensity:.5} };

// ── Toast ──────────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2200);
}

// ── Status dot ────────────────────────────────────────────────────────────────
onValue(ref(db, ".info/connected"), snap => {
  document.getElementById("status-dot").classList.toggle("live", !!snap.val());
});

// ── Session/map ───────────────────────────────────────────────────────────────
onValue(ref(db, "session/currentMap"), snap => {
  if (snap.val()) { currentMap = snap.val(); document.getElementById("map-name-display").textContent = currentMap; }
});
onValue(ref(db, "session/inCombat"), snap => {
  inCombat = !!snap.val();
  const btn = document.getElementById("combat-btn");
  btn.classList.toggle("on", inCombat);
  btn.querySelector(".icon").textContent = inCombat ? "⚔" : "⚔";
  btn.lastChild.textContent = inCombat ? "In Combat" : "Start Combat";
});
onValue(ref(db, `maps/${currentMap}/nightMode`), snap => {
  nightMode = !!snap.val();
  document.getElementById("night-btn").classList.toggle("on", nightMode);
});
onValue(ref(db, "initiative"), snap => {
  const d = snap.val() || {};
  initiative = { order: d.order||[], active: d.active||null };
});
onValue(ref(db, "weather"), snap => {
  const d = snap.val(); if (!d) return;
  ["rain","snow","mist","storm"].forEach(t => {
    if (d[t]) Object.assign(weather[t], d[t]);
    const toggle = document.getElementById(`wx-${t}`);
    const slider = document.getElementById(`wx-${t}-i`);
    if (toggle) toggle.checked = weather[t].enabled;
    if (slider) slider.value  = weather[t].intensity;
  });
});

// ── PCs ───────────────────────────────────────────────────────────────────────
onValue(ref(db, "characters/pcs"), snap => {
  const d = snap.val() || {};
  for (const k in pcsData) delete pcsData[k];
  Object.assign(pcsData, d);
  renderPCStrip();
});

onValue(ref(db, `maps/${currentMap}/tokens`), snap => {
  for (const k in tokens) delete tokens[k];
  const d = snap.val() || {};
  Object.assign(tokens, d);
  renderPCStrip();
});

function hpColor(cur, max) {
  if (!max) return "#c8a84b";
  const p = cur/max;
  return p>.5?"#4a9a4a":p>.25?"#aaaa30":"#e04040";
}

function renderPCStrip() {
  const strip = document.getElementById("pc-strip");
  strip.innerHTML = "";
  const pcToks = Object.entries(tokens).filter(([,t]) => t.type === "pc");
  if (!pcToks.length) {
    strip.innerHTML = `<div style="font-size:10px;color:var(--dim);text-align:center;padding:8px">No PC tokens on map</div>`;
    return;
  }
  for (const [, tok] of pcToks) {
    const charId = tok.characterId;
    const pc     = charId ? pcsData[charId] : null;
    const hp     = pc?.combat?.hp_current ?? tok.hp ?? 0;
    const maxHp  = pc?.combat?.hp_max     ?? tok.maxHp ?? 1;
    const hpPct  = Math.max(0, Math.min(1, hp/maxHp));
    const color  = hpColor(hp, maxHp);

    if (charId) tryLoadTokenTexture(charId, tok.lookupName || tok.name);
    const img = charId ? tokenTextures[charId] : null;

    const row = document.createElement("div");
    row.className = "pc-row";

    const portrait = document.createElement("div");
    portrait.className = "pc-portrait";
    if (img) { const i = document.createElement("img"); i.src = img.src; portrait.appendChild(i); }
    else portrait.textContent = (tok.name||"?")[0].toUpperCase();

    const info = document.createElement("div");
    info.className = "pc-info";
    info.innerHTML = `<div class="pc-name">${tok.name||"?"}</div>
      <div class="hp-bar-wrap"><div class="hp-bar" style="width:${Math.round(hpPct*100)}%;background:${color}"></div></div>`;

    const valEl = document.createElement("div");
    valEl.className = "hp-val";
    valEl.textContent = `${hp}/${maxHp}`;

    const btns = document.createElement("div");
    btns.className = "hp-btns";

    const healBtn = document.createElement("button");
    healBtn.className = "hp-adj heal"; healBtn.textContent = "+";
    healBtn.onclick = async () => {
      const delta = parseInt(document.getElementById("hp-delta-input").value)||5;
      if (!charId) return;
      const newHp = Math.min(maxHp, hp + delta);
      await update(ref(db, `characters/pcs/${charId}/combat`), { hp_current: newHp });
      toast(`❤ ${tok.name} +${delta} HP`);
    };

    const dmgBtn = document.createElement("button");
    dmgBtn.className = "hp-adj dmg"; dmgBtn.textContent = "−";
    dmgBtn.onclick = async () => {
      const delta = parseInt(document.getElementById("hp-delta-input").value)||5;
      if (!charId) return;
      const newHp = Math.max(0, hp - delta);
      await update(ref(db, `characters/pcs/${charId}/combat`), { hp_current: newHp });
      toast(`💔 ${tok.name} −${delta} HP`);
    };

    btns.appendChild(healBtn); btns.appendChild(dmgBtn);
    row.appendChild(portrait); row.appendChild(info); row.appendChild(valEl); row.appendChild(btns);
    strip.appendChild(row);
  }
}

// ── Combat controls ───────────────────────────────────────────────────────────
window.toggleCombat = async () => {
  if (inCombat) {
    await set(ref(db,"session/inCombat"),false);
    await remove(ref(db,"initiative"));
    toast("Combat ended");
  } else {
    await set(ref(db,"session/inCombat"),true);
    await remove(ref(db,"initiative"));
    toast("⚔ Combat started");
  }
};
window.doNextTurn = async () => {
  const order = initiative.order||[];
  if (!order.length) { toast("No initiative order"); return; }
  const idx  = order.findIndex(e => e.tokenId === initiative.active);
  const next = order[(idx+1) % order.length];
  await update(ref(db,"initiative"),{active:next.tokenId});
  await push(ref(db,"chat"),{sender:"System",type:"system",text:`⚔ It's **${next.name}**'s turn`,t:Date.now()});
  toast(`▶ ${next.name}'s turn`);
};
window.doClearInitiative = async () => {
  await set(ref(db,"session/inCombat"),false);
  await remove(ref(db,"initiative"));
  toast("Combat cleared");
};

// ── Session controls ──────────────────────────────────────────────────────────
window.toggleNight = async () => {
  nightMode = !nightMode;
  await set(ref(db,`maps/${currentMap}/nightMode`),nightMode);
  document.getElementById("night-btn").classList.toggle("on",nightMode);
  toast(nightMode?"🌙 Night mode on":"☀ Night mode off");
};
window.doFogAll = async () => {
  const snap = await get(ref(db,`maps/${currentMap}/tiles`));
  if (!snap.exists()) { toast("No map loaded"); return; }
  const tiles = snap.val();
  const cells = {};
  for (const k in tiles) cells[k] = true;
  await set(ref(db,`maps/${currentMap}/fog/fog_admin`),{cells,type:"fog"});
  toast("🌫 Map fogged");
};
window.doClearFog = async () => {
  await set(ref(db,`maps/${currentMap}/fog`),null);
  toast("☀ Fog cleared");
};
window.doPing = () => { toast("Use the map to ping"); };

// ── Weather ───────────────────────────────────────────────────────────────────
["rain","snow","mist","storm"].forEach(t => {
  document.getElementById(`wx-${t}`).onchange    = () => { weather[t].enabled=document.getElementById(`wx-${t}`).checked;     saveWeather(); };
  document.getElementById(`wx-${t}-i`).oninput   = () => { weather[t].intensity=parseFloat(document.getElementById(`wx-${t}-i`).value); saveWeather(); };
});
async function saveWeather() { await set(ref(db,"weather"),weather); }

// ── Oracle ────────────────────────────────────────────────────────────────────
const oracleOut = document.getElementById("oracle-out");
window.oracleRoll = async (type) => {
  let result;
  if (type==="npc")     { const r=rollNPC();       result=`${r.name}, ${r.occupation}\n${r.mood} · ${r.quirk}\nWants: ${r.wants}`; }
  else if(type==="loot")    { const r=await rollLoot(); result=`${r.tier}: ${r.coin}\n${r.item}${r.oddity?"\n"+r.oddity:""}`; }
  else if(type==="monster") { const r=rollMonster();    result=`${r.creature}\n${r.behavior}${r.twist?"\n"+r.twist:""}`; }
  else if(type==="poi")     { const r=rollPOI();        result=`${r.what}\n${r.detail}\n${r.hook}`; }
  else if(type==="hazard")  { const r=rollHazard();     result=`${r.name}\n${r.effect}\nTrigger: ${r.trigger}`; }
  else if(type==="danger")  { const r=rollDanger();     result=`${r.threat}\n${r.detail}\n${r.sign}`; }
  oracleOut.textContent = result || "—";
};
</script>
</body>
</html>
