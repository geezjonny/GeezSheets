<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GM Console</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+English&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0908;--panel:#161210;--border:#3d2e1a;
  --gold:#c8a84b;--gold-dim:#7a6228;
  --text:#d4c49a;--dim:#6b5a38;
  --red:#c0392b;--green:#27ae60;--blue:#2980b9;--purple:#8e44ad;--orange:#d35400;
}
html,body{width:100%;min-height:100%;background:var(--bg);font-family:'Cinzel',serif;color:var(--text);overflow-x:hidden}

h1{font-size:18px;color:var(--gold);letter-spacing:.2em;padding:18px 20px 0;text-transform:uppercase}
.subtitle{font-size:10px;color:var(--dim);letter-spacing:.15em;padding:4px 20px 16px;border-bottom:1px solid var(--border)}

/* ── Section ── */
.section{padding:16px 20px}
.section-title{font-size:10px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Button grid ── */
.btn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.btn-grid.wide{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}

/* ── Stream deck button ── */
.sd-btn{
  height:80px;border-radius:10px;border:2px solid var(--border);
  background:var(--panel);color:var(--text);
  font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;
  cursor:pointer;transition:all .12s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:8px;text-align:center;line-height:1.3;
  position:relative;overflow:hidden;
}
.sd-btn .icon{font-size:26px;line-height:1}
.sd-btn:hover{border-color:var(--gold-dim);background:#1e1a14;transform:translateY(-1px);}
.sd-btn:active{transform:translateY(1px);filter:brightness(.85);}
.sd-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(200,168,75,.1);}
.sd-btn.danger{border-color:var(--red);color:#e74c3c;}
.sd-btn.danger:hover{background:rgba(192,57,43,.15);}
.sd-btn.success{border-color:var(--green);color:#2ecc71;}
.sd-btn.blue{border-color:var(--blue);color:#3498db;}
.sd-btn.purple{border-color:var(--purple);color:#9b59b6;}

/* ── Weather buttons with sliders ── */
.wx-btn{height:100px}
.wx-slider{width:80%;accent-color:var(--gold);cursor:pointer;margin-top:2px}

/* ── Current map display ── */
#map-display{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
#map-display .map-name{font-size:16px;color:var(--gold);letter-spacing:.1em}
#map-display .map-label{font-size:9px;color:var(--dim);letter-spacing:.12em}

/* ── NPC spawn ── */
#npc-form{display:flex;gap:8px;margin-bottom:12px;align-items:center}
#npc-name{flex:1;background:#111;border:1px solid var(--border);color:var(--text);font-family:'IM Fell English',serif;font-size:14px;padding:8px 12px;border-radius:6px;outline:none}
#npc-name:focus{border-color:var(--gold-dim)}
#npc-hp{width:80px;background:#111;border:1px solid var(--border);color:var(--text);font-family:'IM Fell English',serif;font-size:14px;padding:8px 10px;border-radius:6px;outline:none}
#npc-spawn-btn{height:40px;padding:0 16px;border:1px solid var(--green);border-radius:6px;background:transparent;color:#2ecc71;font-family:'Cinzel',serif;font-size:11px;cursor:pointer}
#npc-spawn-btn:hover{background:rgba(39,174,96,.15)}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--gold);color:var(--gold);font-family:'Cinzel',serif;font-size:12px;padding:8px 20px;border-radius:6px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:100}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Map list ── */
.map-btn{height:60px;font-size:11px}
.map-btn .icon{font-size:18px}
</style>
</head>
<body>

<h1>⚔ GM Console</h1>
<div class="subtitle">DUNGEON MASTER CONTROL SURFACE</div>

<!-- Current session -->
<div class="section">
  <div class="section-title">Session</div>
  <div id="map-display">
    <div>
      <div class="map-label">CURRENT MAP</div>
      <div class="map-name" id="current-map-name">Loading…</div>
    </div>
    <div style="font-size:10px;color:var(--dim)" id="session-status">—</div>
  </div>
  <div class="btn-grid">
    <button class="sd-btn danger" id="clear-chat-btn"><div class="icon">💬</div>Clear Chat</button>
    <button class="sd-btn danger" id="clear-init-btn"><div class="icon">⚔</div>Clear Initiative</button>
    <button class="sd-btn danger" id="clear-tokens-btn"><div class="icon">🪆</div>Clear All Tokens</button>
    <button class="sd-btn success" id="reset-hp-btn"><div class="icon">❤️</div>Reset All HP</button>
    <button class="sd-btn blue" id="export-btn"><div class="icon">📥</div>Export Map JSON</button>
    <button class="sd-btn danger" id="nuke-btn"><div class="icon">💥</div>Nuke Session</button>
  </div>
</div>

<!-- Weather -->
<div class="section">
  <div class="section-title">Weather</div>
  <div class="btn-grid">
    <button class="sd-btn wx-btn" id="wx-rain" data-type="rain">
      <div class="icon">🌧</div>Rain
      <input class="wx-slider" type="range" min="0" max="1" step="0.05" value="0.5" id="wx-rain-slider">
    </button>
    <button class="sd-btn wx-btn" id="wx-snow" data-type="snow">
      <div class="icon">❄️</div>Snow
      <input class="wx-slider" type="range" min="0" max="1" step="0.05" value="0.3" id="wx-snow-slider">
    </button>
    <button class="sd-btn wx-btn" id="wx-mist" data-type="mist">
      <div class="icon">🌫</div>Mist
      <input class="wx-slider" type="range" min="0" max="1" step="0.05" value="0.4" id="wx-mist-slider">
    </button>
    <button class="sd-btn wx-btn" id="wx-storm" data-type="storm">
      <div class="icon">⛈</div>Storm
      <input class="wx-slider" type="range" min="0" max="1" step="0.05" value="0.5" id="wx-storm-slider">
    </button>
    <button class="sd-btn danger" id="wx-clear-btn"><div class="icon">☀️</div>Clear All Weather</button>
  </div>
</div>

<!-- Background Image -->
<div class="section">
  <div class="section-title">Background Map Image</div>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
    <input type="text" id="bg-url-input" placeholder="https://raw.githubusercontent.com/…/maps/tavern.png" style="flex:1;background:#111;border:1px solid #3d2e1a;color:#c8a84b;font-family:monospace;font-size:12px;padding:6px 10px;border-radius:6px;outline:none">
    <button id="bg-set-btn" style="height:36px;padding:0 14px;border:1px solid #27ae60;border-radius:6px;background:transparent;color:#2ecc71;font-family:monospace;font-size:11px;cursor:pointer">Set</button>
    <button id="bg-clear-btn" style="height:36px;padding:0 14px;border:1px solid #c0392b;border-radius:6px;background:transparent;color:#e74c3c;font-family:monospace;font-size:11px;cursor:pointer">Clear</button>
  </div>
  <div id="bg-status" style="font-size:10px;color:#6b5a38;font-family:monospace">No background set for current map</div>
</div>

<!-- NPC Spawn -->
<div class="section">
  <div class="section-title">Spawn NPC</div>
  <div id="npc-form">
    <input id="npc-name" type="text" placeholder="NPC name (e.g. Goblin)" spellcheck="false">
    <input id="npc-hp" type="number" placeholder="HP" min="1" value="10">
    <button id="npc-spawn-btn">⚔ Spawn</button>
  </div>
  <div class="btn-grid" id="quick-npcs">
    <!-- Quick spawn buttons added here -->
  </div>
</div>

<!-- Maps -->
<div class="section">
  <div class="section-title">Maps</div>
  <div class="btn-grid wide" id="map-list">
    <div style="font-family:'IM Fell English',serif;font-size:12px;color:var(--dim)">Loading maps…</div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getDatabase, ref, set, get, remove, onValue, push, update }
  from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyBJJUrF9ZKt_YGImKUUWwL2hQNbvWl_Ozo",
  authDomain:"sheets-e5838.firebaseapp.com",
  databaseURL:"https://sheets-e5838-default-rtdb.firebaseio.com",
  projectId:"sheets-e5838",
  storageBucket:"sheets-e5838.firebasestorage.app",
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

// ── State ─────────────────────────────────────────────────────────────────────
let currentMap="dungeon-1";
const weather={rain:{enabled:false,intensity:0.5},snow:{enabled:false,intensity:0.3},mist:{enabled:false,intensity:0.4},storm:{enabled:false,intensity:0.5}};

// Quick-spawn NPC roster (persisted in localStorage)
const QUICK_NPCS_KEY="vtt_quick_npcs";
let quickNpcs=JSON.parse(localStorage.getItem(QUICK_NPCS_KEY)||"[]");

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),2500);
}

// ── Background image ──────────────────────────────────────────────────────────
const bgUrlInput=document.getElementById("bg-url-input");
const bgStatus=document.getElementById("bg-status");

async function loadBgForMap(mapName){
  const snap=await get(ref(db,`maps/${mapName}/background`));
  const url=snap.val()||"";
  bgUrlInput.value=url;
  bgStatus.textContent=url?`Background: ${url}`:`No background set for ${mapName}`;
}

document.getElementById("bg-set-btn").onclick=async()=>{
  const url=bgUrlInput.value.trim();
  if(!url){toast("Enter a URL");return;}
  await set(ref(db,`maps/${currentMap}/background`),url);
  bgStatus.textContent=`Background set: ${url}`;
  toast("Background image set ✓");
};

document.getElementById("bg-clear-btn").onclick=async()=>{
  await remove(ref(db,`maps/${currentMap}/background`));
  bgUrlInput.value="";
  bgStatus.textContent=`No background set for ${currentMap}`;
  toast("Background cleared");
};

// Reload bg URL when map changes
onValue(ref(db,"session/currentMap"),snap=>{
  const name=snap.val();
  if(name){currentMap=name;document.getElementById("current-map-name").textContent=name;document.getElementById("session-status").textContent="Live ✓";loadBgForMap(name);}
});

// ── Weather ───────────────────────────────────────────────────────────────────
async function saveWeather(){
  await set(ref(db,"weather"),weather);
}

// Sync weather state from RTDB on load
onValue(ref(db,"weather"),snap=>{
  const data=snap.val();if(!data)return;
  ["rain","snow","mist","storm"].forEach(t=>{
    if(data[t]){
      Object.assign(weather[t],data[t]);
      const btn=document.getElementById(`wx-${t}`);
      const slider=document.getElementById(`wx-${t}-slider`);
      btn.classList.toggle("on",weather[t].enabled);
      slider.value=weather[t].intensity;
    }
  });
},{onlyOnce:true});

["rain","snow","mist","storm"].forEach(t=>{
  const btn=document.getElementById(`wx-${t}`);
  const slider=document.getElementById(`wx-${t}-slider`);

  btn.onclick=(e)=>{
    // Don't toggle if clicking the slider
    if(e.target===slider)return;
    weather[t].enabled=!weather[t].enabled;
    btn.classList.toggle("on",weather[t].enabled);
    saveWeather();
    toast(`${t.charAt(0).toUpperCase()+t.slice(1)} ${weather[t].enabled?"ON":"OFF"}`);
  };

  slider.addEventListener("input",e=>{
    e.stopPropagation();
    weather[t].intensity=parseFloat(slider.value);
    saveWeather();
  });
  slider.addEventListener("click",e=>e.stopPropagation());
  slider.addEventListener("pointerdown",e=>e.stopPropagation());
});

document.getElementById("wx-clear-btn").onclick=async()=>{
  ["rain","snow","mist","storm"].forEach(t=>{
    weather[t].enabled=false;
    document.getElementById(`wx-${t}`).classList.remove("on");
  });
  await saveWeather();
  toast("Weather cleared");
};

// ── Session actions ───────────────────────────────────────────────────────────
document.getElementById("clear-chat-btn").onclick=async()=>{
  if(!confirm("Clear all chat messages?"))return;
  await remove(ref(db,"chat"));
  toast("Chat cleared");
};

document.getElementById("clear-init-btn").onclick=async()=>{
  await remove(ref(db,"initiative"));
  toast("Initiative cleared");
};

document.getElementById("clear-tokens-btn").onclick=async()=>{
  if(!confirm(`Clear all tokens from ${currentMap}?`))return;
  await remove(ref(db,`maps/${currentMap}/tokens`));
  toast("Tokens cleared");
};

document.getElementById("reset-hp-btn").onclick=async()=>{
  const snap=await get(ref(db,`maps/${currentMap}/tokens`));
  if(!snap.exists()){toast("No tokens on map");return;}
  const tokens=snap.val();
  const updates={};
  for(const[id,tok]of Object.entries(tokens)){
    if(tok.maxHp)updates[`maps/${currentMap}/tokens/${id}/hp`]=tok.maxHp;
  }
  await update(ref(db),updates);
  toast("All HP reset to max");
};

document.getElementById("export-btn").onclick=async()=>{
  const snap=await get(ref(db,`maps/${currentMap}`));
  if(!snap.exists()){toast("No map data");return;}
  const data={mapName:currentMap,...snap.val()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`${currentMap}.json`;a.click();
  toast(`Exported ${currentMap}.json`);
};

document.getElementById("nuke-btn").onclick=async()=>{
  if(!confirm("⚠ NUKE SESSION — clear chat, initiative, pings, lasers, and weather?"))return;
  await Promise.all([
    remove(ref(db,"chat")),
    remove(ref(db,"initiative")),
    remove(ref(db,"pings")),
    remove(ref(db,"lasers")),
    remove(ref(db,"weather")),
  ]);
  ["rain","snow","mist","storm"].forEach(t=>{weather[t].enabled=false;document.getElementById(`wx-${t}`).classList.remove("on");});
  toast("Session nuked 💥");
};

// ── NPC Spawn ─────────────────────────────────────────────────────────────────
async function spawnNpc(name,hp){
  if(!name){toast("Enter a name");return;}
  hp=parseInt(hp)||10;

  // Find a position next to an existing token
  const snap=await get(ref(db,`maps/${currentMap}/tokens`));
  let x=0,y=0;
  if(snap.exists()){
    const tokens=Object.values(snap.val());
    if(tokens.length){
      // Place next to first token
      x=tokens[0].x+2;y=tokens[0].y;
    }
  }

  const id="tok_"+Date.now();
  await set(ref(db,`maps/${currentMap}/tokens/${id}`),{
    id,name,type:"npc",hp,maxHp:hp,
    characterId:"__npc__",x,y,conditions:[]
  });
  toast(`Spawned ${name} (${hp} HP)`);
}

document.getElementById("npc-spawn-btn").onclick=()=>{
  const name=document.getElementById("npc-name").value.trim();
  const hp=document.getElementById("npc-hp").value;
  if(!name)return;
  // Add to quick spawn roster
  if(!quickNpcs.find(n=>n.name===name)){
    quickNpcs.push({name,hp:parseInt(hp)||10});
    if(quickNpcs.length>12)quickNpcs.shift();
    localStorage.setItem(QUICK_NPCS_KEY,JSON.stringify(quickNpcs));
    buildQuickNpcs();
  }
  spawnNpc(name,hp);
};

document.getElementById("npc-name").addEventListener("keydown",e=>{
  if(e.key==="Enter")document.getElementById("npc-spawn-btn").click();
});

function buildQuickNpcs(){
  const grid=document.getElementById("quick-npcs");
  grid.innerHTML="";
  quickNpcs.forEach(npc=>{
    const btn=document.createElement("button");
    btn.className="sd-btn";
    btn.innerHTML=`<div class="icon">👹</div>${npc.name}<div style="font-size:9px;color:var(--dim)">${npc.hp} HP</div>`;
    btn.onclick=()=>spawnNpc(npc.name,npc.hp);
    // Long press to remove from roster
    let holdTimer;
    btn.addEventListener("pointerdown",()=>{holdTimer=setTimeout(()=>{quickNpcs=quickNpcs.filter(n=>n.name!==npc.name);localStorage.setItem(QUICK_NPCS_KEY,JSON.stringify(quickNpcs));buildQuickNpcs();toast(`Removed ${npc.name} from roster`);},800);});
    btn.addEventListener("pointerup",()=>clearTimeout(holdTimer));
    grid.appendChild(btn);
  });
}
buildQuickNpcs();

// ── Maps ──────────────────────────────────────────────────────────────────────
async function loadMapList(){
  const snap=await get(ref(db,"maps"));
  const list=document.getElementById("map-list");
  list.innerHTML="";
  if(!snap.exists()){list.innerHTML=`<div style="color:var(--dim);font-size:12px">No maps found</div>`;return;}
  const maps=Object.keys(snap.val()).sort();
  maps.forEach(name=>{
    const btn=document.createElement("button");
    btn.className="sd-btn map-btn"+(name===currentMap?" on":"");
    btn.innerHTML=`<div class="icon">🗺</div>${name}`;
    btn.onclick=async()=>{
      await set(ref(db,"session/currentMap"),name);
      document.querySelectorAll(".map-btn").forEach(b=>b.classList.remove("on"));
      btn.classList.add("on");
      toast(`Switched to ${name}`);
    };
    list.appendChild(btn);
  });
  // Add refresh button
  const refresh=document.createElement("button");
  refresh.className="sd-btn blue map-btn";
  refresh.innerHTML=`<div class="icon">🔄</div>Refresh`;
  refresh.onclick=loadMapList;
  list.appendChild(refresh);
}
loadMapList();
</script>
</body>
</html>
