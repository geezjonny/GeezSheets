<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>GeezSheets background</title></head>
<body>
<script type="module">
import OBR, { buildWall, buildLight, buildShape, buildPath } from 'https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm';
import { sceneItems, loadPending, dropPending, inRoom, MAPKEY, DOOR, ROOM } from './dd2vtt.js';
const page = (p) => new URL(p, location.href).href;
OBR.onReady(async () => {
  const role = await OBR.player.getRole();
  // dd2vtt maps (import.html): right-click a map picture to import its walls; right-click a door handle to open / close it.
  OBR.contextMenu.create({
    id: 'com.geezsheets/dd2vtt',
    icons: [{ icon: page('icon.svg'), label: 'Walls from dd2vtt', filter: { roles: ['GM'], max: 1, every: [{ key: 'layer', value: 'MAP' }, { key: 'type', value: 'IMAGE' }] } }],
    onClick: (c) => OBR.modal.open({ id: 'com.geezsheets/import', url: page('import.html?modal&item=' + encodeURIComponent(c.items[0].id)), width: 460, height: 520 }),
  });
  OBR.contextMenu.create({
    id: 'com.geezsheets/door',
    icons: [{ icon: page('icon.svg'), label: 'Open / close door', filter: { roles: ['GM'], every: [{ key: ['metadata', DOOR, 'wall'], value: undefined, operator: '!=' }] } }],
    async onClick(c) {
      const flip = new Map(c.items.map((h) => [h.metadata[DOOR].wall, !h.metadata[DOOR].closed]));
      await OBR.scene.items.updateItems([...flip.keys()], (d) => { for (const w of d) { w.blocking = flip.get(w.id); w.metadata[DOOR] = { closed: w.blocking }; } });
      await OBR.scene.items.updateItems(c.items.map((h) => h.id), (d) => { for (const h of d) {
        const closed = flip.get(h.metadata[DOOR].wall);
        h.metadata[DOOR] = { ...h.metadata[DOOR], closed }; h.style.fillColor = closed ? '#dc2626' : '#16a34a';
      } });
    },
  });
  // "New scene" uploads wait in this browser until the GM opens the scene; then the walls go on the uploaded picture.
  let placing = false;
  async function placePending() {
    const pend = loadPending();
    if (role !== 'GM' || placing || !Object.keys(pend).length || !(await OBR.scene.isReady())) return;
    placing = true;
    try {
      const free = await OBR.scene.items.getItems((i) => i.type === 'IMAGE' && i.layer === 'MAP' && !i.metadata[MAPKEY]);
      for (const [name, map] of Object.entries(pend)) {
        const img = free.find((i) => i.name === name);
        if (!img) continue;
        const items = sceneItems({ buildWall, buildLight, buildShape, buildPath }, img, await OBR.scene.grid.getDpi(), map, map.opts);
        await OBR.scene.items.updateItems([img.id], (d) => { for (const i of d) i.metadata[MAPKEY] = { name }; });
        await OBR.scene.items.addItems(items);
        dropPending(name);
        OBR.notification.show(`${name}: ${[map.opts?.roomFog && (map.rooms || []).length + ' fog rooms', map.opts?.walls !== false && `${map.walls.length} walls, ${map.doors.length} doors, ${map.lights.length} lights`].filter(Boolean).join(', ')} placed`, 'SUCCESS');
      }
    } catch (e) { console.warn('GeezSheets dd2vtt:', e); }
    finally { placing = false; }
  }
  OBR.scene.items.onChange(placePending);

  // Rooms tool (GM): click inside a room to reveal it, click again to fog it. A revealed room is a hidden fog shape.
  const TOOL = 'com.geezsheets/rooms', ROOMS = (i) => i.layer === 'FOG' && i.metadata[ROOM];
  const setRooms = async (pick, visible) => {
    const ids = (await OBR.scene.items.getItems(ROOMS)).filter(pick).map((i) => i.id);
    if (ids.length) await OBR.scene.items.updateItems(ids, (d) => { for (const i of d) i.visible = visible ?? !i.visible; });
  };
  OBR.tool.create({ id: TOOL, icons: [{ icon: page('rooms.svg'), label: 'Rooms: click a room to reveal or fog it', filter: { roles: ['GM'] } }], defaultMode: TOOL + '/reveal' });
  OBR.tool.createMode({
    id: TOOL + '/reveal', icons: [{ icon: page('rooms.svg'), label: 'Reveal / fog a room', filter: { activeTools: [TOOL] } }],
    cursors: [{ cursor: 'pointer' }],
    async onToolClick(_, e) {
      // the smallest room under the pointer (rooms meet along walls, so a click on a wall can touch two)
      const hit = (await OBR.scene.items.getItems(ROOMS)).filter((i) => inRoom(i, e.pointerPosition))
        .sort((a, b) => a.metadata[ROOM].area - b.metadata[ROOM].area)[0];
      if (hit) await setRooms((i) => i.id === hit.id);
      return false;
    },
  });
  OBR.tool.createAction({ id: TOOL + '/all', icons: [{ icon: page('icon.svg'), label: 'Reveal every room', filter: { activeTools: [TOOL] } }], onClick: () => setRooms(() => true, false) });
  OBR.tool.createAction({ id: TOOL + '/none', icons: [{ icon: page('rooms.svg'), label: 'Fog every room', filter: { activeTools: [TOOL] } }], onClick: () => setRooms(() => true, true) });
  OBR.scene.onReadyChange(placePending);
  placePending();
});
</script>
</body>
</html>
