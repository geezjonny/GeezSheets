<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeezSheets sheet</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0f172a; color: #e2e8f0; font: 12px Inter, system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 4px; align-items: center; padding: 4px 6px; border-bottom: 1px solid #334155; user-select: none; }
  #grip { cursor: grab; padding: 3px 4px; font-size: 14px; }
  #grip.drag { cursor: grabbing; color: #f59e0b; }
  select, button { font: inherit; color: inherit; background: #1e293b; border: 1px solid #475569; border-radius: 6px; padding: 2px 6px; }
  select { flex: 1; min-width: 0; }
  button:hover { border-color: #f59e0b; }
  #note { padding: 10px; color: #94a3b8; }
  #note:empty { display: none; }
  iframe { flex: 1; width: 100%; border: 0; }
  body.min iframe, body.min #note { display: none; }
</style>
</head>
<body>
<header>
  <div id="grip" title="Drag to move">⠿</div>
  <select id="pick" aria-label="Character"><option value="">Loading…</option></select>
  <button id="full" title="Switch between the quick card and the full sheet">Full</button>
  <button id="min" title="Minimise">–</button>
  <button id="close" title="Close">×</button>
</header>
<div id="note"></div>
<iframe id="sheet" title="Character sheet" hidden></iframe>
<script type="module">
import { OBR, FLOAT, FLOAT_ON, FLOAT_POS, FLOAT_CHAR, FLOAT_H, esc, page, characters, sheetUrl, openFloat } from './geez.js';
const $ = (id) => document.getElementById(id);
const get = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// A character sheet in a window that stays on the board.
OBR.onReady(async () => {
  const role = await OBR.player.getRole(), name = await OBR.player.getName();
  const mine = get(`geez.obr.${OBR.room.id}.${name}`, '');   // a player's own pick from the main popover
  const show = (char) => {
    $('note').textContent = char ? '' : 'Pick a character.';
    $('sheet').hidden = !char;
    const full = get('geez.obr.float.full', '') === '1';
    $('full').textContent = full ? 'Quick' : 'Full';
    if (char) { const url = full ? sheetUrl(char, role, mine) : page('quick.html?char=' + encodeURIComponent(char)); if ($('sheet').src !== url) $('sheet').src = url; }
  };
  $('full').onclick = () => { put('geez.obr.float.full', get('geez.obr.float.full', '') === '1' ? '' : '1'); show($('pick').value); };
  let list = [];
  try { list = await characters(); } catch (e) { $('note').textContent = 'Could not load characters: ' + e.message; }
  $('pick').innerHTML = '<option value="">Choose…</option>' + list.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  $('pick').value = get(FLOAT_CHAR, '') || mine;
  show($('pick').value);
  $('pick').onchange = () => { put(FLOAT_CHAR, $('pick').value); show($('pick').value); };

  const min = (on) => {
    document.body.classList.toggle('min', on); put('geez.obr.float.min', on ? '1' : '');
    OBR.popover.setHeight(FLOAT, on ? Math.ceil(document.querySelector('header').offsetHeight) : FLOAT_H);
  };
  if (get('geez.obr.float.min', '') === '1') min(true);
  $('min').onclick = () => min(!document.body.classList.contains('min'));
  $('close').onclick = () => { put(FLOAT_ON, '0'); OBR.popover.close(FLOAT); };

  // Drag the grip: Owlbear can't move a popover live, so it reopens at the drop spot.
  // shortcut: moves on release only (no live follow); upgrade if Owlbear adds a move API.
  let start = null;
  $('grip').onpointerdown = (e) => { start = { x: e.screenX, y: e.screenY }; $('grip').setPointerCapture(e.pointerId); $('grip').classList.add('drag'); };
  $('grip').onpointerup = (e) => {
    if (!start) return;
    $('grip').classList.remove('drag');
    const dx = e.screenX - start.x, dy = e.screenY - start.y; start = null;
    if (Math.abs(dx) + Math.abs(dy) < 4) return;
    let pos = { left: 90, top: 90 };
    try { pos = JSON.parse(get(FLOAT_POS, '')) || pos; } catch {}
    openFloat({ left: Math.max(0, Math.round(pos.left + dx)), top: Math.max(0, Math.round(pos.top + dy)) });
  };
  $('grip').onpointercancel = () => { start = null; $('grip').classList.remove('drag'); };
});
</script>
</body>
</html>
