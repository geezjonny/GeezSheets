<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeezSheets quick card</title>
<style>
  :root { color-scheme: dark; --dim: #94a3b8; --line: #334155; }
  html, body { margin: 0; background: #0f172a; color: #e2e8f0; font: 12px/1.45 Inter, system-ui, sans-serif; }
  main { padding: 8px 10px 14px; }
  h1 { font-size: 15px; margin: 0; }
  .sub, .dim { color: var(--dim); }
  h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 10px 0 3px; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .row b { font-weight: 600; }
  .abil { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; text-align: center; }
  .abil div { background: #1e293b; border-radius: 5px; padding: 2px 0; }
  .abil small { display: block; color: var(--dim); font-size: 10px; }
  .prof { color: #f59e0b; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 1px 4px 1px 0; vertical-align: top; }
  td.n { white-space: nowrap; text-align: right; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 99px; background: #475569; margin: 2px 3px 0 0; }
  .tag.conc { background: #6d28d9; } .tag.down { background: #7f1d1d; }
</style>
</head>
<body>
<main id="card">Loading…</main>
<script type="module">
import { ENTITIES, characters, stream, esc } from './geez.js';
const $ = (id) => document.getElementById(id);
const char = new URLSearchParams(location.search).get('char');
const sign = (n) => (Number(n) >= 0 ? '+' : '') + Number(n || 0);
const mod = (s) => Math.floor((Number(s || 10) - 10) / 2);
const list = (v) => Array.isArray(v) ? v : Object.entries(v || {}).filter(([k]) => k !== '%EMPTY').map(([, x]) => x);
const ORD = ['Cantrips', '1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th'];

// Read-only quick reference: the numbers you look up at the table, nothing else.
function card(d) {
  const c = d.combat || {}, st = d.stats || {}, sv = d.saves || {}, profSaves = list(sv.proficient), sp = d.spellcasting || {};
  const ds = c.death_saves || {}, hp = Number(c.hp_current) || 0;
  const tags = [
    hp <= 0 && c.hp_max ? `<span class="tag down">Down · ${Number(ds.success ?? c.death_save_successes) || 0}✓ ${Number(ds.fail ?? c.death_save_failures) || 0}✗</span>` : '',
    c.concentration?.active ? `<span class="tag conc">◎ ${esc(c.concentration.spell || 'Concentrating')}</span>` : '',
    c.exhaustion ? `<span class="tag">Exhaustion ${esc(c.exhaustion)}</span>` : '',
    ...list(c.conditions).filter((x) => typeof x === 'string').map((x) => `<span class="tag">${esc(x)}</span>`),
  ].join('');
  const abil = ['str', 'dex', 'con', 'int', 'wis', 'cha'].map((k) =>
    `<div><small>${k.toUpperCase()}</small><b>${sign(mod(st[k]))}</b> <span class="dim">${esc(st[k] ?? '')}</span>
     <small class="${profSaves.includes(k) ? 'prof' : ''}">save ${sign(sv[k] ?? mod(st[k]))}</small></div>`).join('');
  const skills = Object.entries(d.skills || {}).filter(([, s]) => s?.proficient || s?.expertise)
    .map(([k, s]) => `${esc(k.replace(/_/g, ' '))} ${sign(s.bonus)}${s.expertise ? '★' : ''}`).join(' · ');
  const attacks = list(d.attacks).map((a) => `<tr><td>${esc(a.name)}</td><td class="n">${esc(a.to_hit || '')}</td><td>${esc(a.damage || '')} ${esc(a.damage_type || '')}</td></tr>`).join('');
  const slots = list(sp.slots).map((n, l) => [l, Number(n) || 0]).filter(([l, n]) => l > 0 && n > 0)
    .map(([l, n]) => `${ORD[l]} ${n - (Number(sp.slots_used?.[l]) || 0)}/${n}`).join(' · ');
  const byLvl = {};
  for (const s of list(sp.spells)) (byLvl[Number(s.level) || 0] ||= []).push(esc(s.name) + (s.concentration ? ' <span class="dim">C</span>' : ''));
  const spells = Object.keys(byLvl).sort((a, b) => a - b).map((l) => `<div><span class="dim">${ORD[l]}:</span> ${byLvl[l].join(', ')}</div>`).join('');
  const feats = Object.values(d.abilities || {}).filter(Boolean)
    .map((a) => `${esc(a.label || '')}${Number(a.max) > 1 || a.recharge !== 'none' && a.max ? ` <span class="dim">${esc(a.current ?? '')}/${esc(a.max)}</span>` : ''}`).join(' · ');
  const se = d.senses || {};
  const senses = ['darkvision', 'blindsight', 'tremorsense', 'truesight'].filter((k) => Number(se[k]) > 0).map((k) => `${k} ${se[k]} ft`).join(' · ');
  return `
    <h1>${esc(d.name || '')}</h1>
    <div class="sub">Lv ${esc(d.level ?? '')} ${esc(d.class || '')}${d.subclass ? ` (${esc(d.subclass)})` : ''} · ${esc(d.species || '')}</div>
    <div class="row" style="margin-top:6px">
      <span>HP <b>${hp}/${esc(c.hp_max ?? '')}</b>${Number(c.temp_hp) ? ` +${esc(c.temp_hp)}` : ''}</span>
      <span>AC <b>${esc(c.ac ?? '')}</b></span><span>Speed <b>${esc(c.speed ?? '')}</b></span>
      <span>Init <b>${sign(c.initiative_bonus)}</b></span><span>Prof <b>${sign(d.proficiency_bonus ?? c.proficiency_bonus)}</b></span>
      <span>Passive Perc <b>${esc(se.passive_perception ?? '')}</b></span>
    </div>
    ${tags ? `<div>${tags}</div>` : ''}
    <h2>Abilities</h2><div class="abil">${abil}</div>
    ${skills ? `<h2>Skills</h2><div>${skills}</div>` : ''}
    ${attacks ? `<h2>Attacks</h2><table>${attacks}</table>` : ''}
    ${spells ? `<h2>Spells</h2><div class="dim">DC ${esc(sp.spell_save_dc ?? '')} · Attack ${sign(sp.spell_attack_bonus)}${slots ? ' · ' + slots : ''}</div>${spells}` : ''}
    ${feats ? `<h2>Features</h2><div>${feats}</div>` : ''}
    ${senses ? `<h2>Senses</h2><div>${senses}</div>` : ''}`;
}

(async () => {
  const pc = (await characters()).find((c) => c.id === char);
  if (!pc) { $('card').textContent = 'Character not found.'; return; }
  // live: only this character's record is streamed
  stream(ENTITIES.replace('.json', `/${encodeURIComponent(pc.eid)}/data.json`), (d) => { $('card').innerHTML = card({ ...d, name: d.name || pc.name }); });
})();
</script>
</body>
</html>
