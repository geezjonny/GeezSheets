<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GeezVTT 3D</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #05060a; --panel: rgba(2, 6, 23, 0.9); --line: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #6366f1; --amber: #f59e0b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  button { background: #1e293b; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font: inherit; cursor: pointer; }
  button:hover { background: #273449; }
  button.on { border-color: var(--amber); color: #fde68a; }
  #controls { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; z-index: 2; }
  #where { position: fixed; left: 12px; top: max(12px, env(safe-area-inset-top)); padding: 6px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); z-index: 2; pointer-events: none; }
  #where:empty, #msg:empty { display: none; }
  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(420px, calc(100% - 32px)); padding: 14px 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); text-align: center; color: var(--muted); z-index: 2; }
  #picker { position: fixed; inset: 0; z-index: 5; background: rgba(2, 6, 23, 0.96); overflow: auto; padding: 32px 16px; }
  #picker[hidden] { display: none; }
  #picker h1 { margin: 0 auto 4px; max-width: 720px; font-size: 22px; }
  #picker p { margin: 0 auto 20px; max-width: 720px; color: var(--muted); }
  #chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; max-width: 720px; margin: 0 auto; }
  .char { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 10px; border-radius: 12px; text-align: center; }
  .char img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 3px solid #10b981; background: #312e81; }
  .char b { font-size: 15px; }
  .char span { font-size: 12px; color: var(--muted); }
  .char.off img { border-color: var(--line); filter: grayscale(.6); }
</style>
<script src="js/geez-config.js"></script>
<script src="js/swatches.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-database-compat.js"></script>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="where"></div>
<div id="msg">Connecting…</div>
<div id="controls">
  <button id="motionBtn" title="Look around by moving your phone">Enable motion</button>
  <button id="recenterBtn" title="Make the way you are facing forward">Recenter</button>
  <button id="fullBtn">Fullscreen</button>
  <button id="charBtn">Character</button>
</div>
<div id="picker" hidden>
  <h1>Who are you?</h1>
  <p>Pick your character. You'll see the battle map through their eyes, wherever the DM has placed them in GeezVTT.</p>
  <div id="chars"></div>
</div>

<script type="module">
// =====================================================================
//  GeezVTT 3D: see the battle map through your character's eyes.
//  GeezVTT (index.html) is the source of truth; this page only reads it from Firebase:
//    geezvtt/live/_dmCampaign            which campaign the DM is running
//    geezvtt/campaign/things             characters and battle maps (traits.dd2vtt)
//    geezvtt/campaign/battles            token placements, doors, wall edits, dark/bright
//    geezvtt/live/<campaign>/tokens      token moves during play
//    geezvtt/live/<campaign>/dmAt        where the DM is; "Pull everyone here" brings everyone to that map
//    characters/pcs                      character sheets (darkvision)
//  Sight follows GeezVTT's player vision: walls and closed doors hide creatures, and on a dark
//  map (battles[id].light = 'dark') you only see what a light or your darkvision reaches.
//  Walls and doors the DM drew use their swatch (js/swatches.js).
//  Pick your character and you stand on their token on whichever battle map it's on.
//  1 world unit = 1 grid square. Map x -> world X, map y -> world Z.
// =====================================================================
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const FB_ROOT = 'geezvtt', CHAR_KEY = 'geezvtt.3d.char';
const WALL_H = 2, WALL_T = 0.14, DOOR_H = 1.7, DOOR_T = 0.1, EYE = 1.0, MAX_LIGHTS = 12;
const $ = (id) => document.getElementById(id);
const say = (t) => { $('msg').textContent = t || ''; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tokenSize = (t) => { const v = parseFloat(t?.traits?.size); return v > 0 ? v : 1; };

// ---------------------------------------------------------------------
//  Firebase, read-only
// ---------------------------------------------------------------------
firebase.initializeApp(window.GEEZ_FIREBASE_CONFIG);
const fb = firebase.database();
function watch(path, cb) {
  const ref = fb.ref(FB_ROOT + '/' + path), h = (snap) => cb(snap.val());
  ref.on('value', h, (err) => say('Firebase read failed: ' + err.message));
  return () => ref.off('value', h);
}

// ---------------------------------------------------------------------
//  Battle map files (same folders as GeezVTT)
// ---------------------------------------------------------------------
async function fileFromFolder(name) {
  for (const f of ['battlemap/', 'maps/', '']) {
    try { const r = await fetch(f + encodeURIComponent(name)); if (r.ok) return await r.blob(); } catch { /* next */ }
  }
  return null;
}
const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
// dd2vtt -> { img, gw, gh, walls: [[{x,y}]], doors: [[a,b]], lights } in grid units
async function parseDd2vtt(text) {
  const j = JSON.parse(text);
  const ppg = j.resolution?.pixels_per_grid || 70, o = j.resolution?.map_origin || { x: 0, y: 0 };
  const P = (p) => ({ x: p.x - o.x, y: p.y - o.y });
  const s = String(j.image || '');
  const img = await loadImg((s.startsWith('/9j/') ? 'data:image/jpeg;base64,' : s.startsWith('UklGR') ? 'data:image/webp;base64,' : 'data:image/png;base64,') + s);
  return {
    img, gw: img.width / ppg, gh: img.height / ppg,
    walls: (j.line_of_sight || []).concat(j.objects_line_of_sight || []).filter(l => Array.isArray(l) && l.length > 1).map(l => l.map(P)),
    doors: (j.portals || []).map(pt => (pt.bounds || []).map(P)),
    lights: (j.lights || []).map(l => ({ ...P(l.position || { x: 0, y: 0 }), range: Number(l.range) || 0, intensity: Number(l.intensity) || 1, color: l.color || 'ffffffff' }))
  };
}
// The battle's walls, doors and lights after the DM's edits (mirrors sceneGeometry / sceneLights in index.html)
function geometryOf(map, b) {
  const ed = b?.edits || {}, hideW = ed.hideWalls || {}, hideD = ed.hideDoors || {}, hideL = ed.hideLights || {}, state = b?.doors || {};
  const walls = [];
  map.walls.forEach((line, li) => { for (let i = 0; i < line.length - 1; i++) if (!hideW[`${li}_${i}`]) walls.push({ x1: line[i].x, y1: line[i].y, x2: line[i + 1].x, y2: line[i + 1].y }); });
  Object.values(ed.addWalls || {}).forEach(w => walls.push(w));
  const doors = [];
  map.doors.forEach(([a, c], i) => { if (a && c && !hideD[i]) doors.push({ key: String(i), x1: a.x, y1: a.y, x2: c.x, y2: c.y, open: state[i] === 'open' }); });
  Object.entries(ed.addDoors || {}).forEach(([key, d]) => doors.push({ key, ...d, open: state[key] === 'open' }));
  const lights = map.lights.filter((_, i) => !hideL[i]);
  Object.values(ed.addLights || {}).forEach(l => lights.push({ intensity: 1.5, color: 'ffffe0b0', ...l, range: Number(l.range) || 4 }));
  return { walls, doors, lights: lights.filter(l => l.range > 0) };
}

// ---------------------------------------------------------------------
//  three.js scene (no shadows: meant for phones)
// ---------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
$('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 3000);
const hemi = new THREE.HemisphereLight(0xf4f1ff, 0x3a3540, Math.PI * 0.6);
const sun = new THREE.DirectionalLight(0xfff4e0, Math.PI * 0.55);
sun.position.set(-20, 40, 25);
scene.add(hemi, sun);
// A fixed pool of point lights (a changing light count would recompile every shader);
// on a dark map the map lights nearest you get them.
const pool = Array.from({ length: MAX_LIGHTS }, () => { const l = new THREE.PointLight(0xffffff, 0, 1, 1.4); l.userData = { base: 0, phase: Math.random() * 10 }; scene.add(l); return l; });
// Your darkvision: a cool, dim light that travels with you on dark maps
const dvLight = new THREE.PointLight(0xa8b0c4, 0, 1, 1);
scene.add(dvLight);
const world = new THREE.Group(); scene.add(world);
const wallMat = new THREE.MeshStandardMaterial({ color: 0x4b4752, roughness: 0.95 });
const doorMat = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.8 });
let wallsGroup = null, doorsGroup = null, tokensGroup = null, wallsKey = null;
// Swatch materials: walls/doors the DM drew carry a swatch id (mat); dd2vtt walls use the plain material
const SWATCHES = window.GEEZ_SWATCHES || { wall: [], door: [] };
const swatchMats = new Map();
function swatchMaterial(kind, id) {
  const sw = id && SWATCHES[kind].find(x => x.id === id);
  if (!sw) return kind === 'door' ? doorMat : wallMat;
  const k = kind + ':' + sw.id;
  if (!swatchMats.has(k)) {
    const m = new THREE.MeshStandardMaterial({ color: sw.texture ? 0xffffff : sw.color, roughness: 0.9 });
    if (sw.texture) new THREE.TextureLoader().load(sw.texture, (t) => { t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; m.map = t; m.needsUpdate = true; }, undefined, () => { m.color.set(sw.color); });
    swatchMats.set(k, m);
  }
  return swatchMats.get(k);
}
// A box whose UVs are scaled to its size, so a texture tiles once per grid square instead of stretching
function tiledBox(w, h, d) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;
  [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]].forEach(([u, v], face) => { for (let i = face * 4; i < face * 4 + 4; i++) uv.setXY(i, uv.getX(i) * u, uv.getY(i) * v); });
  return g;
}

const ui = { camp: null, things: {}, battles: {}, sheets: {}, moves: {}, dmAt: null, pull: null, spot: new THREE.Vector3(), charId: '', battleId: null, map: null, geo: null, dark: false, yaw: 0, pitch: 0, heading: 0, sensor: null, motion: false };
const battle = () => ui.battles[ui.battleId] || {};

function clearWorld() {
  world.traverse(o => { o.geometry?.dispose(); if (o.userData.ownsMap) o.material.map?.dispose(); });
  world.clear();
  wallsGroup = doorsGroup = tokensGroup = wallsKey = null;
  tokenObjs.clear();
}
function buildFloor(map) {
  const maxTex = Math.min(renderer.capabilities.maxTextureSize, 4096);   // phones choke on bigger textures
  let src = map.img;
  if (Math.max(src.width, src.height) > maxTex) {
    const k = maxTex / Math.max(src.width, src.height), c = document.createElement('canvas');
    c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    src = c;
  }
  const tex = new THREE.Texture(src);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); tex.needsUpdate = true;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(map.gw, map.gh), new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
  floor.userData.ownsMap = true;
  floor.rotation.x = -Math.PI / 2; floor.position.set(map.gw / 2, 0, map.gh / 2);
  world.add(floor);
}
// A box standing on the floor along a segment, already placed in the world
function segmentGeometry(s, h, t, y0 = 0) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1, len = Math.hypot(dx, dy);
  if (len < 1e-3) return null;
  const g = tiledBox(len + t * 0.5, h, t);
  g.applyMatrix4(new THREE.Matrix4().makeRotationY(-Math.atan2(dy, dx)).setPosition((s.x1 + s.x2) / 2, y0 + h / 2, (s.y1 + s.y2) / 2));
  return g;
}
function buildWalls() {
  if (wallsGroup) { world.remove(wallsGroup); wallsGroup.traverse(o => o.geometry?.dispose()); }
  if (doorsGroup) { world.remove(doorsGroup); doorsGroup.traverse(o => o.geometry?.dispose()); }
  // Walls and lintels merged into one mesh per material: a few draw calls even on big maps
  const byMat = new Map(), add = (mat, g) => { if (!g) return; if (!byMat.has(mat)) byMat.set(mat, []); byMat.get(mat).push(g); };
  ui.geo.walls.forEach(w => add(w.mat || '', segmentGeometry(w, WALL_H, WALL_T)));
  doorsGroup = new THREE.Group();
  for (const d of ui.geo.doors) {
    const dx = d.x2 - d.x1, dy = d.y2 - d.y1, len = Math.hypot(dx, dy);
    if (len < 1e-3) continue;
    add('', segmentGeometry(d, WALL_H - DOOR_H, WALL_T, DOOR_H));
    // hinge at the first end: the door swings about it
    const pivot = new THREE.Group();
    pivot.position.set(d.x1, 0, d.y1);
    const leaf = new THREE.Mesh(new THREE.BoxGeometry(len, DOOR_H, DOOR_T), swatchMaterial('door', d.mat));
    leaf.position.set(len / 2, DOOR_H / 2, 0);
    pivot.add(leaf);
    pivot.userData = { key: d.key, closedAngle: -Math.atan2(dy, dx) };
    doorsGroup.add(pivot);
  }
  wallsGroup = new THREE.Group();
  for (const [mat, parts] of byMat) { wallsGroup.add(new THREE.Mesh(mergeGeometries(parts), swatchMaterial('wall', mat))); parts.forEach(g => g.dispose()); }
  world.add(wallsGroup, doorsGroup);
  doorTargets(true);
}
function doorTargets(snap) {
  doorsGroup?.children.forEach(p => {
    const d = ui.geo.doors.find(x => x.key === p.userData.key);
    p.userData.target = p.userData.closedAngle + (d?.open ? -Math.PI * 0.45 : 0);
    if (snap) p.rotation.y = p.userData.target;
  });
}

// ---------------------------------------------------------------------
//  Tokens: standees with the character's portrait, on a coloured base
// ---------------------------------------------------------------------
const portraitCache = new Map();
function initials(name) { return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?'; }
// an avatar URL on the card wins; otherwise tokens/<Name>.png (or lower-case / file-safe versions)
function avatarTries(t) {
  const n = String(t.name || '').trim();
  return [t.traits?.avatar, ...new Set([n, n.toLowerCase(), n.toLowerCase().replace(/[^a-z0-9]+/g, '_'), n.toLowerCase().replace(/[^a-z0-9]+/g, '-')].filter(Boolean).map(v => 'tokens/' + encodeURIComponent(v) + '.png'))].filter(Boolean);
}
function portraitTexture(t, ring) {
  const key = (t.traits?.avatar || '') + '|' + t.name + '|' + ring;
  if (portraitCache.has(key)) return portraitCache.get(key);
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const paint = (img) => {
    x.clearRect(0, 0, 256, 256);
    x.save(); x.beginPath(); x.arc(128, 128, 118, 0, Math.PI * 2); x.closePath(); x.clip();
    if (img) { const s = Math.max(256 / img.width, 256 / img.height); x.drawImage(img, 128 - img.width * s / 2, 128 - img.height * s / 2, img.width * s, img.height * s); }
    else { x.fillStyle = '#312e81'; x.fillRect(0, 0, 256, 256); x.fillStyle = '#e0e7ff'; x.font = 'bold 96px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(initials(t.name), 128, 136); }
    x.restore();
    x.lineWidth = 14; x.strokeStyle = ring; x.beginPath(); x.arc(128, 128, 118, 0, Math.PI * 2); x.stroke();
    tex.needsUpdate = true;
  };
  portraitCache.set(key, tex);
  paint(null);
  const tries = avatarTries(t);
  const next = (i) => { if (i < tries.length) loadImg(tries[i]).then(paint, () => next(i + 1)); };
  next(0);
  return tex;
}
function labelSprite(text) {
  const c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = 'bold 40px system-ui, sans-serif';
  const w = Math.ceil(x.measureText(text).width) + 32;
  c.width = w; c.height = 60;
  x.font = 'bold 40px system-ui, sans-serif';
  x.fillStyle = 'rgba(2,6,23,0.8)'; x.beginPath(); x.roundRect(0, 0, w, 60, 16); x.fill();
  x.fillStyle = '#f1f5f9'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, 32);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  s.userData.ownsMap = true;
  s.scale.set(0.4 * w / 60, 0.4, 1);
  return s;
}
const tokenObjs = new Map();   // thing id -> { group, standee, target }
function syncTokens() {
  if (!ui.map) return;
  if (!tokensGroup) { tokensGroup = new THREE.Group(); world.add(tokensGroup); }
  const seen = new Set();
  for (const [id, sp] of Object.entries(battle().tokens || {})) {
    const t = ui.things[id];
    if (!t || sp?.hidden) continue;   // the DM's hidden tokens never show here
    const pos = ui.moves[id] || sp;
    seen.add(id);
    let o = tokenObjs.get(id), fresh = false;
    if (!o) {
      const size = tokenSize(t), pc = !!t.traits?.pc, ring = pc ? '#10b981' : '#ef4444';
      const group = new THREE.Group(), r = 0.42 * size, h = 1.1 * size;
      const base = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.04, 0.08, 32), new THREE.MeshStandardMaterial({ color: pc ? 0x065f46 : 0x7f1d1d, roughness: 0.5, metalness: 0.2 }));
      base.position.y = 0.04;
      const standee = new THREE.Mesh(new THREE.PlaneGeometry(h, h), new THREE.MeshStandardMaterial({ map: portraitTexture(t, ring), transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.7 }));
      standee.position.y = 0.08 + h / 2;
      group.add(base, standee);
      if (!sp.hideName) { const label = labelSprite(t.name || '?'); label.position.y = 0.08 + h + 0.28; group.add(label); }
      tokensGroup.add(group);
      o = { group, standee, target: new THREE.Vector3() };
      tokenObjs.set(id, o); fresh = true;
    }
    const before = o.target.clone();
    o.target.set(pos.x * ui.map.gw, 0, pos.y * ui.map.gh);
    if (fresh) o.group.position.copy(o.target);
    // you turn to face the way the DM moved you
    if (id === ui.charId && !fresh && before.distanceTo(o.target) > 0.2) ui.heading = Math.atan2(-(o.target.x - before.x), -(o.target.z - before.z));
  }
  for (const [id, o] of tokenObjs) if (!seen.has(id)) { tokensGroup.remove(o.group); o.group.traverse(x => x.geometry?.dispose()); tokenObjs.delete(id); }
  updateSight();
  const placed = tokenObjs.has(ui.charId);
  if (placed && ui.placed === false) faceCenter();
  ui.placed = placed;
  const t = ui.things[ui.charId], bt = ui.things[ui.battleId];
  if (t && bt) $('where').textContent = `${t.name} · ${bt.name}${placed ? '' : ' · waiting for the DM to place you'}`;
}

// ---------------------------------------------------------------------
//  Sight (mirrors partyVision / seenAt in index.html): a creature is visible when no wall or
//  closed door is in the way, and on a dark map when a light or your darkvision also reaches it.
//  Other PCs are always shown, as in GeezVTT.
// ---------------------------------------------------------------------
// The character sheet behind a PC token (characters/pcs), matched like GeezVTT's sheetFor
function sheetOf(t) {
  const cid = t?.traits?.charId;
  if (cid && ui.sheets[cid]) return ui.sheets[cid];
  const name = String(t?.name || '').trim().toLowerCase();
  return Object.values(ui.sheets).find(c => String(c?.name || '').trim().toLowerCase() === name) || null;
}
// Darkvision range in grid squares (5 ft each)
function darkvision() { const t = ui.things[ui.charId], ft = parseFloat(sheetOf(t)?.senses?.darkvision ?? t?.traits?.darkvision); return ft > 0 ? ft / 5 : 0; }
// Does segment a-b cross segment c-d (touching an end of a-b doesn't count)?
function crosses(ax, ay, bx, by, cx, cy, dx, dy) {
  const rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy, den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-9) return false;
  const t = ((cx - ax) * sy - (cy - ay) * sx) / den, u = ((cx - ax) * ry - (cy - ay) * rx) / den;
  return t > 1e-4 && t < 1 - 1e-4 && u >= 0 && u <= 1;
}
const blocked = (ax, ay, bx, by) => ui.geo.walls.some(w => crosses(ax, ay, bx, by, w.x1, w.y1, w.x2, w.y2)) || ui.geo.doors.some(d => !d.open && crosses(ax, ay, bx, by, d.x1, d.y1, d.x2, d.y2));
function seen(x, y) {
  if (battle().vision === false || !ui.geo) return true;
  const ex = camera.position.x, ey = camera.position.z;
  if (blocked(ex, ey, x, y)) return false;
  if (!ui.dark) return true;
  const dv = darkvision();
  if (dv && Math.hypot(x - ex, y - ey) <= dv) return true;
  return ui.geo.lights.some(l => Math.hypot(x - l.x, y - l.y) <= l.range && !blocked(l.x, l.y, x, y));
}
let sightAt = 0;
function updateSight() {
  sightAt = performance.now();
  for (const [id, o] of tokenObjs) {
    if (id === ui.charId) { o.group.visible = false; continue; }   // your own standee would block your eyes
    o.group.visible = !!ui.things[id]?.traits?.pc || seen(o.group.position.x, o.group.position.z);
  }
}

// ---------------------------------------------------------------------
//  Lighting: bright, or a dark map (battles[id].light = 'dark') lit only by its own lights
// ---------------------------------------------------------------------
const argb = (hex) => { const h = String(hex || 'ffffffff').replace('#', '').padStart(8, 'f'); return new THREE.Color(`#${h.slice(2, 8)}`); };
const lightFrom = new THREE.Vector3(Infinity, 0, 0);
function applyLighting() {
  ui.dark = battle().light === 'dark';
  hemi.intensity = ui.dark ? Math.PI * 0.06 : Math.PI * 0.6;
  sun.intensity = ui.dark ? 0 : Math.PI * 0.55;
  scene.background.set(ui.dark ? 0x020205 : 0x05060a);
  scene.fog = ui.dark ? new THREE.FogExp2(0x020205, 0.06) : null;
  const dv = darkvision();
  dvLight.intensity = ui.dark && dv ? Math.PI * 1.2 : 0;
  dvLight.distance = dv || 1;
  assignLights();
}
function assignLights() {
  lightFrom.copy(camera.position);
  const lights = ui.dark && ui.geo ? ui.geo.lights : [];
  const sorted = lights.map(l => ({ l, d: Math.hypot(l.x - camera.position.x, l.y - camera.position.z) })).sort((a, b) => a.d - b.d).slice(0, MAX_LIGHTS);
  pool.forEach((p, i) => {
    const s = sorted[i];
    if (!s) { p.intensity = 0; p.userData.base = 0; return; }
    p.color.copy(argb(s.l.color));
    p.position.set(s.l.x, 0.9, s.l.y);
    p.distance = s.l.range * 1.8;
    p.userData.base = Math.PI * 1.5 * Math.min(3, s.l.intensity);
  });
}

// ---------------------------------------------------------------------
//  Your eyes: stand on your token; drag or move your phone to look around
// ---------------------------------------------------------------------
const yAxis = new THREE.Vector3(0, 1, 0), turn = new THREE.Quaternion();
function updateEyes() {
  if (!ui.map) return;
  // on your token, or in the middle of the map until the DM places you
  const o = tokenObjs.get(ui.charId), at = o ? o.group.position : ui.spot;
  camera.position.set(at.x, EYE * tokenSize(ui.things[ui.charId]), at.z);
  if (ui.sensor) { camera.quaternion.copy(ui.sensor); camera.quaternion.premultiply(turn.setFromAxisAngle(yAxis, ui.heading + ui.yaw)); }
  else camera.rotation.set(ui.pitch, ui.heading + ui.yaw, 0, 'YXZ');
}
// Start out facing the middle of the map
function faceCenter() {
  const o = tokenObjs.get(ui.charId), m = ui.map;
  if (!m) return;
  ui.heading = o ? Math.atan2(-(m.gw / 2 - o.target.x), -(m.gh / 2 - o.target.z)) : 0;
  recenter();
}
{
  const el = renderer.domElement; let prev = null;
  el.addEventListener('pointerdown', (e) => { prev = { x: e.clientX, y: e.clientY }; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', (e) => {
    if (!prev) return;
    ui.yaw -= (e.clientX - prev.x) * 0.006;
    if (!ui.sensor) ui.pitch = THREE.MathUtils.clamp(ui.pitch - (e.clientY - prev.y) * 0.006, -1.45, 1.45);
    prev = { x: e.clientX, y: e.clientY };
  });
  const end = () => { prev = null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
// Phone motion: the device's orientation becomes the camera's, turned so "forward" is your facing
function onOrientation(e) {
  if (e.alpha === null || e.beta === null || e.gamma === null) return;
  const r = THREE.MathUtils.degToRad;
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(r(e.beta), r(e.alpha), -r(e.gamma), 'YXZ'));
  q.multiply(new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2));
  q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -r(screen.orientation?.angle ?? window.orientation ?? 0)));
  const first = !ui.sensor;
  ui.sensor = q;
  if (first) recenter();
}
function recenter() {
  ui.pitch = 0;
  if (ui.sensor) { const f = new THREE.Vector3(0, 0, -1).applyQuaternion(ui.sensor); ui.yaw = Math.atan2(f.x, -f.z); }
  else ui.yaw = 0;
}
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

$('recenterBtn').onclick = recenter;
$('charBtn').onclick = () => showPicker();
$('fullBtn').onclick = async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); else alert('Fullscreen is unavailable here. On iPhone, use Share → Add to Home Screen.'); }
  catch { /* blocked */ }
};
$('motionBtn').onclick = async () => {
  if (ui.motion) { removeEventListener('deviceorientation', onOrientation); ui.motion = false; ui.sensor = null; recenter(); $('motionBtn').textContent = 'Enable motion'; $('motionBtn').classList.remove('on'); return; }
  if (!isSecureContext) { alert('Motion needs HTTPS: open this page from the GitHub Pages address.'); return; }
  if (!window.DeviceOrientationEvent) { alert('No motion sensors here. Drag to look around.'); return; }
  try { if (typeof DeviceOrientationEvent.requestPermission === 'function' && await DeviceOrientationEvent.requestPermission() !== 'granted') { alert('Motion permission was denied. You can still drag to look.'); return; } }
  catch { alert('Motion permission failed. You can still drag to look.'); return; }
  addEventListener('deviceorientation', onOrientation);
  ui.motion = true; $('motionBtn').textContent = 'Disable motion'; $('motionBtn').classList.add('on');
};

// ---------------------------------------------------------------------
//  Pick your character
// ---------------------------------------------------------------------
const pcs = () => Object.values(ui.things).filter(t => t?.traits?.pc && t.campaign === ui.camp).sort((a, b) => String(a.name).localeCompare(String(b.name)));
// The battle map you're on: the one the DM last pulled everyone to, else the DM's current one
// if your token is there, else any map with your token
function battleOf(charId) {
  if (ui.things[ui.pull?.target]?.traits?.dd2vtt) return ui.pull.target;
  const on = Object.keys(ui.battles).filter(bid => { const sp = ui.battles[bid]?.tokens?.[charId]; return sp && !sp.hidden && ui.things[bid]?.traits?.dd2vtt; });
  return on.includes(ui.dmAt?.target) ? ui.dmAt.target : on[0] || null;
}
function showPicker() {
  const list = pcs();
  $('chars').innerHTML = list.length ? list.map(t => {
    const bid = battleOf(t.id);
    return `<button class="char${bid ? '' : ' off'}" data-id="${esc(t.id)}"><img alt="" data-tries="${esc(JSON.stringify(avatarTries(t)))}"><b>${esc(t.name)}</b><span>${bid ? esc(ui.things[bid].name) : 'Not on a battle map'}</span></button>`;
  }).join('') : '<p>No characters in this campaign yet.</p>';
  $('chars').querySelectorAll('img').forEach(img => { const tries = JSON.parse(img.dataset.tries); let i = 0; img.onerror = () => { if (++i < tries.length) img.src = tries[i]; else img.onerror = null; }; if (tries.length) img.src = tries[0]; });
  $('chars').querySelectorAll('.char').forEach(b => b.onclick = () => pick(b.dataset.id));
  $('picker').hidden = false;
}
function pick(id) {
  ui.charId = id;
  try { localStorage.setItem(CHAR_KEY, id); } catch {}
  $('picker').hidden = true;
  faceCenter();
  follow();
}

// ---------------------------------------------------------------------
//  Follow your token: load its battle map, keep everything in sync with GeezVTT
// ---------------------------------------------------------------------
let loadSeq = 0, movesUnsub = null;
async function follow() {
  if (!ui.charId || !ui.camp || $('picker').hidden === false) return;
  const t = ui.things[ui.charId];
  if (!t) { showPicker(); return; }
  const bid = battleOf(ui.charId);
  if (!bid) {
    clearWorld(); ui.battleId = null; ui.map = null; $('where').textContent = '';
    say(`${t.name} isn't on a battle map yet. You'll drop in as soon as the DM places them.`);
    return;
  }
  if (bid !== ui.battleId) {
    const seq = ++loadSeq, bt = ui.things[bid];
    ui.battleId = bid; ui.map = null; clearWorld();
    movesUnsub?.(); ui.moves = {};
    movesUnsub = watch(`live/${ui.camp}/tokens/${bid}`, (v) => { ui.moves = v || {}; syncTokens(); });
    say(`Loading ${bt.name}…`);
    const blob = await fileFromFolder(bt.traits.dd2vtt);
    if (seq !== loadSeq) return;
    if (!blob) { say(`Can't find ${bt.traits.dd2vtt}. Ask the DM to put it in the battlemap/ folder.`); return; }
    try { ui.map = await parseDd2vtt(await blob.text()); }
    catch (e) { say(`Couldn't read ${bt.traits.dd2vtt}: ${e.message || e}`); return; }
    if (seq !== loadSeq) return;
    buildFloor(ui.map);
    ui.spot.set(ui.map.gw / 2, 0, ui.map.gh / 2); ui.placed = undefined;
    document.title = `${t.name} · ${bt.name}`;
    say('');
    refresh();
    faceCenter();
    return;
  }
  refresh();
}
// Walls, doors, lights and tokens from the current battle data
function refresh() {
  if (!ui.map) return;
  ui.geo = geometryOf(ui.map, battle());
  const key = JSON.stringify(battle().edits || {});
  if (key !== wallsKey) { wallsKey = key; buildWalls(); } else doorTargets(false);
  syncTokens();
  applyLighting();
}

// ---------------------------------------------------------------------
//  Frame loop
// ---------------------------------------------------------------------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), now = performance.now();
  for (const o of tokenObjs.values()) o.group.position.lerp(o.target, 1 - Math.pow(0.0005, dt));
  updateEyes();
  dvLight.position.copy(camera.position);
  if (ui.geo && now - sightAt > 150) updateSight();
  for (const o of tokenObjs.values()) o.standee.rotation.y = Math.atan2(camera.position.x - o.group.position.x, camera.position.z - o.group.position.z);
  doorsGroup?.children.forEach(p => { p.rotation.y += (p.userData.target - p.rotation.y) * (1 - Math.pow(0.002, dt)); });
  if (ui.dark) {
    if (Math.hypot(camera.position.x - lightFrom.x, camera.position.z - lightFrom.z) > 2) assignLights();
    pool.forEach(p => { if (p.userData.base) p.intensity = p.userData.base * (0.92 + 0.08 * Math.sin(now / 130 + p.userData.phase) * Math.sin(now / 370 + p.userData.phase * 2)); });
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------------
//  Start: the campaign the DM is running
// ---------------------------------------------------------------------
let ready = { things: false, battles: false, dmAt: false };
const proceed = () => {
  if (!ready.things || !ready.battles || !ready.dmAt) return;
  say('');
  if (!ui.charId) { let saved = ''; try { saved = localStorage.getItem(CHAR_KEY) || ''; } catch {} if (ui.things[saved]?.traits?.pc && ui.things[saved].campaign === ui.camp) pick(saved); else showPicker(); }
  else if ($('picker').hidden) follow(); else showPicker();
};
let campUnsubs = [];
watch('live/_dmCampaign', (v) => {
  if (!v?.id) { say('No campaign yet. Ask the DM to open GeezVTT.'); return; }
  if (v.id === ui.camp) return;
  campUnsubs.forEach(f => f());
  Object.assign(ui, { camp: v.id, charId: '', battleId: null, map: null, pull: null }); ready = { things: false, battles: false, dmAt: false }; clearWorld();
  campUnsubs = [
    watch('campaign/things', (val) => { ui.things = val || {}; ready.things = true; proceed(); }),
    watch('campaign/battles', (val) => { ui.battles = val || {}; ready.battles = true; proceed(); }),
    (() => { const ref = fb.ref('characters/pcs'), h = (snap) => { ui.sheets = snap.val() || {}; if (ui.map) applyLighting(); }; ref.on('value', h); return () => ref.off('value', h); })(),
    watch(`live/${v.id}/dmAt`, (val) => {
      ui.dmAt = val;
      if (val?.pullAt && val.pullAt > (ui.pull?.at || 0)) ui.pull = { at: val.pullAt, target: val.target };
      ready.dmAt = true; proceed();
    })
  ];
});
</script>
