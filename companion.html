function slots(){const s=pc.spellcasting;if(!s)return '';let out='<div class="card"><div class="section-title">Spell slots</div>';for(let l=1;l<=9;l++){const max=Number(s.slots?.[l]??s.slots?.[String(l)]??0);if(!max)continue;const used=Number(s.slots_used?.[l]??s.slots_used?.[String(l)]??0);out+=`<div class="row"><span class="grow">Level ${l}</span><div class="pips">${Array.from({length:max},(_,i)=>`<button class="pip ${i>=used?'on':''}" data-act="slot" data-level="${l}" data-used="${i<used}">${i<used?'●':'○'}</button>`).join('')}</div></div>`}for(const [key,a] of Object.entries(pc.abilities||{})){if(a.kind!=='charge')continue;const max=Number(a.max||0),cur=Number(a.current??max);out+=`<div class="row"><span class="grow">${esc(a.label||key)}</span><div class="pips">${Array.from({length:max},(_,i)=>`<button class="pip ${i<cur?'on':''}" data-act="charge" data-key="${esc(key)}" data-n="${i+1}">${i<cur?'●':'○'}</button>`).join('')}</div></div>`}return out+`<div class="muted">Save DC ${esc(s.spell_save_dc??'—')} · Attack ${esc(s.spell_attack_bonus??'—')}</div></div>`}
function home(){const c=pc.combat||{},hp=Number(c.hp_current??0),max=Number(c.hp_max??1),pct=Math.max(0,Math.min(100,hp/max*100)),col=pct>50?'var(--green)':pct>25?'var(--warn)':'var(--red)',sub=`Lv ${pc.level??'?'} ${pc.class||''}${pc.subclass?' ('+pc.subclass+')':''} · ${pc.species||''}`;return `<section class="view">${`<div class="card hero">${avatar()}<div class="name">${esc(pc.name)}</div><div class="sub">${esc(sub)}</div></div>`}<div class="card"><div class="hp-head"><span class="section-title">Hit points</span><span class="hp-num">${hp} / ${max} <span class="temp">+${Number(c.temp_hp||0)} temp</span></span></div><div class="bar"><i style="width:${pct}%;background:${col}"></i></div><div class="hp-controls"><input id="hp-amount" inputmode="numeric" type="number" min="1" placeholder="Amount" value="${esc(keepHp)}"><button class="danger" data-act="damage">Damage</button><button class="primary" data-act="heal">Heal</button></div><div class="temp-row"><input id="temp-hp" inputmode="numeric" type="number" min="0" placeholder="Temp HP" value="${Number(c.temp_hp||0)}"><button data-act="temp">Set temp</button></div></div>${death()}<div class="card"><div class="stats">${[['AC',c.ac??pc.ac??'—'],['Initiative',bonus(c.initiative_bonus??mod(ability('dex')))],['Speed',pc.combat?.speed??pc.speed??'—'],['Prof',bonus(prof())],['Passive',pc.senses?.passive_perception??10+mod(ability('wis'))]].map(x=>`<div class="stat"><span class="label">${x[0]}</span><button data-act="${x[0]==='Initiative'?'initiative':'noop'}" class="value">${esc(x[1])}</button></div>`).join('')}</div><div class="row"><span class="grow">Inspiration</span><button data-act="inspiration">${c.inspiration?'On':'Off'}</button><span class="muted">Exhaustion</span><button data-act="exhaust" data-delta="-1">−</button><b>${Number(c.exhaustion||0)}</b><button data-act="exhaust" data-delta="1">+</button></div></div><div class="card"><div class="section-title">Ability checks</div><div class="ability-grid">${A.map(k=>`<butt function skills(){const st=pc.stats||{},sk=pc.skills||{};return `<section class="view"><div class="card"><div class="section-title">Roll mode</div><div class="actions"><button data-act="mode" data-mode="normal">Normal</button><button data-act="mode" data-mode="adv">Advantage</button><button data-act="mode" data-mode="dis">Disadvantage</button></div></div><div class="card"><div class="section-title">Saving throws</div>${A.map(k=>{const s=pc.saving_throws?.[k]??pc.saves?.[k]??mod(st[k]??10)+(pc.saving_throw_proficiencies?.includes?.(k)?prof():0);return `<div class="row"><span class="grow"><b>${AL[k]}</b> saving throw ${pc.saving_throw_proficiencies?.includes?.(k)?'●':''}</span><button data-act="save" data-key="${k}">${bonus(s)}</button></div>`}).join('')}</div><div class="card"><div class="section-title">Skills</div>${skillDb.map(x=>{const key=x.index?.replace(/-/g,'_'),v=sk[key],b=v?.bonus??(mod(st[x.ability_score?.index?.slice(0,3)??'wis']??10)+(v?.proficient?prof():0)+(v?.expertise?prof():0));return `<details><summary class="row"><span class="grow">${esc(x.name)} <span class="muted">${AL[x.ability_score?.index?.slice(0,3)??'wis']}</span></span><button data-act="skill" data-key="${esc(key)}" data-bonus="${esc(b)}">${bonus(b)}</button></summary>${rules(x.desc)}</details>`}).join('')}</div><div class="card"><div class="section-title">Senses</div><div>${Object.entries(pc.senses||{}).map(([k,v])=>`<span class="pill">${esc(k)} ${esc(v)}</span>`).join('')||'<span class="muted">No senses listed</span>'}</div><div class="section-title" style="margin-top:14px">Proficiencies & languages</div><div class="rule">${esc(fix(pc.text_blocks?.proficiencies_languages||'None listed'))}</div></div></section>`}
function feats(){return `<section class="view">${Object.entries(pc.abilities||{}).map(([k,a])=>`<div class="card"><div class="section-title">${esc(a.kind||'Feature')}</div><h3>${esc(a.label||k)}</h3>${rules(a.effect_desc)}<div class="muted">${[a.activation,a.recharge,a.die].filter(Boolean).map(esc).join(' · ')}</div>${a.kind==='charge'?`<div class="pips">${Array.from({length:Number(a.max||0)},(_,i)=>`<button class="pip ${i<Number(a.current??a.max??0)?'on':''}" data-act="charge" data-key="${esc(k)}" data-n="${i+1}">${i<Number(a.current??a.max??0)?'●':'○'}</button>`).join('')}</div>`:''}</div>`).join('')}<div class="card"><div class="section-title">Origin feat</div><div>${esc(pc.origin_feat||'None listed')}</div></div><div class="card"><div class="section-title">Features & traits</div><div class="rule">${esc(fix(pc.text_blocks?.features_traits||'None listed'))}</div></div><details class="card"><summary>About</summary>${['appearance','backstory','notes'].map(k=>`<h3>${k}</h3><div class="rule">${esc(fix(pc.text_blocks?.[k]||'None listed'))}</div>`).join('')}</details></section>`}
function spellRow(s){const d=spellDb[norm(s.name)]||{};return `<details class="card"><summary><b>${esc(s.name)}</b> <span class="badge">${s.level===0||s.prepared_type==='cantrip'?'Cantrip':s.level+'th level'}</span><div class="muted">${esc(s.cast_time||d.casting_time||'')} ${s.concentration?' · Concentration':''}</div></summary>${rules(d.desc)}<div class="rule">Range: ${esc(d.range||'—')} · Components: ${esc((d.components||[]).join(', ')||'—')} · Duration: ${esc(d.duration||s.duration||'—')}</div>${rules([s.notes,s.beginner_tip])}<div class="actions">${s.level>0&&s.prepared_type!=='cantrip'?`<button data-act="cast" data-spell="${esc(s.name)}" data-level="${esc(s.level)}">Cast</button>`:''}${s.to_hit!=null?`<button data-act="spell-attack" data-expr="1d20${bonus(s.to_hit)}">Attack</button>`:''}${s.damage?`<button data-act="roll" data-label="${esc(s.name)} damage" data-expr="${esc(s.damage)}">Damage</button>`:''}</div></details>`}
function items(){let inv=pc.inventory||{};if(Array.isArray(inv))inv=Object.fromEntries(inv.map((x,i)=>[i,x]));const list=Object.values(inv).filter(x=>x&&x.name&&norm(x.name).includes(norm(invSearch))),groups={};list.forEach(x=>(groups[x.category||itemData(x.name).equipment_category?.name||'Other']??=[]).push(x));return `<section class="view"><input class="search" id="item-search" placeholder="Search inventory" value="${esc(invSearch)}">${Object.entries(groups).map(([cat,xs])=>`<div class="card"><div class="section-title">${esc(cat)}</div>${xs.map(x=>`<details><summary class="row"><span class="grow"><b>${esc(x.name)}</b><span class="muted">×${esc(x.qty??1)}</span></span></summary><div class="rule">${esc(x.desc||desc(itemData(x.name))||'No description.')}</div><div class="rule">${esc(x.notes||'')}</div></details>`).join('')}</div>`).join('')||'<div class="empty">No matching items.</div>'}</section>`}
function picker(){app.innerHTML='<section class="picker"><h1>Choose your companion</h1><p class="muted">Pick the character you are playing.</p><div id="pick-list">Loading characters…</div></section>';get(ref(db,'characters/pcs')).then(s=>{const list=Object.entries(s.val()||{}).map(([i,x])=>({...x,id:i})).filter(x=>x.name&&x.id!=='__oracle__'&&x.campaign!=='__oracle__'&&x.type!=='npc'&&x.record_type!=='npc').sort((a,b)=>a.name.localeCompare(b.name));$('#pick-list').innerHTML=list.map(x=>`<button data-act="pick" data-id="${esc(x.id)}"><b>${esc(x.name)}</b><br><span class="muted">Lv ${esc(x.level??'?')} ${esc(x.class||'')} · ${esc(x.campaign||'')}</span></button>`).join('')||'<p class="error">No player characters found.</p>'}).catch(e=>{$('#pick-list').textContent='Could not load characters: '+e.message})}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-act],[data-tab]');if(!b)return;if(b.dataset.tab){active=b.dataset.tab;location.hash=active;render();return}const act=b.dataset.act;try{if(act==='picker'){pc=null;render();return}if(act==='pick'){await select(b.dataset.id);return}if(act==='noop')return;if(act==='damage'||act==='heal'){const n=Math.max(1,Math.trunc(Number($('#hp-amount')?.value)||0));keepHp='';if(act==='damage'&&db.damage)await write(()=>db.damage(id,n));else await write(()=>runTransaction(ref(db,'characters/pcs/'+id+'/combat'),c=>{if(!c)return c;const cur=Number(c.hp_current)||0,tmp=Math.max(0,Number(c.temp_hp)||0);const hp=act==='heal'?Math.min(Number(c.hp_max)||1,cur+n):Math.max(0,cur-Math.max(0,n-tmp));return {...c,hp_current:hp,temp_hp:act==='heal'?tmp:Math.max(0,tmp-n),death_saves:hp>0?{success:0,fail:0}:c.death_saves||{success:0,fail:0}}}));return}if(act==='temp'){await write(()=>set(ref(db,'characters/pcs/'+id+'/combat/temp_hp'),Math.max(0,Math.trunc(Number($('#temp-hp')?.value)||0))));return}if(act==='initiative'){await roll('Initiative','1d20'+bonus(pc.combat?.initiative_bonus??mod(ability('dex'))));return}if(act==='ability'){await roll(AL[b.dataset.key]+' check','1d20'+bonus(mod(ability(b.dataset.key))));return}if(act==='save'){await roll(AL[b.dataset.key]+' saving throw','1d20'+bonus(pc.saving_throws?.[b.dataset.key]??pc.saves?.[b.dataset.key]??mod(ability(b.dataset.key))));return}if(act==='skill'){await roll(b.parentElement?.querySelector('b')?.textContent||'Skill',`1d20${bonus(b.dataset.bonus)}`);return}if(act==='roll'||act==='spell-attack'){await roll(b.dataset.label||'Roll',b.dataset.expr);return}if(act==='inspiration'){await write(()=>update(ref(db,'characters/pcs/'+id+'/combat'),{inspiration:!pc.combat?.inspiration}));return}if(act==='exhaust'){await write(()=>update(ref(db,'characters/pcs/'+id+'/combat'),{exhaustion:Math.max(0,Number(pc.combat?.exhaustion||0)+Number(b.dataset.delta))}));return}if(act==='slot'){const l=b.dataset.level,u=Number(pc.spellcasting?.slots_used?.[l]||0),max=Number(pc.spellcasting?.slots?.[l]||0),n=b.dataset.used==='true'?Math.max(0,u-1):Math.min(max,u+1);await write(()=>set(ref(db,`characters/pcs/${id}/spellcasting/slots_used/${l}`),n));return}if(act==='charge'){const k=b.dataset.key,a=pc.abilities?.[k],n=b.dataset.n,cur=Number(a.current??a.max??0);await write(()=>set(ref(db,`characters/pcs/${id}/abilities/${k}/current`),cur>=Number(n)?Number(n)-1:Number(n)));return}if(act==='cast'){let l=Number(b.dataset.level),chosen=null;for(let i=l;i<=9;i++){const max=Number(pc.spellcasting?.slots?.[i]||0),u=Number(pc.spellcasting?.slots_used?.[i]||0);if(max>u){chosen=i;break}}if(!chosen){toast('No spell slot left');return}await write(()=>set(ref(db,`characters/pcs/${id}/spellcasting/slots_used/${chosen}`),Number(pc.spellcasting?.slots_used?.[chosen]||0)+1));const s=(pc.spellcasting.spells||[]).find(x=>x.name===b.dataset.spell);if(s?.concentration)await write(()=>update(ref(db,'characters/pcs/'+id+'/combat'),{concentration:{active:true,spell:s.name,check:null}}));toast('Cast '+b.dataset.spell);return}if(act==='death'){await write(()=>runTransaction(ref(db,'characters/pcs/'+id+'/combat'),c=>{if(!c||Number(c.hp_current)!==0)return c;const d=c.death_saves||{},k=b.dataset.kind,n=Number(b.dataset.n);return {...c,death_saves:{success:count(d.success),fail:count(d.fail),[k]:count(d[k])>=n?n-1:n}}}));return}if(act==='death-roll'){const r=await roll('Death save','1d20');if(r)await write(()=>runTransaction(ref(db,'characters/pcs/'+id+'/combat'),c=>{if(!c||Number(c.hp_current)!==0)return c;if(r.nat===20)return {...c,hp_current:1,death_saves:{success:0,fail:0}};const d={success:count(c.death_saves?.success),fail:count(c.death_saves?.fail)},k=r.nat>=10?'success':'fail';d[k]=count(d[k]+(r.nat===1?2:1));return {...c,death_saves:d}}));return}if(act==='condition-sheet'){conditionSheet();return}if(act==='condition-remove'){const cs=(pc.combat?.conditions||[]).filter(x=>x!==b.dataset.name);await write(()=>update(ref(db,'characters/pcs/'+id+'/combat'),{conditions:cs}));return}if(act==='conc-toggle'){await write(()=>update(ref(db,'characters/pcs/'+id+'/combat'),{concentration:{active:b.checked,spell:$('#conc-spell')?.value.trim()||'Spell',check:null}}));return}if(act==='conc-roll'){await roll('Concentration CON save','1d20'+bonus(mod(ability('con'))));return}if(act==='conc-keep'){await write(()=>update(ref(db,'characters/pcs/'+id+'/combat'),{concentration:{...pc.combat.concentration,check:null}}));return}if(act==='conc-drop'){await write(()=>update(ref(db,'characters/pcs/'+id+'/combat'),{concentration:{active:false,spell:'',check:null}}));return}}catch(e){toast(e.message)}});

function recipePanel(v){const r=recipeFor(pc,v,{spells:Object.values(spellDb)}),x=document.createElement('div');x.className='overlay';const riders=(r.rolls||[]).flatMap((z,i)=>(z.riders||[]).map((q,j)=>`<label><input type="checkbox" data-rider="${i}:${j}"> ${esc(q.label)} <span class="muted">${esc(q.note||'')}</span></label>`));x.innerHTML=`<div class="sheet"><button class="close" data-close>Close</button><h2>${esc(r.label)}</h2><div class="recipe">${(r.rolls||[]).map(z=>`<div><b>${esc(z.name)}:</b> ${esc(z.text||z.expr)}</div>`).join('')}${(r.notes||[]).map(n=>`<div class="muted">${esc(n)}</div>`).join('')}${r.slotOptions?.length?`<label>Slot <select data-slot>${r.slotOptions.map(n=>`<option value="${n}" ${n===r.slot?'selected':''}>${n}</option>`).join('')}</select></label>`:''}${riders.join('')}</div><button class="primary" data-reroll>Roll</button>${v.kind==='spell'&&r.level?'<button data-cast>Cast</button>':''}</div>`;document.body.append(x);x.addEventListener('change',e=>{if(e.target.matches('[data-slot]')){x.remove();recipePanel({...v,slot:+e.target.value})}});x.onclick=async e=>{if(e.target===x||e.target.closest('[data-close]'))return x.remove();if(e.target.closest('[data-reroll]')){const on={};x.querySelectorAll('[data-rider]').forEach(q=>on[q.dataset.rider]=q.checked);for(const [i,z] of (r.rolls||[]).entries()){const q=(z.riders||[]).filter((_,j)=>on[i+':'+j]);const rr=await roll(r.label+' · '+z.name,[z.expr,...q.map(a=>a.expr).filter(Boolean)].join('+'));if(v.kind==='death'&&rr)await applyDeath(rr)}return}if(e.target.closest('[data-cast]')){const l=+(r.slot||r.level),u=+(pc.spellcasting?.slots_used?.[l]||0);await write(()=>set(ref(db,`characters/pcs/${id}/spellcasting/slots_used/${l}`),u+1));if(r.concentration)await write(()=>update(ref(db,`characters/pcs/${id}/combat`),{concentration:{active:true,spell:r.label,check:null}}));toast('Cast '+r.label)}}}
function notes(){return `<section class="view"><div class="card"><div class="section-title">My notes</div><textarea id="new-note" placeholder="Write a note"></textarea><button data-act="note-save">Save note</button></div><div class="card"><div class="section-title">GM reveals</div>${Object.values(revealNotes||{}).map(n=>`<div class="rule">${esc(n.text||n)}</div>`).join('')||'<span class="muted">No revealed notes.</span>'}</div></section>`}
function tabs2(){return '<nav class="tabs">'+[['home','⌂'],['skills','☷'],['feats','✦'],['spells','✧'],['gear','⚔'],['items','▣'],['notes','▤']].map(x=>`<button class="${active===x[0]?'active':''}" data-tab="${x[0]}"><span>${x[1]}</span>${x[0][0].toUpperCase()+x[0].slice(1)}</button>`).join('')+'</nav>'}
function render(){if(!pc){picker();return}focusId=focusId||document.activeElement?.id||'';recipeStore=[];const b=active==='skills'?skills2():active==='feats'?feats():active==='spells'?spells2():active==='gear'?gear2():active==='items'?items():active==='notes'?notes():home();app.innerHTML=header()+callBanner()+b+tabs2();if(keepHp&&$('#hp-amount'))$('#hp-amount').value=keepHp;if(focusId){const f=$('#'+CSS.escape(focusId));if(f){f.focus();if(f.setSelectionRange)f.setSelectionRange(f.value.length,f.value.length)}}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act="recipe"]');if(b){e.stopImmediatePropagation();recipePanel(recipeStore[+b.dataset.index]);return}if(e.target.closest('[data-act="note-save"]')){const v=$('#new-note')?.value.trim();if(v)await write(()=>set(ref(db,`apps/sheets/party/${pc.campaign}/notes/${id}/companion`),{key:'companion',text:v,author:pc.name,owner:id,updated:Date.now()}));toast('Note saved')}},true);
function spells2(){const a=[...(pc.spellcasting?.spells||[])].sort((x,y)=>(x.level||0)-(y.level||0)),c=a.filter(x=>!x.level),l=a.filter(x=>x.level);return `<section class="view">${slots()}<div class="section-title">Cantrips</div>${c.map(spellRow).join('')||'<div class="empty">No cantrips.</div>'}<div class="section-title">Leveled spells</div>${l.map(spellRow).join('')||'<div class="empty">No leveled spells.</div>'}</section>`}
function gear2(){const n=attacksPerAction(pc);return `<section class="view"><div class="card"><div class="section-title">Attack action</div><b>${n.normal} attack${n.normal===1?'':'s'}</b>${n.round1>n.normal?' · round 1: '+n.round1+', extra attack +1d8':''}</div>${(pc.attacks||[]).map(a=>`<div class="card"><div class="row"><span class="grow"><b>${esc(a.name)}</b></span>${recipeButton({kind:'attack',attack:a},'Roll')}</div>${rules(a.notes||'')}</div>`).join('')||'<div class="empty">No weapons listed.</div>'}</section>`}
function spells(){const a=[...(pc.spellcasting?.spells||[])].sort((x,y)=>(x.level||0)-(y.level||0)),c=a.filter(x=>!x.level),l=a.filter(x=>x.level);return `<section class="view">${slots()}<div class="section-title">Cantrips</div>${c.map(spellRow).join('')||'<div class="empty">No cantrips.</div>'}<div class="section-title">Leveled spells</div>${l.map(spellRow).join('')||'<div class="empty">No leveled spells.</div>'}</section>`}
function gear(){const n=attacksPerAction(pc);return `<section class="view"><div class="card"><div class="section-title">Attack action</div><b>${n.normal} attack${n.normal===1?'':'s'}</b>${n.round1>n.normal?' · round 1: '+n.round1+', extra attack +1d8':''}</div>${(pc.attacks||[]).map(a=>`<div class="card"><div class="row"><span class="grow"><b>${esc(a.name)}</b></span>${recipeButton({kind:'attack',attack:a},'Roll')}</div>${rules(a.notes||'')}</div>`).join('')||'<div class="empty">No weapons listed.</div>'}</section>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(['initiative','ability','save','skill','death-roll','roll','spell-attack'].includes(a)){e.stopImmediatePropagation();let v;if(a==='initiative')v={kind:'initiative'};else if(a==='ability')v={kind:'ability',key:b.dataset.key};else if(a==='save')v={kind:'save',key:b.dataset.key};else if(a==='skill')v={kind:'skill',key:b.dataset.key};else if(a==='death-roll')v={kind:'death'};else if(a==='roll'||a==='spell-attack'){const label=b.dataset.label||b.dataset.act,at=(pc.attacks||[]).find(x=>label.startsWith(x.name));if(at)v={kind:'attack',attack:at};else{const name=b.closest('details')?.querySelector('summary b')?.textContent||label;v={kind:'spell',name}}}recipePanel(v)}},true);

// ---- GM roll calls ("roll Perception, DC 15"): shown with this character's numbers, answered with one tap
let liveCall=null,callUnsub=null,callCamp=null,callMode='normal',callExtras={};
const liveApi=()=>{const r=p=>ref(db,`geezvtt/live/${pc.campaign}/${p}`);return {txn:(p,fn)=>runTransaction(r(p),fn).then(x=>x.committed),update:(p,o)=>update(r(p),o),push:(p,o)=>push(r(p),o)}};
function followCall(){if(!pc?.campaign||callCamp===pc.campaign)return;callUnsub?.();callCamp=pc.campaign;callUnsub=onValue(ref(db,`geezvtt/live/${callCamp}/rollcall`),snap=>{const c=snap.val();if(c?.id!==liveCall?.id){callMode=c?.mode||'normal';callExtras={}}liveCall=c;render()})}
function callBanner(){const c=liveCall;if(!c||!c.open||!pc||!Object.hasOwn(c.to||{},id))return '';
 const done=c.results?.[id];if(done)return `<section class="card callbox"><div class="section-title">GM called a roll</div><b>${esc(callTitle(c))}</b>: you rolled <b>${esc(done.total)}</b>${c.showDc&&c.dc?(passed(c,done)?' · Pass':' · Fail'):''}</section>`;
 const m=callMod(pc,c);
 return `<section class="card callbox"><div class="section-title">GM called a roll</div><h3>${esc(callTitle(c))}${c.showDc&&c.dc?' · DC '+esc(c.dc):''}</h3><div>Roll 1d20, add ${m.parts.map(([k,n])=>esc(k)+' '+esc(sgn(n))).join(', ')} = <b>${esc(sgn(m.mod))}</b></div><div class="actions">${['normal','adv','dis'].map(x=>`<button data-act="call-mode" data-mode="${x}" aria-pressed="${callMode===x}">${x==='normal'?'Normal':x==='adv'?'Advantage':'Disadvantage'}</button>`).join('')}</div><div>${EXTRAS.map(([k,l,d])=>`<label><input type="checkbox" data-call-extra="${k}" ${callExtras[k]?'checked':''}> ${esc(l)} +1d${d}</label>`).join(' ')}</div><button class="primary" data-act="call-roll">Roll it</button></section>`}
function applyDeath(r){return write(()=>runTransaction(ref(db,'characters/pcs/'+id+'/combat'),c=>{if(!c||Number(c.hp_current)!==0)return c;if(r.nat===20)return {...c,hp_current:1,death_saves:{success:0,fail:0}};const d={success:count(c.death_saves?.success),fail:count(c.death_saves?.fail)},k=r.nat>=10?'success':'fail';d[k]=count(d[k]+(r.nat===1?2:1));return {...c,death_saves:d}}))}
document.addEventListener('change',e=>{const k=e.target.dataset?.callExtra;if(k)callExtras[k]=e.target.checked},true);
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act="call-mode"],[data-act="call-roll"]');if(!b)return;e.stopImmediatePropagation();
 if(b.dataset.act==='call-mode'){callMode=b.dataset.mode;render();return}
 try{b.disabled=true;const r=await answerCall(liveApi(),liveCall,id,{name:pc.name,charId:id,c:pc,mode:callMode,extras:callExtras});if(r)toast(`<b>${esc(callTitle(liveCall))}</b>: ${esc(r.total)} (${esc(r.detail)})`);else toast('Someone already answered, or the call closed.')}catch(err){toast('Roll not sent: '+esc(err.message))}finally{b.disabled=false}},true);
await loadData();const chosen=activeId();if(chosen)select(chosen);else picker();
</script></body></html>
