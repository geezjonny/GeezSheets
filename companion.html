<!doctype html>
<html lang="en">
<head>
<script>
  // GeezSheets on Gaia (data in Firebase /v2). Always Firebase, also when opened from this PC; ?gaia=... overrides (tests).
  (function(){const q=new URLSearchParams(location.search);if(q.get('db')==='gaia'&&q.has('gaia'))return;q.set('db','gaia');
  if(!q.has('gaia'))q.set('gaia','firebase');
  location.replace(location.pathname+'?'+q.toString().replace(/=(&|$)/g,'$1')+location.hash);})();
</script>
