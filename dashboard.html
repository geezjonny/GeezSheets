<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeezSheets Dashboard</title>
<script src="js/firebase-config.js"></script>
<style>
  /* Same palette as the VTT (js/vtt/vtt.css): leather, brass, parchment, ink; Georgia everywhere. */
  :root { --leather:#3a2819; --leather-dk:#24170d; --brass:#b98f45; --brass-lt:#e0bf7a; --ink:#2b2012; --paper:#eadfc3;
          --text:var(--paper); --dim:#c9b88f; --line:#b98f4566; --accent:var(--brass-lt); --field:#f1e8cf; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; overflow:hidden; color:var(--paper); font:14px/1.4 Georgia,"Palatino Linotype",serif;
         background:radial-gradient(ellipse at 50% 30%,#4a3321 0%,#2a1c12 70%); }
  #bar { position:fixed; top:0; left:0; right:0; height:34px; display:flex; gap:6px; align-items:center; padding:0 10px; background:var(--leather-dk); border-bottom:1px solid var(--brass); z-index:1000; overflow-x:auto; white-space:nowrap; } #bar button { white-space:nowrap; flex:none; }
  #status { position:fixed; right:10px; bottom:8px; font-size:12px; font-style:italic; color:var(--dim); }
  .win[hidden] { display:none; }
  .win { position:absolute; min-width:240px; min-height:90px; width:300px; background:linear-gradient(var(--leather),var(--leather-dk)); border:1px solid var(--brass); border-radius:8px;
         box-shadow:0 6px 18px #0008; display:flex; flex-direction:column; resize:both; overflow:hidden; }
  .win > header { display:flex; align-items:center; gap:6px; padding:4px 8px; border-bottom:1px solid #b98f4555; cursor:move; user-select:none; color:var(--brass-lt); font-weight:bold; font-size:12px; letter-spacing:.04em; text-transform:uppercase; }
  .win > header span { flex:1; }
  .body { padding:8px; overflow:auto; display:flex; flex-direction:column; gap:8px; flex:1; }
  button { background:#ffffff10; color:var(--paper); border:1px solid #b98f4566; border-radius:6px; cursor:pointer; font:inherit; padding:2px 9px; }
  button:hover { background:#b98f4533; }
  #bar button.on, .chips button.on { background:var(--brass); color:var(--ink); border-color:var(--brass-lt); font-weight:bold; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; } .chips button { padding:3px 8px; }
  .chips .sw { width:24px; height:24px; padding:0; border:2px solid var(--leather-dk); border-radius:50%; } .chips .sw.on { border-color:var(--paper); }
  .lbl { color:var(--brass-lt); font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-top:2px; }
  select, input:not([type=range]):not([type=color]), textarea { background:var(--field); color:var(--ink); border:1px solid var(--brass); border-radius:4px; padding:3px 5px; font:inherit; }
  select { width:100%; }
  input[type=range] { accent-color:var(--brass); }
  .row { display:grid; grid-template-columns:1fr auto; gap:2px 8px; align-items:center; padding:5px 6px; border:1px solid #b98f4533; border-radius:6px; background:#00000022; }
  .row .name { font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .row .name small { color:var(--dim); font-weight:normal; font-style:italic; margin-left:4px; }
  .row .num { font-variant-numeric:tabular-nums; text-align:right; cursor:text; } .row .num input { width:3.2em; text-align:right; padding:0 3px; }
  .bar { grid-column:1 / -1; height:14px; background:var(--leather-dk); border:1px solid var(--brass); border-radius:7px; overflow:hidden; position:relative; }
  .bar i { position:absolute; inset:0 auto 0 0; transition:width .25s, background .25s; } .bar b { position:absolute; inset:0 auto 0 0; background:#6a9ab0; opacity:.9; }
  .row .x { visibility:hidden; padding:0 6px; margin-left:4px; } .row:hover .x { visibility:visible; }
  .amt { grid-column:1 / -1; display:flex; gap:6px; align-items:center; } .amt input { width:4em; text-align:right; }
  .amt .dmg { background:#8a2a1c; border-color:#c0623f; } .amt .dmg:hover { background:#a63a28; }
  .amt .heal { background:#4a6b2a; border-color:#8aa65a; } .amt .heal:hover { background:#5c8236; }
  details { grid-column:1 / -1; } summary { cursor:pointer; color:var(--dim); font-size:12px; font-style:italic; }
  .lvl { display:flex; align-items:center; gap:6px; margin-top:3px; } .lvl label { width:2em; color:var(--dim); font-size:12px; }
  .pip { width:14px; height:14px; border-radius:50%; border:2px solid var(--brass-lt); padding:0; background:var(--brass-lt); } .pip.used { background:transparent; }
  .conditions { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:3px; }
  .condition { padding:1px 6px; border-radius:8px; background:var(--paper); color:var(--ink); border:1px solid var(--brass); font-size:11px; } .condition button { padding:0 2px; background:transparent; color:inherit; border:0; font-size:11px; }
  .note { grid-column:1 / -1; display:flex; gap:4px; align-items:center; } .note button { padding:0 4px; } .note button.has-note { color:var(--brass-lt); border-color:var(--brass-lt); } .note input { min-width:0; flex:1; }
  .empty { color:var(--dim); font-style:italic; text-align:center; padding:8px; }
  .drop-ok { outline:2px dashed var(--brass-lt); outline-offset:2px; }
</style>
</head>
<body><div id="bar"></div><div id="status">connecting…</div>
<script type="module" src="js/dashboard/main.js"></script>
</body>
</html>
