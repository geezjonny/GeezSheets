<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4efdf"><title>The journal</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main class="page"><details id="earlier" hidden><summary>Earlier writing</summary><div id="archive"></div></details><div id="messages" role="log" aria-label="Writing on the page" aria-live="polite"></div><form id="chat-form"><label class="sr-only" for="message">Write on the page. Press Enter for an answer; Shift and Enter for a new line.</label><textarea id="message" rows="3" maxlength="10000" spellcheck="true" aria-label="Write on the page" autofocus required></textarea><div class="margin"><span id="status" role="status"></span><button id="retry" type="button" hidden>Try again</button></div></form></main></body></html>
