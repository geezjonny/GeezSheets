<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Campaign Pinboard</title>
<style>
  :root {
    --glass: rgba(28,28,34,.88); --line: rgba(255,255,255,.08);
    --text: #e8e8ee; --dim: #9a9aa6; --accent: #6366f1; --accent-soft: rgba(99,102,241,.22);
    --radius: 14px; --shadow: 0 8px 28px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0c0c0f; color: var(--text); overflow: hidden; font-size: 13px; }
  [hidden] { display: none !important; }

  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
    background-color: #0c0c0f; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); }
  #stage.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #edges path { fill: none; stroke: rgba(220,220,235,.32); stroke-width: 2; }
  #edges path.hi { stroke: #a5b4fc; stroke-width: 2.5; }
  #edges path.fade { stroke: rgba(220,220,235,.08); }
  #edges path.temp { stroke: #a5b4fc; stroke-dasharray: 6 5; }

  .card { position: absolute; width: 210px; background: #1c1c22; border: 1px solid rgba(255,255,255,.1); border-top: 3px solid var(--c);
    border-radius: 10px; padding: 9px 11px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.45); cursor: pointer; user-select: none; transition: opacity .15s, box-shadow .15s; }
  .card:hover { border-color: rgba(255,255,255,.22); border-top-color: var(--c); }
  .card.sel { box-shadow: 0 0 0 2px var(--accent), 0 10px 26px rgba(0,0,0,.55); }
  .card.fade { opacity: .22; }
  .card.match { box-shadow: 0 0 0 2px #facc15, 0 6px 18px rgba(0,0,0,.45); }
  .card .tagline { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
  .card .tagline i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .card .nm { font-weight: 700; font-size: 14px; margin-top: 3px; line-height: 1.25; word-break: break-word; }
  .card .nt { color: #b8b8c4; font-size: 12px; margin-top: 4px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .knob { position: absolute; right: -8px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: #2a2a33; border: 2px solid var(--c); cursor: crosshair; opacity: 0; transition: opacity .12s; }
  .card:hover .knob, .card.sel .knob { opacity: 1; }
  @media (hover: none) { .card .knob { opacity: 1; } }

  .elabel { position: absolute; transform: translate(-50%, -50%); font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #26262e; border: 1px solid rgba(255,255,255,.12); color: #c9c9d4; white-space: nowrap; cursor: pointer; }
  .elabel:hover { border-color: var(--accent); color: #fff; }
  .elabel.hi { background: #2e2b55; border-color: #6366f1; color: #e0e7ff; }
  .elabel.fade { opacity: .15; }

  /* floating glass */
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .ib { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--text); cursor: pointer; position: relative; }
  .ib:hover { background: rgba(255,255,255,.07); } .ib.active { background: var(--accent-soft); color: #c7d2fe; }
  .ib svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ib[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 48px; white-space: nowrap; background: #000d; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; pointer-events: none; z-index: 40; }
  @media (hover: none) { .ib[data-tip]:hover::after { display: none; } }

  #boardBar { position: fixed; top: 12px; left: 12px; z-index: 20; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; }
  #boardBar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  #boardSel { background: transparent; border: 0; color: var(--text); font: 600 14px inherit; font-family: inherit; padding: 6px 4px; cursor: pointer; max-width: 220px; }
  #boardSel option { background: #1c1c22; }
  #searchBar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; width: min(340px, calc(100vw - 340px)); }
  #searchBar svg { width: 16px; height: 16px; fill: none; stroke: var(--dim); stroke-width: 2; flex-shrink: 0; }
  #search { flex: 1; background: transparent; border: 0; color: var(--text); padding: 7px 2px; font: inherit; outline: none; min-width: 0; }
  #searchCount { color: var(--dim); font-size: 12px; white-space: nowrap; }
  #rail { position: fixed; left: 12px; top: 68px; z-index: 20; display: flex; flex-direction: column; gap: 2px; padding: 4px; }
  #addMenu { position: fixed; left: 68px; top: 68px; z-index: 25; padding: 6px; display: flex; flex-direction: column; gap: 2px; min-width: 150px; }
  #addMenu button { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text); font: inherit; cursor: pointer; text-align: left; }
  #addMenu button:hover { background: rgba(255,255,255,.07); }
  #addMenu i { width: 10px; height: 10px; border-radius: 50%; }
  #legend { position: fixed; left: 12px; bottom: 12px; z-index: 20; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; max-width: calc(100vw - 160px); }
  .chip { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; border: 0; background: rgba(255,255,255,.05); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; }
  .chip.off { opacity: .4; text-decoration: line-through; }
  .chip b { color: var(--dim); font-weight: 500; }
  #zoomBar { position: fixed; right: 12px; bottom: 12px; z-index: 20; display: flex; gap: 2px; padding: 4px; }
  #status { position: fixed; top: 12px; right: 12px; z-index: 20; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; font-weight: 600; }
  #status i { width: 8px; height: 8px; border-radius: 50%; background: #eab308; }
  #status.live i { background: #22c55e; }

  /* editor drawer */
  #drawer { position: fixed; right: 12px; top: 68px; bottom: 68px; width: 340px; z-index: 22; display: flex; flex-direction: column; }
  #drawer header { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 4px 14px; }
  #drawer header span { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #drawer header i { width: 9px; height: 9px; border-radius: 50%; }
  #drawer .body { padding: 6px 14px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .x { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--dim); cursor: pointer; font-size: 14px; }
  .x:hover { background: rgba(255,255,255,.08); color: #fff; }
  #fName { font-size: 18px; font-weight: 700; background: transparent; border: 1px solid transparent; padding: 4px 6px; margin: 0 -6px; border-radius: 8px; width: calc(100% + 12px); color: var(--text); }
  #fName:hover, #fName:focus { border-color: var(--line); background: rgba(0,0,0,.25); outline: none; }
  label { font-size: 12px; color: var(--dim); display: flex; flex-direction: column; gap: 4px; }
  input, select, textarea, button { font: inherit; color: var(--text); }
  input[type="text"], select, textarea { width: 100%; padding: 7px 9px; background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 8px; }
  textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid #818cf8; outline-offset: 1px; }
  .btn { padding: 7px 10px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: #fca5a5; border-color: rgba(220,38,38,.4); }
  .row { display: flex; gap: 6px; align-items: center; }
  .sect { font-size: 12px; font-weight: 600; color: var(--dim); margin-top: 4px; }
  .conn { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.22); }
  .conn .r { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .conn .t { flex: 1; cursor: pointer; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn .t:hover { color: #c7d2fe; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .charbox { padding: 8px 10px; border-radius: 8px; background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.3); font-size: 12px; line-height: 1.5; }
  .muted { color: var(--dim); }
  a { color: #a5b4fc; }

  #rolePop { position: fixed; z-index: 30; padding: 10px; width: 250px; display: flex; flex-direction: column; gap: 8px; }
  #toast { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); padding: 8px 14px; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 40; }
  #toast.show { opacity: 1; }
  #setup { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 60; background: rgba(0,0,0,.6); }
  #setup .glass { max-width: 440px; padding: 20px; line-height: 1.6; }
  #setup code { background: #000; padding: 1px 6px; border-radius: 4px; }

  @media (max-width: 700px) {
    #drawer { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 60vh; }
    #searchBar { top: 64px; left: 68px; right: 12px; transform: none; width: auto; }
    #status { display: none; }
    #legend { bottom: 64px; }
  }
</style>
</head>
<body>
<div id="stage"><div id="world"><svg id="edges"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="rgba(220,220,235,.5)"/></marker><marker id="arrHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a5b4fc"/></marker></defs><g id="edgeG"></g></svg><div id="labels"></div><div id="cards"></div></div></div>

<div id="boardBar" class="glass" title="Board">
  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.2"/><circle cx="16" cy="14" r="1.2"/><path d="M8 9l8 5"/></svg>
  <select id="boardSel"></select>
</div>
<div id="searchBar" class="glass">
  <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  <input id="search" type="text" placeholder="Search cards…  (Enter jumps)" autocomplete="off" />
  <span id="searchCount"></span>
</div>
<div id="status" class="glass"><i></i><span id="statusText">Connecting…</span></div>

<div id="rail" class="glass">
  <button class="ib" id="addBtn" data-tip="Add card (or double-click the board)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="fitBtn" data-tip="Fit everything (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="ib" id="tidyBtn" data-tip="Tidy: group cards by type"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
</div>
<div id="addMenu" class="glass" hidden></div>
<div id="legend" class="glass"></div>
<div id="zoomBar" class="glass">
  <button class="ib" id="zoomOut" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  <button class="ib" id="zoomIn" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
</div>

<aside id="drawer" class="glass" hidden>
  <header><span id="dTag"></span><button class="x" id="dClose" title="Close (Esc)">✕</button></header>
  <div class="body">
    <input id="fName" type="text" placeholder="Name" />
    <label>Type<select id="fTag"></select></label>
    <label>Notes<textarea id="fNotes" placeholder="Who are they, what do they want, what happened…"></textarea></label>
    <label>Linked character sheet<select id="fChar"></select></label>
    <div id="charBox"></div>
    <div class="sect">Connections</div>
    <div id="conns" style="display:flex;flex-direction:column;gap:4px"></div>
    <div class="row"><select id="newTo" style="flex:1"></select></div>
    <div class="row"><input id="newRole" type="text" list="roleList" placeholder="how? e.g. ally of, killed by" style="flex:1" /><button class="btn primary" id="newConn">Connect</button></div>
    <div id="attach"></div>
    <div class="row" style="margin-top:8px"><button class="btn danger" id="delCard">Delete card</button></div>
  </div>
</aside>

<div id="rolePop" class="glass" hidden>
  <div id="rpTitle" style="font-weight:600;font-size:12px"></div>
  <input id="rpRole" type="text" list="roleList" placeholder="how are they connected?" />
  <div class="row"><button class="btn primary" id="rpSave" style="flex:1">Save</button><button class="btn" id="rpFlip" title="Swap direction">⇄</button><button class="btn danger" id="rpDel">Delete</button></div>
</div>
<datalist id="roleList"></datalist>
<div id="toast" class="glass"></div>
<div id="setup" hidden><div class="glass"><b>Firebase not set up yet</b><br>Open <code>pinboard.html</code> and paste your project's <code>firebaseConfig</code> at the top of the script (Firebase console → Project settings → Your apps → Config).</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, get } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";

// ── Paste your Firebase project's config here ─────────────────────────────
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE.firebaseapp.com",
  databaseURL: "https://PASTE-default-rtdb.firebaseio.com",
  projectId: "PASTE",
};
// ──────────────────────────────────────────────────────────────────────────
// Data (same shape the DM board already uses):
//   campaigns/<board>/nodes/<id>  { name, tag, notes, x, y, linkedCharacterId?, linkedCharacterType?, attachments? }
//   campaigns/<board>/edges/<id>  { from, to, role }
//   campaigns/<board>/tagDefs/<tag> { label, color, plural }
//   characters/pcs, characters/npcs   (read only, for linking cards to sheets)
// Anything else under the board (like the world-map data) is never touched.

if (String(firebaseConfig.apiKey).startsWith("PASTE")) { document.getElementById("setup").hidden = false; throw new Error("firebaseConfig not set"); }
const db = getDatabase(initializeApp(firebaseConfig));

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nid = (p = "nm") => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pretty = (r) => String(r || "related").replace(/[_-]+/g, " ");
const CARD_W = 210;
const DEFAULT_TAGS = {
  campaign: { label: "Campaign", color: "#9a6fb0", plural: "campaigns" }, event: { label: "Event", color: "#7c6fb0", plural: "events" },
  faction: { label: "Faction", color: "#a8433d", plural: "factions" }, object: { label: "Object", color: "#4c8ba8", plural: "objects" },
  pc: { label: "PC", color: "#6d9bc3", plural: "pcs" }, person: { label: "NPC", color: "#c9a04e", plural: "npcs" },
  place: { label: "Place", color: "#5c8a72", plural: "locations" }, plan: { label: "Plan", color: "#b9762f", plural: "plans" }
};

// ── state ──
let board = new URLSearchParams(location.search).get("board") || localStorage.getItem("pinboard.board") || "default";
let nodes = {}, edges = {}, tagDefs = {};
const chars = { pcs: {}, npcs: {} };
let hidden = new Set(JSON.parse(localStorage.getItem("pinboard.hidden") || "[]"));
let selected = null, query = "";
const cam = { x: 0, y: 0, z: 1 };
let unsubs = [], firstLoad = true;
const dims = {};   // card id -> {w,h} measured

function toast(m) { $("toast").textContent = m; $("toast").classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("show"), 2200); }
const tagOf = (n) => tagDefs[n?.tag] || { label: n?.tag || "Card", color: "#777" };
const P = (path) => ref(db, `campaigns/${board}/${path}`);

// ── boards ──
async function loadBoards() {
  let ids = [];
  try { const s = await get(ref(db, "campaigns")); ids = Object.keys(s.val() || {}); } catch {}
  if (!ids.includes(board)) ids.push(board);
  ids.sort();
  $("boardSel").innerHTML = ids.map(b => `<option value="${esc(b)}">${esc(b === "default" ? "Main board" : b)}</option>`).join("") + `<option value="__new">+ New board…</option>`;
  $("boardSel").value = board;
}
$("boardSel").onchange = async (e) => {
  if (e.target.value === "__new") {
    const name = (prompt("Name for the new board:") || "").trim();
    e.target.value = board;
    if (!name) return;
    const key = name.replace(/[.#$\[\]\/\s]+/g, "-");
    await set(ref(db, `campaigns/${key}/tagDefs`), DEFAULT_TAGS);
    board = key; await loadBoards();
  } else board = e.target.value;
  localStorage.setItem("pinboard.board", board);
  openBoard();
};

function openBoard() {
  unsubs.forEach(u => u()); unsubs = [];
  nodes = {}; edges = {}; tagDefs = {}; selected = null; firstLoad = true;
  $("cards").innerHTML = ""; $("labels").innerHTML = "";
  closeDrawer();
  let gotNodes = false;
  unsubs.push(onValue(P("tagDefs"), s => { tagDefs = { ...DEFAULT_TAGS, ...(s.val() || {}) }; renderAll(); }));
  unsubs.push(onValue(P("edges"), s => { edges = s.val() || {}; renderAll(); }));
  unsubs.push(onValue(P("nodes"), s => {
    const v = s.val() || {};
    if (drag?.moved && v[drag.id]) { v[drag.id].x = nodes[drag.id].x; v[drag.id].y = nodes[drag.id].y; }   // don't fight our own drag
    nodes = v; gotNodes = true;
    if (selected && !nodes[selected]) closeDrawer();
    renderAll();
    if (firstLoad) { firstLoad = false; requestAnimationFrame(fit); }
    $("status").classList.add("live"); $("statusText").textContent = `${Object.keys(nodes).length} cards`;
  }, () => { $("statusText").textContent = "No access"; toast("Couldn't read the board. Check the database rules."); }));
}
onValue(ref(db, "characters/pcs"), s => { chars.pcs = s.val() || {}; if (selected) renderDrawer(); });
onValue(ref(db, "characters/npcs"), s => { chars.npcs = s.val() || {}; if (selected) renderDrawer(); });

// ── rendering ──
const visible = (n) => n && !hidden.has(n.tag);
function matches(n) {
  if (!query) return false;
  const q = query.toLowerCase();
  return (n.name || "").toLowerCase().includes(q) || (n.notes || "").toLowerCase().includes(q);
}
function neighbours(id) {
  const s = new Set([id]);
  for (const e of Object.values(edges)) { if (e.from === id) s.add(e.to); if (e.to === id) s.add(e.from); }
  return s;
}
function renderAll() { renderCards(); renderEdges(); renderLegend(); renderRoles(); if (selected) renderDrawer(); }

function renderCards() {
  const wrap = $("cards");
  const near = selected ? neighbours(selected) : null;
  let count = 0;
  for (const el of [...wrap.children]) if (!nodes[el.dataset.id]) el.remove();
  for (const [id, n] of Object.entries(nodes)) {
    let el = wrap.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!el) { el = document.createElement("div"); el.className = "card"; el.dataset.id = id; wrap.appendChild(el); }
    const t = tagOf(n);
    const linked = n.linkedCharacterId ? (chars[n.linkedCharacterType === "npc" ? "npcs" : "pcs"][n.linkedCharacterId] ? " · sheet" : "") : "";
    const sig = JSON.stringify([n.name, n.tag, n.notes, t.color, t.label, linked]);
    if (el.dataset.sig !== sig) {
      el.dataset.sig = sig;
      el.style.setProperty("--c", t.color);
      el.innerHTML = `<div class="tagline"><i></i>${esc(t.label)}${linked}</div><div class="nm">${esc(n.name || "Untitled")}</div>${n.notes ? `<div class="nt">${esc(n.notes)}</div>` : ""}<div class="knob" title="Drag onto another card to connect"></div>`;
    }
    if (!(drag && drag.id === id)) { el.style.left = (n.x || 0) + "px"; el.style.top = (n.y || 0) + "px"; }
    el.hidden = !visible(n);
    const m = matches(n); if (m && visible(n)) count++;
    el.classList.toggle("sel", id === selected);
    el.classList.toggle("match", m);
    el.classList.toggle("fade", (near && !near.has(id)) || (!!query && !m));
  }
  for (const el of wrap.children) dims[el.dataset.id] = { w: el.offsetWidth || CARD_W, h: el.offsetHeight || 70 };
  $("searchCount").textContent = query ? `${count} found` : "";
}

function anchor(id, toward) {
  // point on the card's border facing `toward`
  const n = nodes[id], d = dims[id] || { w: CARD_W, h: 70 };
  const cx = (n.x || 0) + d.w / 2, cy = (n.y || 0) + d.h / 2;
  const dx = toward.x - cx, dy = toward.y - cy;

function renderEdges() {

  $("labels").innerHTML = labels;
}

function renderRoles() {

// ── camera ──
const world = $("world"), stage = $("stage");
function applyCam() {
  world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.z})`;
  const g = 22 * cam.z; stage.style.backgroundSize = `${g}px ${g}px`; stage.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
}
const toWorld = (sx, sy) => ({ x: (sx - cam.x) / cam.z, y: (sy - cam.y) / cam.z });
function zoomAt(sx, sy, f) { const w = toWorld(sx, sy); cam.z = clamp(cam.z * f, 0.15, 2.5); cam.x = sx - w.x * cam.z; cam.y = sy - w.y * cam.z; applyCam(); }
function fit() {
  const ids = Object.keys(nodes).filter(id => visible(nodes[id]));

  if (!ids.length) { cam.x = r.width / 2; cam.y = r.height / 2; cam.z = 1; return applyCam(); }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const id of ids) { const n = nodes[id], d = dims[id] || { w: CARD_W, h: 70 }; x0 = Math.min(x0, n.x || 0); y0 = Math.min(y0, n.y || 0); x1 = Math.max(x1, (n.x || 0) + d.w); y1 = Math.max(y1, (n.y || 0) + d.h); }
  const padL = 70, padR = selected ? 370 : 30, padT = 70, padB = 70;
  cam.z = clamp(Math.min((r.width - padL - padR) / (x1 - x0), (r.height - padT - padB) / (y1 - y0)), 0.15, 1.2);
  cam.x = padL + (r.width - padL - padR - (x1 - x0) * cam.z) / 2 - x0 * cam.z;
  cam.y = padT + (r.height - padT - padB - (y1 - y0) * cam.z) / 2 - y0 * cam.z;

}
function focusCard(id) {

  if (hidden.has(n.tag)) { hidden.delete(n.tag); localStorage.setItem("pinboard.hidden", JSON.stringify([...hidden])); }
  select(id);
  const r = stage.getBoundingClientRect(), c = centre(id);

// ── pointer: pan, drag cards, drag knob to connect ──
let drag = null, pan = null, link = null;
const pointers = new Map(); let pinch = null;
const local = (e) => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest("#rolePop")) return;
  hidePop(); $("addMenu").hidden = true;
  const [sx, sy] = local(e);
  pointers.set(e.pointerId, { x: sx, y: sy });
  stage.setPointerCapture(e.pointerId);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: cam.z, w: toWorld((a.x + b.x) / 2, (a.y + b.y) / 2) };
    drag = pan = link = null; return;
  }
  const knob = e.target.closest(".knob"), card = e.target.closest(".card"), lab = e.target.closest(".elabel");
  const w = toWorld(sx, sy);
  if (knob) { link = { from: card.dataset.id, x: w.x, y: w.y }; return; }
  if (lab) { editEdge(lab.dataset.edge, e.clientX, e.clientY); return; }
  if (card) {
    const id = card.dataset.id, n = nodes[id];
    drag = { id, el: card, ox: w.x - (n.x || 0), oy: w.y - (n.y || 0), moved: false, sx, sy };
    return;
  }

stage.addEventListener("pointermove", (e) => {
  const [sx, sy] = local(e);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: sx, y: sy });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    cam.z = clamp(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, 0.15, 2.5);
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    cam.x = cx - pinch.w.x * cam.z; cam.y = cy - pinch.w.y * cam.z; applyCam(); return;
  }
  const w = toWorld(sx, sy);
  if (link) { link.x = w.x; link.y = w.y; renderEdges(); return; }
  if (drag) {
    if (!drag.moved && Math.hypot(sx - drag.sx, sy - drag.sy) < 4) return;
    drag.moved = true;
    const n = nodes[drag.id]; n.x = Math.round(w.x - drag.ox); n.y = Math.round(w.y - drag.oy);

  }
  if (pan) { if (Math.hypot(sx - pan.sx, sy - pan.sy) > 3) pan.moved = true; cam.x = pan.x + sx - pan.sx; cam.y = pan.y + sy - pan.sy; applyCam(); }

    const from = link.from; link = null; renderEdges();
    if (target && target.dataset.id !== from) newEdgePrompt(from, target.dataset.id, e.clientX, e.clientY);
    return;
  }
  if (drag) {
    const { id, moved } = drag; drag = null;

$("zoomOut").onclick = () => zoomC(0.8);
addEventListener("keydown", (e) => {
  const typing = e.target.closest("input, textarea, select");
  if (e.key === "Escape") { if (!$("rolePop").hidden) hidePop(); else if (!typing) closeDrawer(); }
  if (typing) return;
  if (e.key === "f") fit();
  if (e.key === "/") { e.preventDefault(); $("search").focus(); }
  if ((e.key === "Delete" || e.key === "Backspace") && selected) deleteCard(selected);
});
addEventListener("resize", applyCam);

applyCam();
loadBoards();
openBoard();
window.__pin = { get nodes() { return nodes; }, get edges() { return edges; }, cam, focusCard };
</script>
</body>
</html>
