<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Campaign Pinboard</title>
<style>
  :root {
    --glass: rgba(28,28,34,.88); --line: rgba(255,255,255,.08);
    --text: #e8e8ee; --dim: #9a9aa6; --accent: #6366f1; --accent-soft: rgba(99,102,241,.22);
    --radius: 14px; --shadow: 0 8px 28px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0c0c0f; color: var(--text); overflow: hidden; font-size: 13px; }
  [hidden] { display: none !important; }

  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
    background-color: #0c0c0f; background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); }
  #stage.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #edges path { fill: none; stroke: rgba(220,220,235,.32); stroke-width: 2; }
  #edges path.hi { stroke: #a5b4fc; stroke-width: 2.5; }
  #edges path.fade { stroke: rgba(220,220,235,.08); }
  #edges path.temp { stroke: #a5b4fc; stroke-dasharray: 6 5; }

  .card { position: absolute; width: 210px; background: #1c1c22; border: 1px solid rgba(255,255,255,.1); border-top: 3px solid var(--c);
    border-radius: 10px; padding: 9px 11px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.45); cursor: pointer; user-select: none; transition: opacity .15s, box-shadow .15s; }
  .card:hover { border-color: rgba(255,255,255,.22); border-top-color: var(--c); }
  .card.sel { box-shadow: 0 0 0 2px var(--accent), 0 10px 26px rgba(0,0,0,.55); }
  .card.fade { opacity: .22; }
  .card.match { box-shadow: 0 0 0 2px #facc15, 0 6px 18px rgba(0,0,0,.45); }
  .card .tagline { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
  .card .tagline i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .card .nm { font-weight: 700; font-size: 14px; margin-top: 3px; line-height: 1.25; word-break: break-word; }
  .card .nt { color: #b8b8c4; font-size: 12px; margin-top: 4px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .knob { position: absolute; right: -8px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: #2a2a33; border: 2px solid var(--c); cursor: crosshair; opacity: 0; transition: opacity .12s; }
  .card:hover .knob, .card.sel .knob { opacity: 1; }
  @media (hover: none) { .card .knob { opacity: 1; } }

  .elabel { position: absolute; transform: translate(-50%, -50%); font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #26262e; border: 1px solid rgba(255,255,255,.12); color: #c9c9d4; white-space: nowrap; cursor: pointer; }
  .elabel:hover { border-color: var(--accent); color: #fff; }
  .elabel.hi { background: #2e2b55; border-color: #6366f1; color: #e0e7ff; }
  .elabel.fade { opacity: .15; }

  /* floating glass */
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .ib { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--text); cursor: pointer; position: relative; }
  .ib:hover { background: rgba(255,255,255,.07); } .ib.active { background: var(--accent-soft); color: #c7d2fe; }
  .ib svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ib[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 48px; white-space: nowrap; background: #000d; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; pointer-events: none; z-index: 40; }
  @media (hover: none) { .ib[data-tip]:hover::after { display: none; } }

  #boardBar { position: fixed; top: 12px; left: 12px; z-index: 20; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; }
  #boardBar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  #campSel { background: transparent; border: 0; color: var(--text); font: 600 14px inherit; font-family: inherit; padding: 6px 4px; cursor: pointer; max-width: 220px; }
  #campSel option { background: #1c1c22; }
  #searchBar { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; width: min(340px, calc(100vw - 340px)); }
  #searchBar svg { width: 16px; height: 16px; fill: none; stroke: var(--dim); stroke-width: 2; flex-shrink: 0; }
  #search { flex: 1; background: transparent; border: 0; color: var(--text); padding: 7px 2px; font: inherit; outline: none; min-width: 0; }
  #searchCount { color: var(--dim); font-size: 12px; white-space: nowrap; }
  #rail { position: fixed; left: 12px; top: 68px; z-index: 20; display: flex; flex-direction: column; gap: 2px; padding: 4px; }
  #addMenu { position: fixed; left: 68px; top: 68px; z-index: 25; padding: 6px; display: flex; flex-direction: column; gap: 2px; min-width: 150px; }
  #addMenu button { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text); font: inherit; cursor: pointer; text-align: left; }
  #addMenu button:hover { background: rgba(255,255,255,.07); }
  #addMenu i { width: 10px; height: 10px; border-radius: 50%; }
  #legend { position: fixed; left: 12px; bottom: 12px; z-index: 20; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; max-width: calc(100vw - 160px); }
  .chip { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; border: 0; background: rgba(255,255,255,.05); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; }
  .chip.off { opacity: .4; text-decoration: line-through; }
  .chip b { color: var(--dim); font-weight: 500; }
  #zoomBar { position: fixed; right: 12px; bottom: 12px; z-index: 20; display: flex; gap: 2px; padding: 4px; }
  #status { position: fixed; top: 12px; right: 12px; z-index: 20; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; font-weight: 600; }
  #status i { width: 8px; height: 8px; border-radius: 50%; background: #eab308; }
  #status.live i { background: #22c55e; }

  /* editor drawer */
  #drawer { position: fixed; right: 12px; top: 68px; bottom: 68px; width: 340px; z-index: 22; display: flex; flex-direction: column; }
  #drawer header { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 4px 14px; }
  #drawer header span { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #drawer header i { width: 9px; height: 9px; border-radius: 50%; }
  #drawer .body { padding: 6px 14px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .x { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--dim); cursor: pointer; font-size: 14px; }
  .x:hover { background: rgba(255,255,255,.08); color: #fff; }
  #fName { font-size: 18px; font-weight: 700; background: transparent; border: 1px solid transparent; padding: 4px 6px; margin: 0 -6px; border-radius: 8px; width: calc(100% + 12px); color: var(--text); }
  #fName:hover, #fName:focus { border-color: var(--line); background: rgba(0,0,0,.25); outline: none; }
  label { font-size: 12px; color: var(--dim); display: flex; flex-direction: column; gap: 4px; }
  input, select, textarea, button { font: inherit; color: var(--text); }
  input[type="text"], select, textarea { width: 100%; padding: 7px 9px; background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 8px; }
  textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid #818cf8; outline-offset: 1px; }
  .btn { padding: 7px 10px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: #fca5a5; border-color: rgba(220,38,38,.4); }
  .row { display: flex; gap: 6px; align-items: center; }
  .sect { font-size: 12px; font-weight: 600; color: var(--dim); margin-top: 4px; }
  .conn { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; background: rgba(0,0,0,.22); }
  .conn .r { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .conn .t { flex: 1; cursor: pointer; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn .t:hover { color: #c7d2fe; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .charbox { padding: 8px 10px; border-radius: 8px; background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.3); font-size: 12px; line-height: 1.5; }
  .muted { color: var(--dim); }
  a { color: #a5b4fc; }

  #rolePop { position: fixed; z-index: 30; padding: 10px; width: 250px; display: flex; flex-direction: column; gap: 8px; }
  #toast { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); padding: 8px 14px; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 40; }
  #toast.show { opacity: 1; }

  @media (max-width: 700px) {
    #drawer { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 60vh; }
    #searchBar { top: 64px; left: 68px; right: 12px; transform: none; width: auto; }
    #status { display: none; }
    #legend { bottom: 64px; }
  }
  .card.note { background: var(--paper); color: #1c1917; border: 0; border-radius: 6px; }
  .card.note .tagline { color: rgba(28,25,23,.65); } .card.note .nt { color: #292524; -webkit-line-clamp: 5; white-space: pre-line; }
  .card.note .knob { background: #fff; }
  .card .pin { position: absolute; top: -9px; left: 50%; margin-left: -8px; width: 16px; height: 16px; border-radius: 50%; background: #dc2626; border: 2px solid #fca5a5; box-shadow: 0 2px 4px #0008; }
  .card .who { display: flex; align-items: center; gap: 9px; margin-top: 2px; }
  .card .who img, .card .who .ini { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(255,255,255,.15); flex-shrink: 0; }
  .card .who .ini { display: grid; place-items: center; background: var(--c); color: #fff; font-weight: 700; }
  .card .sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .card .own { position: absolute; top: 6px; right: 8px; font-size: 10px; color: var(--dim); }
  .card.note .own { color: rgba(28,25,23,.6); }
  .card .eye { position: absolute; top: 6px; right: 8px; font-size: 11px; }
  .pnote { padding: 7px 9px; border-radius: 8px; background: rgba(0,0,0,.22); font-size: 12px; line-height: 1.45; white-space: pre-line; }
  .pnote b { color: #a5b4fc; font-weight: 600; }
  .pnote .when { color: var(--dim); font-size: 11px; }
  .toggle { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 13px; padding: 8px 10px; border-radius: 8px; background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.25); cursor: pointer; }
  .toggle input { width: 16px; height: 16px; accent-color: #22c55e; }
  #modeTag { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: #c7d2fe; }
  body.player #modeTag { background: rgba(34,197,94,.15); color: #86efac; }
  body.player [data-gm], body.gm [data-player] { display: none !important; }
</style>
</head>
<body>
<div id="stage"><div id="world"><svg id="edges"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="rgba(220,220,235,.5)"/></marker><marker id="arrHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a5b4fc"/></marker></defs><g id="edgeG"></g></svg><div id="labels"></div><div id="cards"></div></div></div>

<div id="boardBar" class="glass" title="Campaign">
  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.2"/><circle cx="16" cy="14" r="1.2"/><path d="M8 9l8 5"/></svg>
  <select id="campSel"></select>
  <span id="modeTag"></span>
</div>
<div id="searchBar" class="glass">
  <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  <input id="search" type="text" placeholder="Search cards…  (Enter jumps)" autocomplete="off" />
  <span id="searchCount"></span>
</div>
<div id="status" class="glass"><i></i><span id="statusText">Connecting…</span></div>

<div id="rail" class="glass">
  <button class="ib" id="addBtn" data-tip="Add card (or double-click the board)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="fitBtn" data-tip="Fit everything (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div id="addMenu" class="glass" hidden></div>
<div id="legend" class="glass"></div>
<div id="zoomBar" class="glass">
  <button class="ib" id="zoomOut" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  <button class="ib" id="zoomIn" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
</div>

<aside id="drawer" class="glass" hidden>
  <header><span id="dTag"></span><button class="x" id="dClose" title="Close (Esc)">✕</button></header>
  <div class="body">
    <input id="fName" type="text" placeholder="Name" />
    <div id="readName" style="font-size:18px;font-weight:700" hidden></div>
    <label class="toggle" data-gm><input type="checkbox" id="fKnown"> Players know about this</label>
    <div id="npcFields" class="row" style="flex-wrap:wrap">
      <label style="flex:1;min-width:120px">Role<input id="fRole" type="text"></label>
      <label style="flex:1;min-width:120px">Faction<input id="fFaction" type="text"></label>
      <label style="flex:1;min-width:120px">Status<input id="fStatus" type="text" placeholder="Alive"></label>
    </div>
    <div id="noteFields" class="row">
      <label style="flex:1">Label<input id="fNoteTag" type="text" placeholder="e.g. Object, Clue"></label>
      <label>Colour<input id="fColor" type="color" style="width:52px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--line);background:transparent"></label>
    </div>
    <label id="notesWrap">Notes<textarea id="fNotes"></textarea></label>
    <div id="readInfo" class="muted"></div>
    <div id="partyNotesWrap">
      <div class="sect" id="pnTitle">Party notes</div>
      <div id="pnList" style="display:flex;flex-direction:column;gap:4px;margin-top:4px"></div>
      <div data-player style="margin-top:6px;display:flex;flex-direction:column;gap:6px">
        <textarea id="pnInput" style="min-height:60px" placeholder="Add a note for the party…"></textarea>
        <button class="btn primary" id="pnAdd">Add note</button>
      </div>
    </div>
    <div class="sect">Connections</div>
    <div id="conns" style="display:flex;flex-direction:column;gap:4px"></div>
    <div class="row"><select id="newTo" style="flex:1"></select></div>
    <div class="row"><input id="newRole" type="text" list="roleList" placeholder="how? e.g. ally of, killed by" style="flex:1" /><button class="btn primary" id="newConn">Connect</button></div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap">
      <button class="btn" id="offBoard" data-gm title="Keeps it in the campaign (maps, lists), just not on the board">Take off board</button>
      <button class="btn danger" id="delCard">Delete</button>
    </div>
  </div>
</aside>

<div id="rolePop" class="glass" hidden>
  <div id="rpTitle" style="font-weight:600;font-size:12px"></div>
  <input id="rpRole" type="text" list="roleList" placeholder="how are they connected?" />
  <div class="row"><button class="btn primary" id="rpSave" style="flex:1">Save</button><button class="btn" id="rpFlip" title="Swap direction">⇄</button><button class="btn danger" id="rpDel">Delete</button></div>
</div>
<div id="namePop" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center">
  <div class="glass" style="width:320px;padding:18px;display:flex;flex-direction:column;gap:10px">
    <b style="font-size:15px">Your name</b><div class="muted">Shown on the notes you add for the party.</div>
    <input id="nameIn" type="text" placeholder="e.g. Lark" /><button class="btn primary" id="nameOk">OK</button>
  </div>
</div>
<datalist id="roleList"></datalist>
<div id="toast" class="glass"></div>
<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
//  Campaign pinboard — the same boards as index.html, on their own page.
//    pinboard.html?gm=jonny   DM board: geezvtt/campaign (everything, editable)
//    pinboard.html            Player board: only things marked "pc-known", without the
//                             DM's notes, plus the party's own cards, strings, notes and
//                             layout in geezvtt/party/<campaign> (same as index.html).
//  Firebase connection comes from js/rodeo-firebase.js like the rest of GeezSheets.
// ─────────────────────────────────────────────────────────────────────────────
import { db, ref, onValue, set, update, remove } from "./js/rodeo-firebase.js";

const GM_KEY = "jonny";   // same key as index.html
const QS = new URLSearchParams(location.search);
const GM = QS.get("gm") === GM_KEY || QS.has("gm" + GM_KEY);
document.body.classList.add(GM ? "gm" : "player");

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const CARD_W = 220;
const TYPES = {
  npc:      { label: "NPC",   color: "#a855f7" },
  location: { label: "Place", color: "#f59e0b" },
  event:    { label: "Event", color: "#f43f5e" },
  note:     { label: "Note",  color: "#facc15" },
};
const typeOf = (t) => TYPES[t?.type] || TYPES.note;
const truthy = (v) => /^(true|yes|y|1|x)$/i.test(String(v ?? "").trim());
const prop = (t, k) => (Array.isArray(t?.properties) ? t.properties : Object.values(t?.properties || {})).find(p => String(p?.key).trim().toLowerCase() === k)?.value;
const isKnown = (t) => truthy(prop(t, "pc-known"));
const CAMP = (p) => ref(db, `geezvtt/campaign/${p}`);
const PARTY = (p) => ref(db, `geezvtt/party/${camp}/${p}`);

// ── state ──
let campaign = { things: {}, links: {}, maps: {} };
let party = { cards: {}, links: {}, board: {}, notes: {} };
let camp = QS.get("campaign") || localStorage.getItem(GM ? "pinboard.gm.campaign" : "geezvtt.player.lastCampaign") || null;
let view = { things: {}, links: {} };
let hidden = new Set(JSON.parse(localStorage.getItem("pinboard.hiddenTypes") || "[]"));
let selected = null, query = "", firstFit = true;
let playerName = "";
const cam = { x: 0, y: 0, z: 1 };
const dims = {};
let partyUnsub = null, partyLoaded = false;

function toast(m) { $("toast").textContent = m; $("toast").classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").classList.remove("show"), 2200); }

// ── which campaign (root world map) a thing belongs to — same rule as index.html ──
function rootMap(id) { let m = campaign.maps[id], g = 0; while (m && m.parentMap && campaign.maps[m.parentMap] && g++ < 30) m = campaign.maps[m.parentMap]; return m ? m.id || id : null; }
function campaignOf(id) {
  const t = campaign.things[id]; if (!t) return null;
  const mapId = Object.keys(campaign.maps).find(m => campaign.maps[m]?.pins?.[id]);
  if (mapId) return rootMap(mapId);
  if (t.campaign && campaign.maps[t.campaign]) return t.campaign;
  return null;
}
const inCamp = (id) => (campaignOf(id) || camp) === camp;
const worlds = () => Object.entries(campaign.maps).filter(([, m]) => m && !m.parentMap).map(([id, m]) => ({ id, name: m.name || id }));

// ── build what this person sees ──
function buildView() {
  const things = {}, links = {};
  if (GM) {
    for (const [id, t] of Object.entries(campaign.things)) {
      if (!t?.board || !inCamp(id)) continue;
      things[id] = { ...t, id, known: isKnown(t), mine: true };
    }
    for (const [id, l] of Object.entries(campaign.links)) if (l && things[l.from] && things[l.to]) links[id] = { ...l, id };
  } else {
    const known = Object.entries(campaign.things).filter(([id, t]) => t && isKnown(t) && inCamp(id))
      .sort((a, b) => String(a[1].name).localeCompare(String(b[1].name)));
    let n = 0;
    for (const [id, t] of known) {
      const traits = { ...(t.traits || {}) };
      if (!traits.pc) { delete traits.hp; delete traits.ac; delete traits.charId; }
      const board = party.board[id] || { x: 420 + (n % 6) * 260, y: 80 + Math.floor(n / 6) * 190 };
      n++;
      things[id] = { id, type: t.type, name: t.name, traits, notes: "", board, mine: false };
    }

  $("fKnown").checked = !!t.known;
  $("npcFields").hidden = !(edit && t.type === "npc");
  if (t.type === "npc") { idle($("fRole"), tr.role); idle($("fFaction"), tr.faction); idle($("fStatus"), tr.status); }
  $("noteFields").hidden = !(edit && t.type === "note");
  if (t.type === "note") { idle($("fNoteTag"), tr.tag); idle($("fColor"), tr.color || "#facc15"); }
  $("notesWrap").hidden = !edit;
  $("fNotes").placeholder = GM ? "Your notes. Players never see these." : "Your notes on this card";
  idle($("fNotes"), t.notes);
  $("readInfo").innerHTML = !edit ? [t.type === "npc" ? [tr.role, tr.faction, tr.status].filter(Boolean).map(esc).join(" · ") : "", t.type === "event" && tr.when ? esc(tr.when) : ""].filter(Boolean).join("<br>") : "";

  // party notes (players write them on DM cards; the DM can read them)
  const pn = notesOf(selected);
  const showPN = GM ? pn.length > 0 : !t.mine;
  $("partyNotesWrap").hidden = !showPN;
  $("pnTitle").textContent = GM ? "What the party wrote" : "Party notes";
  $("pnList").innerHTML = pn.length ? pn.map(([nid, n]) => `<div class="pnote"><b>${esc(n.author || "Player")}</b> <span class="when">${n.ts ? new Date(n.ts).toLocaleDateString() : ""}</span>${!GM && n.author === playerName ? ` <button class="x" style="float:right;width:22px;height:22px" data-delnote="${esc(nid)}">✕</button>` : ""}<br>${esc(n.text)}</div>`).join("") : `<div class="muted">Nothing yet.</div>`;
  $("pnList").querySelectorAll("[data-delnote]").forEach(b => b.onclick = () => remove(PARTY(`notes/${selected}/${b.dataset.delnote}`)));

  // strings
  const list = Object.values(view.links).filter(l => l.from === selected || l.to === selected)
    .map(l => ({ l, out: l.from === selected, other: l.from === selected ? l.to : l.from }))
    .sort((a, b) => nm(a.other).localeCompare(nm(b.other)));
  $("conns").innerHTML = list.length ? list.map(x => `<div class="conn"><i style="background:${typeOf(view.things[x.other]).color}"></i><span class="r">${x.out ? "" : "← "}${esc(x.l.label || "")}${x.out ? " →" : ""}</span><span class="t" data-go="${esc(x.other)}">${esc(nm(x.other))}</span><button class="x" data-edit="${esc(x.l.id)}" title="Edit">✎</button></div>`).join("")
    : `<div class="muted">None yet. Drag the dot on the card's edge onto another card, or pick one below.</div>`;
  $("conns").querySelectorAll("[data-go]").forEach(b => b.onclick = () => focusCard(b.dataset.go));
  $("conns").querySelectorAll("[data-edit]").forEach(b => b.onclick = (e) => editEdge(b.dataset.edit, e.clientX - 260, e.clientY));
  if (document.activeElement !== $("newTo")) {
    const prev = $("newTo").value;
    $("newTo").innerHTML = `<option value="">Connect to…</option>` + Object.values(view.things).filter(o => o.id !== selected)
      .sort((a, b) => (a.name || "").localeCompare(b.name || "")).map(o => `<option value="${esc(o.id)}">${esc(o.name || "Untitled")} (${esc(typeOf(o).label)})</option>`).join("");
    $("newTo").value = prev;
  }
  $("delCard").hidden = !edit;
}

let saveT = {};
function saveLater(key, patch) { const id = selected; clearTimeout(saveT[key]); saveT[key] = setTimeout(() => patchCard(id, patch()), 350); }
$("fName").oninput = (e) => saveLater("name", () => ({ name: e.target.value }));
$("fNotes").oninput = (e) => saveLater("notes", () => ({ notes: e.target.value }));
$("fRole").oninput = (e) => saveLater("role", () => ({ "traits/role": e.target.value }));
$("fFaction").oninput = (e) => saveLater("faction", () => ({ "traits/faction": e.target.value }));
$("fStatus").oninput = (e) => saveLater("status", () => ({ "traits/status": e.target.value }));
$("fNoteTag").oninput = (e) => saveLater("tag", () => ({ "traits/tag": e.target.value }));
$("fColor").oninput = (e) => saveLater("color", () => ({ "traits/color": e.target.value }));
$("fName").addEventListener("keydown", (e) => { if (e.key === "Enter") $("fNotes").focus(); });
$("fKnown").onchange = (e) => {
  const t = campaign.things[selected]; if (!GM || !t) return;
  const props = (Array.isArray(t.properties) ? t.properties : Object.values(t.properties || {})).filter(p => String(p?.key).trim().toLowerCase() !== "pc-known");
  if (e.target.checked) props.push({ key: "pc-known", value: "true" });
  set(CAMP(`things/${selected}/properties`), props);
  toast(e.target.checked ? "Players can now see this card" : "Hidden from players");
};
$("newConn").onclick = () => {
  const to = $("newTo").value; if (!to) { toast("Pick a card to connect to"); return; }
  const id = (GM ? "link_" : "plink_") + uid();
  set(linkRef(id), { id, from: selected, to, label: $("newRole").value.trim() });
  $("newRole").value = ""; $("newTo").value = "";
};
$("newRole").addEventListener("keydown", (e) => { if (e.key === "Enter") $("newConn").click(); });
$("delCard").onclick = () => deleteCard(selected);
$("offBoard").onclick = () => { if (GM && selected) { set(CAMP(`things/${selected}/board`), null); closeDrawer(); toast("Taken off the board (still in the campaign)"); } };

// party notes
function needName(then) {
  if (playerName) return then();
  $("namePop").hidden = false; $("nameIn").focus();
  $("nameOk").onclick = () => { const v = $("nameIn").value.trim(); if (!v) return; playerName = v; localStorage.setItem(`geezvtt.player.${camp}.name`, v); $("namePop").hidden = true; then(); };
}
$("nameIn").addEventListener("keydown", (e) => { if (e.key === "Enter") $("nameOk").click(); });
$("pnAdd").onclick = () => {
  const text = $("pnInput").value.trim(); if (!text || !selected) return;
  needName(() => { set(PARTY(`notes/${selected}/n${uid()}`), { author: playerName, text, ts: Date.now() }); $("pnInput").value = ""; });
};

// ── search, buttons, keys ──
$("search").oninput = (e) => { query = e.target.value.trim(); renderCards(); };
$("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const q = query.toLowerCase(), inName = (t) => (t.name || "").toLowerCase().includes(q) ? 0 : 1;
    const hits = Object.values(view.things).filter(t => matches(t) && visible(t)).sort((a, b) => inName(a) - inName(b) || (a.name || "").localeCompare(b.name || ""));
    if (!hits.length) return;
    focusCard(hits[(hits.findIndex(t => t.id === selected) + 1) % hits.length].id);
  }
  if (e.key === "Escape") { e.target.value = ""; query = ""; renderCards(); e.target.blur(); }
});
$("addBtn").onclick = () => { $("addMenu").hidden = !$("addMenu").hidden; };
$("fitBtn").onclick = fit;
const zoomC = (f) => { const r = stage.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, f); };
$("zoomIn").onclick = () => zoomC(1.25);
$("zoomOut").onclick = () => zoomC(0.8);
addEventListener("keydown", (e) => {
  const typing = e.target.closest("input, textarea, select");
  if (e.key === "Escape") { if (!$("rolePop").hidden) hidePop(); else if (!typing) closeDrawer(); }
  if (typing) return;
  if (e.key === "f") fit();
  if (e.key === "/") { e.preventDefault(); $("search").focus(); }
  if ((e.key === "Delete" || e.key === "Backspace") && selected) deleteCard(selected);
});
addEventListener("resize", applyCam);

applyCam();
window.__pin = { get view() { return view; }, get camp() { return camp; }, focusCard };
</script>
</body>
</html>
