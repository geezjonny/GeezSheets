<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeezMapConverter · Trace your world</title>
<style>
/* Dragging on the map must never select page text. */
body { user-select: none; -webkit-user-select: none; }
input, textarea, select, [contenteditable] { user-select: text; -webkit-user-select: text; }
:root{color-scheme:dark;--bg:#141a20;--panel:#202933;--line:#3c4c5b;--text:#edf2f4;--muted:#b0bec9;--accent:#7fe5d3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui,sans-serif;overflow:hidden}canvas{display:block;touch-action:none}
button,select,input{font:inherit;color:inherit;background:#293744;border:1px solid var(--line);border-radius:5px;padding:6px;max-width:100%}button{cursor:pointer}button:hover{border-color:var(--accent)}button.active{background:#28584f;border-color:var(--accent);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}
#top-bar{position:absolute;inset:0 0 auto;height:48px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:8px}#level-tabs{display:flex;gap:4px;flex:1;overflow:auto}.level-tab{white-space:nowrap}#scene-name{width:145px}
#toolbar{position:absolute;left:10px;top:60px;width:152px;display:grid;gap:5px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px}#toolbar button{text-align:left;padding:9px 6px}kbd{float:right;font:10px monospace;color:var(--muted);margin-top:3px}
#options-bar{position:absolute;left:172px;right:286px;top:60px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}#options{display:flex;gap:7px;align-items:center;flex-wrap:wrap}#hint{color:var(--accent);padding-top:9px;line-height:1.5}label{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}input[type=number]{width:74px}input[type=range]{width:95px;padding:0}input[type=color]{width:45px;padding:2px}
#sidebar{position:absolute;right:10px;top:60px;bottom:35px;width:266px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px}h2{font-size:16px;margin:0 0 14px}h3{font-size:13px;margin:18px 0 8px;color:var(--accent)}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:9px 0}.row select{width:142px}.muted{color:var(--muted);line-height:1.6}.swatch{display:inline-block;width:10px;height:10px;margin-right:5px;border:1px solid #ffffff66;border-radius:2px}.legend{display:flex;gap:7px 10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:9px}.room-list{display:flex;gap:4px;flex-wrap:wrap;max-height:180px;overflow:auto}.heat{height:9px;background:linear-gradient(90deg,#2779d5,#739cb7,#58616a,#d69248,#f25336);border-radius:3px}
#status-bar{position:absolute;bottom:0;left:0;right:0;height:26px;background:var(--panel);padding:5px 12px;font:11px monospace;color:var(--muted)}.hidden{display:none}#view-controls{position:absolute;left:10px;bottom:38px;width:152px;max-height:calc(100vh - 510px);overflow:auto;padding:9px;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;gap:8px}.wide{width:100%}#welcome{position:absolute;left:30%;top:45%;pointer-events:none;line-height:1.8;color:var(--muted)}
@media(max-width:1000px){#toolbar{width:126px}#options-bar{left:146px;right:246px}#sidebar{width:226px}#view-controls{width:126px}#top-bar strong{display:none}}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,44px);gap:4px;width:min(720px,60vw);max-height:96px;overflow:auto;margin:6px 0}.stamp{width:44px;height:44px;padding:1px;border:1px solid var(--line);border-radius:6px;background:#c9b48a;cursor:pointer}.stamp.on{outline:2px solid #91fff0}.stamp.new{background:transparent;color:inherit;font-size:22px}
</style>
</head>
<body>
<canvas id="canvas" aria-label="Map tracing canvas"></canvas>
<header id="top-bar"><strong>GeezMapConverter</strong><div id="level-tabs"></div><button onclick="newMap()" title="Close this map and start an empty one">New map</button><button onclick="addLevelPrompt()">＋ Import maps</button><button onclick="loadScenePrompt()">Open scene</button><button onclick="saveScene()">Export</button><input id="scene-name" aria-label="Scene name" value="Untitled Map" onchange="pushHistory();state.name=this.value;saveState()"></header>
<nav id="toolbar" aria-label="Tools"></nav>
<section id="options-bar"><div id="options"></div><div id="hint"></div><div id="material-legend" class="legend"></div></section>
<aside id="sidebar" aria-label="Selection panel"></aside>
<div id="view-controls"><button onclick="fitMap()" title="Fit map (F)">Fit map · F</button><label><input type="checkbox" checked onchange="state.view.showImg=this.checked;redraw()">Tracing picture</label><label>Opacity <input type="range" min="0" max="1" step=".05" value=".5" oninput="state.view.opacity=+this.value;redraw()"></label><label><input type="checkbox" checked onchange="state.view.showGrid=this.checked;redraw()">Grid</label><button onclick="undo()" title="Undo (Ctrl+Z)">↶ Undo</button><button onclick="redo()" title="Redo (Ctrl+Shift+Z / Ctrl+Y)">↷ Redo</button><span class="muted">Pan: Space + drag<br>Zoom: wheel</span></div>
<div id="welcome">Drop .dd2vtt maps here to begin.<br>Multiple maps become levels in filename order.<br>Reopen your work with a .geez2vtt file.</div>
<footer id="status-bar">Ready to import</footer>
<input type="file" id="file-input" class="hidden"><input type="file" id="scene-input" class="hidden" accept=".geez2vtt,.json">
<script src="js/props.js"></script>
<script>
const MATERIALS = ["stone","wood","brick","ashlar","cave","fieldstone","marble","palisade","plaster","timber"];
const FLOOR_MATS = ["stone","wood","tile","carpet","cave","cobble","dirt","marble","sand","slab","snow"];
const TERRAIN_MATS = ["grass","dirt","mud","gravel","rocks","sand","snow","water","lava","ice","cobble_road","dirt_path"];
const ELEVATIONS = [-30,-20,-15,-10,-5,0,5,10,15,20,30];
const PORTAL_KINDS = ["door","window","arch"];
const PORTAL_MATS = ["wood","iron","stone","curtain"];
const PROP_IDS = (window.GEEZ_PROPS||[]).map(p=>p.id); // the prop catalogue: js/props.js
// Stamps: the prop catalogue plus your own named stamps (remembered in this browser). Any name exports as a tag.
let customStamps=[];try{customStamps=JSON.parse(localStorage.getItem('geezforge.stamps')||'[]');}catch{}
const allStamps=()=>[...PROP_IDS,...customStamps.filter(s=>!PROP_IDS.includes(s))];
const stampId=name=>String(name).trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);
let Ink=null;import('./js/stamps.js').then(m=>{Ink=m;updateOptions();redraw();}).catch(()=>{}); // same drawings as the VTT (needs a web server, not file://)
function drawStampIcon(cv,id){const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);if(Ink){Ink.drawStamp(x,{id,x:.5,y:.5,scale:id==='blackship'?.12:.8},cv.width);}else{x.fillStyle='#ccc';x.font='9px system-ui';x.textAlign='center';x.fillText(id.slice(0,8),cv.width/2,cv.height/2);}}
function pickStamp(id){state.toolOptions.propId=id;if(state.tool!=='prop')setTool('prop');setMode('draw');} // pick a stamp, then just click the map
function newStamp(){const name=prompt('Name this stamp (e.g. skull, tree, chains):');const id=name&&stampId(name);if(!id)return;if(!allStamps().includes(id)){customStamps.push(id);try{localStorage.setItem('geezforge.stamps',JSON.stringify(customStamps));}catch{}}pickStamp(id);notify('Stamp ready: click the map to place '+id.replaceAll('_',' '));}
function stampSwatch(){
    const cur=state.toolOptions.propId;
    return `<div class="stamps" role="listbox" aria-label="Stamps"><button class="stamp new" onclick="newStamp()" title="New stamp: type a name">+</button>${allStamps().map(id=>`<button class="stamp ${id===cur?'on':''}" role="option" aria-selected="${id===cur}" title="${id.replaceAll('_',' ')}" onclick="pickStamp('${id}')"><canvas width="40" height="40" data-stamp="${id}"></canvas></button>`).join('')}</div><p class="muted">Pick a stamp, then click the map. <b>${cur.replaceAll('_',' ')}</b></p>`;
}
const LIGHT_PRESETS = {candle:{r:2,i:0.8,c:"#ffaa44"},torch:{r:4,i:1,c:"#ffcc88"},brazier:{r:5,i:1.2,c:"#ffbb66"},lantern:{r:6,i:1,c:"#ffeeaa"},magic:{r:8,i:1.1,c:"#aaaaff"}};


const state = {
    name:'Untitled Map', activeLevel:0, grid:{cols:0,rows:0,cell_ft:5}, levels:[],
    tool:'select', layer:'wall', mode:'select', selection:new Set(), history:[], redoStack:[],
    view:{x:0,y:0,zoom:30,showImg:true,opacity:.5,showGrid:true}, dirty:true,
    toolOptions:{material:'stone',floor:'stone',terrain:'grass',elevation:0,brushSize:1,
        portalKind:'door',portalMat:'wood',portalClosed:true,propId:'table',propRot:0,
        lightRange:4,lightIntensity:1,lightColor:'#ffcc88',doorsClose:true}
};
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const toolInfo=[['select','↖','Select','V'],['wall','╱','Walls','W'],['portal','◫','Doors & windows','G'],
    ['light','☀','Lights','L'],['floor','▦','Floor','P'],['terrain','♣','Terrain','T'],
    ['elevation','↥','Elevation','H'],['prop','♟','Props','O'],['eraser','⌫','Erase','E']];
const layerNames={wall:'walls',portal:'doors',light:'lights',prop:'props',cell:'cells'};
const matColors={stone:'#889aaa',wood:'#c08748',brick:'#db6662',ashlar:'#a894ce',cave:'#7e9061',fieldstone:'#94b7a4',marble:'#e0cfed',palisade:'#dfb75a',plaster:'#e8d6b0',timber:'#a76e60',tile:'#549ac9',carpet:'#b94c91',cobble:'#949275',dirt:'#9c7445',sand:'#e8c467',slab:'#7386c5',snow:'#e5f7ff',grass:'#69b84d',mud:'#89704f',gravel:'#b3a4a1',rocks:'#667880',water:'#2da6d6',lava:'#ff633c',ice:'#80eadb',cobble_road:'#b8b774',dirt_path:'#c89c7d'};
let mouse={gx:0,gy:0,x:0,y:0}, action=null, hover=null, rooms=[], barrierCache=null, space=false;
const pictureCache=new Map(); // Pictures stay outside scene JSON, even across undoing an import.
const level=()=>state.levels[state.activeLevel];
const redraw=()=>state.dirty=true;
const screenToGrid=(x,y)=>({x:(x-state.view.x)/state.view.zoom,y:(y-state.view.y)/state.view.zoom});
const snap=v=>Math.round(v*2)/2;
const inMap=(x,y)=>x>=0&&y>=0&&x<state.grid.cols&&y<state.grid.rows;
const cellKey=(x,y)=>`${x},${y}`;
function layer(){return state.layer;}
function items(){return layer()==='cell'?[]:level()?.[layer()+'s']||[];}
function clearSelection(){state.selection=new Set();updateSidebar();redraw();}
function setTool(t){
    state.tool=t;
    const next=['floor','terrain','elevation'].includes(t)?'cell':t;
    if(!['select','eraser'].includes(t)&&next!==state.layer){state.layer=next;clearSelection();}
    state.mode='select'; action=null; hover=null; rooms=[];
    document.querySelectorAll('#toolbar button').forEach(b=>b.classList.toggle('active',b.id==='tool-'+t));
    updateOptions();updateSidebar();redraw();
}
function setLayer(l){state.layer=l;clearSelection();rooms=[];updateOptions();}
function setMode(m){state.mode=m;action=null;updateOptions();redraw();}
function options(values,value){return values.map(v=>`<option value="${v}" ${v===value?'selected':''}>${v}</option>`).join('');}
function optionSelect(id,values,key){return `<select id="${id}" aria-label="Current ${key}" onchange="state.toolOptions.${key}=this.value;updateOptions()">${options(values,state.toolOptions[key])}</select>`;}
function updateOptions(){
    const t=state.tool,o=state.toolOptions,cell=layer()==='cell';
    let h='';
    if(['select','eraser'].includes(t)) h+=`<label>Layer <select aria-label="Selection layer" onchange="setLayer(this.value)">${options(['wall','portal','light','prop','cell'],layer())}</select></label>`;
    const modes=['select'];
    if(t==='select'&&cell)modes.push('room');
    if(!['select','eraser'].includes(t))modes.push(...(cell?['brush','rect','room']:['draw']));
    h+=modes.map(m=>`<button id="mode-${m}" class="${state.mode===m?'active':''}" onclick="setMode('${m}')" title="${{select:'S',draw:'D',brush:'B',rect:'R',room:'M'}[m]}">${{select:'Select · S',draw:t==='wall'?'Draw · D':'Place · D',brush:'Brush · B',rect:'Rectangle · R',room:'Room · M'}[m]}</button>`).join('');
    if(t==='wall') h+=optionSelect('current-material',MATERIALS,'material');
    if(t==='portal') h+=optionSelect('current-kind',PORTAL_KINDS,'portalKind')+optionSelect('current-material',PORTAL_MATS,'portalMat');
    if(t==='floor') h+=optionSelect('current-material',FLOOR_MATS,'floor');
    if(t==='terrain') h+=optionSelect('current-material',TERRAIN_MATS,'terrain');
    if(t==='elevation')h+=`<label>Height <input id="elevation-value" aria-label="Paint elevation" type="range" min="-30" max="30" step="5" value="${o.elevation}" oninput="setPaintHeight(+this.value)"><strong id="height-label">${o.elevation} ft</strong> ±</label>`;
    if(cell&&!['select','eraser'].includes(t)){
        h+=`<label>Brush <input id="brush-size" aria-label="Brush size" type="number" min="1" max="5" value="${o.brushSize}" onchange="state.toolOptions.brushSize=Math.max(1,Math.min(5,+this.value||1))"> [ ]</label>`;
        h+=`<label><input id="doors-close" type="checkbox" ${o.doorsClose?'checked':''} onchange="state.toolOptions.doorsClose=this.checked;barrierCache=null;rooms=[];updateSidebar();redraw()">Doors close rooms</label>`;
        h+=`<button id="fill-room" onclick="fillSelected()">Fill room with ${t==='elevation'?o.elevation+' ft':o[t]}</button><button id="fill-all-rooms" onclick="findRooms()" title="Find enclosed regions, number them, then click a room to select it">Fill all rooms…</button>`;
    }
    if(t==='light')h+=`<label>Preset <select aria-label="Current light preset" onchange="setLightPreset(this.value)">${options(Object.keys(LIGHT_PRESETS),'torch')}</select></label>`;
    if(t==='prop')h+=stampSwatch();
    if(t==='portal')h+=`<button id="next-unreviewed" onclick="nextUnreviewed()">Next unreviewed (${level()?.portals.filter(p=>!p.reviewed).length||0})</button>`;
    document.getElementById('options').innerHTML=h;
    document.querySelectorAll('#options canvas[data-stamp]').forEach(cv=>drawStampIcon(cv,cv.dataset.stamp));
    const name=layerNames[layer()];
    let hint=`Drag empty space to box-select ${name}. Click one to select it. Shift adds; Alt removes.`;
    if(state.mode==='draw')hint=t==='wall'?'Drag to draw a wall. S returns to selection.':t==='portal'?'Drag between endpoints to place a door or window. S returns to selection.':'Click to place. S returns to selection.';
    if(state.mode==='brush')hint='Drag to paint. [ ] changes brush size. + / − changes elevation. S selects cells.';
    if(state.mode==='rect')hint='Drag a rectangle to paint its cells. One stroke = one undo step. S selects cells.';
    if(state.mode==='room')hint=t==='select'?'Click to select a room, then Apply in the side panel. Shift adds; Alt removes.':'Click to fill a room with the current material. Shift adds rooms; Alt removes from selection.';
    if(t==='eraser')hint=`Select ${name}, then Delete or Clear selection data. Shift adds; Alt removes.`;
    document.getElementById('hint').textContent=hint+' Esc clears · Ctrl+A selects this layer.';
    const mats=t==='wall'?MATERIALS:t==='floor'?FLOOR_MATS:t==='terrain'?TERRAIN_MATS:[];
    document.getElementById('material-legend').innerHTML=mats.map(m=>`<span><i class="swatch" style="background:${matColors[m]}"></i>${m}</span>`).join('');
}
function selectedObjects(){return layer()==='cell'?[...state.selection].map(k=>level()?.cells[k]||{}):[...state.selection];}
function setPaintHeight(value){
    state.toolOptions.elevation=value;
    document.getElementById('height-label').textContent=value+' ft';
    document.getElementById('fill-room').textContent='Fill room with '+value+' ft';
}
function updateSidebar(){
    const sb=document.getElementById('sidebar');if(!sb)return;
    const n=state.selection.size, first=selectedObjects()[0]||{}, o=state.toolOptions;
    let h=`<h2 id="selection-count">${layer()==='cell'?`Selected: ${n} cells`:`${n} ${layerNames[layer()]} selected`}</h2>`;
    if(!n)h+='<p class="muted">Choose a tool, then click an item or drag empty space to select a group. Use Draw / Place or Brush to create.</p>';
    const sel=(label,key,vals,fallback)=>`<div class="row"><label for="batch-${key}">${label}</label><select id="batch-${key}" ${!n?'disabled':''} onchange="updateSelected('${key}',this.value)"><option value="" selected disabled>${selectedObjects().every(x=>x[key]===first[key])?(first[key]??fallback):'Mixed — choose'}</option>${options(vals,null)}</select></div>`;
    const num=(label,key,fallback,step=1)=>`<div class="row"><label for="batch-${key}">${label}</label><input id="batch-${key}" ${!n?'disabled':''} type="number" step="${step}" value="${first[key]??fallback}" onchange="updateSelected('${key}',+this.value)"></div>`;
    if(layer()==='portal'){
        h+=sel('Kind','kind',PORTAL_KINDS,'door')+sel('Material','material',PORTAL_MATS,'wood');
        for(const k of ['closed','reviewed'])h+=`<div class="row"><label>${k}<input id="batch-${k}" ${!n?'disabled':''} type="checkbox" ${first[k]?'checked':''} onchange="updateSelected('${k}',this.checked)"></label></div>`;
    }
    if(layer()==='wall')h+=sel('Material','material',MATERIALS,o.material);
    if(layer()==='light')h+=`<div class="row"><label>Preset</label><select id="batch-preset" ${!n?'disabled':''} onchange="batchPreset(this.value)"><option value="">Choose…</option>${options(Object.keys(LIGHT_PRESETS),'')}</select></div>`+num('Range','range',4)+num('Intensity','intensity',1,.1)+`<div class="row"><label>Color</label><input id="batch-color" type="color" ${!n?'disabled':''} value="${/^#[0-9a-f]{6}$/i.test(first.color)?first.color:'#ffcc88'}" onchange="updateSelected('color',this.value)"></div>`;
    if(layer()==='prop')h+=sel('Prop id','id',allStamps(),o.propId)+`<div class="row"><label>Rotate</label><button onclick="rotateSelected(-90)">−90°</button><button onclick="rotateSelected(90)">+90°</button></div>`+num('Scale','scale',1,.1);
    if(layer()==='cell'){
        for(const [key,label,vals] of [['floor','Floor',FLOOR_MATS],['terrain','Terrain',TERRAIN_MATS],['elevation','Elevation ft',null]]){
            h+=`<div class="row"><label for="batch-${key}">${label}</label>${vals?`<select id="batch-${key}" onchange="state.toolOptions.${key}=this.value">${options(vals,o[key])}</select>`:`<input id="batch-${key}" type="number" step="5" value="${o[key]}" onchange="state.toolOptions.elevation=+this.value">`}<button id="apply-${key}" ${!n?'disabled':''} onclick="applyBatch('${key}')">Apply</button></div>`;
        }
        h+=`<p class="muted">Enter applies the current tool's material.</p><div class="row"><button onclick="clearCells('floor')">Clear floor</button><button onclick="clearCells('terrain')">Clear terrain</button></div><button onclick="clearCells('elevation')">Clear elevation</button>`;
    }
    h+=`<p><button id="delete-selection" class="wide" ${!n?'disabled':''} onclick="removeSelected()">${layer()==='cell'?'Clear selection data':'Delete selection'} · Del</button></p>`;
    if(layer()==='cell'){
        h+='<h3>Elevation · feet</h3><div class="heat"></div><div class="row muted"><span>−30 blue</span><span>0</span><span>+30 warm</span></div>';
        if(rooms.length)h+=`<h3>${rooms.length} enclosed rooms</h3><p class="muted">Click a number or its map label to select that room, then fill it.</p><div class="room-list">${rooms.map((r,i)=>`<button onclick="selectRoom(${i})" title="${r.length} cells">${i+1} · ${r.length}</button>`).join('')}</div><p><button onclick="fillAllRooms()">Fill all ${rooms.length} rooms with current value</button></p>`;
    }
    h+='<h3>Selection shortcuts</h3><div class="muted">S Select · D Draw / Place<br>B Brush · R Rectangle · M Room<br>Shift adds · Alt removes<br>Esc clears · Ctrl+A all on level</div>';
    sb.innerHTML=h+propPanel()+guessPanel();
    if(level()?.img)for(const el of sb.querySelectorAll('canvas[data-prop-group]')){
        const p=level().props.find(p=>p.guessed&&p.group===+el.dataset.propGroup),b=p.bounds||[p.x-.5,p.y-.5,1,1],img=level().img;
        el.getContext('2d').drawImage(img,(b[0]-.3)*img.width/state.grid.cols,(b[1]-.3)*img.height/state.grid.rows,(b[2]+.6)*img.width/state.grid.cols,(b[3]+.6)*img.height/state.grid.rows,0,0,48,48);
    }
    for(const k of ['closed','reviewed']){const el=document.getElementById('batch-'+k);if(el)el.indeterminate=selectedObjects().some(x=>!!x[k]!==!!first[k]);}
}
function editSelection(fn){
    if(!level()||!state.selection.size)return;pushHistory();
    if(layer()==='cell')for(const k of state.selection){const c=level().cells[k]||={};fn(c);markReviewed(k);if(!Object.keys(c).length)delete level().cells[k];}
    else for(const obj of state.selection){fn(obj);if(layer()==='prop')obj.reviewed=true;}
    barrierCache=null;updateSidebar();updateOptions();redraw();
}
function applyBatch(key){const el=document.getElementById('batch-'+key),value=key==='elevation'?+el.value:el.value;state.toolOptions[key]=value;updateSelected(key,value);}
function updateSelected(k,v){editSelection(obj=>obj[k]=v);}
function rotateSelected(degrees){editSelection(obj=>obj.rotation=((obj.rotation||0)+degrees+360)%360);}
function clearCells(key){editSelection(obj=>delete obj[key]);}
function batchPreset(k){if(!LIGHT_PRESETS[k])return;const p=LIGHT_PRESETS[k];editSelection(obj=>Object.assign(obj,{range:p.r,intensity:p.i,color:p.c}));}
function setLightPreset(k){const p=LIGHT_PRESETS[k];Object.assign(state.toolOptions,{lightRange:p.r,lightIntensity:p.i,lightColor:p.c});}
function removeSelected(){
    if(!level()||!state.selection.size)return;pushHistory();
    if(layer()==='cell')for(const k of state.selection){delete level().cells[k];markReviewed(k);}
    else {if(layer()==='prop')for(const p of state.selection)(guessState().propDismissed||=[]).push({x:p.x,y:p.y,size:p.size});level()[layer()+'s']=items().filter(o=>!state.selection.has(o));}
    barrierCache=null;rooms=[];clearSelection();updateOptions();
}
function select(values,e={}){if(!e.shiftKey&&!e.altKey)state.selection.clear();for(const v of values){if(e.altKey)state.selection.delete(v);else state.selection.add(v);}updateSidebar();redraw();}
function selectAll(){if(!level())return;if(layer()==='cell'){const all=[];for(let y=0;y<state.grid.rows;y++)for(let x=0;x<state.grid.cols;x++)all.push(cellKey(x,y));select(all);}else select(items());}
function lineDist(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],d=dx*dx+dy*dy;const t=d?Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/d)):0;return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy);}

function barriers(){

function pictureFrom(b64) {
    return new Promise(res => {
        if (!b64) return res(null);
        const type = b64.startsWith('iVBOR') ? 'png' : b64.startsWith('/9j/') ? 'jpeg' : 'webp';
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = () => res(null);
        img.src = 'data:image/' + type + ';base64,' + b64;
    });
}
async function attachPicture(lv, b64) {

    state.dirty = true;
}

let importNote = '';

function newMap() {

async function importDD2VTT(data, filename) {
    importNote = '';
    const img = await pictureFrom(data.image);
    if (!img) notify(filename + ': the picture could not be read; walls, doors and lights still load.', true);
    {
        const size = data.resolution.map_size;
        // A map with a different grid size is a new map, never a level of the open one (its picture would be stretched over the wrong grid).
        if(state.levels.length && (state.grid.cols !== size.x || state.grid.rows !== size.y)) { pushHistory(); resetMap(); importNote = 'Different size from the open map, so it opened as a new map.'; }
        else if(state.levels.length) importNote = 'Same size as the open map, so it was added as level ' + (state.levels.length + 1) + '. Press New map to convert it on its own.';
        if(state.levels.length === 0) {
            state.grid.cols = data.resolution.map_size.x;
            state.grid.rows = data.resolution.map_size.y;
            state.name = filename.replace(/\.[^/.]+$/, "").replace(/_\d+$/, "");
            document.getElementById('scene-name').value = state.name;
        }
        const lv = {
            name: filename.replace(/\.[^/.]+$/, ""), level: state.levels.length, elevation: state.levels.length * 10,
            source: filename, cells: {}, walls: [], portals: [], lights: [], props: [], img: img
        };
        if(img) pictureCache.set(filename,img);
        // Walls, doors and lights are relative to map_origin (usually 0,0).
        const ox = +data.resolution.map_origin?.x || 0, oy = +data.resolution.map_origin?.y || 0;
        const at = v => ({x: v.x - ox, y: v.y - oy});
        data.line_of_sight = data.line_of_sight?.map(poly => poly.map(at));
        data.objects_line_of_sight = data.objects_line_of_sight?.map(poly => poly.map(at));
        data.portals = data.portals?.map(q => ({...q, bounds: q.bounds.map(at)}));
        data.lights = data.lights?.map(l => ({...l, position: at(l.position)}));
        data.line_of_sight?.forEach(poly => {
            for(let i=0; i<poly.length-1; i++) lv.walls.push({a:[poly[i].x, poly[i].y], b:[poly[i+1].x, poly[i+1].y], material:"stone"});
        });
        data.objects_line_of_sight?.forEach(poly => {
            for(let i=0; i<poly.length-1; i++) lv.walls.push({a:[poly[i].x, poly[i].y], b:[poly[i+1].x, poly[i+1].y], material:"stone", object:true});
        });
        data.portals?.forEach(p => {
            lv.portals.push({a:[p.bounds[0].x, p.bounds[0].y], b:[p.bounds[1].x, p.bounds[1].y], kind:"door", material:"wood", closed:p.closed, reviewed:false});
        });
        data.lights?.forEach(l => {
            let c = l.color; if(c.length === 8) c = c.slice(2); if(!c.startsWith('#')) c = '#'+c;
            lv.lights.push({x:l.position.x, y:l.position.y, range:l.range, intensity:l.intensity, color:c});
        });
        pushHistory();
        state.levels.push(lv);
        clearSelection(); rooms = []; barrierCache = null;
        state.activeLevel = state.levels.length - 1;
        if(img)guessMaterials(false);
        fitMap();
        updateLevelTabs(); updateOptions();
        saveState();
    };
}

        if(area<.12||area>24||Math.min(bw,bh)<.23||Math.max(bw,bh)>7||aspect>6||area/(bw*bh)<.28)continue;
        const x=(sx/tail+.5)/s,y=(sy/tail+.5)/s,inside=!!g.samples[cellKey(Math.floor(x),Math.floor(y))]?.inside;
        const nearWall=(idx.buckets.get(cellKey(Math.floor(x),Math.floor(y)))||[]).some(a=>lineDist(x,y,a.a,a.b)<Math.min(bw,bh)/2+.5);
        const p={x,y,rotation:(.5*Math.atan2(2*(sxy-sx*sy/tail),sxx-sx*sx/tail-syy+sy*sy/tail)*180/Math.PI+360)%360,scale:Math.sqrt(bw*bh),size:Math.max(bw,bh),bounds:[minx/s,miny/s,bw,bh],color:sum.map(v=>Math.round(v/tail)),aspect,solidity:area/(bw*bh),roundness:Math.min(1,4*Math.PI*tail/(perimeter*perimeter)),inside,nearWall,colorSpread:lumMax-lumMin,brightFraction:bright/tail,guessed:true,reviewed:false};
        p.id=classifyProp(p);
        // Bright pixels at a known imported light are already represented in the scene.
        if(['brazier','campfire'].includes(p.id)&&lv.lights.some(l=>Math.hypot(l.x-x,l.y-y)<.65))continue;
        candidates.push(p);
    }
    const preserved=lv.props.filter(p=>p.reviewed!==false),dismissed=g.propDismissed||[],groups=[];
    lv.props=[...preserved];
    for(const p of candidates){
        if([...preserved,...dismissed].some(q=>Math.hypot(q.x-p.x,q.y-p.y)<Math.max(.45,(q.size||.7)*.45)))continue;
        let group=groups.findIndex(q=>q.id===p.id&&Math.abs(Math.log(p.size/q.size))<.5&&Math.abs(p.aspect-q.aspect)<.85&&Math.hypot(...p.color.map((v,i)=>v-q.color[i]))<65);
        if(group<0){group=groups.length;groups.push({id:p.id,size:p.size,aspect:p.aspect,color:p.color,show:false});}
        p.group=group;lv.props.push(p);
    }
    // Keep reviewed objects attached to a matching group without changing their labels.
    for(const p of preserved)if(p.guessed){
        let group=groups.findIndex(q=>q.id===p.id&&Math.abs(Math.log(p.size/q.size))<.5&&Math.abs(p.aspect-q.aspect)<.85&&Math.hypot(...p.color.map((v,i)=>v-q.color[i]))<65);
        if(group<0){group=groups.length;groups.push({id:p.id,size:p.size,aspect:p.aspect,color:p.color,show:false});}p.group=group;
    }
    g.propGroups=groups;clearSelection();updateSidebar();redraw();saveState();
    const ms=performance.now()-start;notify(`Found ${lv.props.length-preserved.length} candidate props in ${Math.round(ms)} ms. Review prop groups.`);return ms;
}

function toScene() {
    return JSON.stringify({
        format: "geez2vtt", version: 1, name: state.name, grid: state.grid,
        floors: state.levels.map(l => ({
            level: l.level, name: l.name, elevation: l.elevation, source: l.source,
            cells: Object.keys(l.cells).length ? l.cells : undefined,
            converter: l.converter?{...l.converter,propRecords:l.props}:undefined,
            walls: l.walls.length ? l.walls : undefined,
            portals: l.portals.length ? l.portals : undefined,
            lights: l.lights.length ? l.lights : undefined,
            props: l.props.some(p=>p.id&&p.id!=='unknown') ? l.props.filter(p=>p.id&&p.id!=='unknown').map(({id,x,y,rotation=0,scale=1})=>({id,x,y,rotation,scale})) : undefined
        }))
    }, (k,v) => v === null ? undefined : v, 1);
}

function fromScene(json, keepView) {
    const data = JSON.parse(json);
    state.levels.filter(l => l.img).forEach(l => pictureCache.set(l.source,l.img));
    const pics = Object.fromEntries(pictureCache);
    state.name = data.name; state.grid = data.grid; state.levels = [];
    data.floors.forEach(f => {
        state.levels.push({
            name: f.name, level: f.level, elevation: f.elevation, source: f.source,
            converter:f.converter, cells: f.cells || {}, walls: f.walls || [], portals: f.portals || [],
            lights: f.lights || [], props: f.converter?.propRecords || f.props || [], img: pics[f.source] || null
        });
    });
    if (!keepView) state.activeLevel = 0;
    state.activeLevel = Math.min(state.activeLevel, state.levels.length - 1);
    rooms = []; barrierCache = null; hover = null; action = null; clearSelection();
    document.getElementById('scene-name').value = state.name;
    updateLevelTabs(); updateOptions(); if (!keepView) fitMap(); state.dirty = true;
}

function saveScene() {
    const blob = new Blob([toScene()], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `${state.name}.geez2vtt`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function loadScenePrompt() { document.getElementById('scene-input').click(); }
document.getElementById('scene-input').onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = () => fromScene(reader.result);
    reader.readAsText(file);
};

function pushHistory() {
    state.history.push(toScene());
    if(state.history.length > 200) state.history.shift();
    state.redoStack = [];
}
function undo() { if(state.history.length) { state.redoStack.push(toScene()); fromScene(state.history.pop(), true); } }
function redo() { if(state.redoStack.length) { state.history.push(toScene()); fromScene(state.redoStack.pop(), true); } }

function saveState() { autosave(); }
function autosave() {
    try {
        if(state.levels.length === 0) return;
        localStorage.setItem("geez.mapconvert." + state.name, toScene());
    } catch(e) {}
}


init();
</script>
</body>
