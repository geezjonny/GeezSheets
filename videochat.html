<html lang="en">
<head>
  <meta charset="utf-8">

  <style>
    :root{color-scheme:dark;--bg:#101317;--panel:#191e24;--panel2:#202730;--line:#303944;--text:#edf2f7;--muted:#9aa6b2;--accent:#72e0a2;--warn:#f2bd62;--danger:#ef7777;--shadow:0 16px 50px #0008}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -20%,#27303b 0,#101317 46%);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .hidden{display:none!important}.app{min-height:100vh}.join-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.join-card{width:min(760px,100%);background:linear-gradient(145deg,#1d242c,#14181d);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(22px,5vw,48px)}h1{font-size:clamp(1.7rem,4vw,2.6rem);margin:0 0 8px;letter-spacing:-.04em}h2{margin:0 0 6px;font-size:1.25rem}.sub{color:var(--muted);margin:0 0 28px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}label{color:#cdd5dd;font-size:.9rem}.text-input,select{width:100%;border:1px solid var(--line);background:#101419;color:var(--text);border-radius:9px;padding:11px 12px}.options{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:20px 0 12px}.check{display:flex;gap:8px;align-items:center}.check input{accent-color:var(--accent);width:17px;height:17px}.preview-wrap{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:start;margin-top:18px}.preview-box{aspect-ratio:16/10;background:#0b0e11;border:1px solid var(--line);border-radius:10px;overflow:hidden}.preview-box video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.device-actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary,.danger{border:1px solid transparent;border-radius:9px;padding:11px 16px;font-weight:700}.primary{background:var(--accent);color:#102016}.secondary{background:#242c35;color:var(--text);border-color:var(--line)}.danger{background:#542b31;color:#ffdfe0;border-color:#7d3c43}.join-actions{display:flex;gap:10px;align-items:center;margin-top:24px}.message{padding:10px 12px;border-radius:8px;margin-top:14px;background:#332b1c;color:#f5d18e;border:1px solid #6b542e}.message.error{background:#3a2227;color:#ffc2c2;border-color:#713a42}.room{padding:14px;min-height:100vh}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 12px;max-width:1500px}.brand{font-weight:800;letter-spacing:-.02em}.room-meta{color:var(--muted);font-size:.9rem}.banner{max-width:1500px;margin:0 auto 12px;padding:10px 12px;border:1px solid #6b542e;background:#332b1c;color:#f5d18e;border-radius:8px}.tiles{max-width:1500px;margin:0 auto;padding-bottom:92px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tile{position:relative;min-width:0;aspect-ratio:16/10;overflow:hidden;background:#0b0e11;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 22px #0004;transition:.18s border-color,.18s transform}.tile:hover{border-color:#637383}.tile.pinned{grid-column:span 2;grid-row:span 2;aspect-ratio:16/10}.tile video{width:100%;height:100%;object-fit:cover;display:block}.tile.self video{transform:scaleX(-1)}.avatar{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(2.5rem,8vw,5rem);font-weight:800;color:#b9c5d1;background:radial-gradient(circle at 50% 35%,#45515e,#222a32 48%,#11151a)}.tile .label{position:absolute;left:10px;bottom:9px;display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;background:#080a0dcc;max-width:calc(100% - 20px);font-size:.84rem}.tile .label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icons{display:flex;gap:4px;color:#f4a6a6}.quality{position:absolute;right:9px;top:8px;color:#b3bec9;background:#080a0dcc;padding:3px 6px;border-radius:6px;font-size:.7rem}.quality.connected{color:var(--accent)}.quality.reconnecting,.quality.connecting{color:var(--warn)}.speaking{box-shadow:0 0 0 2px var(--accent),0 0 0 5px #72e0a244}.volume{position:absolute;right:8px;bottom:8px;width:70px;accent-color:var(--accent);opacity:.85}.controls{position:fixed;z-index:4;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#171c22ec;border:1px solid var(--line);padding:9px;border-radius:14px;box-shadow:var(--shadow);max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center}.controls button{border:1px solid var(--line);background:#252e38;color:var(--text);border-radius:8px;padding:9px 11px}.controls button.on{background:#315844;border-color:#4f9d6e}.controls button.leave{background:#592b31;border-color:#86414a}.popover{position:fixed;z-index:5;bottom:82px;left:50%;transform:translateX(-50%);width:min(360px,calc(100% - 24px));background:#1a2027;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow);display:grid;gap:12px}.chat{position:fixed;z-index:3;right:16px;bottom:82px;width:min(330px,calc(100% - 32px));max-height:55vh;background:#1a2027;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr auto}.chat-head{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}.chat-list{overflow:auto;padding:10px 12px;display:grid;gap:8px}.chat-msg{font-size:.85rem;overflow-wrap:anywhere}.chat-msg b{color:var(--accent)}.chat-form{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.chat-form input{min-width:0;flex:1}.compact .room{padding:6px}.compact .topbar,.compact .banner,.compact .controls,.compact .chat{display:none}.compact .tiles{display:flex;overflow-x:auto;gap:6px;padding:0}.compact .tile{flex:0 0 112px;aspect-ratio:1.35}.compact .tile.pinned{flex:0 0 112px;grid-column:auto;grid-row:auto}.compact .tile .label{font-size:.68rem;left:4px;bottom:4px;padding:3px 5px}.compact .quality{font-size:.58rem;right:4px;top:4px}.compact .volume{display:none}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.preview-wrap{grid-template-columns:1fr}.preview-box{max-width:260px}.join-shell{padding:14px}.room{padding:8px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{aspect-ratio:1.25}.tile.pinned{grid-column:span 2;grid-row:auto}.controls{bottom:8px}.controls button{padding:8px 9px;font-size:.85rem}}

    /* ---- VTT skin: leather + brass, Georgia, square corners, slim menu-bar-style controls (matches js/vtt/vtt.css) ---- */
    :root{color-scheme:dark;--leather:#3a2819;--leather-dk:#24170d;--brass:#b98f45;--brass-lt:#e0bf7a;--paper:#eadfc3;--ink:#2b2012;--bg:#24170d;--panel:#2e2013;--panel2:#3a2819;--line:#6b5230;--text:#eadfc3;--muted:#b8a579;--accent:#e0bf7a;--warn:#e0bf7a;--danger:#c0604c;--shadow:2px 4px 10px #0009;--speak:#d89a2b}
    *{scrollbar-width:thin;scrollbar-color:var(--brass) var(--leather-dk)}
    html,body{font:.85rem/1.35 Georgia,"Palatino Linotype",serif;background:var(--leather-dk);color:var(--paper)}
    button,input,select{font-family:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--brass-lt);outline-offset:1px}
    h1{font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brass-lt);margin:0 0 4px}.sub{font-size:.76rem;font-style:italic;color:var(--muted);margin:0 0 12px}
    .join-shell{padding:10px;min-height:100vh;place-items:start center}.join-card{background:var(--leather);border:1px solid var(--brass);border-radius:0;box-shadow:none;padding:14px}
    .form-grid{gap:10px}.field{gap:3px}label{color:var(--brass-lt);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase}.check{text-transform:none;letter-spacing:0;font-size:.82rem;color:var(--paper)}.check input{accent-color:var(--brass);width:14px;height:14px}
    .text-input,select{background:var(--paper);color:var(--ink);border:1px solid var(--brass);border-radius:0;padding:5px 7px;font-size:.85rem}
    .options{margin:12px 0 8px}.preview-wrap{margin-top:10px;gap:10px}.preview-box{border-radius:0;background:#150d06;border:1px solid var(--brass)}
    .primary,.secondary,.danger{border:1px solid var(--brass);border-radius:0;padding:5px 12px;font:700 .8rem Georgia,serif;color:var(--brass-lt);background:linear-gradient(#5a4128,#3d2a18)}
    .primary:hover,.secondary:hover{background:var(--brass);color:var(--ink)}.secondary{background:none;font-weight:400}.danger{background:#5a2a20;color:#f3d9c8}
    .join-actions{margin-top:14px}.room-meta{font-size:.72rem;color:var(--muted);font-style:italic}
    .message{border-radius:0;background:#2b1d0e;border:1px solid var(--brass);color:var(--brass-lt);font-size:.8rem}.message.error{background:#3a1e14;border-color:#a94c3d;color:#f0c0b0}
    .room{padding:6px}.topbar{margin:0 0 6px;max-width:none}.brand{display:none}.topbar .secondary{padding:1px 8px;font-size:.72rem}
    .banner{max-width:none;margin:0 0 6px;border-radius:0;padding:4px 8px;font-size:.74rem;background:#2b1d0e;border-color:var(--brass);color:var(--brass-lt)}
    .tiles{max-width:none;margin:0;padding-bottom:36px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
    .tile{aspect-ratio:4/3;background:#150d06;border:1px solid var(--brass);border-radius:0;box-shadow:none;transition:border-color .15s,box-shadow .15s}.tile:hover{border-color:var(--brass-lt)}
    .tile.pinned{grid-column:1/-1;grid-row:auto;aspect-ratio:16/10}
    .avatar{background:radial-gradient(circle at 50% 35%,#5a4128,#24170d 72%);color:var(--brass-lt);font:700 clamp(1.6rem,7vw,3rem) Georgia,serif}
    .tile .label{left:0;bottom:0;border-radius:0;background:#24170de6;color:var(--paper);padding:2px 7px;font-size:.72rem;font-style:italic;max-width:100%}
    .icons{color:#e8a090}.quality{top:0;right:0;border-radius:0;background:#24170dd0;color:var(--muted);font-size:.62rem;padding:2px 5px}.quality.connected{display:none}
    .speaking{border-color:var(--speak);box-shadow:0 0 0 1px var(--speak),0 0 10px 1px #d89a2b99}.volume{width:54px;right:4px;bottom:4px;accent-color:var(--brass)}
    .controls{bottom:0;left:0;right:0;transform:none;max-width:none;height:28px;padding:0;gap:0;flex-wrap:nowrap;justify-content:flex-start;background:var(--leather-dk);border:0;border-top:1px solid var(--brass);border-radius:0;box-shadow:none}
    .controls button{height:100%;flex:0 0 auto;padding:0 .7rem;border:0;border-radius:0;background:none;color:var(--brass-lt);font:.8rem Georgia,serif}
    .controls button:hover{background:#b98f4540}.controls button.on{background:#b98f4566;color:#fff}.controls button.leave{margin-left:auto;color:#e8a090;background:none;border:0}.controls button.leave:hover{background:#8a3a2a;color:#fff}
    .popover,.chat{background:var(--leather-dk);border:1px solid var(--brass);border-radius:0;box-shadow:var(--shadow)}
    .popover{bottom:34px;width:min(300px,calc(100% - 12px));padding:10px;gap:8px}.chat{right:6px;bottom:34px;width:min(300px,calc(100% - 12px));max-height:60vh}
    .chat-head{padding:3px 8px;border-bottom:1px solid var(--brass);color:var(--brass-lt);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;align-items:center}.chat-head .secondary{padding:0 7px;font-size:.7rem}
    .chat-list{padding:6px 8px;gap:5px}.chat-msg{font-size:.8rem}.chat-msg b{color:var(--brass-lt)}.chat-form{padding:5px;border-top:1px solid var(--brass)}.chat-form .primary{padding:3px 10px}

    /* ---- video-only: no bar, no header, no text chat; mic / cam / leave float inside your own tile ---- */
    .controls,.topbar,.chat,.popover{display:none!important}
    html,body{height:100%;overflow:hidden}.room{padding:0;height:100vh;min-height:0}
    .banner{position:absolute;top:0;left:0;right:0;z-index:5;margin:0}
    .tiles{height:100vh;padding:0;gap:2px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));grid-auto-rows:minmax(0,1fr)}
    .tile{aspect-ratio:auto;border:0}.tile.pinned{grid-column:1/-1;grid-row:auto;aspect-ratio:auto}
    .speaking{box-shadow:none}.tile.speaking::after{content:"";position:absolute;inset:0;border:2px solid var(--speak);pointer-events:none;z-index:2}
    .selfctl{position:absolute;right:6px;bottom:6px;display:flex;gap:4px;z-index:3}
    .fab{width:26px;height:26px;padding:0;display:grid;place-items:center;border:1px solid var(--brass);border-radius:0;background:#24170dcc;color:var(--brass-lt);cursor:pointer}
    .fab:hover{background:var(--brass);color:var(--ink)}.fab.off{background:#5a2a20e6;color:#f3d9c8;border-color:#a94c3d}.fab.leave:hover{background:#8a3a2a;color:#fff}
  </style>

<body>
  <main id="app" class="app"></main>
  <script src="js/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script type="module">
    /* Optional TURN: localStorage key 'geez.videochat.turn' may contain a JSON array of
       RTCIceServer objects, or define window.GEEZ_TURN_SERVERS before this module loads. */
    const $ = (s, root = document) => root.querySelector(s);
    const params = new URLSearchParams(location.search), compact = params.get('compact') === '1';
    const peerId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36);
    const state = { room:'', name:'', localStream:null, cameraOn:false, micOn:false, screenTrack:null, peers:new Map(), presenceRef:null, signalsRef:null, roomRef:null, audio:new Map(), joined:false, previewStream:null };
    const app = $('#app');
    const safeStorage = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}, remove(k){try{localStorage.removeItem(k)}catch{}} };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initialRoom = params.get('room') || '';
    const initialName = params.get('name') || safeStorage.get('geez.videochat.name') || '';
    function setMessage(text, error = false){ const node = $('#joinMessage'); if(node){node.textContent = text; node.className = 'message' + (error ? ' error' : ''); node.hidden = !text;} }
    function joinScreen(){ app.innerHTML = `<section class="join-shell"><div class="join-card"><h1>Geez Video Chat</h1><p class="sub">A lightweight tabletop room for your GM and party.</p><div class="form-grid"><div class="field"><label for="name">Display name</label><input class="text-input" id="name" maxlength="40" value="${esc(initialName)}" placeholder="Your name" autocomplete="nickname"></div><div class="field"><label for="room">Room name</label><input class="text-input" id="room" maxlength="60" value="${esc(initialRoom)}" placeholder="e.g. moonlit-tavern"></div></div><div class="options"><label class="check"><input id="useCamera" type="checkbox" checked> Camera</label><label class="check"><input id="useMic" type="checkbox" checked> Microphone</label></div><div class="preview-wrap"><div class="preview-box"><video id="preview" autoplay playsinline muted></video></div><div><h2>Before you join</h2><p class="sub" style="margin-bottom:12px">Choose devices and optionally preview them. Permissions are requested only when you preview or join.</p><div class="field"><label for="cameraDevice">Camera</label><select id="cameraDevice"><option value="">Default camera</option></select></div><div class="field" style="margin-top:10px"><label for="micDevice">Microphone</label><select id="micDevice"><option value="">Default microphone</option></select></div><div class="device-actions" style="margin-top:12px"><button class="secondary" id="previewBtn" type="button">Preview devices</button></div></div></div><div id="joinMessage" class="message" hidden></div><div class="join-actions"><button class="primary" id="joinBtn" type="button">Join room</button><span class="room-meta">Voice-only and listener modes are supported.</span></div></div></section>`; wireJoin(); }
    function friendlyError(error){ const name = error?.name || ''; if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return 'Camera and microphone access requires HTTPS or localhost.'; if(name === 'NotAllowedError' || name === 'SecurityError') return 'Permission was denied. Check your browser site permissions and try again.'; if(name === 'NotFoundError') return 'No matching camera or microphone was found.'; if(name === 'NotReadableError') return 'The camera or microphone is already in use by another app.'; return error?.message || 'The device could not be opened.'; }
    async function requestMedia(camera, mic, preview = false){ const constraints = {}; if(camera) constraints.video = $('#cameraDevice')?.value ? {deviceId:{exact:$('#cameraDevice').value}} : true; if(mic) constraints.audio = $('#micDevice')?.value ? {deviceId:{exact:$('#micDevice').value}} : true; if(!constraints.video && !constraints.audio) return new MediaStream(); try{ const stream = await navigator.mediaDevices.getUserMedia(constraints); if(preview){ state.previewStream?.getTracks().forEach(t=>t.stop()); state.previewStream=stream; const video=$('#preview'); video.srcObject=stream; await loadDevices(); } return stream; }catch(e){setMessage(friendlyError(e),true); throw e;} }
    async function loadDevices(){ try{ const devices = await navigator.mediaDevices.enumerateDevices(); for(const [id, kind] of [['cameraDevice','videoinput'],['micDevice','audioinput']]){const select=$('#'+id); if(!select) continue; const old=select.value; select.innerHTML=`<option value="">Default ${kind === 'videoinput' ? 'camera':'microphone'}</option>`; devices.filter(d=>d.kind===kind).forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label || `${kind === 'videoinput' ? 'Camera':'Microphone'} ${i+1}`;select.append(o)}); if([...select.options].some(o=>o.value===old))select.value=old;} }catch{} }
    function wireJoin(){ loadDevices(); $('#previewBtn').onclick=async()=>{try{await requestMedia($('#useCamera').checked,$('#useMic').checked,true)}catch{}}; $('#useCamera').onchange=()=>{if(!$('#useCamera').checked && state.previewStream){state.previewStream.getVideoTracks().forEach(t=>t.stop())}}; $('#useMic').onchange=()=>{if(!$('#useMic').checked && state.previewStream){state.previewStream.getAudioTracks().forEach(t=>t.stop())}}; $('#joinBtn').onclick=join; }
    async function join(){ if(state.joined)return; state.name=$('#name').value.trim() || 'Guest'; state.room=$('#room').value.trim(); if(!state.room){setMessage('Enter a room name to continue.',true);return} safeStorage.set('geez.videochat.name',state.name); $('#joinBtn').disabled=true; try{ state.localStream=await requestMedia($('#useCamera').checked,$('#useMic').checked); state.cameraOn=state.localStream.getVideoTracks().some(t=>t.enabled); state.micOn=state.localStream.getAudioTracks().some(t=>t.enabled); state.previewStream?.getTracks().forEach(t=>t.stop()); state.previewStream=null; state.joined=true; renderRoom(); await connectFirebase(); }catch(e){$('#joinBtn').disabled=false; if(!$('#joinMessage').textContent)setMessage(friendlyError(e),true)} }
    function renderRoom(){ app.classList.toggle('compact',compact); app.innerHTML=`<section class="room"><div class="topbar"><div><div class="brand">Geez Video Chat</div><div class="room-meta">Room: <span id="roomTitle"></span> · <span id="memberCount">1</span> here</div></div><button class="secondary" id="copyBtn">Copy invite link</button></div><div id="banner" class="banner" hidden></div><section id="tiles" class="tiles"></section><div id="chat" class="chat hidden"><div class="chat-head"><b>Table chat</b><button class="secondary" id="closeChat" type="button">Close</button></div><div id="chatList" class="chat-list"></div><form id="chatForm" class="chat-form"><input class="text-input" id="chatInput" maxlength="500" placeholder="Send a message"><button class="primary">Send</button></form></div><div id="devicePopover" class="popover hidden"><b>Switch device</b><div class="field"><label for="roomCamera">Camera</label><select id="roomCamera"></select></div><div class="field"><label for="roomMic">Microphone</label><select id="roomMic"></select></div><button class="secondary" id="closeDevices">Done</button></div><nav class="controls"><button id="micBtn" type="button"></button><button id="camBtn" type="button"></button><button id="deviceBtn" type="button">Devices</button><button id="screenBtn" type="button">Share</button><button id="chatBtn" type="button">Chat</button><button id="leaveBtn" class="leave" type="button">Leave</button></nav></section>`; $('#roomTitle').textContent=state.room; $('#copyBtn').onclick=copyInvite; $('#micBtn').onclick=toggleMic; $('#camBtn').onclick=toggleCam; $('#deviceBtn').onclick=toggleDevices; $('#closeDevices').onclick=()=>$('#devicePopover').classList.add('hidden'); $('#screenBtn').onclick=toggleScreen; $('#chatBtn').onclick=()=>$('#chat').classList.toggle('hidden'); $('#closeChat').onclick=()=>$('#chat').classList.add('hidden'); $('#leaveBtn').onclick=leave; $('#chatForm').onsubmit=sendChat; updateControls(); renderSelf(); if(params.get('fake'))addFakePeers(Math.min(12,+params.get('fake')||0)); }
    const ICON={
      mic:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
      micOff:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></svg>',
      cam:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="M15 10l7-4v12l-7-4z"/></svg>',
      camOff:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="M15 10l7-4v12l-7-4zM3 3l18 18"/></svg>',
      leave:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg>'};
    function syncFabs(){ const m=$('#micFab'),c=$('#camFab'); if(m){m.innerHTML=state.micOn?ICON.mic:ICON.micOff;m.classList.toggle('off',!state.micOn);m.title=m.ariaLabel=state.micOn?'Mute microphone':'Unmute microphone'} if(c){c.innerHTML=state.cameraOn?ICON.cam:ICON.camOff;c.classList.toggle('off',!state.cameraOn);c.title=c.ariaLabel=state.cameraOn?'Turn camera off':'Turn camera on'} }
    /* Layout preview only (?fake=N): animated stand-in players, no real connections. Every 4th is camera-off. */
    function addFakePeers(n){ const names=['Aria','Borin','Cyra','Dax','Elowen','Fenn','Garrick','Hild','Isolde','Jory','Kess','Lorn']; const tiles=[];
      for(let i=0;i<n;i++){ const name=names[i%names.length], camOff=i%4===3, hue=(i*67+20)%360, cv=document.createElement('canvas'); cv.width=320; cv.height=240; const g=cv.getContext('2d');
        const tile=document.createElement('article'); tile.id='tile-fake'+i; tile.className='tile'; tile.onclick=()=>tile.classList.toggle('pinned');
        tile.innerHTML=`<div class="avatar">${esc(name[0])}</div><video autoplay playsinline muted></video><div class="label"><span>${esc(name)}</span><span class="icons">${camOff?'🎙':''}</span></div>`;
        const v=$('video',tile); if(camOff)v.style.display='none'; else{ $('.avatar',tile).style.display='none'; v.srcObject=cv.captureStream(12); const t0=Math.random()*6; setInterval(()=>{ const t=t0+performance.now()/1000; const gr=g.createLinearGradient(0,0,320,240); gr.addColorStop(0,`hsl(${hue},35%,${30+8*Math.sin(t)}%)`); gr.addColorStop(1,`hsl(${hue+40},40%,18%)`); g.fillStyle=gr; g.fillRect(0,0,320,240); g.fillStyle=`hsl(${hue},25%,62%)`; const x=160+22*Math.sin(t*.8); g.beginPath(); g.arc(x,105,40,0,7); g.fill(); g.beginPath(); g.ellipse(x,230,85,70,0,0,7); g.fill(); },83); }
        $('#tiles').append(tile); tiles.push(tile); }
      setInterval(()=>{ tiles.forEach(t=>t.classList.remove('speaking')); if(tiles.length&&Math.random()<.8)tiles[Math.floor(Math.random()*tiles.length)].classList.add('speaking'); },1400); updateCount(n+1); }
    function updateControls(){ syncFabs(); if(!$('#micBtn'))return; $('#micBtn').textContent=state.micOn?'Mic':'Mic off'; $('#micBtn').classList.toggle('on',state.micOn); $('#camBtn').textContent=state.cameraOn?'Cam':'Cam off'; $('#camBtn').classList.toggle('on',state.cameraOn); }
    function renderSelf(){ let tile=$('#selfTile'); if(!tile){tile=document.createElement('article');tile.id='selfTile';tile.className='tile self';$('#tiles').prepend(tile); tile.onclick=()=>tile.classList.toggle('pinned')} tile.innerHTML=`<div class="avatar">${esc(state.name.charAt(0).toUpperCase())}</div><video autoplay playsinline muted></video><div class="label"><span>${esc(state.name)} (you)</span><span class="icons" id="selfIcons"></span></div><div class="quality connected">connected</div><div class="selfctl"><button class="fab" id="micFab" type="button"></button><button class="fab" id="camFab" type="button"></button><button class="fab leave" id="leaveFab" type="button" title="Leave" aria-label="Leave">${ICON.leave}</button></div>`; $('#micFab').onclick=e=>{e.stopPropagation();toggleMic()}; $('#camFab').onclick=e=>{e.stopPropagation();toggleCam()}; $('#leaveFab').onclick=e=>{e.stopPropagation();leave()}; syncFabs(); const video=$('video',tile);video.srcObject=state.localStream;video.style.display=state.cameraOn?'block':'none';$('.avatar',tile).style.display=state.cameraOn?'none':'grid'; $('#selfIcons').textContent=(state.micOn?'':'🎙 ') + (state.cameraOn?'':'▣'); }
    function showBanner(text){const n=$('#banner');if(n){n.textContent=text;n.hidden=!text}} function updateCount(count){$('#memberCount').textContent=count; if(count>7)showBanner('More than 6 remote players are present; mesh quality may degrade.');else if($('#banner')?.textContent.startsWith('More'))showBanner('')}
    function turnServers(){ let extra=window.GEEZ_TURN_SERVERS; if(!extra){try{extra=JSON.parse(safeStorage.get('geez.videochat.turn')||'null')}catch{}} return Array.isArray(extra)?extra:[]; }
    function db(){ if(!window.GEEZ_FIREBASE_CONFIG)throw new Error('Firebase configuration is missing.'); if(!firebase.apps.length)firebase.initializeApp(window.GEEZ_FIREBASE_CONFIG);return firebase.database(); }
    async function connectFirebase(){ const database=db(), base=`geezvtt/videochat/${encodeURIComponent(state.room)}`; state.roomRef=database.ref(`${base}/peers`);state.presenceRef=state.roomRef.child(peerId);state.signalsRef=database.ref(`${base}/signals/${peerId}`); await state.presenceRef.onDisconnect().remove(); await state.presenceRef.set({name:state.name,t:firebase.database.ServerValue.TIMESTAMP,joined:true}); state.roomRef.on('child_added',snap=>{if(snap.key!==peerId) addPeer(snap.key,snap.val()?.name||'Guest')}); state.roomRef.on('child_removed',snap=>removePeer(snap.key)); state.signalsRef.on('child_added',consumeSignal); updateCount(1); }
    function newConnection(id,name,initiator){ const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},...turnServers()]}); const p={id,name,pc,channel:null,remoteStream:new MediaStream(),remoteDescription:false,candidates:[],retryTimer:null,initiator}; state.peers.set(id,p); state.localStream?.getTracks().forEach(track=>pc.addTrack(track,state.localStream)); pc.onicecandidate=e=>{if(e.candidate)sendSignal(id,'ice',e.candidate.toJSON())}; pc.ontrack=e=>{e.streams[0]?.getTracks().forEach(t=>{if(!p.remoteStream.getTrackById(t.id))p.remoteStream.addTrack(t)});renderPeer(p);watchLevel(p)}; pc.onconnectionstatechange=()=>{updatePeerQuality(p);if(['failed','disconnected'].includes(pc.connectionState)){clearTimeout(p.retryTimer);p.retryTimer=setTimeout(()=>{if(p.pc.connectionState==='failed'||p.pc.connectionState==='disconnected')restartPeer(p)},1800)} }; pc.ondatachannel=e=>attachChannel(p,e.channel); if(initiator){p.channel=pc.createDataChannel('state');attachChannel(p,p.channel)} return p; }
    async function addPeer(id,name){if(state.peers.has(id))return;const initiator=peerId<id,p=newConnection(id,name,initiator);renderPeer(p);if(initiator)try{const offer=await p.pc.createOffer();await p.pc.setLocalDescription(offer);sendSignal(id,'offer',p.pc.localDescription)}catch(e){updatePeerQuality(p,e)} }
    async function restartPeer(p){try{if(p.pc.signalingState==='closed')return;const offer=await p.pc.createOffer({iceRestart:true});await p.pc.setLocalDescription(offer);await sendSignal(p.id,'offer',p.pc.localDescription);updatePeerQuality(p)}catch(e){updatePeerQuality(p,e)}}
    function sendSignal(to,type,data){return state.roomRef.root.child(`geezvtt/videochat/${encodeURIComponent(state.room)}/signals/${to}`).push({from:peerId,type,data,t:firebase.database.ServerValue.TIMESTAMP})}
    async function consumeSignal(snap){const value=snap.val();await snap.ref.remove();if(!value||value.from===peerId||(value.data?.type==='offer'&&false))return;if(value.t && Date.now()-value.t>60000)return;let p=state.peers.get(value.from);if(!p){const peerSnap=await state.roomRef.child(value.from).once('value');p=newConnection(value.from,peerSnap.val()?.name||'Guest',false);state.peers.set(value.from,p);renderPeer(p)}try{if(value.type==='offer'){if(!p.remoteDescription){await p.pc.setRemoteDescription(value.data);p.remoteDescription=true;await flushCandidates(p);const answer=await p.pc.createAnswer();await p.pc.setLocalDescription(answer);sendSignal(p.id,'answer',p.pc.localDescription)}}else if(value.type==='answer'){await p.pc.setRemoteDescription(value.data);p.remoteDescription=true;await flushCandidates(p)}else if(value.type==='ice'){if(p.remoteDescription)await p.pc.addIceCandidate(value.data);else p.candidates.push(value.data)}}catch(e){updatePeerQuality(p,e)} }
    async function flushCandidates(p){for(const c of p.candidates.splice(0))try{await p.pc.addIceCandidate(c)}catch{}}
    function sendData(p,msg){if(p.channel?.readyState==='open')p.channel.send(JSON.stringify(msg))} function broadcast(msg){state.peers.forEach(p=>sendData(p,msg))}
    function attachChannel(p,ch){p.channel=ch;ch.onopen=()=>{sendData(p,{kind:'state',name:state.name,micOn:state.micOn,cameraOn:state.cameraOn});updatePeerQuality(p)};ch.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.kind==='state'){p.name=m.name||p.name;p.micOn=m.micOn;p.cameraOn=m.cameraOn;renderPeer(p)}if(m.kind==='chat')addChat(m.name,m.text)}catch{}};ch.onclose=()=>updatePeerQuality(p)}
    function renderPeer(p){let tile=$('#tile-'+p.id);if(!tile){tile=document.createElement('article');tile.id='tile-'+p.id;tile.className='tile';$('#tiles').append(tile);tile.onclick=()=>tile.classList.toggle('pinned')}tile.innerHTML=`<div class="avatar">${esc((p.name||'?').charAt(0).toUpperCase())}</div><video autoplay playsinline></video><div class="label"><span>${esc(p.name)}</span><span class="icons"></span></div><div class="quality ${p.pc.connectionState}">${p.pc.connectionState}</div><input class="volume" type="range" min="0" max="1" step=".05" value="1" aria-label="Volume for ${esc(p.name)}">`;const video=$('video',tile);video.srcObject=p.remoteStream;video.volume=1;video.style.display=p.cameraOn===false?'none':'block';$('.avatar',tile).style.display=p.cameraOn===false?'grid':'none';$('.icons',tile).textContent=p.micOn===false?'🎙 ':'';$('.volume',tile).oninput=e=>video.volume=Number(e.target.value);updateCount(state.peers.size+1)}
    function updatePeerQuality(p,error){const t=$('#tile-'+p.id),q=t&&$('.quality',t);if(q){const c=error?'reconnecting':p.pc.connectionState;q.className='quality '+c;q.textContent=c}renderPeer(p)}
    function watchLevel(p){if(state.audio.has(p.id))return;try{const ctx=new AudioContext(),source=ctx.createMediaStreamSource(p.remoteStream),analyser=ctx.createAnalyser();analyser.fftSize=256;source.connect(analyser);const data=new Uint8Array(analyser.frequencyBinCount);const tick=()=>{if(!state.peers.has(p.id)){ctx.close();return}analyser.getByteFrequencyData(data);let sum=0;for(const x of data)sum+=x;$('#tile-'+p.id)?.classList.toggle('speaking',sum/data.length>18);requestAnimationFrame(tick)};state.audio.set(p.id,ctx);tick()}catch{}}
    function toggleMic(){state.micOn=!state.micOn;state.localStream?.getAudioTracks().forEach(t=>t.enabled=state.micOn);broadcast({kind:'state',name:state.name,micOn:state.micOn,cameraOn:state.cameraOn});updateControls();renderSelf()}
    function toggleCam(){state.cameraOn=!state.cameraOn;state.localStream?.getVideoTracks().forEach(t=>t.enabled=state.cameraOn);broadcast({kind:'state',name:state.name,micOn:state.micOn,cameraOn:state.cameraOn});updateControls();renderSelf()}
    async function toggleDevices(){const pop=$('#devicePopover');pop.classList.toggle('hidden');if(pop.classList.contains('hidden'))return;await loadRoomDevices();$('#roomCamera').onchange=()=>replaceDevice('videoinput',$('#roomCamera').value);$('#roomMic').onchange=()=>replaceDevice('audioinput',$('#roomMic').value)}
    async function loadRoomDevices(){const ds=await navigator.mediaDevices.enumerateDevices();for(const [id,kind,label] of [['roomCamera','videoinput','Camera'],['roomMic','audioinput','Microphone']]){const s=$('#'+id);s.innerHTML=`<option value="">Default ${label}</option>`;ds.filter(d=>d.kind===kind).forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||`${label} ${i+1}`;s.append(o)})}}
    async function replaceDevice(kind,id){if(!id)return;try{const stream=await navigator.mediaDevices.getUserMedia(kind==='videoinput'?{video:{deviceId:{exact:id}}}:{audio:{deviceId:{exact:id}}});const track=stream.getTracks()[0],old=state.localStream.getTracks().find(t=>t.kind===track.kind);if(old)state.localStream.removeTrack(old);state.localStream.addTrack(track);state.peers.forEach(p=>p.pc.getSenders().find(s=>s.track?.kind===track.kind)?.replaceTrack(track));track.onended=()=>{if(kind==='videoinput')toggleCam()};renderSelf()}catch(e){showBanner(friendlyError(e))}}
    async function toggleScreen(){if(state.screenTrack){state.screenTrack.stop();return}try{const stream=await navigator.mediaDevices.getDisplayMedia({video:true});const track=stream.getVideoTracks()[0],old=state.localStream.getVideoTracks()[0];state.screenTrack=track;state.peers.forEach(p=>p.pc.getSenders().find(s=>s.track?.kind==='video')?.replaceTrack(track));const video=$('#selfTile video');video.srcObject=stream;track.onended=()=>{if(old){state.peers.forEach(p=>p.pc.getSenders().find(s=>s.track?.kind==='video')?.replaceTrack(old));video.srcObject=state.localStream}state.screenTrack=null;$('#screenBtn').textContent='Share'};$('#screenBtn').textContent='Stop'}catch(e){showBanner(friendlyError(e))}}
    function addChat(name,text){const list=$('#chatList');if(!list)return;const item=document.createElement('div');item.className='chat-msg';item.innerHTML=`<b>${esc(name)}</b> ${esc(text)}`;list.append(item);list.scrollTop=list.scrollHeight}function sendChat(e){e.preventDefault();const input=$('#chatInput'),text=input.value.trim();if(!text)return;addChat(state.name,text);broadcast({kind:'chat',name:state.name,text});input.value=''}
    async function copyInvite(){const url=`${location.origin}${location.pathname}?room=${encodeURIComponent(state.room)}`;try{await navigator.clipboard.writeText(url);showBanner('Invite link copied. Add &name=YourName for a prefilled join.');setTimeout(()=>showBanner(''),2500)}catch{showBanner(url)}}
    async function leave(){await cleanup();if(window.parent!==window){window.parent.postMessage({geezChat:'left'},location.origin)}else location.href=location.pathname}
    async function removePeer(id){const p=state.peers.get(id);if(!p)return;clearTimeout(p.retryTimer);p.pc.close();state.peers.delete(id);state.audio.get(id)?.close();state.audio.delete(id);$('#tile-'+id)?.remove();updateCount(state.peers.size+1)}
    async function cleanup(){state.joined=false;state.peers.forEach(p=>p.pc.close());state.peers.clear();state.audio.forEach(ctx=>ctx.close());state.localStream?.getTracks().forEach(t=>t.stop());state.previewStream?.getTracks().forEach(t=>t.stop());try{await state.presenceRef?.remove()}catch{} }
    addEventListener('pagehide',()=>{state.peers.forEach(p=>p.pc.close());state.localStream?.getTracks().forEach(t=>t.stop());try{state.presenceRef?.remove()}catch{}});
    if((compact || params.get('autojoin')==='1') && initialRoom && initialName){joinScreen();$('#joinBtn').click()}else joinScreen();
  </script>
