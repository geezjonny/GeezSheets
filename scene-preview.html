<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DD2VTT File Previewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background: #1e1e1e;
            border-right: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            z-index: 10;
        }

        #viewer-container {
            flex: 1;
            position: relative;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .drop-zone {
            border: 2px dashed #007acc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: #252526;
            cursor: pointer;
            transition: 0.2s;
        }

        .drop-zone:hover {
            background: #2a2d2e;
            border-color: #0098ff;
        }

        .layer-toggle {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #252526;
            padding: 12px;
            border-radius: 6px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .info-box {
            background: #252526;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.6;
            color: #ccc;
        }

        .info-box b { color: #fff; }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>DD2VTT Previewer</h2>
        
        <div class="drop-zone" id="drop-zone">
            <span>Drag & Drop <b>.dd2vtt</b> file here<br>or click to browse</span>
            <input type="file" id="file-input" accept=".dd2vtt,.json">
        </div>

        <div class="layer-toggle">
            <b style="font-size: 12px; color: #888; text-transform: uppercase;">Toggle Overlay Layers</b>
            <label class="checkbox-label">
                <input type="checkbox" id="show-grid" checked> Show Grid Overlay
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="show-los" checked> Show Line of Sight (Walls)
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="show-portals" checked> Show Doors / Portals
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="show-lights" checked> Show Dynamic Lights
            </label>
        </div>

        <div class="info-box" id="info-box">
            <i>No file loaded. Drop a file above to inspect data.</i>
        </div>
    </div>

    <div id="viewer-container">
        <canvas id="map-canvas"></canvas>
    </div>

    <script>
        let currentVttData = null;
        let loadedMapImage = null;

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('map-canvas');
        const ctx = canvas.getContext('2d');
        const infoBox = document.getElementById('info-box');

        // Checkbox controls
        const showGrid = document.getElementById('show-grid');
        const showLos = document.getElementById('show-los');
        const showPortals = document.getElementById('show-portals');
        const showLights = document.getElementById('show-lights');

        [showGrid, showLos, showPortals, showLights].forEach(cb => {
            cb.addEventListener('change', render);
        });

        // Drag and Drop triggers
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = '#00ff88'; });
        dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#007acc'; });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#007acc';
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    currentVttData = JSON.parse(e.target.result);
                    displayFileInfo(file.name, currentVttData);
                    
                    // Load base64 map artwork image
                    loadedMapImage = new Image();
                    loadedMapImage.onload = () => {
                        canvas.width = loadedMapImage.width;
                        canvas.height = loadedMapImage.height;
                        render();
                    };
                    loadedMapImage.src = 'data:image/png;base64,' + currentVttData.image;
                } catch (err) {
                    alert('Invalid .dd2vtt JSON format!');
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        function displayFileInfo(fileName, data) {
            const res = data.resolution || {};
            const size = res.map_size || { x: '?', y: '?' };
            const ppg = res.pixels_per_grid || '?';
            const losCount = data.line_of_sight ? data.line_of_sight.length : 0;
            const portalCount = data.portals ? data.portals.length : 0;
            const lightCount = data.lights ? data.lights.length : 0;

            infoBox.innerHTML = `
                <b>File:</b> ${fileName}<br>
                <b>Format Version:</b> ${data.format || 'Unknown'}<br>
                <b>Grid Size:</b> ${size.x} x ${size.y} tiles<br>
                <b>Pixels Per Grid:</b> ${ppg} px<br>
                <hr style="border: 0; border-top: 1px solid #444; margin: 8px 0;">
                <b>Walls (LOS):</b> ${losCount}<br>
                <b>Doors (Portals):</b> ${portalCount}<br>
                <b>Lights:</b> ${lightCount}
            `;
        }

        function render() {
            if (!currentVttData || !loadedMapImage) return;

            const w = canvas.width;
            const h = canvas.height;

            // 1. Draw Base Map Artwork
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(loadedMapImage, 0, 0);

            const ppg = currentVttData.resolution.pixels_per_grid || 70;
            const mapSize = currentVttData.resolution.map_size || { x: w / ppg, y: h / ppg };

            // Helper to convert normalized coordinate (0.0 to 1.0) into image Pixel position
            const normToPx = (pt) => ({
                x: pt.x * mapSize.x * ppg,
                y: pt.y * mapSize.y * ppg
            });

            // 2. Draw Grid
            if (showGrid.checked) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.lineWidth = 1;

                for (let x = 0; x <= w; x += ppg) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, h);
                    ctx.stroke();
                }
                for (let y = 0; y <= h; y += ppg) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                    ctx.stroke();
                }
            }

            // 3. Draw Dynamic Lights
            if (showLights.checked && currentVttData.lights) {
                currentVttData.lights.forEach(l => {
                    const pos = normToPx(l.position);
                    const rangePx = (l.range || 5) * ppg;
                    const color = '#' + (l.color || 'ffaa00');

                    // Radial glow gradient preview
                    const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, rangePx);
                    grad.addColorStop(0, color);
                    grad.addColorStop(1, 'transparent');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, rangePx, 0, Math.PI * 2);
                    ctx.fill();

                    // Center bulb marker
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // 4. Draw Line-of-Sight Walls
            if (showLos.checked && currentVttData.line_of_sight) {
                ctx.strokeStyle = '#ff3333';
                ctx.lineWidth = 3;

                currentVttData.line_of_sight.forEach(wall => {
                    if (wall.length >= 2) {
                        const p1 = normToPx(wall[0]);
                        const p2 = normToPx(wall[1]);

                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                });
            }

            // 5. Draw Portals / Doors
            if (showPortals.checked && currentVttData.portals) {
                ctx.strokeStyle = '#00ff66';
                ctx.lineWidth = 4;

                currentVttData.portals.forEach(p => {
                    if (p.bounds && p.bounds.length >= 2) {
                        const b1 = normToPx(p.bounds[0]);
                        const b2 = normToPx(p.bounds[1]);

                        ctx.beginPath();
                        ctx.moveTo(b1.x, b1.y);
                        ctx.lineTo(b2.x, b2.y);
                        ctx.stroke();
                    }
                });
            }
        }
    </script>
</body>
</html>
