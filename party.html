<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party View (Tabs, PCs Only)</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg2: #111827;
      --panel: #1f2937;
      --panel2: #0b1220;
      --line: #374151;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --accent2: #93c5fd;
      --good: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0b1020 0%, #111827 100%);
      color: var(--text);
      padding: 20px;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .title-wrap p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status {
      min-width: 240px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      font-size: 0.95rem;
    }

    .card {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      margin-bottom: 16px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }

    .field {
      grid-column: span 12;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.col-6 { grid-column: span 6; }
    .field.col-4 { grid-column: span 4; }
    .field.col-3 { grid-column: span 3; }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 700;
    }

    input {
      width: 100%;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #0b1220;
    }

    .btn-primary:hover {
      background: var(--accent2);
    }

    .btn-secondary {
      background: #334155;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .tab-bar-wrap {
      margin-bottom: 16px;
    }

    .tab-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .tab-btn {
      white-space: nowrap;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .tab-btn:hover {
      border-color: var(--accent);
    }

    .tab-btn.active {
      background: rgba(96,165,250,0.12);
      border-color: var(--accent);
      color: var(--accent2);
      box-shadow: 0 0 0 1px rgba(96,165,250,0.2);
    }

    .detail-empty {
      color: var(--muted);
      padding: 10px 0;
    }

    .detail-name {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .detail-sub {
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-box {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 700;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .section {
      margin-top: 16px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .section h3 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .ability-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .ability-box {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      background: rgba(255,255,255,0.03);
    }

    .ability-label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .ability-score {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .ability-mod {
      font-size: 0.9rem;
      color: var(--accent2);
      font-weight: 700;
    }

    .line-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .line-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.03);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .line-item span:first-child {
      color: var(--muted);
    }

    .text-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .text-block {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      white-space: pre-wrap;
      line-height: 1.45;
      min-height: 70px;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 1100px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .ability-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .line-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .text-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .field.col-6, .field.col-4, .field.col-3 {
        grid-column: span 12;
      }

      .summary-grid, .ability-grid, .line-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title-wrap">
        <h1>Party View</h1>
        <p>Loads all <strong>PCs only</strong> from <strong>/characters/pcs</strong> into character tabs.</p>
      </div>
      <div class="status" id="statusBox">Ready.</div>
    </div>
	<div class="card">
  <h2>Party Controls</h2>
  <div class="toolbar">
    <button class="btn-primary" id="loadBtn">Load Party</button>
    <button class="btn-secondary" id="clearBtn">Clear View</button>
  </div>
</div>
    <!-- TABS -->
    <div class="card">
      <h2>Party Tabs</h2>
      <div class="tab-bar-wrap">
        <div class="tab-bar" id="tabBar">
          <div class="muted">Click <strong>Load Party</strong> to fetch /characters/pcs</div>
        </div>
      </div>
    </div>

    <!-- DETAIL -->
    <div class="card">
      <h2>Selected Character</h2>
      <div id="detailPanel">
        <div class="detail-empty">No character selected yet.</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const $ = (id) => document.getElementById(id);

    function setStatus(message, type = "info") {
      const box = $("statusBox");
      box.textContent = message;

      if (type === "success") {
        box.style.borderColor = "#166534";
        box.style.color = "#86efac";
      } else if (type === "error") {
        box.style.borderColor = "#7f1d1d";
        box.style.color = "#fca5a5";
      } else if (type === "warn") {
        box.style.borderColor = "#92400e";
        box.style.color = "#fcd34d";
      } else {
        box.style.borderColor = "#374151";
        box.style.color = "#e5e7eb";
      }
    }

    function safe(value, fallback = "") {
      return value === undefined || value === null || value === "" ? fallback : value;
    }

    function signed(n) {
      const num = Number(n || 0);
      return num >= 0 ? `+${num}` : `${num}`;
    }
    // -------------------------
    // Hardcoded Firebase config
    // -------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBJJUrF9ZKt_YGImKUUWwL2hQNbvWl_Ozo",
      authDomain: "sheets-e5838.firebaseapp.com",
      databaseURL: "https://sheets-e5838-default-rtdb.firebaseio.com",
      projectId: "sheets-e5838",
      storageBucket: "sheets-e5838.firebasestorage.app"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const database = getDatabase(firebaseApp);
    let partyCharacters = [];
    let selectedId = null;

    function ensureFirebase() {
      return database;
    }

    function getCharacterById(id) {
      return partyCharacters.find(pc => pc.id === id) || null;
    }

    function renderTabs() {
      const tabBar = $("tabBar");

      if (!partyCharacters.length) {
        tabBar.innerHTML = `<div class="muted">No PCs found under /characters/pcs</div>`;
        $("detailPanel").innerHTML = `<div class="detail-empty">No character selected yet.</div>`;
        return;
      }

      tabBar.innerHTML = "";

      partyCharacters.forEach(pc => {
        const btn = document.createElement("button");
        btn.className = "tab-btn" + (pc.id === selectedId ? " active" : "");
        btn.textContent = safe(pc.name, "Unnamed PC");

        btn.addEventListener("click", () => {
          selectedId = pc.id;
          renderTabs();
          renderDetail(getCharacterById(selectedId));
        });

        tabBar.appendChild(btn);
      });
    }

    function renderDetail(pc) {
      const panel = $("detailPanel");

      if (!pc) {
        panel.innerHTML = `<div class="detail-empty">No character selected yet.</div>`;
        return;
      }

      const combat = pc.combat || {};
      const stats = pc.stats || {};
      const mods = pc.mods || {};
      const saves = pc.saves || {};
      const skills = pc.skills || {};
      const spell = pc.spellcasting || {};
      const text = pc.text_blocks || {};

      const topLineParts = [
        pc.species,
        pc.class,
        pc.subclass ? `(${pc.subclass})` : "",
        pc.background ? `• ${pc.background}` : ""
      ].filter(Boolean);

      panel.innerHTML = `
        <div class="detail-name">${safe(pc.name, "Unnamed Character")}</div>
        <div class="detail-sub">
          Level ${safe(pc.level, 0)} ${topLineParts.join(" ")} ${pc.player_name ? `• Player: ${pc.player_name}` : ""}
        </div>

        <div class="summary-grid">
          <div class="stat-box">
            <div class="stat-label">HP</div>
            <div class="stat-value">${safe(combat.hp_current, 0)} / ${safe(combat.hp_max, 0)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">AC</div>
            <div class="stat-value">${safe(combat.ac, 0)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Speed</div>
            <div class="stat-value">${safe(combat.speed, 0)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Initiative</div>
            <div class="stat-value">${signed(safe(combat.initiative_bonus, 0))}</div>
          </div>

          <div class="stat-box">
            <div class="stat-label">Prof Bonus</div>
            <div class="stat-value">${signed(safe(combat.proficiency_bonus, 0))}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Passive Perception</div>
            <div class="stat-value">${safe(combat.passive_perception, 10)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Passive Insight</div>
            <div class="stat-value">${safe(combat.passive_insight, 10)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Passive Investigation</div>
            <div class="stat-value">${safe(combat.passive_investigation, 10)}</div>
          </div>
        </div>

        <div class="section">
          <h3>Ability Scores</h3>
          <div class="ability-grid">
            ${abilityBox("STR", stats.str, mods.str)}
            ${abilityBox("DEX", stats.dex, mods.dex)}
            ${abilityBox("CON", stats.con, mods.con)}
            ${abilityBox("INT", stats.int, mods.int)}
            ${abilityBox("WIS", stats.wis, mods.wis)}
            ${abilityBox("CHA", stats.cha, mods.cha)}
          </div>
        </div>

        <div class="section">
          <h3>Saving Throws</h3>
          <div class="line-grid">
            ${lineItem("STR", signed(safe(saves.str, 0)))}
            ${lineItem("DEX", signed(safe(saves.dex, 0)))}
            ${lineItem("CON", signed(safe(saves.con, 0)))}
            ${lineItem("INT", signed(safe(saves.int, 0)))}
            ${lineItem("WIS", signed(safe(saves.wis, 0)))}
            ${lineItem("CHA", signed(safe(saves.cha, 0)))}
          </div>
        </div>

        <div class="section">
          <h3>Skills</h3>
          <div class="line-grid">
            ${lineItem("Athletics", signed(safe(skills.athletics, 0)))}
            ${lineItem("Acrobatics", signed(safe(skills.acrobatics, 0)))}
            ${lineItem("Sleight of Hand", signed(safe(skills.sleight_of_hand, 0)))}
            ${lineItem("Stealth", signed(safe(skills.stealth, 0)))}
            ${lineItem("Arcana", signed(safe(skills.arcana, 0)))}
            ${lineItem("History", signed(safe(skills.history, 0)))}
            ${lineItem("Investigation", signed(safe(skills.investigation, 0)))}
            ${lineItem("Nature", signed(safe(skills.nature, 0)))}
            ${lineItem("Religion", signed(safe(skills.religion, 0)))}
            ${lineItem("Animal Handling", signed(safe(skills.animal_handling, 0)))}
            ${lineItem("Insight", signed(safe(skills.insight, 0)))}
            ${lineItem("Medicine", signed(safe(skills.medicine, 0)))}
            ${lineItem("Perception", signed(safe(skills.perception, 0)))}
            ${lineItem("Survival", signed(safe(skills.survival, 0)))}
            ${lineItem("Deception", signed(safe(skills.deception, 0)))}
            ${lineItem("Intimidation", signed(safe(skills.intimidation, 0)))}
            ${lineItem("Performance", signed(safe(skills.performance, 0)))}
            ${lineItem("Persuasion", signed(safe(skills.persuasion, 0)))}
          </div>
        </div>

        <div class="section">
          <h3>Spellcasting</h3>
          <div class="summary-grid">
            <div class="stat-box">
              <div class="stat-label">Ability</div>
              <div class="stat-value">${safe(spell.ability || "—")}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Spell Save DC</div>
              <div class="stat-value">${safe(spell.spell_save_dc, 0)}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Spell Attack</div>
              <div class="stat-value">${signed(safe(spell.spell_attack_bonus, 0))}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Summary</div>
              <div class="stat-value" style="font-size:0.95rem;">${safe(spell.summary, "—")}</div>
            </div>
          </div>
        </div>

        <div class="section">
          <h3>Text Blocks</h3>
          <div class="text-grid">
            <div>
              <h4 class="muted">Attacks</h4>
              <div class="text-block">${safe(text.attacks, "")}</div>
            </div>
            <div>
              <h4 class="muted">Features & Traits</h4>
              <div class="text-block">${safe(text.features_traits, "")}</div>
            </div>
            <div>
              <h4 class="muted">Proficiencies & Languages</h4>
              <div class="text-block">${safe(text.proficiencies_languages, "")}</div>
            </div>
            <div>
              <h4 class="muted">Equipment</h4>
              <div class="text-block">${safe(text.equipment, "")}</div>
            </div>
            <div>
              <h4 class="muted">Backstory / Personality</h4>
              <div class="text-block">${safe(text.backstory, "")}</div>
            </div>
            <div>
              <h4 class="muted">Notes</h4>
              <div class="text-block">${safe(text.notes, "")}</div>
            </div>
          </div>
        </div>
      `;
    }

    function abilityBox(label, score, mod) {
      return `
        <div class="ability-box">
          <div class="ability-label">${label}</div>
          <div class="ability-score">${safe(score, 0)}</div>
          <div class="ability-mod">${signed(safe(mod, 0))}</div>
        </div>
      `;
    }

    function lineItem(label, value) {
      return `
        <div class="line-item">
          <span>${label}</span>
          <span>${value}</span>
        </div>
      `;
    }

    async function loadParty() {
      try {
        setStatus("Connecting to Firebase...", "warn");
        const db = ensureFirebase();

        setStatus("Loading /characters/pcs ...", "warn");
        const snapshot = await get(ref(db, "characters/pcs"));

        if (!snapshot.exists()) {
          partyCharacters = [];
          selectedId = null;
          renderTabs();
          setStatus("No PCs found under /characters/pcs", "warn");
          return;
        }

        const data = snapshot.val();
        const list = Object.values(data);

        // Sort by level desc, then name asc
        list.sort((a, b) => {
          const levelA = Number(a.level || 0);
          const levelB = Number(b.level || 0);
          if (levelB !== levelA) return levelB - levelA;

          const nameA = String(a.name || "").toLowerCase();
          const nameB = String(b.name || "").toLowerCase();
          return nameA.localeCompare(nameB);
        });

        partyCharacters = list;
        selectedId = partyCharacters[0]?.id || null;

        renderTabs();
        renderDetail(getCharacterById(selectedId));

        setStatus(`Loaded ${partyCharacters.length} PC(s) into tabs.`, "success");
      } catch (err) {
        console.error(err);
        setStatus(`Load failed: ${err.message}`, "error");
      }
    }

    function clearView() {
      partyCharacters = [];
      selectedId = null;
      $("tabBar").innerHTML = `<div class="muted">Click <strong>Load Party</strong> to fetch /characters/pcs</div>`;
      $("detailPanel").innerHTML = `<div class="detail-empty">No character selected yet.</div>`;
      setStatus("View cleared.", "info");
    }

    $("loadBtn").addEventListener("click", loadParty);
    $("clearBtn").addEventListener("click", clearView);

    setStatus("Ready. Click Load Party.", "info");
  </script>
</body>
</html>
