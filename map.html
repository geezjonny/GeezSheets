<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Renderer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=IM+Fell+English&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0b08;--panel:#1a1510;--panel2:#151208;--border:#3d2e1a;
  --gold:#c8a84b;--gold-dim:#7a6228;--text:#d4c49a;--dim:#6b5a38;
  --red:#e04040;--green:#5a9a5a;
  --sidebar:280px;--hud:48px;--initiative:56px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'IM Fell English',serif;color:var(--text)}

/* ── Layout ── */
#app{display:grid;grid-template-columns:1fr var(--sidebar);grid-template-rows:var(--hud) 1fr var(--initiative);width:100vw;height:100vh}

/* ── HUD ── */
#hud{grid-column:1/3;grid-row:1;background:rgba(13,11,8,.95);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:20;backdrop-filter:blur(6px)}
#hud h1{font-family:'Cinzel',serif;font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.12em;white-space:nowrap}
.sep{width:1px;height:22px;background:var(--border);flex-shrink:0}
#map-input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--gold);font-family:'Cinzel',serif;font-size:11px;width:110px;padding:2px 4px;outline:none}
#map-input:focus{border-bottom-color:var(--gold)}
button{height:30px;padding:0 11px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--dim);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.05em;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
button:hover{border-color:var(--gold-dim);color:var(--text)}
button.active{border-color:var(--gold);color:var(--gold);background:rgba(200,168,75,.08)}
#status{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;color:var(--dim);flex-shrink:0}
#status.live{color:var(--green)}
#status.error{color:var(--red)}
#player-name-display{font-family:'Cinzel',serif;font-size:10px;color:var(--gold-dim);margin-left:auto;flex-shrink:0;cursor:pointer;padding:0 4px}
#player-name-display:hover{color:var(--gold)}

/* ── Viewport ── */
#viewport{grid-column:1;grid-row:2;position:relative;overflow:hidden;cursor:grab}
#viewport.grabbing{cursor:grabbing}
#viewport.pinging{cursor:crosshair}
canvas{display:block;width:100%;height:100%}
#scale-label{position:absolute;bottom:8px;left:8px;font-family:'Cinzel',serif;font-size:9px;color:var(--dim);pointer-events:none}
#weather-indicator{position:absolute;bottom:8px;left:60px;font-family:'Cinzel',serif;font-size:9px;color:var(--dim);pointer-events:none}

/* ── Session sidebar ── */
#session{grid-column:2;grid-row:2;display:flex;flex-direction:column;background:var(--panel2);border-left:1px solid var(--border);overflow:hidden}
#session-header{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);letter-spacing:.1em;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}

/* Chat */
#chat-log{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
#chat-log::-webkit-scrollbar{width:4px}
#chat-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chat-msg{font-size:12px;line-height:1.4;word-break:break-word}
.chat-msg .who{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);margin-right:6px}
.chat-msg .who.system{color:var(--dim)}
.chat-msg .who.dice{color:#7ab0e0}
.chat-msg.mine .who{color:#e0b070}

/* Dice in sidebar */
#dice-section{border-top:1px solid var(--border);padding:8px;flex-shrink:0}
#dice-section-label{font-family:'Cinzel',serif;font-size:9px;color:var(--dim);letter-spacing:.08em;margin-bottom:6px}
#dice-btns{display:flex;gap:4px;flex-wrap:wrap}
.die-btn{width:36px;height:36px;padding:0;font-family:'Cinzel',serif;font-size:10px;border-radius:4px}
#dice-result-inline{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);margin-top:6px;min-height:18px;text-align:center}

/* Chat input */
#chat-input-row{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border);flex-shrink:0}
#chat-input{flex:1;background:#111;border:1px solid var(--border);color:var(--text);font-family:'IM Fell English',serif;font-size:12px;padding:5px 8px;border-radius:4px;outline:none;min-width:0}
#chat-input:focus{border-color:var(--gold-dim)}
#chat-send{padding:0 10px;height:28px;font-size:10px}

/* ── Initiative bar ── */
#initiative-bar{grid-column:1/3;grid-row:3;background:rgba(13,11,8,.95);border-top:1px solid var(--border);display:flex;align-items:center;gap:0;overflow:hidden;position:relative}
#init-label{font-family:'Cinzel',serif;font-size:9px;color:var(--dim);letter-spacing:.1em;padding:0 10px;flex-shrink:0;text-transform:uppercase}
#init-controls{display:flex;flex-direction:column;gap:4px;padding:4px 8px;border-right:1px solid var(--border);flex-shrink:0}
#init-controls button{height:22px;font-size:9px;padding:0 8px}
#init-track{flex:1;display:flex;align-items:center;gap:6px;padding:0 8px;overflow-x:auto}
#init-track::-webkit-scrollbar{height:3px}
#init-track::-webkit-scrollbar-thumb{background:var(--border)}
.init-card{flex-shrink:0;height:44px;min-width:80px;border:1px solid var(--border);border-radius:4px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;padding:0 8px;position:relative}
.init-card:hover{border-color:var(--gold-dim)}
.init-card.active-turn{border-color:var(--gold);background:rgba(200,168,75,.1);box-shadow:0 0 8px rgba(200,168,75,.3)}
.init-card.active-turn::before{content:'▶';position:absolute;left:-14px;font-size:10px;color:var(--gold)}
.init-card .init-name{font-family:'Cinzel',serif;font-size:10px;color:var(--text);letter-spacing:.04em;text-align:center}
.init-card .init-num{font-family:'Cinzel',serif;font-size:9px;color:var(--dim)}
.init-card .init-hp{font-size:9px;font-family:'Cinzel',serif;color:var(--green)}

/* ── Modals ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-overlay.hidden{display:none}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:24px;min-width:300px;display:flex;flex-direction:column;gap:14px}
.modal-box h2{font-family:'Cinzel',serif;font-size:15px;color:var(--gold);letter-spacing:.1em}
.modal-box p{font-size:12px;color:var(--dim)}
.modal-box input{background:#111;border:1px solid var(--border);color:var(--text);font-family:'IM Fell English',serif;font-size:14px;padding:7px 10px;border-radius:4px;outline:none;width:100%;text-align:center}
.modal-box input:focus{border-color:var(--gold-dim)}
.modal-box button.primary{border-color:var(--gold);color:var(--gold);width:100%;height:36px}

/* ── Context menu ── */
#ctx-menu{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:4px 0;display:none;min-width:160px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#ctx-menu.open{display:block}
.ctx-item{padding:7px 14px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.05em;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text-dim);transition:background .1s}
.ctx-item:hover{background:rgba(200,168,75,.08);color:var(--text)}
.ctx-item .ctx-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid currentColor}
.ctx-sep{height:1px;background:var(--border);margin:3px 0}
.ctx-label{padding:4px 14px;font-family:'Cinzel',serif;font-size:8px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}

/* ── Ping toast ── */
#ping-toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid #4a8aaa;color:#7ac0e0;font-family:'Cinzel',serif;font-size:11px;padding:5px 14px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:25}
#ping-toast.show{opacity:1}

/* ── Init roll prompt ── */
#init-roll-modal .roll-result{font-family:'Cinzel',serif;font-size:48px;color:var(--gold);text-align:center;min-height:60px}
#init-roll-modal .rolling{color:var(--dim)}
</style>
</head>
<body>

<!-- Name modal -->
<div id="name-modal" class="modal-overlay">
  <div class="modal-box" style="text-align:center">
    <h2>Who Are You?</h2>
    <p>Enter your name to join the session</p>
    <input id="name-input" type="text" placeholder="Your name…" maxlength="30" spellcheck="false">
    <button id="name-confirm" class="primary">Enter the Dungeon</button>
  </div>
</div>

<!-- Loading overlay -->
<div id="overlay" class="modal-overlay">
  <div class="modal-box" style="text-align:center;gap:16px">
    <h2>Dungeon Renderer</h2>
    <div style="width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto"></div>
    <p id="overlay-msg">Loading…</p>
  </div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<!-- Initiative roll prompt (shown to players when GM calls roll) -->
<div id="init-roll-modal" class="modal-overlay hidden">
  <div class="modal-box" style="text-align:center;min-width:260px">
    <h2>Roll Initiative!</h2>
    <div class="roll-result" id="init-roll-result">—</div>
    <button id="init-roll-btn" class="primary">Roll d20</button>
  </div>
</div>

<!-- Condition context menu -->
<div id="ctx-menu">
  <div class="ctx-label">Conditions</div>
  <div class="ctx-item" data-condition="poisoned"  data-color="#5aaa5a"><div class="ctx-dot" style="color:#5aaa5a"></div>Poisoned</div>
  <div class="ctx-item" data-condition="stunned"   data-color="#aaaa30"><div class="ctx-dot" style="color:#aaaa30"></div>Stunned</div>
  <div class="ctx-item" data-condition="prone"     data-color="#888888"><div class="ctx-dot" style="color:#888888"></div>Prone</div>
  <div class="ctx-item" data-condition="burning"   data-color="#e07030"><div class="ctx-dot" style="color:#e07030"></div>Burning</div>
  <div class="ctx-item" data-condition="frozen"    data-color="#50c0e0"><div class="ctx-dot" style="color:#50c0e0"></div>Frozen</div>
  <div class="ctx-item" data-condition="blinded"   data-color="#dddddd"><div class="ctx-dot" style="color:#dddddd"></div>Blinded</div>
  <div class="ctx-item" data-condition="charmed"   data-color="#e070c0"><div class="ctx-dot" style="color:#e070c0"></div>Charmed</div>
  <div class="ctx-item" data-condition="frightened"data-color="#9060d0"><div class="ctx-dot" style="color:#9060d0"></div>Frightened</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" data-condition="clear" style="color:var(--red)">✕ Clear all conditions</div>
  <div class="ctx-sep"></div>
  <div class="ctx-label">Token</div>
  <div class="ctx-item" data-action="delete" style="color:var(--red)">✕ Delete token</div>
</div>

<div id="app">
  <!-- HUD -->
  <div id="hud">
    <h1>⚔ DUNGEON</h1>
    <div class="sep"></div>
    <button id="fitBtn">Fit</button>
    <input id="map-input" type="text" value="dungeon-1" hidden>
    <div class="sep"></div>
    <button id="pingBtn">📍 Ping</button>
    <button id="sheetsBtn">📋 Sheets</button>
    <div class="sep"></div>
    <span id="status">—</span>
    <span id="player-name-display" title="Click to change name"></span>
  </div>

  <!-- Map viewport -->
  <div id="viewport">
    <canvas id="canvas"></canvas>
    <div id="scale-label">100%</div>
    <div id="weather-indicator"></div>
  </div>

  <!-- Session sidebar: chat + dice -->
  <div id="session">
    <div id="session-header">⚔ SESSION</div>
    <div id="chat-log"></div>
    <div id="dice-section">
      <div id="dice-section-label">DICE ROLLER</div>
      <div id="dice-btns">
        <button class="die-btn" data-sides="4">d4</button>
        <button class="die-btn" data-sides="6">d6</button>
        <button class="die-btn" data-sides="8">d8</button>
        <button class="die-btn" data-sides="10">d10</button>
        <button class="die-btn" data-sides="12">d12</button>
        <button class="die-btn" data-sides="20">d20</button>
        <button class="die-btn" data-sides="100">d100</button>
      </div>
      <div id="dice-result-inline"></div>
    </div>
    <div id="chat-input-row">
      <input id="chat-input" type="text" placeholder="Message…" maxlength="300" spellcheck="false">
      <button id="chat-send">Send</button>
    </div>
  </div>

  <!-- Initiative bar -->
  <div id="initiative-bar">
    <div id="init-label">Initiative</div>
    <div id="init-controls">
      <button id="init-roll-call-btn" title="Ask all players to roll initiative">⚄ Roll</button>
      <button id="init-next-btn" title="Next turn">▶ Next</button>
    </div>
    <div id="init-track"></div>
  </div>
</div>

<div id="ping-toast"></div>
<div id="init-roll-modal" class="modal-overlay hidden" id="init-roll-modal"></div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getDatabase, ref, onValue, set, push, remove, update, get }
  from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyBJJUrF9ZKt_YGImKUUWwL2hQNbvWl_Ozo",
  authDomain:"sheets-e5838.firebaseapp.com",
  databaseURL:"https://sheets-e5838-default-rtdb.firebaseio.com",
  projectId:"sheets-e5838",
  storageBucket:"sheets-e5838.firebasestorage.app",
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

// ── Constants ─────────────────────────────────────────────────────────────────
const TILE=32;
const TEXTURE_PATH="./textures/";
const PROP_PATH="./props/";
const TOKEN_PATH="./tokens/";
const TERRAINS=["grass","stone","wood","water","cobble","sand","lava","dirt","gravel","ice","void","carpet","marble","mud"];
const FALLBACK={grass:"#3a6b3a",stone:"#6b6b6b",wood:"#7a5c3a",water:"#2a5a8a",cobble:"#9a9a8a",sand:"#b8a86a",lava:"#8b2a0a",dirt:"#6b4a2a",gravel:"#555a50",ice:"#a8d0e0",void:"#080808",carpet:"#6b2a5a",marble:"#d0ccc0",mud:"#4a3520"};
const FEET_PER_TILE=5;
const CONDITIONS={poisoned:"#5aaa5a",stunned:"#aaaa30",prone:"#888888",burning:"#e07030",frozen:"#50c0e0",blinded:"#dddddd",charmed:"#e070c0",frightened:"#9060d0"};

// ── DOM ───────────────────────────────────────────────────────────────────────
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const viewport=document.getElementById("viewport");
const statusEl=document.getElementById("status");
const overlayEl=document.getElementById("overlay");
const overlayMsg=document.getElementById("overlay-msg");
const mapInput=document.getElementById("map-input");
const scaleLabel=document.getElementById("scale-label");
const pingToast=document.getElementById("ping-toast");
const nameModal=document.getElementById("name-modal");
const nameInput=document.getElementById("name-input");
const nameDisplay=document.getElementById("player-name-display");
const chatLog=document.getElementById("chat-log");
const chatInput=document.getElementById("chat-input");
const initTrack=document.getElementById("init-track");
const ctxMenu=document.getElementById("ctx-menu");
const initRollModal=document.getElementById("init-roll-modal");

// ── Player name ───────────────────────────────────────────────────────────────
let playerName=localStorage.getItem("vtt_player_name")||"";
function showNameModal(){nameInput.value=playerName;nameModal.classList.remove("hidden");setTimeout(()=>nameInput.focus(),50);}
function confirmName(){const n=nameInput.value.trim();if(!n)return;playerName=n;localStorage.setItem("vtt_player_name",n);nameModal.classList.add("hidden");nameDisplay.textContent=playerName;}
document.getElementById("name-confirm").onclick=confirmName;
nameInput.addEventListener("keydown",e=>{if(e.key==="Enter")confirmName();});
nameDisplay.onclick=showNameModal;

// ── State ─────────────────────────────────────────────────────────────────────
let tiles={},textures={},fog={},tokens={},stamps={},roofs={},props={};
let bgImage=null, bgUrl="";
let propTextures={},tokenTextures={},propDefs={};
let camX=0,camY=0,zoom=1;
let panning=false,panStartX=0,panStartY=0,camStartX=0,camStartY=0;
let liveUnsub=null,firstLoad=true;
let pingMode=false;
const activePings={};
const activeLasers={};  // { playerName: {wx,wy} }
let myLaserRef=null;
let pingHoldTimer=null;
let isHolding=false;

// Ruler
let rulerActive=false,rulerStart=null,rulerEnd=null;

// Initiative
let initiative={order:[],active:null,rolls:{}};

// Context menu target
let ctxTokenId=null;

// Weather
const weather={rain:{enabled:false,intensity:0.5},snow:{enabled:false,intensity:0.3},mist:{enabled:false,intensity:0.4},storm:{enabled:false,intensity:0.5}};
const rainDrops=[],snowFlakes=[],mistClouds=[];
let lastLightning=0,lightningAlpha=0;

// ── Asset loading ─────────────────────────────────────────────────────────────
async function loadTextures(){
  await Promise.all(TERRAINS.map(t=>new Promise(resolve=>{
    const img=new Image();img.onload=()=>{textures[t]=img;resolve()};img.onerror=()=>resolve();img.src=`${TEXTURE_PATH}${t}.png`;
  })));
}
function tryLoadPropTexture(id){
  if(propTextures[id]!==undefined)return;
  propTextures[id]=null;
  const img=new Image();
  img.onload=()=>{propTextures[id]=img;};
  img.onerror=()=>{
    // Fallback: check RTDB base64 upload
    get(ref(db,`assets/uploads/props/${id}`)).then(snap=>{
      const b64=snap.val();
      if(b64){const i=new Image();i.onload=()=>{propTextures[id]=i;};i.src=b64;}
    });
  };
  img.src=`${PROP_PATH}${id}.png`;
}

function tryLoadTokenTexture(characterId,name){
  if(tokenTextures[characterId]!==undefined)return;
  tokenTextures[characterId]=null;
  const img=new Image();
  const fname=(name||characterId).toLowerCase().replace(/\s+/g,"_");
  img.onload=()=>{tokenTextures[characterId]=img;};
  img.onerror=()=>{
    // Fallback: check RTDB base64 upload
    get(ref(db,`assets/uploads/tokens/${characterId}`)).then(snap=>{
      const b64=snap.val();
      if(b64){const i=new Image();i.onload=()=>{tokenTextures[characterId]=i;};i.src=b64;}
    });
  };
  img.src=`${TOKEN_PATH}${fname}.png`;
}

// ── Resize ────────────────────────────────────────────────────────────────────
function resize(){canvas.width=viewport.clientWidth;canvas.height=viewport.clientHeight;initParticles();}
resize();window.addEventListener("resize",resize);

// ── Particles ─────────────────────────────────────────────────────────────────
function initParticles(){
  const W=window.innerWidth,H=window.innerHeight;
  rainDrops.length=0;snowFlakes.length=0;mistClouds.length=0;
  for(let i=0;i<400;i++)rainDrops.push({x:Math.random()*W,y:Math.random()*H,len:Math.random()*14+8,speed:Math.random()*6+14});
  for(let i=0;i<300;i++)snowFlakes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+1,speed:Math.random()*1.2+0.4,drift:Math.random()*0.6-0.3});
  for(let i=0;i<12;i++)mistClouds.push({x:Math.random()*W,y:Math.random()*H,rx:W*0.2+100,ry:Math.random()*100+50,speed:Math.random()*0.3+0.1,phase:Math.random()*Math.PI*2});
}
initParticles();

// ── Camera ────────────────────────────────────────────────────────────────────
function fitCamera(){
  const coords=Object.keys(tiles).map(k=>k.split(",").map(Number));if(!coords.length)return;
  const xs=coords.map(([x])=>x),ys=coords.map(([,y])=>y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const mapW=(maxX-minX+1)*TILE,mapH=(maxY-minY+1)*TILE;
  zoom=Math.min((canvas.width-80)/mapW,(canvas.height-80)/mapH,2);
  camX=canvas.width/2-(minX*TILE+mapW/2)*zoom;camY=canvas.height/2-(minY*TILE+mapH/2)*zoom;
  scaleLabel.textContent=`${Math.round(zoom*100)}%`;
}
function toWorld(sx,sy){return[(sx-camX)/zoom,(sy-camY)/zoom];}
function toScreen(wx,wy){return[wx*zoom+camX,wy*zoom+camY];}
function setStatus(cls,text){statusEl.className=cls;statusEl.textContent=text;}

// ── Firebase listeners ────────────────────────────────────────────────────────
function subscribeLive(){
  if(liveUnsub){liveUnsub();liveUnsub=null;}
  const mapName=mapInput.value.trim()||"dungeon-1";
  setStatus("","Connecting…");
  liveUnsub=onValue(ref(db,`maps/${mapName}`),snap=>{
    const data=snap.val();
    for(const k in tiles)delete tiles[k];for(const k in fog)delete fog[k];
    for(const k in tokens)delete tokens[k];for(const k in stamps)delete stamps[k];
    for(const k in roofs)delete roofs[k];for(const k in props)delete props[k];
    if(data){
      if(data.tiles)Object.assign(tiles,data.tiles);
      if(data.fog)Object.assign(fog,data.fog);
      if(data.tokens){Object.assign(tokens,data.tokens);Object.values(data.tokens).forEach(t=>tryLoadTokenTexture(t.characterId,t.name));}
      if(data.stamps)for(const[k,v]of Object.entries(data.stamps))stamps[k.replace("_",",")]=v;
      if(data.roofs)Object.assign(roofs,data.roofs);
      if(data.props)Object.assign(props,data.props);
      // Background image
      if(data.background&&data.background!==bgUrl){
        bgUrl=data.background;bgImage=null;
        const img=new Image();img.crossOrigin="anonymous";
        img.onload=()=>{bgImage=img;};
        img.onerror=()=>{bgImage=null;};
        img.src=bgUrl;
      } else if(!data.background){bgUrl="";bgImage=null;}
    }
    setStatus("live",`Live · ${Object.keys(tiles).length} tiles`);
    if(firstLoad){firstLoad=false;fitCamera();overlayEl.classList.add("hidden");}
  },()=>{setStatus("error","RTDB error");overlayEl.classList.add("hidden");});
}

function renderInitTrack(){
  initTrack.innerHTML="";
  if(!initiative.order.length){
    initTrack.innerHTML=`<span style="font-family:'Cinzel',serif;font-size:10px;color:var(--dim);padding:0 8px">No initiative set</span>`;
    return;
  }
  initiative.order.forEach(tokId=>{
    const tok=tokens[tokId];
    const card=document.createElement("div");
    card.className="init-card"+(initiative.active===tokId?" active-turn":"");
    const roll=initiative.rolls?.[tokId]||"?";
    const hpPct=tok?Math.max(0,Math.min(1,(tok.hp??tok.maxHp)/(tok.maxHp||1))):1;
    const hpColor=hpPct>.5?"#5a9a5a":hpPct>.25?"#aaaa30":"#e04040";
    card.innerHTML=`
      <div class="init-name">${tok?.name||tokId}</div>
      <div class="init-num">Roll: ${roll}</div>
      ${tok?`<div class="init-hp" style="color:${hpColor}">${tok.hp??'?'}/${tok.maxHp??'?'} HP</div>`:""}
    `;
    card.onclick=()=>{
      // Highlight token on map
      const t=tokens[tokId];
      if(t){
        const[sx,sy]=toScreen(t.x*TILE+TILE/2,t.y*TILE+TILE/2);
        activePings[`init_${tokId}`]={wx:t.x*TILE+TILE/2,wy:t.y*TILE+TILE/2,name:tok?.name||"",startTime:Date.now(),id:`init_${tokId}`};
      }
    };
    initTrack.appendChild(card);
  });
}

// Player initiative roll prompt
function showInitRollPrompt(){
  initRollModal.classList.remove("hidden");
  document.getElementById("init-roll-result").textContent="—";
  document.getElementById("init-roll-result").className="roll-result";
}

document.getElementById("init-roll-btn").onclick=async()=>{
  const result=Math.ceil(Math.random()*20);
  const el=document.getElementById("init-roll-result");
  el.className="roll-result rolling";
  let ticks=0;
  const t=setInterval(async()=>{
    ticks++;
    el.textContent=Math.ceil(Math.random()*20);
    if(ticks>=15){
      clearInterval(t);
      el.textContent=result;
      el.className="roll-result";
      // Save roll and check if all have rolled
      const myKey=playerName.replace(/\./g,"_");
      await update(ref(db,`initiative/rolls`),{[myKey]:result});
      // Find my token
      const myTok=Object.entries(tokens).find(([,t])=>t.name?.toLowerCase()===playerName.toLowerCase()&&t.type==="pc");
      if(myTok) await update(ref(db,`initiative/rolls`),{[myTok[0]]:result});
      sendChat(`rolled initiative: ${result}`,"system");
      setTimeout(()=>initRollModal.classList.add("hidden"),1500);
      // Check if all PCs have rolled, then sort
      const snap=await get(ref(db,"initiative"));
      const data=snap.val()||{};
      const allRolls=data.rolls||{};
      const allTokens=tokens;
      const pcTokens=Object.entries(allTokens).filter(([,t])=>t.type==="pc");
      const allPCsRolled=pcTokens.every(([id,t])=>{
        const k=t.name?.toLowerCase().replace(/\s+/g,"_")||id;
        return allRolls[id]!==undefined||allRolls[k]!==undefined;
      });
      if(allPCsRolled||Object.keys(allTokens).length===0){
        // Sort and finalize
        const sorted=Object.entries(allTokens).sort(([aid],[bid])=>{
          const ar=allRolls[aid]??0,br=allRolls[bid]??0;return br-ar;
        }).map(([id])=>id);
        await update(ref(db,"initiative"),{order:sorted,active:sorted[0]||null,rolling:false});
      }
    }
  },60);
};

async function applyCondition(tokId,condition){

  } else {

    const newConds=conds.includes(condition)?conds.filter(c=>c!==condition):[...conds,condition];
    await update(ref(db,`maps/${mapName}/tokens/${tokId}`),{conditions:newConds});
  }
}

function tokenAtScreen(sx,sy){

// ── Characters/pcs — source of truth for HP ───────────────────────────────────
const pcsData={};
onValue(ref(db,"characters/pcs"),snap=>{
  for(const k in pcsData)delete pcsData[k];
  if(snap.exists())Object.assign(pcsData,snap.val());
});
function hasWall(x,y){const t=tiles[`${x},${y}`];return t&&t.walls;}

function drawTileAt(x,y,terrain){
  const px=x*TILE,py=y*TILE;
  if(textures[terrain])ctx.drawImage(textures[terrain],px,py,TILE,TILE);
  else{ctx.fillStyle=FALLBACK[terrain]||"#333";ctx.fillRect(px,py,TILE,TILE);}
}

function drawToken(tok){
  const px=tok.x*TILE,py=tok.y*TILE,r=TILE*0.42,cx=px+TILE/2,cy=py+TILE/2;
  const img=tokenTextures[tok.characterId];
  // Condition rings (outermost first)
  const conds=tok.conditions||[];
  conds.forEach((c,i)=>{
    ctx.beginPath();ctx.arc(cx,cy,r+4+i*4,0,Math.PI*2);
    ctx.strokeStyle=CONDITIONS[c]||"#fff";ctx.lineWidth=2.5/zoom;ctx.stroke();
  });
  if(img){
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
    ctx.drawImage(img,px,py,TILE,TILE);ctx.restore();
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=tok.type==="pc"?"#7ab0e0":"#e07070";ctx.lineWidth=2/zoom;ctx.stroke();
  } else {
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle=tok.type==="pc"?"#3a6aaa":"#8a2a2a";ctx.fill();
    ctx.strokeStyle=tok.type==="pc"?"#7ab0e0":"#e07070";ctx.lineWidth=2/zoom;ctx.stroke();
    ctx.fillStyle="#fff";ctx.font=`bold ${Math.round(14/zoom)}px Cinzel,serif`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText((tok.name||"?")[0].toUpperCase(),cx,cy);
  }
  ctx.font=`${Math.round(9/zoom)}px Cinzel,serif`;ctx.textAlign="center";ctx.textBaseline="top";
  const nameLabel=tok.name||"";const nameW=ctx.measureText(nameLabel).width;
  ctx.fillStyle="rgba(0,0,0,0.65)";ctx.fillRect(cx-nameW/2-3/zoom,py+TILE+2/zoom,nameW+6/zoom,10/zoom);
  ctx.fillStyle="#fff";ctx.fillText(nameLabel,cx,py+TILE+2/zoom);
  const bw=TILE*0.85,bh=5/zoom,bx=px+(TILE-bw)/2,by=py+TILE+12/zoom;
  let liveHp=tok.hp,liveMaxHp=tok.maxHp;
  if(tok.type==="pc"&&pcsData[tok.characterId]){const c=pcsData[tok.characterId];liveHp=c.hp??c.combat?.hp_current??tok.hp;liveMaxHp=c.maxHp??c.combat?.hp_max??tok.maxHp;}
  const pct=Math.max(0,Math.min(1,(liveHp??liveMaxHp)/(liveMaxHp||1)));
  ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=pct>.5?"#4a9a4a":pct>.25?"#aaaa30":"#aa3030";ctx.fillRect(bx,by,bw*pct,bh);
}

function drawPings(){
  const now=Date.now();
  for(const[id,ping]of Object.entries(activePings)){
    const age=(now-ping.startTime)/1000;if(age>3){delete activePings[id];continue;}
    const alpha=1-age/3;
    const[sx,sy]=toScreen(ping.wx,ping.wy);
    for(let i=0;i<3;i++){const phase=(age+i*0.4)%1.2;ctx.beginPath();ctx.arc(sx,sy,20+phase*60,0,Math.PI*2);ctx.strokeStyle=`rgba(255,200,50,${alpha*(1-phase/1.2)*0.8})`;ctx.lineWidth=2.5;ctx.stroke();}
    ctx.beginPath();ctx.arc(sx,sy,5,0,Math.PI*2);ctx.fillStyle=`rgba(255,220,80,${alpha})`;ctx.fill();
    ctx.font="bold 11px Cinzel,serif";ctx.textAlign="center";ctx.textBaseline="bottom";ctx.fillStyle=`rgba(255,220,80,${alpha})`;ctx.fillText(ping.name,sx,sy-10);
  }
}

function drawLasers(){
  for(const[name,laser]of Object.entries(activeLasers)){
    const[sx,sy]=toScreen(laser.wx,laser.wy);
    ctx.save();
    ctx.beginPath();ctx.arc(sx,sy,8,0,Math.PI*2);
    ctx.fillStyle=laser.color||"#fff";ctx.globalAlpha=0.85;ctx.fill();
    ctx.font="bold 10px Cinzel,serif";ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="bottom";
    ctx.fillText(name.replace(/_/g," "),sx,sy-10);
    ctx.restore();
  }
}

function drawRuler(){
  if(!rulerStartScreen||!rulerEnd)return;
  const[sx,sy]=rulerStartScreen;
  const[ex,ey]=rulerEnd;
  const[wx,wy]=toWorld(sx,sy);
  const[wx2,wy2]=toWorld(ex,ey);
  const dtiles=Math.sqrt((wx2/TILE-wx/TILE)**2+(wy2/TILE-wy/TILE)**2);
  const dfeet=Math.round(dtiles*FEET_PER_TILE);
  ctx.save();
  ctx.strokeStyle="rgba(200,168,75,0.9)";ctx.lineWidth=2;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle="rgba(200,168,75,1)";ctx.beginPath();ctx.arc(sx,sy,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(ex,ey,4,0,Math.PI*2);ctx.fill();
  const label=`${Math.round(dtiles*10)/10} tiles · ${dfeet}ft`;
  const mx=(sx+ex)/2,my=(sy+ey)/2;
  ctx.font="bold 12px Cinzel,serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle="rgba(13,11,8,0.75)";const tw=ctx.measureText(label).width;
  ctx.fillRect(mx-tw/2-4,my-9,tw+8,18);
  ctx.fillStyle="#c8a84b";ctx.fillText(label,mx,my);
  ctx.restore();
}

function drawWeather(W,H){
  const now=Date.now();
  if(weather.mist.enabled){const intensity=weather.mist.intensity;mistClouds.forEach(c=>{c.x+=c.speed;if(c.x-c.rx>W)c.x=-c.rx;const pulse=0.5+0.5*Math.sin(now/3000+c.phase);const alpha=intensity*0.18*pulse;const grad=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.rx);grad.addColorStop(0,`rgba(180,190,210,${alpha})`);grad.addColorStop(1,"rgba(180,190,210,0)");ctx.save();ctx.scale(1,c.ry/c.rx);ctx.fillStyle=grad;ctx.beginPath();ctx.arc(c.x,c.y*(c.rx/c.ry),c.rx,0,Math.PI*2);ctx.fill();ctx.restore();});}
  if(weather.rain.enabled){const intensity=weather.rain.intensity;const count=Math.floor(intensity*rainDrops.length);ctx.strokeStyle=`rgba(174,194,220,${0.25+intensity*0.35})`;ctx.lineWidth=1;for(let i=0;i<count;i++){const d=rainDrops[i];d.y+=d.speed;d.x+=d.speed*0.22;if(d.y>H){d.y=-20;d.x=Math.random()*W;}if(d.x>W)d.x=0;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+d.len*0.22,d.y+d.len);ctx.stroke();}}
  if(weather.snow.enabled){const intensity=weather.snow.intensity;const count=Math.floor(intensity*snowFlakes.length);ctx.fillStyle=`rgba(220,230,255,${0.5+intensity*0.3})`;for(let i=0;i<count;i++){const f=snowFlakes[i];f.y+=f.speed;f.x+=f.drift+Math.sin(now/1200+i)*0.3;if(f.y>H){f.y=-10;f.x=Math.random()*W;}if(f.x>W)f.x=0;if(f.x<0)f.x=W;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();}}
  if(weather.storm.enabled){const interval=8000-weather.storm.intensity*6000;if(now-lastLightning>interval&&Math.random()<0.02){lastLightning=now;lightningAlpha=1;ctx.save();ctx.strokeStyle="rgba(200,210,255,0.9)";ctx.lineWidth=2;let bx=W*0.2+Math.random()*W*0.6,by=0;ctx.beginPath();ctx.moveTo(bx,by);while(by<H*0.7){bx+=Math.random()*80-40;by+=Math.random()*60+30;ctx.lineTo(bx,by);}ctx.stroke();ctx.restore();}if(lightningAlpha>0){ctx.fillStyle=`rgba(180,190,255,${lightningAlpha*0.12})`;ctx.fillRect(0,0,W,H);lightningAlpha=Math.max(0,lightningAlpha-0.06);}}
}

// ── Main draw loop ────────────────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#0d0b08";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();ctx.translate(camX,camY);ctx.scale(zoom,zoom);

  // Background image (DA map PNG, scaled 32/70 to match our tile size)
  if(bgImage){
    const s=32/70;
    ctx.drawImage(bgImage,0,0,bgImage.width*s,bgImage.height*s);
  }

  for(const k in tiles){const[x,y]=k.split(",").map(Number);drawTileAt(x,y,tiles[k].terrain);}

  ctx.strokeStyle="#c0392b";ctx.lineWidth=2.5/zoom;ctx.lineCap="round";
  for(const k in tiles){if(!tiles[k].walls)continue;const[x,y]=k.split(",").map(Number);const px=x*TILE,py=y*TILE;[[0,-1,px,py,px+TILE,py],[0,1,px,py+TILE,px+TILE,py+TILE],[-1,0,px,py,px,py+TILE],[1,0,px+TILE,py,px+TILE,py+TILE]].forEach(([dx,dy,x1,y1,x2,y2])=>{if(!hasWall(x+dx,y+dy)){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}});}

  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`${Math.round(TILE*.65)}px serif`;
  for(const[k,emoji]of Object.entries(stamps)){const[x,y]=k.split(",").map(Number);ctx.fillText(emoji,x*TILE+TILE/2,y*TILE+TILE/2);}
  ctx.restore();

  for(const[k,p]of Object.entries(props)){
    let rx,ry;
    if(p.attachedTo&&tokens[p.attachedTo]){
      rx=tokens[p.attachedTo].x+(p.offsetX||0);
      ry=tokens[p.attachedTo].y+(p.offsetY||0);
    }else{[rx,ry]=k.split(",").map(Number);}
    const def=propDefs[p.propId]||{emoji:"📦",w:1,h:1};
    const px=rx*TILE,py=ry*TILE,pw=(p.w||def.w||1)*TILE,ph=(p.h||def.h||1)*TILE;
    const img=propTextures[p.propId];
    if(img)ctx.drawImage(img,px,py,pw,ph);
    else{ctx.save();ctx.font=`${Math.round(Math.min(pw,ph)*0.7)}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(def.emoji,px+pw/2,py+ph/2);ctx.restore();}
  }

  for(const[id,tok]of Object.entries(tokens))if(tok.type==="npc")drawToken(tok);

  ctx.fillStyle="rgba(0,0,0,1)";
  for(const gid in fog){const cells=(fog[gid]&&fog[gid].cells)||{};for(const k in cells){const[x,y]=k.split(",").map(Number);ctx.fillRect(x*TILE,y*TILE,TILE,TILE);}}

  for(const[id,tok]of Object.entries(tokens))if(tok.type==="pc")drawToken(tok);

  ctx.save();ctx.globalAlpha=1;
  for(const[k,r]of Object.entries(roofs)){const[x,y]=k.split(",").map(Number);drawTileAt(x,y,r.terrain);}
  ctx.restore();

  ctx.strokeStyle="rgba(255,255,255,.03)";ctx.lineWidth=1/zoom;
  const l=-camX/zoom,t=-camY/zoom,r=(canvas.width-camX)/zoom,b=(canvas.height-camY)/zoom;
  for(let x=Math.floor(l/TILE)*TILE;x<r;x+=TILE){ctx.beginPath();ctx.moveTo(x,t);ctx.lineTo(x,b);ctx.stroke();}
  for(let y=Math.floor(t/TILE)*TILE;y<b;y+=TILE){ctx.beginPath();ctx.moveTo(l,y);ctx.lineTo(r,y);ctx.stroke();}

  ctx.restore();

  // Screen-space overlays
  drawWeather(canvas.width,canvas.height);
  drawPings();
  drawLasers();
  drawRuler();

  requestAnimationFrame(draw);
}

// ── Pointer events ────────────────────────────────────────────────────────────
let draggingToken=null;

document.getElementById("fitBtn").onclick=fitCamera;
document.getElementById("sheetsBtn").onclick=()=>window.open("https://geezjonny.github.io/GeezSheets","_blank");

// Auto-follow GM's current map
onValue(ref(db,"session/currentMap"),snap=>{
  const mapName=snap.val();
  if(!mapName)return;
  // Update the hidden input so subscribeLive uses the right name
  mapInput.value=mapName;
  firstLoad=true;
  subscribeLive();
});

document.getElementById("pingBtn").onclick=()=>{
  if(!playerName){showNameModal();return;}
  pingMode=!pingMode;
  document.getElementById("pingBtn").classList.toggle("active",pingMode);
  viewport.classList.toggle("pinging",pingMode);
};

viewport.addEventListener("contextmenu",e=>{
  e.preventDefault();
  const rect=viewport.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;
  const tokId=tokenAtScreen(sx,sy);
  if(tokId){
    ctxTokenId=tokId;
    ctxMenu.style.left=e.clientX+"px";
    ctxMenu.style.top=e.clientY+"px";
    ctxMenu.classList.add("open");
  }
});

viewport.addEventListener("pointerdown",e=>{
  const rect=viewport.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;

  // Ping mode: single click
  if(pingMode){
    sendPing(sx,sy);
    pingMode=false;document.getElementById("pingBtn").classList.remove("active");viewport.classList.remove("pinging");
    return;
  }

  // Ruler: alt+drag
  if(e.altKey){
    rulerStartScreen=[sx,sy];rulerEnd=[sx,sy];
    viewport.setPointerCapture(e.pointerId);return;
  }

  // Token drag (own PC tokens only for players)
  const tokId=tokenAtScreen(sx,sy);
  if(tokId&&isMyToken(tokId)){
    const[wx,wy]=toWorld(sx,sy);const tx=Math.floor(wx/TILE),ty=Math.floor(wy/TILE);
    draggingToken={id:tokId,offsetTX:tx-tokens[tokId].x,offsetTY:ty-tokens[tokId].y};
    viewport.setPointerCapture(e.pointerId);return;
  }

  // Hold for laser, click for ping (handled via hold timer)
  isHolding=false;
  pingHoldTimer=setTimeout(()=>{
    isHolding=true;
    startLaser(sx,sy);
    viewport.classList.add("grabbing");
  },300);

  panning=true;panStartX=e.clientX;panStartY=e.clientY;camStartX=camX;camStartY=camY;
  viewport.setPointerCapture(e.pointerId);
});

viewport.addEventListener("pointermove",e=>{
  const rect=viewport.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;

  if(rulerStartScreen){rulerEnd=[sx,sy];return;}

  if(draggingToken){
    const[wx,wy]=toWorld(sx,sy);
    const newTX=Math.floor(wx/TILE)-draggingToken.offsetTX;
    const newTY=Math.floor(wy/TILE)-draggingToken.offsetTY;
    tokens[draggingToken.id].x=newTX;tokens[draggingToken.id].y=newTY;return;
  }

  if(isHolding&&myLaserRef){moveLaser(sx,sy);return;}

  if(panning){camX=camStartX+(e.clientX-panStartX);camY=camStartY+(e.clientY-panStartY);}
});

viewport.addEventListener("pointerup",e=>{
  const rect=viewport.getBoundingClientRect();
  const sx=e.clientX-rect.left,sy=e.clientY-rect.top;

  if(rulerStartScreen){rulerEnd=[sx,sy];setTimeout(()=>{rulerStartScreen=null;rulerEnd=null;},3000);return;}

  if(draggingToken){
    const mapName=mapInput.value.trim()||"dungeon-1";
    update(ref(db,`maps/${mapName}/tokens/${draggingToken.id}`),{x:tokens[draggingToken.id].x,y:tokens[draggingToken.id].y});
    draggingToken=null;return;
  }

  clearTimeout(pingHoldTimer);
  if(isHolding){stopLaser();viewport.classList.remove("grabbing");}
  isHolding=false;panning=false;
});

viewport.addEventListener("wheel",e=>{
  e.preventDefault();const factor=e.deltaY<0?1.1:.9;
  const rect=viewport.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  camX=mx-(mx-camX)*factor;camY=my-(my-camY)*factor;zoom=Math.min(Math.max(zoom*factor,.1),4);
  scaleLabel.textContent=`${Math.round(zoom*100)}%`;
},{passive:false});

// ── Init ──────────────────────────────────────────────────────────────────────
(async()=>{
  if(location.protocol==="file:"){
    overlayMsg.innerHTML=`<span style="color:#e04040;font-family:'Cinzel',serif">Must be served over http://</span>`;
    return;
  }
  if(!playerName)showNameModal();
  else nameDisplay.textContent=playerName;
  overlayMsg.textContent="Loading textures…";
  await loadTextures();
  overlayMsg.textContent="Connecting…";
  subscribeLive();
  draw();
})();
</script>
