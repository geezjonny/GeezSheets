<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GeezVTT</title>
  <style>
    :root {
      --glass: rgba(28, 28, 34, .86);
      --glass-hi: rgba(44, 44, 52, .95);
      --line: rgba(255,255,255,.08);
      --text: #e8e8ee; --dim: #9a9aa6;
      --accent: #6366f1; --accent-soft: rgba(99,102,241,.22);
      --radius: 14px;
      --shadow: 0 8px 28px rgba(0,0,0,.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #09090b; color: var(--text); overflow: hidden; font-size: 13px; }
    [hidden] { display: none !important; }
    body.player [data-gm], body.gm [data-player] { display: none !important; }

    #viewport { position: fixed; inset: 0; }
    canvas { position: absolute; inset: 0; display: block; touch-action: none; }

    /* ── floating glass pieces ── */
    .glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .ib { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--text); cursor: pointer; position: relative; }
    .ib:hover { background: rgba(255,255,255,.07); }
    .ib.active { background: var(--accent-soft); color: #c7d2fe; }
    .ib svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .ib[data-tip]:hover::after { content: attr(data-tip); position: absolute; white-space: nowrap; background: #000d; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; pointer-events: none; z-index: 30; }
    .rail-l .ib[data-tip]:hover::after { left: 48px; }
    .rail-r .ib[data-tip]:hover::after { right: 48px; }
    .sep { height: 1px; background: var(--line); margin: 4px 6px; }

    /* top-left: map pill + menu */
    #mapBar { position: fixed; top: 12px; left: 12px; z-index: 20; display: flex; align-items: center; gap: 2px; padding: 4px; }
    #mapBtn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 8px; border: 0; border-radius: 10px; background: transparent; color: var(--text); font: 600 14px inherit; font-family: inherit; cursor: pointer; max-width: 280px; }
    #mapBtn:hover { background: rgba(255,255,255,.07); }
    body.player #mapBtn { cursor: default; } body.player #mapBtn:hover { background: transparent; }
    #mapBtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; flex-shrink: 0; }
    #mapTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mapMenu { position: fixed; top: 60px; left: 12px; width: 270px; z-index: 25; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

    /* left: tools */
    #toolRail { position: fixed; left: 12px; top: 68px; z-index: 20; display: flex; flex-direction: column; gap: 2px; padding: 4px; }

    /* right: who + panels */
    #who { position: fixed; top: 12px; right: 12px; z-index: 20; height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
    #who .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    body.player #who { cursor: pointer; }
    #panelRail { position: fixed; right: 12px; top: 68px; z-index: 20; display: flex; flex-direction: column; gap: 2px; padding: 4px; }
    .fpanel { position: fixed; right: 68px; top: 68px; width: 310px; max-height: calc(100vh - 140px); z-index: 22; display: flex; flex-direction: column; }
    .fpanel > header, #ctxPanel > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 10px 6px 14px; font-weight: 700; font-size: 14px; }
    .fpanel > .body, #ctxBody { padding: 4px 12px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .x { width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--dim); cursor: pointer; font-size: 14px; }
    .x:hover { background: rgba(255,255,255,.08); color: #fff; }

    /* context card (token picker / inspector) sits beside the tool rail */
    #ctxPanel { position: fixed; left: 68px; top: 68px; width: 290px; max-height: calc(100vh - 140px); z-index: 21; display: flex; flex-direction: column; }

    /* bottom: hint + zoom; top-centre: roll chip */
    #toolHint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 18; padding: 8px 14px; color: var(--dim); max-width: min(560px, calc(100vw - 140px)); text-align: center; line-height: 1.4; }
    #zoomBar { position: fixed; right: 12px; bottom: 12px; z-index: 20; display: flex; gap: 2px; padding: 4px; }
    #rollChip { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 24; padding: 8px 16px; display: flex; align-items: baseline; gap: 10px; transition: opacity .25s; }
    #rollChip.fade { opacity: 0; }
    #rollChip b { font-size: 20px; color: #c7d2fe; font-variant-numeric: tabular-nums; }
    #rollChip span { color: var(--dim); }
    #toast { position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%); padding: 8px 14px; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 26; }
    #toast.show { opacity: 1; }

    /* controls inside panels */
    h3 { font-size: 12px; font-weight: 600; color: var(--dim); }
    label { font-size: 12px; color: #cfcfd8; display: flex; flex-direction: column; gap: 4px; }
    label.row { flex-direction: row; }
    .hint { font-size: 12px; color: var(--dim); line-height: 1.45; }
    input, select, textarea, button { font: inherit; color: var(--text); }
    input[type="text"], input[type="number"], select { width: 100%; padding: 7px 9px; background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 8px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid #818cf8; outline-offset: 1px; }
    .btn, .fpanel button:not(.x):not(.ib), #ctxBody button, #mapMenu button { padding: 7px 9px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .fpanel button:not(.x):not(.ib):hover, #ctxBody button:hover, #mapMenu button:hover { background: rgba(255,255,255,.12); }
    button.active { background: var(--accent-soft) !important; border-color: var(--accent) !important; color: #e0e7ff; }
    button.primary { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff; }
    button.danger { color: #fca5a5; border-color: rgba(220,38,38,.4) !important; }
    button:disabled { opacity: .4; cursor: default; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .flex-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .val-badge { font-size: 11px; background: rgba(255,255,255,.06); padding: 2px 7px; border-radius: 6px; color: var(--dim); white-space: nowrap; }
    .muted { color: var(--dim); }

    #diceShow { display: flex; justify-content: space-between; align-items: baseline; background: rgba(0,0,0,.3); border-radius: 8px; padding: 8px 10px; }
    #diceWho { color: var(--dim); font-size: 12px; }
    #diceNum { font-size: 22px; color: #c7d2fe; font-variant-numeric: tabular-nums; }
    #diceNum.rolling { color: #71717a; }

    .init-row { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 8px; }
    .init-row.cur { background: var(--accent-soft); }
    .init-row .n { width: 30px; text-align: center; font-weight: 700; color: #c7d2fe; font-variant-numeric: tabular-nums; }
    .init-row .nm { flex: 1; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .init-row input { width: 52px; padding: 3px 5px; }
    .init-row button { padding: 2px 7px !important; }

    .item { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
    .stat { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 8px; text-align: center; padding: 4px 2px; cursor: pointer; }
    .stat:hover { border-color: var(--accent); }
    .stat b { display: block; font-size: 15px; color: #fff; }
    .stat small { color: var(--dim); font-size: 10px; text-transform: uppercase; }
    .stat span { color: var(--dim); font-size: 11px; }
    .hpbar { height: 7px; border-radius: 4px; background: #000; overflow: hidden; }
    .hpbar > div { height: 100%; }

    #log { height: 260px; overflow-y: auto; font-size: 12px; line-height: 1.5; color: #b4b4bf; }
    .log-entry { padding: 3px 0; border-bottom: 1px solid var(--line); }
    .log-entry strong { color: #a5b4fc; }

    #login { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
    #login .glass { width: 340px; max-width: calc(100% - 30px); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    #login button { padding: 9px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-weight: 600; }
    #login button:hover { background: var(--accent-soft); }

    @media (max-width: 640px) {
      .fpanel, #ctxPanel { left: 8px; right: 8px; width: auto; top: auto; bottom: 64px; max-height: 55vh; }
      #toolRail { top: 64px; } #panelRail { top: 64px; }
      #toolHint { display: none; }
      #mapBtn { max-width: 150px; }
    }
    @media (hover: none) { .ib[data-tip]:hover::after { display: none; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div id="viewport"><canvas id="vttCanvas"></canvas></div>

  <!-- top-left: map -->
  <div id="mapBar" class="glass">
    <button id="mapBtn" title="Map">
      <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>
      <span id="mapTitle">No map</span><span data-gm class="muted">▾</span>
    </button>
  </div>
  <div id="mapMenu" class="glass" data-gm hidden>
    <select id="mapSelect" title="Maps in the battlemap/ folder"><option value="">Loading maps…</option></select>
    <div class="grid-2">
      <button id="showPlayers" class="primary" title="Players' screens switch to this map">Show to players</button>
      <button id="resetWalls" title="Put walls, doors and lights back to how they are in the .dd2vtt file">Reset walls</button>
    </div>
    <div class="grid-3">
      <button id="nightBtn">☀ Day</button>
      <button id="gridBtn" class="active">Grid</button>
      <button id="lockBtn" title="Stop players moving their tokens">🔓 Moves</button>
    </div>
    <div class="flex-row"><h3>Night darkness</h3><span id="darkVal" class="val-badge">100%</span></div>
    <input type="range" id="darkRange" min="0" max="100" value="100" aria-label="Night darkness" />
  </div>

  <!-- left: tools -->
  <div id="toolRail" class="glass rail-l">
    <button class="ib active" data-tool="select" data-tip="Move"><svg viewBox="0 0 24 24"><path d="M5 3l14 7-6.5 2L10 19z"/></svg></button>
    <button class="ib" data-tool="ruler" data-tip="Measure"><svg viewBox="0 0 24 24"><path d="M3 16 16 3l5 5L8 21z"/><path d="M7.5 11.5l2 2M10.5 8.5l2 2M13.5 5.5l2 2"/></svg></button>
    <button class="ib" data-tool="ping" data-tip="Ping"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="8"/></svg></button>
    <div class="sep" data-gm></div>
    <button class="ib" data-tool="token" data-gm data-tip="Add token"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></button>
    <button class="ib" data-tool="wall" data-gm data-tip="Walls"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 12h18M9 5v7M15 12v7"/></svg></button>
    <button class="ib" data-tool="door" data-gm data-tip="Doors"><svg viewBox="0 0 24 24"><path d="M6 21V4h12v17M3 21h18"/><circle cx="14.5" cy="12.5" r=".8" fill="currentColor"/></svg></button>
    <button class="ib" data-tool="light" data-gm data-tip="Lights"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></button>
    <button class="ib" data-tool="erase" data-gm data-tip="Erase"><svg viewBox="0 0 24 24"><path d="M4 16l9-9 6 6-6 6H7z"/><path d="M13 19h8"/></svg></button>
  </div>

  <!-- context card: token picker / inspector -->
  <div id="ctxPanel" class="glass" hidden>
    <header><span id="ctxTitle"></span><button class="x" id="ctxClose" title="Close">✕</button></header>
    <div id="ctxBody"></div>
  </div>

  <!-- top-right: who, then panel buttons -->
  <div id="who" class="glass"><span class="dot"></span><span id="whoName"></span></div>
  <div id="panelRail" class="glass rail-r">
    <button class="ib" data-panel="sheet" data-player data-tip="Character"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></button>
    <button class="ib" data-panel="dice" data-tip="Dice"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.1" fill="currentColor"/><circle cx="15" cy="15" r="1.1" fill="currentColor"/><circle cx="15" cy="9" r="1.1" fill="currentColor"/><circle cx="9" cy="15" r="1.1" fill="currentColor"/></svg></button>
    <button class="ib" data-panel="init" data-tip="Initiative"><svg viewBox="0 0 24 24"><path d="M14.5 17.5 4 7V4h3l10.5 10.5"/><path d="M13 19l6-6M16 16l4 4"/></svg></button>
    <button class="ib" data-panel="log" data-tip="Log"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg></button>
  </div>

  <section id="panel-sheet" class="fpanel glass" data-player hidden>
    <header><span id="sheetTitle">Character</span><button class="x" data-close>✕</button></header>
    <div class="body" id="sheetBody"></div>
  </section>
  <section id="panel-dice" class="fpanel glass" hidden>
    <header><span>Dice</span><button class="x" data-close>✕</button></header>
    <div class="body">
      <div class="grid-4" id="diceBtns"></div>
      <div id="diceShow"><span id="diceWho">No rolls yet</span><b id="diceNum">–</b></div>
    </div>
  </section>
  <section id="panel-init" class="fpanel glass" hidden>
    <header><span>Initiative</span><button class="x" data-close>✕</button></header>
    <div class="body" id="initBody"></div>
  </section>
  <section id="panel-log" class="fpanel glass" hidden>
    <header><span>Log</span><button class="x" data-close>✕</button></header>
    <div class="body"><div id="log"></div></div>
  </section>

  <!-- bottom-right: zoom -->
  <div id="zoomBar" class="glass">
    <button class="ib" id="zoomOut" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button class="ib" id="zoomFit" title="Fit map (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="zoomIn" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
  </div>

  <div id="toolHint" class="glass" hidden></div>
  <div id="rollChip" class="glass fade" hidden><span id="rollWho"></span><b id="rollNum"></b></div>
  <div id="toast" class="glass"></div>

  <div id="login" hidden>
    <div class="glass">
      <div style="font-size:15px;font-weight:700">Who are you playing?</div>
      <div class="hint">Your name is used for pings, dice and initiative.</div>
      <select id="loginCampaign"></select>
      <div id="loginList" class="grid-2"></div>
    </div>
  </div>

  <script type="module" src="js/vtt-app.js"></script>
</body>
</html>
