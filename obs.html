<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>GeezVTT — OBS Map Source</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #00ff00; /* chroma key — OBS will remove this */
  overflow: hidden;
}
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";

const FIREBASE_CONFIG = {
  apiKey:        "AIzaSyAI3Itfvj4kZ0j0wxUhdrlVK6W76h260ZY",
  authDomain:    "sheets-e5838.firebaseapp.com",
  databaseURL:   "https://sheets-e5838-default-rtdb.firebaseio.com",
  projectId:     "sheets-e5838",
  storageBucket: "sheets-e5838.firebasestorage.app",
};
const app = initializeApp(FIREBASE_CONFIG);
const db  = getDatabase(app);

const TILE = 32;

// ── State ─────────────────────────────────────────────────────────────────────
const tiles={}, fogGroups={}, tokens={}, stamps={}, roofs={}, props={}, wallGroups={}, doors={};
let bgImage=null, bgUrl="", bgPpi=70, timeOfDay="day";
const tokenTextures={}, propTextures={}, terrainTextures={};
let firstLoad=true;

const canvas = document.getElementById("canvas");
const ctx    = canvas.getContext("2d");

// ── Camera — fit on first load, then fixed ────────────────────────────────────
const camera = { x: 0, y: 0, zoom: 1 };

function fitCamera() {
  const tileKeys = Object.keys(tiles);
  if (!tileKeys.length) return;
  const coords = tileKeys.map(k => k.split(",").map(Number));
  const minX = Math.min(...coords.map(([x]) => x));
  const minY = Math.min(...coords.map(([, y]) => y));
  const maxX = Math.max(...coords.map(([x]) => x)) + 1;
  const maxY = Math.max(...coords.map(([, y]) => y)) + 1;
  const mapW = (maxX - minX) * TILE, mapH = (maxY - minY) * TILE;
  const scaleX = canvas.width / mapW, scaleY = canvas.height / mapH;
  camera.zoom = Math.min(scaleX, scaleY) * 0.95;
  camera.x = (canvas.width  - mapW * camera.zoom) / 2 - minX * TILE * camera.zoom;
  camera.y = (canvas.height - mapH * camera.zoom) / 2 - minY * TILE * camera.zoom;
}

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener("resize", resize);

// ── Texture loaders ───────────────────────────────────────────────────────────
function loadTerrainTexture(id) {
  if (terrainTextures[id] !== undefined) return;
  terrainTextures[id] = null;
  const img = new Image();
  img.onload = () => { terrainTextures[id] = img; };
  img.src = `./textures/${id}.png`;
}

function loadTokenTexture(characterId, name) {
  const cacheKey = characterId === "__npc__" && name ? `__npc__:${name.toLowerCase()}` : characterId;
  if (tokenTextures[cacheKey] !== undefined) return cacheKey;
  tokenTextures[cacheKey] = null;
  const fname = (name || characterId).toLowerCase().replace(/\s+/g, "_");
  const img = new Image();
  img.onload = () => { tokenTextures[cacheKey] = img; };
  img.src = `./tokens/${fname}.png`;
  return cacheKey;
}

// ── Fog colors (matches fog.js) ───────────────────────────────────────────────
const FOG_COLORS = {
  fog:      "rgba(10,20,40,0.55)",
  darkness: "rgba(10,5,20,0.72)",
  magical:  "rgba(60,10,80,0.65)",
};

// ── Draw ──────────────────────────────────────────────────────────────────────
function drawTileAt(x, y, terrain) {
  const px = x * TILE, py = y * TILE;
  loadTerrainTexture(terrain);
  if (terrainTextures[terrain]) {
    ctx.drawImage(terrainTextures[terrain], px, py, TILE, TILE);
  } else {
    ctx.fillStyle = "#334";
    ctx.fillRect(px, py, TILE, TILE);
  }
}

function drawToken(tok) {
  const s = tok.size || 1;
  const px = tok.x * TILE, py = tok.y * TILE;
  const sw = s * TILE, sh = s * TILE;
  const r = sw * 0.42, cx = px + sw / 2, cy = py + sh / 2;
  const cacheKey = loadTokenTexture(tok.characterId, tok.lookupName || tok.name);
  const img = tokenTextures[cacheKey];

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  if (img) {
    ctx.drawImage(img, px, py, sw, sh);
  } else {
    ctx.fillStyle = tok.type === "pc" ? "#3a6aaa" : "#8a2a2a";
    ctx.fillRect(px, py, sw, sh);
    ctx.fillStyle = "#fff";
    ctx.font = `bold ${Math.round(14 * s / camera.zoom)}px Cinzel,serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText((tok.name || "?")[0].toUpperCase(), cx, cy);
  }
  ctx.restore();

  // Ring
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = tok.type === "pc" ? "#7ab0e0" : "#e07070";
  ctx.lineWidth = 2 / camera.zoom; ctx.stroke();

  // Name
  ctx.font = `${Math.round(9 / camera.zoom)}px Cinzel,serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const nameW = ctx.measureText(tok.name || "").width;
  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(cx - nameW / 2 - 3 / camera.zoom, py + sh + 2 / camera.zoom, nameW + 6 / camera.zoom, 10 / camera.zoom);
  ctx.fillStyle = "#fff"; ctx.fillText(tok.name || "", cx, py + sh + 2 / camera.zoom);
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#0d0b08"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(camera.x, camera.y); ctx.scale(camera.zoom, camera.zoom);

  // Background image
  if (bgImage) {
    const s = TILE / (bgPpi || 70);
    const bw = bgImage.width * s, bh = bgImage.height * s;
    if (timeOfDay!=="day") {
      ctx.save();
      const _todFilter=(timeOfDay==="dawn"?"saturate(0.8) brightness(0.85) sepia(0.25) hue-rotate(-10deg)":(timeOfDay==="dusk"?"saturate(0.9) brightness(0.75) sepia(0.4) hue-rotate(10deg)":(timeOfDay==="night"?"saturate(0.35) brightness(0.45) hue-rotate(200deg)":"none")));
      ctx.filter=_todFilter;
      ctx.drawImage(bgImage,0,0,bw,bh);
      ctx.filter="none";
      if(timeOfDay!=="day"){
        const _ovColors={dawn:"rgba(255,160,80,0.18)",dusk:"rgba(200,100,40,0.28)",night:"rgba(20,40,100,0.55)"};
        ctx.globalCompositeOperation="multiply";
        ctx.fillStyle=_ovColors[timeOfDay]||"rgba(0,0,0,0)";
        ctx.fillRect(0,0,bw,bh);
        ctx.globalCompositeOperation="source-over";
      }
      ctx.restore();
    } else {
      ctx.drawImage(bgImage, 0, 0, bw, bh);
    }
  }

  // Tiles
  for (const k in tiles) {
    const [x, y] = k.split(",").map(Number);
    drawTileAt(x, y, tiles[k].terrain);
  }

  // Fog — GM view (semi-transparent, typed colors)
  for (const gid in fogGroups) {
    const group = fogGroups[gid];
    const cells = group.cells || {};
    const type  = group.type || "fog";
    ctx.fillStyle = FOG_COLORS[type] || FOG_COLORS.fog;
    for (const ck in cells) {
      const [x, y] = ck.split(",").map(Number);
      ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
    }
  }

  // Stamps
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `${Math.round(TILE * 0.65)}px serif`;
  for (const [k, emoji] of Object.entries(stamps)) {
    const [x, y] = k.split(",").map(Number);
    ctx.fillText(emoji, x * TILE + TILE / 2, y * TILE + TILE / 2);
  }
  ctx.restore();

  // Wall groups
  ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 2.5 / camera.zoom; ctx.lineCap = "round";
  for (const gid in wallGroups) {
    const cells = wallGroups[gid].cells || {};
    for (const ck in cells) {
      const [x, y] = ck.split(",").map(Number);
      const px = x * TILE, py = y * TILE;
      [[0,-1,px,py,px+TILE,py],[0,1,px,py+TILE,px+TILE,py+TILE],[-1,0,px,py,px,py+TILE],[1,0,px+TILE,py,px+TILE,py+TILE]].forEach(([dx,dy,x1,y1,x2,y2]) => {
        if (!cells[`${x+dx},${y+dy}`]) { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
      });
    }
  }

  // Doors
  for (const did in doors) {
    const d = doors[did];
    const px = d.x * TILE, py = d.y * TILE;
    const edgeCoords = { n:[px,py,px+TILE,py], s:[px,py+TILE,px+TILE,py+TILE], w:[px,py,px,py+TILE], e:[px+TILE,py,px+TILE,py+TILE] };
    const [x1,y1,x2,y2] = edgeCoords[d.edge] || edgeCoords.n;
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    if (d.open) {
      ctx.strokeStyle = "#8a6a2a"; ctx.lineWidth = 2 / camera.zoom;
      const len = TILE * 0.25; const isH = d.edge === "n" || d.edge === "s";
      ctx.beginPath();
      if (isH) { ctx.moveTo(x1,y1-len); ctx.lineTo(x1,y1+len); ctx.moveTo(x2,y2-len); ctx.lineTo(x2,y2+len); }
      else { ctx.moveTo(x1-len,y1); ctx.lineTo(x1+len,y1); ctx.moveTo(x2-len,y2); ctx.lineTo(x2+len,y2); }
      ctx.stroke();
    } else {
      ctx.strokeStyle = d.locked ? "#8a2a2a" : "#8a6a2a"; ctx.lineWidth = 3.5 / camera.zoom;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const sz = 4 / camera.zoom;
      ctx.fillStyle = d.locked ? "#c04040" : "#c0a040";
      ctx.fillRect(mx - sz/2, my - sz/2, sz, sz);
    }
  }

  // NPC tokens
  for (const tok of Object.values(tokens)) if (tok.type === "npc") drawToken(tok);

  // PC tokens
  for (const tok of Object.values(tokens)) if (tok.type === "pc") drawToken(tok);

  // Roofs
  ctx.save(); ctx.globalAlpha = 0.85;
  for (const [k, r] of Object.entries(roofs)) {
    const [x, y] = k.split(",").map(Number);
    drawTileAt(x, y, r.terrain);
  }
  ctx.restore();

  // Grid
  ctx.strokeStyle = "rgba(255,255,255,.03)"; ctx.lineWidth = 1 / camera.zoom;
  const l = -camera.x/camera.zoom, t = -camera.y/camera.zoom;
  const rr = (canvas.width - camera.x)/camera.zoom, b = (canvas.height - camera.y)/camera.zoom;
  for (let x = Math.floor(l/TILE)*TILE; x < rr; x += TILE) { ctx.beginPath(); ctx.moveTo(x,t); ctx.lineTo(x,b); ctx.stroke(); }
  for (let y = Math.floor(t/TILE)*TILE; y < b; y += TILE) { ctx.beginPath(); ctx.moveTo(l,y); ctx.lineTo(rr,y); ctx.stroke(); }

  ctx.restore();
  requestAnimationFrame(render);
}

// ── RTDB ──────────────────────────────────────────────────────────────────────
let liveUnsub = null;

function subscribeLive(mapName) {
  if (liveUnsub) { liveUnsub(); liveUnsub = null; }
  liveUnsub = onValue(ref(db, `maps/${mapName}`), snap => {
    const data = snap.val();
    for (const k in tiles) delete tiles[k];
    for (const k in fogGroups) delete fogGroups[k];
    for (const k in tokens) delete tokens[k];
    for (const k in stamps) delete stamps[k];
    for (const k in roofs) delete roofs[k];
    for (const k in wallGroups) delete wallGroups[k];
    for (const k in doors) delete doors[k];
    if (data) {
      if (data.tiles) Object.assign(tiles, data.tiles);
      if (data.fog)   Object.assign(fogGroups, data.fog);
      if (data.wallGroups) Object.assign(wallGroups, data.wallGroups);
      if (data.doors) Object.assign(doors, data.doors);
      if (data.tokens) {
        Object.assign(tokens, data.tokens);
        Object.values(data.tokens).forEach(t => loadTokenTexture(t.characterId, t.lookupName || t.name));
      }
      if (data.stamps) for (const [k,v] of Object.entries(data.stamps)) stamps[k.replace("_",",")] = v;
      if (data.roofs) Object.assign(roofs, data.roofs);
      if (data.background && data.background !== bgUrl) {
        bgUrl = data.background; bgImage = null;
        const img = new Image(); img.crossOrigin = "anonymous";
        img.onload = () => bgImage = img; img.src = bgUrl;
      } else if (!data.background) { bgUrl = ""; bgImage = null; }
      bgPpi = data.backgroundPpi || 70;
      timeOfDay = data.timeOfDay!=="day" || "day";
    }
    if (firstLoad) { firstLoad = false; fitCamera(); }
  });
}

// Follow session/currentMap like index.html does
onValue(ref(db, "session/currentMap"), snap => {
  const name = snap.val();
  if (!name) return;
  firstLoad = true;
  subscribeLive(name);
});

render();
</script>
</body>
</html>
