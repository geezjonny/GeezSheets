<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Loot Roller</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f0e8;color:#1a1814;min-height:100vh;padding:1.5rem 1rem 3rem}
h1{font-size:18px;font-weight:500;margin-bottom:1.5rem;color:#1a1814}
.back{font-size:13px;color:#8a7a60;text-decoration:none;display:inline-block;margin-bottom:1rem}
.back:hover{color:#1a1814}
.section-label{font-size:11px;color:#8a7a60;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.tier-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:1.5rem}
.tier-btn{padding:10px 8px;border-radius:8px;border:0.5px solid #c8b98a;background:#fff8e8;color:#1a1814;font-size:14px;cursor:pointer;text-align:center}
.tier-btn:hover{background:#f0e4c8}
.tier-btn.active{border:2px solid #1a1814;font-weight:500;background:#fff8e8}
.tier-sub{font-size:11px;color:#8a7a60;display:block;margin-top:2px}
.roll-btn{width:100%;padding:14px;font-size:16px;font-weight:500;border-radius:12px;border:0.5px solid #c8b98a;background:#fff8e8;color:#1a1814;cursor:pointer;margin-bottom:1.5rem}
.roll-btn:hover{background:#f0e4c8}
.roll-btn:active{transform:scale(0.98)}
.result-section{margin-bottom:1.25rem}
.result-card{background:#fff8e8;border:0.5px solid #c8b98a;border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.5}
.result-card.magic{border-color:#6a8ab8;background:#e8f0f8;color:#1a2a4a}
.result-card.intel{border-color:#b88a30;background:#f8f0d8;color:#3a2a08}
.result-card.nothing{color:#8a7a60;font-size:14px;font-style:italic}
.list-item{padding:4px 0;border-bottom:0.5px solid #e0d4b0}
.list-item:last-child{border-bottom:none}
.empty-state{text-align:center;padding:2rem 1rem;color:#8a7a60;font-size:14px}
</style>
</head>
<body>
<a class="back" href="index.html">← suite</a>
<h1>Loot Roller</h1>

<p class="section-label">Encounter tier</p>
<div class="tier-grid">
  <button class="tier-btn" onclick="setTier(this,'trash')">Trash<span class="tier-sub">minions, animals</span></button>
  <button class="tier-btn" onclick="setTier(this,'standard')">Standard<span class="tier-sub">soldiers, cultists</span></button>
  <button class="tier-btn" onclick="setTier(this,'elite')">Elite<span class="tier-sub">captains, veterans</span></button>
  <button class="tier-btn" onclick="setTier(this,'boss')">Boss<span class="tier-sub">named enemies</span></button>
</div>

<button class="roll-btn" onclick="rollLoot()">⚄ Roll loot</button>

<div id="results"><div class="empty-state">Pick a tier and roll.</div></div>

<script>
let currentTier=null;
const TIERS={
  trash:   {gemChance:0.15,consumableChance:0.10,magicChance:0.03,intelChance:0.20},
  standard:{gemChance:0.30,consumableChance:0.30,magicChance:0.10,intelChance:0.40},
  elite:   {gemChance:0.55,consumableChance:0.70,magicChance:0.28,intelChance:0.65},
  boss:    {gemChance:0.90,consumableChance:1.00,magicChance:0.55,intelChance:0.90},
};
const GEMS=["a bloodstone, deep red flecked with green","a pale moonstone, faintly luminescent","a rough-cut amethyst, thumb-sized","a cluster of small garnets, still in matrix rock","an obsidian disk, carved with a symbol","a cracked sapphire, still valuable","a topaz the color of old honey","a piece of raw amber with something inside it","a jade figurine, small enough to pocket","a string of black pearls, seven total","a fire opal, flickering even in still light","a diamond chip, wrapped in velvet","a carved onyx seal","a smoky quartz pendant, chain broken"];
const CONSUMABLES=["Potion of Healing","Potion of Healing","Potion of Healing","Potion of Greater Healing","Potion of Invisibility","Potion of Speed","Potion of Fire Breath","Potion of Water Breathing","Potion of Resistance (fire)","Potion of Resistance (cold)","Potion of Climbing","Potion of Heroism","Oil of Slipperiness","Scroll of Charm Person","Scroll of Darkness","Scroll of Hold Person","Scroll of Misty Step","Scroll of Thunderwave","Scroll of Detect Magic","Dust of Disappearance","Antitoxin"];
const MAGIC_A=["+1 Weapon (type fits the enemy)","+1 Shield","+1 Ammunition (x10)","Bag of Holding","Cloak of Protection","Eyes of the Eagle","Periapt of Wound Closure","Ring of Feather Falling","Boots of Elvenkind","Cloak of Elvenkind","Hat of Disguise","Slippers of Spider Climbing","Wand of Magic Missiles","Wand of Secrets","Staff of the Adder","Lantern of Revealing","Headband of Intellect","Gauntlets of Ogre Power"];
const MAGIC_B=["+2 Weapon (type fits the enemy)","Cloak of Displacement","Necklace of Fireballs","Ring of Evasion","Robe of Eyes","Staff of Charming","Staff of Healing","Wand of Paralysis","Flame Tongue","Sun Blade","Oathbow","Nine Lives Stealer","Mace of Terror","Dwarven Thrower"];
const MAGIC_C=["+3 Weapon (type fits the enemy)","Staff of Fire","Staff of Frost","Staff of Power","Vorpal Sword","Cloak of Invisibility","Ring of Three Wishes","Efreeti Bottle"];
const INTEL=["a hand-drawn map of a nearby location, exits marked","a letter with orders — someone higher up is pulling strings","a journal with recent entries, last one dated three days ago","a list of names, some crossed out","a crude sketch of the party — they were being watched","a wax-sealed message, unread, addressed to someone in town","a codebook — whatever cipher they're using, this cracks it","a ledger of transactions, one column is people","a symbol or insignia you don't recognize — but it's everywhere","a torn page describing this location in detail — written before they arrived","a password or passphrase, written on the inside of a wrist bracer","a rough timeline of planned events — one is very soon","a confession, unsigned, implicating someone the party knows","a map with a location marked that doesn't appear on any other map"];

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function d(n){return Math.floor(Math.random()*n)+1;}

function setTier(btn,tier){
  currentTier=tier;
  document.querySelectorAll('.tier-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function rollMagic(){
  const r=d(20);
  if(r<=12)return pick(MAGIC_A);
  if(r<=18)return pick(MAGIC_B);
  return pick(MAGIC_C);
}
function rollLoot(){
  if(!currentTier){document.getElementById('results').innerHTML='<div class="empty-state">Pick a tier first.</div>';return;}
  const t=TIERS[currentTier];
  let html='';

  html+='<div class="result-section"><p class="section-label">Valuables</p>';
  if(Math.random()<t.gemChance)html+=`<div class="result-card">${pick(GEMS)}</div>`;
  else html+='<div class="result-card nothing">Nothing worth taking.</div>';
  html+='</div>';

  if(Math.random()<t.consumableChance){
    html+=`<div class="result-section"><p class="section-label">Consumable</p><div class="result-card">${pick(CONSUMABLES)}</div></div>`;
  }

  if(Math.random()<t.magicChance){
    html+=`<div class="result-section"><p class="section-label">✦ Magic item</p><div class="result-card magic">${rollMagic()}</div></div>`;
  }

  html+='<div class="result-section"><p class="section-label">Intel</p>';
  if(Math.random()<t.intelChance)html+=`<div class="result-card intel">${pick(INTEL)}</div>`;
  else html+='<div class="result-card nothing">Nothing useful on them.</div>';
  html+='</div>';

  document.getElementById('results').innerHTML=html;
}
</script>
</body>
</html>
