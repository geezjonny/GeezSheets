<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel VTT — Player</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=IM+Fell+English&family=JetBrains+Mono:wght@400;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Sheet CSS below expects these dd2vtt-editor CSS variables (copied
       verbatim from mapeditor.html so buildSheetCard()'s markup renders
       correctly). --dim is aliased to --text-dim: the original never
       actually defined --dim, an existing quirk this fixes rather than
       reproduces. */
    :root {
      --bg:#0d0b08; --panel:#1a1510; --panel2:#151208; --border:#3d2e1a;
      --gold:#c8a84b; --gold-dim:#7a6228; --red:#8b2020; --red-bright:#e04040;
      --text:#d4c49a; --text-dim:#6b5a38; --green:#5a9a5a; --dim: var(--text-dim);
    }

    body {
      display: flex;
      height: 100vh;
      font-family: sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }

    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20,20,20,0.85);
      padding: 8px 10px;
      border-radius: 8px;
      backdrop-filter: blur(2px);
    }

    button {
      padding: 6px 12px;
      background: #4a4a4a;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #606060; }
    button.active { background: #4f9da6; }

    .toolbar-tools { display: flex; gap: 6px; }

    #dice-popover-wrap { position: relative; }
    #dice-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 200px;
      background: #242424;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 60;
    }
    #dice-popover.hidden { display: none; }

    .dice-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .dice-row button { flex: 1; min-width: 40px; padding: 6px 4px; }

    #dice-result {
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 8px;
      background: #1a1a1a;
      border-radius: 4px;
      min-height: 1.4em;
    }
    #dice-result-meta { text-align: center; font-size: 0.72rem; color: #999; }

    #identity-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #bbb;
      white-space: nowrap;
    }
    #identity-badge .role-chip {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.03em;
      background: #4f9da6;
      color: #fff;
    }

    #right-panel { flex: 1; position: relative; }
    #three-canvas { width: 100%; height: 100%; display: block; }

    #ping-hint {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #ddd;
      pointer-events: none;
    }

    /* Login modal */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #login-overlay.hidden { display: none; }
    #login-modal {
      width: 360px;
      background: #242424;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #login-modal h2 { font-size: 1.1rem; }
    #login-modal label { font-size: 0.8rem; color: #bbb; }
    #login-modal input, #login-modal select {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #1a1a1a;
      color: #fff;
    }
    #login-error { color: #e07070; font-size: 0.8rem; min-height: 1em; }

    /* ── Character sheet (sheet.js / buildSheetCard) ──────────────────────
       CSS copied verbatim from mapeditor.html so the generated card markup
       renders correctly, PLUS an override block at the very end that embeds
       it inline in this tools panel instead of mapeditor.html's fixed
       slide-out overlay -- everything above the override is unmodified. */
#sheet-panel{position:fixed;z-index:700;top:0;right:0;width:340px;height:100vh;background:var(--panel);border-left:1px solid var(--border);box-shadow:-8px 0 32px rgba(0,0,0,.6);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;overflow:hidden}
#sheet-panel.open{transform:translateX(0)}
#sheet-panel-header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--panel2)}
#sheet-panel-title{font-family:'Cinzel',serif;font-size:10px;color:var(--gold);letter-spacing:.1em;flex:1}
#sheet-panel-close{border:none;background:transparent;color:var(--dim);font-size:14px;cursor:pointer;padding:2px 6px;border-radius:3px;line-height:1;transition:color .12s}
#sheet-panel-close:hover{color:var(--text)}
#sheet-view{flex:1;overflow-y:auto;padding:0}
#sheet-empty{display:flex;align-items:center;justify-content:center;height:100%;font-family:'Cinzel',serif;font-size:.75rem;color:var(--dim);text-align:center;padding:20px;line-height:1.8}
#sheet-panel .card{background:transparent;border:none;border-radius:0;width:100%;flex-shrink:0;overflow:visible}
#sheet-panel .card-header{padding:12px 12px 8px;border-bottom:1px solid var(--border)}
#sheet-panel .char-name{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;color:var(--gold);margin-bottom:2px}
#sheet-panel .char-sub{font-size:.68rem;color:var(--dim);font-family:'JetBrains Mono',monospace}
#sheet-panel .char-role-badge{display:inline-block;font-family:'Cinzel',serif;font-size:.56rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.3);color:var(--gold);margin-top:4px}
#sheet-panel .hp-row{display:flex;align-items:center;gap:6px;margin-top:8px}
#sheet-panel .hp-label{font-family:'Cinzel',serif;font-size:.58rem;font-weight:700;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;width:16px}
#sheet-panel .hp-bar-wrap{flex:1;height:5px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}
#sheet-panel .hp-bar{height:100%;border-radius:999px;transition:width .4s,background-color .4s}
#sheet-panel .hp-val{font-size:.7rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text);white-space:nowrap;min-width:48px;text-align:right}
#sheet-panel .temp-badge{font-size:.58rem;font-family:'JetBrains Mono',monospace;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.35);color:#c084fc;border-radius:999px;padding:1px 6px;white-space:nowrap}
#sheet-panel .hp-controls{display:flex;align-items:center;gap:5px;margin-top:6px}
#sheet-panel .hp-delta{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:4px 6px;font-size:.76rem;font-family:'JetBrains Mono',monospace;outline:none;text-align:center;min-width:0}
#sheet-panel .hp-delta:focus{border-color:var(--gold-dim)}
#sheet-panel .hp-btn{border-radius:4px;padding:4px 8px;font-size:.68rem;font-weight:700;font-family:'Cinzel',serif;cursor:pointer;transition:all .12s;white-space:nowrap;letter-spacing:.04em}
#sheet-panel .hp-btn.heal{background:rgba(74,154,74,.12);border:1px solid rgba(74,154,74,.3);color:#5a9a5a}
#sheet-panel .hp-btn.heal:hover{background:rgba(74,154,74,.22)}
#sheet-panel .hp-btn.dmg{background:rgba(224,64,64,.12);border:1px solid rgba(224,64,64,.3);color:#fca5a5}
#sheet-panel .hp-btn.dmg:hover{background:rgba(224,64,64,.22)}
#sheet-panel .stats-row{display:flex;border-bottom:1px solid var(--border)}
#sheet-panel .stat-cell{flex:1;padding:6px 2px;text-align:center;border-right:1px solid var(--border)}
#sheet-panel .stat-cell:last-child{border-right:none}
#sheet-panel .stat-label{font-family:'Cinzel',serif;font-size:.52rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
#sheet-panel .stat-val{font-size:.84rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text)}
#sheet-panel .ability-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px;border-bottom:1px solid var(--border)}
#sheet-panel .ab-box{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:5px;padding:5px 2px;text-align:center}
#sheet-panel .ab-name{font-family:'Cinzel',serif;font-size:.5rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin-bottom:1px}
#sheet-panel .ab-score{font-size:.84rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text);line-height:1}
#sheet-panel .ab-mod{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:var(--gold);margin-top:1px}
#sheet-panel .conditions-row{display:flex;flex-wrap:wrap;gap:3px;padding:5px 8px;border-bottom:1px solid var(--border)}
#sheet-panel .conditions-row:empty{display:none}
#sheet-panel .cond-pill{font-family:'Cinzel',serif;font-size:.55rem;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(224,64,64,.12);border:1px solid rgba(224,64,64,.3);color:#fca5a5}
#sheet-panel .card-footer{padding:6px;display:flex;flex-direction:column;gap:4px}
#sheet-panel .panel-btn{width:100%;border-radius:5px;color:var(--dim);font-family:'Cinzel',serif;font-size:.68rem;font-weight:700;letter-spacing:.04em;padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;border:1px solid var(--border);background:rgba(255,255,255,.02)}
#sheet-panel .panel-btn .chevron{margin-left:auto;transition:transform .2s}
#sheet-panel .panel-btn.open .chevron{transform:rotate(180deg)}
#sheet-panel .panel-btn:hover,#sheet-panel .panel-btn.open{border-color:var(--gold-dim);color:var(--text);background:rgba(200,168,75,.05)}
#sheet-panel .panel-btn.spell-btn:hover,#sheet-panel .panel-btn.spell-btn.open{border-color:#8b5cf6;color:#c084fc;background:rgba(139,92,246,.08)}
#sheet-panel .panel-btn.skill-btn:hover,#sheet-panel .panel-btn.skill-btn.open{border-color:#0ea5e9;color:#38bdf8;background:rgba(14,165,233,.08)}
#sheet-panel .panel-btn.weapon-btn:hover,#sheet-panel .panel-btn.weapon-btn.open{border-color:#e8834a;color:#f5a87b;background:rgba(232,131,74,.08)}
#sheet-panel .panel-btn.tip-btn:hover,#sheet-panel .panel-btn.tip-btn.open{border-color:#22c55e;color:#4ade80;background:rgba(34,197,94,.05)}
#sheet-panel .panel-btn.inv-btn:hover,#sheet-panel .panel-btn.inv-btn.open{border-color:var(--gold-dim);color:var(--gold);background:rgba(200,168,75,.06)}
#sheet-panel .expand-panel{display:none;border-top:1px solid var(--border);padding:10px;background:rgba(12,9,8,.5)}
#sheet-panel .expand-panel.open{display:block}
#sheet-panel .sp-section-title{font-family:'Cinzel',serif;font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;margin-top:8px}
#sheet-panel .sp-section-title:first-child{margin-top:0}
#sheet-panel .slot-levels{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
#sheet-panel .slot-level-row{display:flex;align-items:center;gap:6px}
#sheet-panel .slot-level-label{font-family:'Cinzel',serif;font-size:.58rem;color:var(--dim);width:38px;flex-shrink:0}
#sheet-panel .slot-pips{display:flex;gap:4px;flex-wrap:wrap}
#sheet-panel .slot-pip{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold-dim);background:rgba(200,168,75,.15);cursor:pointer;transition:all .12s;flex-shrink:0}
#sheet-panel .slot-pip:hover{transform:scale(1.15)}
#sheet-panel .slot-pip.used{background:rgba(255,255,255,.04);border-color:var(--border)}
#sheet-panel .spell-list{display:flex;flex-direction:column;gap:3px}
#sheet-panel .spell-item{padding:5px 7px;border-radius:4px;background:rgba(255,255,255,.02);border:1px solid var(--border)}
#sheet-panel .spell-item-top{display:flex;align-items:baseline;justify-content:space-between;gap:5px}
#sheet-panel .spell-name{font-family:'Cinzel',serif;font-size:.7rem;font-weight:700;color:var(--text)}
#sheet-panel .spell-level-tag{font-size:.58rem;font-family:'JetBrains Mono',monospace;color:var(--dim);white-space:nowrap}
#sheet-panel .spell-desc{font-size:.64rem;color:var(--dim);line-height:1.5;margin-top:2px;font-family:'JetBrains Mono',monospace}
#sheet-panel .skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:6px}
#sheet-panel .skill-row-item{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:3px 7px;border-radius:4px;background:rgba(255,255,255,.02);border:1px solid var(--border);font-size:.66rem}
#sheet-panel .skill-name{color:var(--dim)}
#sheet-panel .skill-val{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text)}
#sheet-panel .skill-row-item.prof .skill-name{color:#38bdf8}
#sheet-panel .skill-row-item.expert .skill-name{color:#4ade80}
#sheet-panel .save-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:6px}
#sheet-panel .save-row-item{display:flex;align-items:center;justify-content:space-between;flex-direction:column;gap:2px;padding:4px 3px;border-radius:4px;background:rgba(255,255,255,.02);border:1px solid var(--border);font-size:.62rem;text-align:center}
#sheet-panel .save-row-item.prof .skill-name{color:var(--gold)}
#sheet-panel .senses-block{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
#sheet-panel .sense-pill{font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:2px 7px;border-radius:4px;border:1px solid rgba(14,165,233,.25);background:rgba(14,165,233,.05);color:#38bdf8}
#sheet-panel .feat-item{padding:5px 7px;border-radius:4px;border:1px solid var(--border);background:rgba(255,255,255,.02);margin-bottom:3px}
#sheet-panel .feat-name{font-family:'Cinzel',serif;font-size:.7rem;font-weight:700;color:var(--text);margin-bottom:1px}
#sheet-panel .feat-desc{font-size:.64rem;color:var(--dim);line-height:1.5;font-family:'JetBrains Mono',monospace}
#sheet-panel .weapon-list{display:flex;flex-direction:column;gap:4px}
#sheet-panel .weapon-item{border:1px solid var(--border);border-radius:5px;background:rgba(255,255,255,.02);overflow:hidden}
#sheet-panel .weapon-top{display:flex;align-items:center;gap:6px;padding:6px 8px}
#sheet-panel .weapon-name{font-family:'Cinzel',serif;font-size:.74rem;font-weight:700;color:var(--text);flex:1}
#sheet-panel .weapon-type{font-size:.56rem;font-family:'JetBrains Mono',monospace;color:var(--dim);padding:1px 5px;border:1px solid var(--border);border-radius:999px;white-space:nowrap}
#sheet-panel .weapon-stats{display:flex;gap:4px;padding:0 8px 6px;flex-wrap:wrap}
#sheet-panel .wstat{display:flex;flex-direction:column;align-items:center;background:rgba(232,131,74,.06);border:1px solid rgba(232,131,74,.2);border-radius:4px;padding:3px 8px;min-width:48px}
#sheet-panel .wstat-label{font-family:'Cinzel',serif;font-size:.5rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#e8834a;margin-bottom:1px}
#sheet-panel .wstat-val{font-size:.8rem;font-weight:700;font-family:'JetBrains Mono',monospace;color:#f5a87b}
#sheet-panel .weapon-notes{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:var(--dim);padding:0 8px 6px;line-height:1.5}
#sheet-panel .inv-item{padding:6px 7px;border-radius:4px;border:1px solid var(--border);background:rgba(255,255,255,.02);margin-bottom:3px}
#sheet-panel .inv-item-top{display:flex;align-items:center;justify-content:space-between;gap:5px}
#sheet-panel .inv-name{font-family:'Cinzel',serif;font-size:.7rem;font-weight:700;color:var(--text);flex:1}
#sheet-panel .inv-qty{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--gold);white-space:nowrap}
#sheet-panel .inv-cat{font-size:.56rem;font-family:'JetBrains Mono',monospace;color:var(--dim);margin-top:1px;padding:1px 5px;border:1px solid var(--border);border-radius:999px;display:inline-block}
#sheet-panel .inv-desc{font-size:.64rem;color:var(--dim);line-height:1.5;margin-top:3px;font-family:'JetBrains Mono',monospace}
#sheet-panel .inv-notes{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:var(--gold-dim);margin-top:2px;font-style:italic}
#sheet-panel .equipped-row{display:flex;align-items:center;gap:5px;padding:4px 8px;border-bottom:1px solid var(--border);flex-wrap:wrap}
#sheet-panel .equipped-badge{font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:2px 7px;border-radius:4px;border:1px solid rgba(200,168,75,.25);background:rgba(200,168,75,.05);color:var(--gold-dim)}
#sheet-panel .equipped-badge span{color:var(--text)}
#sheet-panel .coin-row{display:flex;align-items:center;gap:5px;padding:4px 8px;border-bottom:1px solid var(--border);flex-wrap:wrap}
#sheet-panel .coin-label{font-family:'Cinzel',serif;font-size:.54rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-right:1px}
#sheet-panel .coin{display:flex;align-items:center;gap:2px;font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:999px;border:1px solid}
#sheet-panel .coin.pp{color:#c4b5fd;border-color:rgba(196,181,253,.3);background:rgba(196,181,253,.07)}
#sheet-panel .coin.gp{color:var(--gold);border-color:rgba(200,168,75,.3);background:rgba(200,168,75,.07)}
#sheet-panel .coin.ep{color:#67e8f9;border-color:rgba(103,232,249,.3);background:rgba(103,232,249,.07)}
#sheet-panel .coin.sp{color:#94a3b8;border-color:rgba(148,163,184,.3);background:rgba(148,163,184,.07)}
#sheet-panel .coin.cp{color:#b45309;border-color:rgba(180,83,9,.3);background:rgba(180,83,9,.07)}
#sheet-panel .ability-charge{padding:6px 7px;border-radius:4px;border:1px solid var(--border);background:rgba(255,255,255,.02);margin-bottom:3px}
#sheet-panel .ability-charge-top{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:4px}
#sheet-panel .ability-charge-name{font-family:'Cinzel',serif;font-size:.7rem;font-weight:700;color:var(--text)}
#sheet-panel .ability-charge-meta{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--dim)}
#sheet-panel .charge-pips{display:flex;gap:4px;flex-wrap:wrap}
#sheet-panel .charge-pip{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold-dim);background:rgba(200,168,75,.2);cursor:pointer;transition:all .12s;flex-shrink:0}
#sheet-panel .charge-pip:hover{transform:scale(1.15)}
#sheet-panel .charge-pip.used{background:rgba(255,255,255,.04);border-color:var(--border)}
#sheet-panel .empty-panel{font-family:'Cinzel',serif;font-size:.68rem;color:var(--dim);text-align:center;padding:8px 0}
#sheet-panel .combat-guide-wrap{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);border-radius:6px;padding:8px 10px}
#sheet-panel .combat-guide{font-size:.68rem;font-family:'JetBrains Mono',monospace;color:#4ade80;line-height:1.7;white-space:pre-wrap}
#sheet-panel .spell-meta{font-size:.6rem;font-family:'JetBrains Mono',monospace;color:var(--dim);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
#sheet-panel .spell-meta span{color:var(--text)}
#sheet-panel .spell-tip{display:flex;align-items:flex-start;gap:4px;margin-top:3px;padding:3px 6px;border-radius:3px;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2)}
#sheet-panel .spell-tip-text{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:#4ade80;line-height:1.5}
#sheet-panel .sp-meta{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
#sheet-panel .sp-meta-item{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:var(--dim)}
#sheet-panel .sp-meta-item span{color:var(--gold);font-weight:700}
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Login: name + passphrase + character pick. This page is Player-only. -->
  <div id="login-overlay">
    <div id="login-modal">
      <h2>Join as Player</h2>
      <div>
        <label for="login-name">Your name</label>
        <input type="text" id="login-name" placeholder="e.g. Sam">
      </div>
      <div>
        <label for="login-pass">Session passphrase (if the GM set one)</label>
        <input type="password" id="login-pass" placeholder="Leave blank if none">
      </div>
      <div>
        <label for="login-char-select">Character</label>
        <select id="login-char-select"><option value="">Loading roster…</option></select>
      </div>
      <div id="login-error"></div>
      <button id="login-submit">Enter</button>
    </div>
  </div>

  <!-- Toolbar: Ruler / Ping / Dice tools + identity + sheet fold toggle.
       Floats over the 3D view, which is now the only main content -- no more
       left panel; Block/Grid/Geometry editing UI is GM-only (see gm.html). -->
  <div id="toolbar">
    <div id="identity-badge">
      <span id="identity-name">Not signed in</span>
      <span id="identity-role" class="role-chip" style="display:none;">PLAYER</span>
    </div>
    <div class="toolbar-tools">
      <button id="tool-ruler" data-tool="ruler" title="Measure distance: click a start point, then an end point">📏 Ruler</button>
      <button id="tool-ping" data-tool="ping" title="Click once, then click the map to ping (Shift+Click always works too)">📍 Ping</button>
      <div id="dice-popover-wrap">
        <button id="tool-dice">🎲 Dice</button>
        <div id="dice-popover" class="hidden">
          <div class="dice-row">
            <button data-sides="4">d4</button>
            <button data-sides="6">d6</button>
            <button data-sides="8">d8</button>
            <button data-sides="10">d10</button>
            <button data-sides="12">d12</button>
            <button data-sides="20">d20</button>
            <button data-sides="100">d100</button>
          </div>
          <div id="dice-result">—</div>
          <div id="dice-result-meta">&nbsp;</div>
        </div>
      </div>
      <button id="tool-sheet" title="Show/hide character sheet">📋 Sheet</button>
    </div>
  </div>

  <div id="right-panel">
    <canvas id="three-canvas"></canvas>
    <div id="ping-hint">Arrow keys move your character · Shift+Click, or the Ping tool, to ping</div>
  </div>

  <!-- Character sheet, via js/sheet.js -- read-only for players. Fixed
       slide-out panel (mapeditor.html's original behavior): hidden off the
       right edge by default, .open class slides it in. Markup mirrors
       mapeditor.html's #sheet-panel/#sheet-panel-header/#sheet-view exactly,
       since openCharSheet()/buildSheetCard() expect that structure. -->
  <div id="sheet-panel">
    <div id="sheet-panel-header">
      <div id="sheet-panel-title">📋 CHARACTER</div>
      <button id="sheet-panel-close" title="Fold away">✕</button>
    </div>
    <div id="sheet-view">
      <div id="sheet-empty">Sign in to load your sheet</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Reused as-is from the mapeditor stack ─────────────────────────────────
    import { db } from './js/firebase.js';
    import { ref, onValue } from 'https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js';
    import { rollDie, animateDiceResult } from './js/dice.js';
    import { sendPing } from './js/pings.js';
    import {
      subscribePassphrase, checkPassphrase, fetchCharacterRoster,
      saveAuthSession, loadAuthSession
    } from './js/auth.js';
    import { openCharSheet, closeSheetPanel } from './js/sheet.js';
    import { FEET_PER_TILE } from './js/config.js';

    // ── Grid/Geometry/Token modules -- Block/palette-editing UI and the 2D
    // paint panel are GM-only (see gm.html); this page runs Grid with
    // has2DPanel:false so it's just the 3D view, reading whatever terrain/
    // geometry/tokens the GM has synced. ─────────────────────────────────────
    import * as Grid from './modules/grid.js';
    import * as Geometry from './modules/geometry.js';
    import * as Token from './modules/token.js';

    // ═══════════════════════════════════════════════════════════════════════
    // LOGIN — Player-only on this page (see gm.html for the GM login).
    // ═══════════════════════════════════════════════════════════════════════
    subscribePassphrase();

    let playerName = '';
    const isGM = false; // this page is Player-only
    let characterId = null;
    let characterName = '';

    const loginOverlay = document.getElementById('login-overlay');
    const loginNameEl  = document.getElementById('login-name');
    const loginPassEl  = document.getElementById('login-pass');
    const loginErrorEl = document.getElementById('login-error');
    const charSelect   = document.getElementById('login-char-select');
    const identityName = document.getElementById('identity-name');
    const identityRole = document.getElementById('identity-role');

    async function loadRoster() {
      charSelect.innerHTML = '<option value="">Loading roster…</option>';
      try {
        const roster = await fetchCharacterRoster();
        if (!roster.length) {
          charSelect.innerHTML = '<option value="">No characters found in characters/pcs</option>';
          return;
        }
        charSelect.innerHTML = roster.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      } catch (err) {
        charSelect.innerHTML = '<option value="">Could not load roster</option>';
      }
    }
    loadRoster();

    function applyIdentity() {
      identityName.textContent = `${playerName} — ${characterName}`;
      identityRole.style.display = 'inline-block';
      loginOverlay.classList.add('hidden');
      openCharSheet(characterId, characterName, false); // false = read-only, per sheet.js's own doc comment
    }

    document.getElementById('login-submit').addEventListener('click', async () => {
      const name = loginNameEl.value.trim();
      const pass = loginPassEl.value;
      loginErrorEl.textContent = '';

      if (!name) { loginErrorEl.textContent = 'Enter a name.'; return; }
      if (!checkPassphrase(pass)) { loginErrorEl.textContent = 'Wrong passphrase.'; return; }
      const selId = charSelect.value;
      const selName = charSelect.options[charSelect.selectedIndex]?.text;
      if (!selId) { loginErrorEl.textContent = 'Pick a character.'; return; }

      playerName = name; characterId = selId; characterName = selName;
      localStorage.setItem('vtt_player_name', playerName);
      saveAuthSession(playerName, characterId, characterName, Grid.getMapName());
      applyIdentity();
    });

    const savedSession = loadAuthSession();
    if (savedSession && savedSession.playerName && savedSession.characterId !== '__gm__') {
      playerName = savedSession.playerName;
      characterId = savedSession.characterId;
      characterName = savedSession.characterName;
      applyIdentity();
    }
    // else: login-overlay stays visible until they submit

    // ── Dice UI, wired to js/dice.js + shared dice/last RTDB node ─────────────
    const diceResultEl = document.getElementById('dice-result');
    const diceMetaEl = document.getElementById('dice-result-meta');

    document.querySelectorAll('.dice-row button').forEach(btn => {
      btn.addEventListener('click', async () => {
        const sides = parseInt(btn.dataset.sides, 10);
        await rollDie(sides, playerName || 'Anonymous');
      });
    });

    onValue(ref(db, 'dice/last'), snap => {
      const data = snap.val();
      if (!data) return;
      animateDiceResult(data, diceResultEl, (finalData) => {
        diceMetaEl.textContent = `d${finalData.sides} — ${finalData.roller}`;
      });
    });

    // ── Toolbar: Dice popover + Sheet fold toggle ──────────────────────────
    const dicePopover = document.getElementById('dice-popover');
    document.getElementById('tool-dice').addEventListener('click', () => {
      dicePopover.classList.toggle('hidden');
    });

    document.getElementById('tool-sheet').addEventListener('click', () => {
      document.getElementById('sheet-panel').classList.toggle('open');
    });
    document.getElementById('sheet-panel-close').addEventListener('click', () => {
      closeSheetPanel();
    });

    // ═══════════════════════════════════════════════════════════════════════
    // THREE.JS CORE — same setup as gm.html's, minus anything 2D-panel-only.
    // ═══════════════════════════════════════════════════════════════════════
    const threeCanvas = document.getElementById('three-canvas');
    const rightPanel = document.getElementById('right-panel');
    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true });
    renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(45, rightPanel.clientWidth / rightPanel.clientHeight, 0.1, 1000);
    camera.position.set(20, 20, 20);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(15, 25, 10);
    scene.add(dirLight);

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let pointerDownPos = null;

    function raycastAgainst(objects) {
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(objects, false);
      return hits.length ? hits[0] : null;
    }
    function setPointerFromEvent(e) {
      const rect = threeCanvas.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    // Everything a click could land ON: voxels, ground, walls/doors, tokens.
    // Used so ping and the ruler hit whatever surface was actually clicked
    // instead of passing through solid geometry to land on the floor behind it.
    function allSolidTargets() {
      return [
        ...Grid.getVoxelGroup().children,
        Grid.getGroundPlane(),
        ...Geometry.getSolidMeshes(),
        ...Token.getTokenMeshesArray(),
      ];
    }

    // ═══════════════════════════════════════════════════════════════════════
    // MODULE INIT — Grid with has2DPanel:false: no paint UI, no data-mode
    // buttons on this page at all, so Geometry/Token's 3D interactions are
    // effectively "always on" (there's no wall/door/light/erase mode to
    // block them the way there is on gm.html).
    // ═══════════════════════════════════════════════════════════════════════
    Grid.init(scene, { has2DPanel: false });
    Geometry.initGeometry(scene);
    Token.initTokens(scene, {
      getIdentity: () => ({ playerName, isGM, characterId, characterName }),
      requireLogin: () => loginOverlay.classList.remove('hidden'),
      clickToMove: false, // players move only via arrow keys, scoped to their own character
    });

    // ── Ping rendering ──────────────────────────────────────────────────────
    const pingMeshes = {};
    const pingGeometry = new THREE.RingGeometry(0.4, 0.55, 32);

    onValue(ref(db, 'pings'), snap => {
      const data = snap.val() || {};
      const seenIds = new Set(Object.keys(data));
      for (const id of Object.keys(pingMeshes)) {
        if (!seenIds.has(id)) { scene.remove(pingMeshes[id].mesh); delete pingMeshes[id]; }
      }
      for (const [id, ping] of Object.entries(data)) {
        if (pingMeshes[id]) continue;
        const material = new THREE.MeshBasicMaterial({ color: 0xffc832, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(pingGeometry, material);
        mesh.rotation.x = -Math.PI / 2;
        // See gm.html's identical comment: height is recomputed from the
        // current column instead of always sitting at floor level.
        const gx = Math.min(Grid.GRID_SIZE - 1, Math.max(0, ping.x));
        const gz = Math.min(Grid.GRID_SIZE - 1, Math.max(0, ping.y));
        const topY = Grid.columnTopY(gx, gz);
        mesh.position.set(ping.x - Grid.GRID_OFFSET, topY + 0.05, ping.y - Grid.GRID_OFFSET);
        scene.add(mesh);
        pingMeshes[id] = { mesh, startTime: ping.t || Date.now() };
      }
    });

    function animatePings() {
      const now = Date.now();
      for (const { mesh, startTime } of Object.values(pingMeshes)) {
        const age = (now - startTime) / 1000;
        const scale = 1 + age * 4;
        mesh.scale.set(scale, scale, scale);
        mesh.material.opacity = Math.max(0, 0.9 * (1 - age / 3));
      }
    }

    // ── Ruler tool ──────────────────────────────────────────────────────────
    // js/ruler.js's drawRuler()/findSnapPoint() are 2D-canvas-only (dd2vtt's
    // TILE-pixel space), so this is a from-scratch 3D version: a persistent
    // line + endpoint markers + a distance label, using FEET_PER_TILE from
    // js/config.js for the same feet conversion the rest of the app uses.
    // Horizontal (X/Z) distance only, matching how the 2D original measures.
    let rulerStart = null, rulerEnd = null;
    let rulerLine = null, rulerLabel = null, rulerMarkers = [];

    function clearRulerVisual() {
      if (rulerLine) { scene.remove(rulerLine); rulerLine = null; }
      if (rulerLabel) { scene.remove(rulerLabel); rulerLabel = null; }
      rulerMarkers.forEach(m => scene.remove(m));
      rulerMarkers = [];
    }

    function makeRulerLabel(text, pos) {
      const c = document.createElement('canvas');
      c.width = 160; c.height = 48;
      const tctx = c.getContext('2d');
      tctx.fillStyle = 'rgba(13,11,8,0.85)';
      tctx.fillRect(0, 0, c.width, c.height);
      tctx.fillStyle = '#c8a84b';
      tctx.font = 'bold 22px sans-serif';
      tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
      tctx.fillText(text, c.width / 2, c.height / 2);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c) }));
      sprite.scale.set(1.6, 0.48, 1);
      sprite.position.copy(pos);
      return sprite;
    }

    function drawRulerVisual(start, end) {
      clearRulerVisual();
      const y = Math.max(start.y, end.y) + 0.1;
      const a = new THREE.Vector3(start.x, y, start.z);
      const b = new THREE.Vector3(end.x, y, end.z);

      rulerLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([a, b]),
        new THREE.LineBasicMaterial({ color: 0xc8a84b })
      );
      scene.add(rulerLine);

      const markerGeo = new THREE.SphereGeometry(0.1, 8, 8);
      const markerMat = new THREE.MeshBasicMaterial({ color: 0xc8a84b });
      for (const p of [a, b]) {
        const marker = new THREE.Mesh(markerGeo, markerMat);
        marker.position.copy(p);
        scene.add(marker);
        rulerMarkers.push(marker);
      }

      const dTiles = Math.hypot(end.x - start.x, end.z - start.z);
      const dFeet = Math.round(dTiles * FEET_PER_TILE);
      const mid = a.clone().add(b).multiplyScalar(0.5).add(new THREE.Vector3(0, 0.5, 0));
      rulerLabel = makeRulerLabel(`${Math.round(dTiles * 10) / 10} tiles · ${dFeet}ft`, mid);
      scene.add(rulerLabel);
    }

    function handleRulerClick() {
      const hit = raycastAgainst(allSolidTargets());
      if (!hit) return;
      if (!rulerStart || rulerEnd) {
        // Fresh measurement -- either nothing started yet, or the last one
        // already finished, so this click restarts from here.
        rulerStart = hit.point.clone();
        rulerEnd = null;
        clearRulerVisual();
      } else {
        rulerEnd = hit.point.clone();
        drawRulerVisual(rulerStart, rulerEnd);
      }
    }

    // ── Toolbar tool-mode: 'none' | 'ruler' | 'ping' ───────────────────────
    // Ruler stays armed until toggled off (matches ruler.js's own comment:
    // stays visible, no auto-clear). Ping-via-toolbar is one-shot: arms,
    // fires on the next click, then auto-reverts -- Shift+Click always pings
    // regardless of toolMode, unchanged from before.
    let toolMode = 'none';
    function setToolMode(next) {
      toolMode = toolMode === next ? 'none' : next; // clicking the active tool again turns it off
      document.querySelectorAll('#toolbar [data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === toolMode));
      if (toolMode !== 'ruler') { rulerStart = null; rulerEnd = null; clearRulerVisual(); }
    }
    document.getElementById('tool-ruler').addEventListener('click', () => setToolMode('ruler'));
    document.getElementById('tool-ping').addEventListener('click', () => setToolMode('ping'));

    // ── Pointer handling: shift+click = ping, plain click = door-toggle or
    // token select/place/move, drag = orbit ────────────────────────────────
    threeCanvas.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    threeCanvas.addEventListener('pointerup', (e) => {
      if (!pointerDownPos) return;
      const moved = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      pointerDownPos = null;
      if (moved > 6) return;

      setPointerFromEvent(e);

      if (toolMode === 'ruler') { handleRulerClick(); return; }

      if (e.shiftKey || toolMode === 'ping') {
        const hit = raycastAgainst(allSolidTargets());
        if (hit) {
          const tx = Math.round(hit.point.x + Grid.GRID_OFFSET);
          const ty = Math.round(hit.point.z + Grid.GRID_OFFSET);
          sendPing(tx, ty, playerName || 'Anonymous');
        }
        if (toolMode === 'ping') setToolMode('ping'); // toggles it back off (one-shot)
        return;
      }

      if (!playerName) { loginOverlay.classList.remove('hidden'); return; }

      if (Geometry.tryToggleDoorAt3DHit(raycastAgainst)) return;
      Token.handlePointerUp3D(raycastAgainst);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      animatePings();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = rightPanel.clientWidth / rightPanel.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
    });

    animate();
  </script>
</body>
</html>
